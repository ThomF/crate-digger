<style>
:root{
  --bg:#0b0a08; --panel:#15120d; --panel2:#1d1812;
  --amber:#ffb53d; --amber-dim:#8a6224; --amber-glow:rgba(255,181,61,.25);
  --green:#7ddba0; --red:#ff6b4a; --grey:#6b6354;
  --rule:#3a3024;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  color:var(--amber); font-size:13px; line-height:1.55;
  padding:24px; max-width:1180px; margin:0 auto;
  text-shadow:0 0 1px var(--amber-glow);
}
/* CRT scanlines */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:98;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);
}
a{color:var(--amber)}
.hazard{height:8px;background:repeating-linear-gradient(45deg,var(--amber-dim) 0 10px,#0b0a08 10px 20px);margin:14px 0;opacity:.6}
header{border:2px solid var(--amber-dim);background:var(--panel);padding:14px 16px;position:relative}
header h1{margin:0;font-size:22px;letter-spacing:.42em;font-weight:700}
header h1 small{letter-spacing:.1em;font-size:11px;color:var(--amber-dim);display:block;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{border:1px solid var(--rule);background:var(--panel2);padding:3px 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-dim)}
.chip b{color:var(--amber);font-weight:600}
.verdict{border-width:2px;padding:4px 12px;font-weight:700;letter-spacing:.2em}
.v-shipped{border-color:var(--green);color:var(--green)}
.v-failed{border-color:var(--red);color:var(--red)}
.v-partial,.v-pending{border-color:var(--amber);color:var(--amber)}
section{border:1px solid var(--rule);background:var(--panel);margin:18px 0}
section>h2{
  margin:0;padding:8px 14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  background:var(--panel2);border-bottom:1px solid var(--rule);color:var(--amber-dim);
}
section>.body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.crit{border:1px solid var(--rule);padding:9px 11px;background:var(--panel2)}
.crit .id{font-weight:700;letter-spacing:.14em}
.crit .st{float:right;font-size:11px;letter-spacing:.14em}
.pass{color:var(--green)} .fail{color:var(--red)} .untested{color:var(--grey)}
.crit p{margin:6px 0 0;color:#d9c9a6;font-size:12px}
.bar{height:16px;border:1px solid var(--rule);background:#0c0a07;display:flex;margin-bottom:14px}
.bar i{display:block;height:100%}
.bar i.p{background:var(--green)} .bar i.f{background:var(--red)} .bar i.u{background:#2a2419}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--amber-dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
td.mono{color:#d9c9a6}
.tag{border:1px solid var(--rule);padding:1px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-dim)}
.t-done{border-color:var(--green);color:var(--green)}
.t-blocked{border-color:var(--red);color:var(--red)}
pre{background:#0c0a07;border:1px solid var(--rule);padding:11px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#d9c9a6;font-size:12px;margin:0}
details{border:1px solid var(--rule);background:var(--panel2);margin:7px 0}
details>summary{padding:7px 11px;cursor:pointer;letter-spacing:.14em;font-size:11px;text-transform:uppercase;color:var(--amber-dim)}
details[open]>summary{border-bottom:1px solid var(--rule);color:var(--amber)}
details .inner{padding:11px}
.cycle-head{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.cycle-head h3{margin:0;font-size:13px;letter-spacing:.26em}
.empty{color:var(--grey);font-style:italic}
footer{color:var(--grey);font-size:11px;letter-spacing:.14em;text-align:center;padding:18px 0}
@media print{body::before,body::after{display:none}}

/* ── live telemetry ─────────────────────────────────────── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(420%)}}
@keyframes flicker{0%,100%{opacity:1}97%{opacity:1}98%{opacity:.82}99%{opacity:1}}
header{animation:flicker 7s infinite}
.live{border-color:var(--green)!important;color:var(--green)!important}
.live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;animation:pulse 1.1s infinite;box-shadow:0 0 6px var(--green)}
.scan{position:relative;overflow:hidden;height:3px;background:#0c0a07;border:1px solid var(--rule);border-left:0;border-right:0;margin:0}
.scan i{position:absolute;top:0;left:0;height:100%;width:24%;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 2.4s linear infinite}
/* stage pipeline */
.pipe{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--rule);background:#0c0a07}
.pipe div{flex:1;text-align:center;padding:7px 2px;font-size:10px;letter-spacing:.18em;color:#3b3225;border-right:1px solid var(--rule);position:relative}
.pipe div:last-child{border-right:0}
.pipe div.done{color:var(--amber-dim);background:#140f09}
.pipe div.now{color:#0b0a08;background:var(--amber);font-weight:700;animation:pulse 1.6s infinite}
.tele{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--grey);margin-top:6px}
.pipe div small{display:block;font-size:9px;letter-spacing:.08em;margin-top:2px;opacity:.85}
.nosignal{border-color:var(--red)!important;color:var(--red)!important;animation:pulse 1.6s infinite}
.fast{border-color:var(--green);color:var(--green)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hand{border:1px solid var(--green);background:var(--panel2);padding:9px 11px}
.hand .role{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.hand .role .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.1s infinite}
.hand .who{font-weight:700;margin:4px 0 2px}
.hand .clock{float:right;color:#e8d5ad}
.hand.slow{border-color:var(--amber)}
td.num{text-align:right;white-space:nowrap}
.add{color:var(--green)} .del{color:var(--red)}
.wip{color:var(--green);animation:pulse 1.1s infinite}
</style>

07T08:20:46Z tester-1: 22/22 pass, e2e smoke from base-commit DB passes, 222 api + 167 web tests. Tree unchanged. reporter-1 dispatched.\n- 2026-11-07T08:21:37Z verdict shipped. Fast-forward merge to main and push per owner override.\n","reportMd":"# Report: Frisson 1.0 Phase 2 (profiles, avatars, social links, verified badge)\n\n**Verdict: shipped.** All 22 acceptance criteria pass, the gates are green, and the end-to-end smoke from a base-commit database passes. Branch: `shipyard/profiles-social-links-2026-11-07T07-53-30`, base `8eaedeb`.\n\n## What was asked\nFrisson 1.0 Phase 2: user profiles with bio, location, avatar, up to 6 social links and an admin-only verified badge. API: public profile, self-edit, avatar upload/delete, admin verified toggle. Web: public profile page, edit profile page, header links, crate owner links. The owner asked for a direct merge and push to main. The harbormaster does that right after this report.\n\n## Acceptance criteria\n| AC | Summary | Status |\n|---|---|---|\n| AC1 | All repo gates green | pass |\n| AC2 | Single additive migration 0004, no DROP/RENAME, drizzle-kit reports no changes | pass |\n| AC3 | Data survives migration, empty profiles for existing users | pass |\n| AC4 | Schema columns, user_links with ON DELETE CASCADE and index | pass |\n| AC5 | Shared zod contracts and URL/limit rules | pass |\n| AC6 | Public profile endpoint, no email/role leak, 404, case-insensitive | pass |\n| AC7 | PATCH /api/me/profile, ordered links, atomic | pass |\n| AC8 | No self-verify or role/email/username change | pass |\n| AC9 | Admin-only verified endpoint | pass |\n| AC10 | Avatar upload/replace/delete, 400x400 JPEG, limits | pass |\n| AC11 | Covers approach reused, no new dependency, no path changes | pass |\n| AC12 | /u/ serves the SPA, /avatars/missing is a JSON 404 | pass |\n| AC13 | Private responses carry avatarUrl and verified; no owner email/role in crates | pass |\n| AC14 | Phase 1 permission tests unchanged | pass |\n| AC15 | Web routes and auth redirect | pass |\n| AC16 | Profile page rendering, safe link attributes | pass |\n| AC17 | Plain-text rendering, no v-html | pass |\n| AC18 | Edit profile page, 7th link blocked, no verified control | pass |\n| AC19 | Header links, badge, crate owner link | pass |\n| AC20 | API client and session store refresh | pass |\n| AC21 | Security hygiene | pass |\n| AC22 | Docs, ADR 0005, backup/restore hints | pass |\n\n## What was built (7 task commits)\n- `7d81910` feat(shared,api): profile contracts, users/user_links schema and migration 0004 (T1)\n- `5b8ba91` feat(web): profiles API client, session refresh, profile routes and verified badge (W1)\n- `967d91e` feat(api): public profiles, self-edit and admin verified flag (T2)\n- `d69b9e6` docs: user profiles, avatars backups and ADR 0005 (D1)\n- `0341332` feat(web): edit profile page with links editor and avatar upload (W3)\n- `e43bb6e` feat(web): public profile page, header profile links, crate owner link (W2)\n- `10a7668` feat(api): avatar upload/delete, shared multipart registration and /avatars static (T3)\n\n## Test results\nFull chain `format:check && lint && typecheck && test && build` exited 0:\n- api: Test Files 16 passed, Tests 222 passed\n- web: Test Files 23 passed, Tests 167 passed\n- vite build ok\n- `npx drizzle-kit generate`: \"No schema changes, nothing to migrate\"\n- Migration SQL: CREATE TABLE user_links, CREATE INDEX, 4x ALTER TABLE users ADD; zero DROP/RENAME; FK is ON DELETE cascade.\n- No package.json or lockfile changes; no Dockerfile/compose changes.\n\n**E2E smoke** (base `8eaedeb` seeded on a data dir, then the branch server in production mode on the same dir):\n- 5 migrations applied; users have bio \"\", location null, avatar null, verified 0; sessions, crates and albums intact; the old session cookie still works.\n- Public profile `/api/users/dee` returns the expected shape, with no email/role/password; `DEE` returns 200, unknown user 404.\n- Profile PATCH ok; 7 links 400, http:// 400, `verified:true` 400, profile unchanged after rejects, signed out 401.\n- Avatar: 640x480 PNG gave a 400x400 JPEG at `/avatars/2-f0cf654a.jpg`, served immutable; non-image 400; DELETE removed the file and the old URL 404s as JSON; `/avatars/missing.jpg` JSON 404; `/u/dee` serves HTML.\n- Admin verified true/false 200; non-admin 403 (own username and others); signed out 401.\n- Cover upload still works.\n\n## What went wrong\nNothing blocking. No deaths, no fix rounds.\n- W2 ran `prettier --write apps/web/src` across the web tree, which may have reformatted W3's in-progress files. It was formatting only, and the tree was clean after all commits.\n- Tester flag 1: base signup returned 500 (ResponseSerializationError) during seeding because the symlinked node_modules made the base API load the branch's `@frisson/shared`. This was a harness artifact, not a branch defect. The user, session and crate were still created. Future base runs should use a separate `npm ci`.\n- Tester flag 2: the literal credential grep on `git diff` hit 3 unchanged context lines (README SESSION_SECRET note, `'secret'` test mocks). Grep restricted to added/removed lines is empty.\n- Tester flag 3: the 6-link limit is app-enforced (zod), not a DB CHECK. The criterion allowed either.\n\n## Before you deploy\n- Avatars live in `DATA_DIR/avatars`, inside the existing `/data` volume. No compose change is needed.\n- Back up that folder alongside covers. DEPLOY.md and the backup/restore hints now mention it.\n- Migration 0004 runs automatically on start. It is additive.\n\n## Known limits\n- The 6-link cap is app-enforced only.\n- No avatar file cleanup if a user is ever deleted (account deletion is out of scope).\n- The `owner_id` FK on crates still lacks ON DELETE SET NULL, carried over from Phase 1.\n\n## Next\nPhase 3: favorites and crate likes.\n","cycles":[{"n":"1","spec":"# Cycle 1 spec: Frisson Phase 2, user profiles\n\n## What we are building\n\nEvery Frisson account gets a public face: a display name, a bio (up to 500 chars), an optional location (80), a square avatar, up to six ordered social links, and a verified badge that only an admin can grant. Anyone, signed in or not, can open `/u/:username` and see that profile plus the user's crates. Signed-in users edit their own profile at `/profile/edit`; the header links to both, and crate pages name their owner with a link to the profile.\n\n## Why it is shaped this way\n\n**Data.** Profile fields are additive columns on `users` (`bio` not null default `''`, `location`, `avatar_path`, `verified` not null default 0) so existing users pick up empty profiles through defaults alone. Links are their own `user_links` table (FK `ON DELETE CASCADE`, `position`, index on `(user_id, position)`) because they are an ordered list. The six-link limit lives in the shared zod schema and is checked again in the service. drizzle-kit generates migration 0004, which nobody edits by hand. A migration test in the 0003 style shows that every Phase 1 row survives.\n\n**Contracts first.** `packages/shared/src/index.ts` is one file, so T1 owns it and writes every schema later tasks need: `SOCIAL_PLATFORMS`, `MAX_AVATAR_BYTES`, `usernameParams`, `profileLinkInput`, `updateProfileInput`, `setVerifiedInput`, `publicProfile`, plus `avatarUrl` and `verified` added to the private `publicUser`. The API and the web app then validate against the same rules.\n\n**No leaks and no self-verify.** `publicUser` carries email and role, so it stays private to `/auth/*`. The public profile gets its own schema and its own mapper (`toPublicProfile`), and a test checks that the JSON contains no email and no `role` key. `updateProfileInput` is a `z.strictObject`, which means `verified`, `role`, `email` or `username` in the body gets a 400 and changes nothing. There is no `:username` edit route. Only `requireAdmin` guards `PATCH /api/users/:username/verified`, and a regular user gets 403 there even for their own name.\n\n**Link safety.** A URL must parse with `URL`, use `https:`, have a host, carry no credentials and be at most 2048 chars. Any platform accepts any https URL, and duplicate platforms are allowed. The web renders everything through `{{ }}` and never `v-html`. Links open with `target=\"_blank\" rel=\"noopener noreferrer\"`.\n\n**PATCH semantics.** `PATCH /api/me/profile` replaces `displayName`, `bio`, `location` and `links` in full. Array order becomes position, and the whole change runs in one transaction, so a rejected request changes nothing.\n\n**Avatars reuse covers.** The pipeline is the same as for covers: sharp rotates (EXIF) and resizes to a 400x400 JPEG, with the same 50 MP guard. File names are random (`\u003cuserId>-\u003c8hex>.jpg`) and deletes are basename-guarded. The files live under `DATA_DIR/avatars` (`AVATARS_DIR` overrides it), are served by a second `@fastify/static` with immutable caching, and the DB stores only the `/avatars/...` path. `@fastify/multipart` is registered globally today inside the covers plugin. T3 moves that registration into a single `uploads` plugin whose ceiling covers both cases, and each route passes its own limit to `req.file()` (10 MB for covers, 5 MB for avatars). The SPA fallback and the Vite proxy learn `/avatars/`, so a missing avatar returns a real 404 while `/u/x` still serves `index.html`. Caddy already proxies everything. No new dependencies.\n\n**Responses.** `GET /api/users/:username`, `PATCH /api/me/profile`, `PATCH /api/users/:username/verified` and `POST/DELETE /api/me/avatar` all return `publicProfile`. After a change, the web session store calls `/api/auth/me` again so the header picks up the new name, avatar and badge.\n\n## Task graph\n\n- **T1** contracts, schema, migration 0004, `toPublicUser` fields, and fixture fixes. Every other task depends on it.\n- **T2** (after T1) profile service and routes, `requireAdmin`, `profileRoutes` in `app.ts`, `profiles.test.ts` with the describe names `public profile`, `update profile`, `cannot self`, `verified` plus a `no email` crate test.\n- **T3** (after T2, because both edit `app.ts`) avatars and the shared multipart refactor, `/avatars` static, `web.ts` fallback, Vite proxy, test helpers (sole owner), `avatars.test.ts`, and the `avatars` describe in `web.test.ts`.\n- **W1** (after T1) web API client, session `refresh` and save wrappers, both routes with placeholder views, `router.test.ts`, `VerifiedBadge`.\n- **W2** (after W1) ProfileView (including the `plain text` XSS test), header links and badge (`App.test.ts`), crate owner link (`ownerLink.test.ts`).\n- **W3** (after W1) EditProfileView with LinksEditor and AvatarUpload. The word \"verified\" never appears in that view.\n- **D1** (after T1) DEPLOY backups and restore, backup/restore hints, ADR 0005, README API table and env vars.\n\nWaves: T1, then T2/W1/D1 in parallel, then T3/W2/W3 in parallel. That never exceeds the cap of 4, and no two unordered tasks share a file.\n\n## Out of scope\n\nFavorites, likes, follows, feed, B-Side, email verification, password change, account deletion. No changes to `crate.db`, `DATA_DIR`, `/data` or the `crate-data` volume. Nothing in the Pennant GitHub organization.\n","plan":{"cycle":1,"base":"8eaedebd510420837409cd59b5d0a2eec871c162","concurrencyCap":4,"waves":[["T1"],["T2","W1","D1"],["T3","W2","W3"]],"tasks":[{"id":"T1","title":"Shared profile contracts, users/user_links schema, migration 0004","description":"Sole owner of packages/shared/src/index.ts for this cycle; add everything later tasks need now. (1) Shared, new section 'Profiles': SOCIAL_PLATFORMS = ['instagram','x','tiktok','youtube','soundcloud','spotify','bandcamp','discogs','website'] as const; MAX_AVATAR_BYTES = 5*1024*1024; AVATAR_SIZE is api-side only. usernameParams = z.object({ username }) reusing the signup username rule (trim, lowercase, 3-32, [a-z0-9_-]); extract that rule into a const and reuse it in signupInput without changing behavior. profileLinkUrl: string trimmed, max 2048, refine via new URL(): protocol must be 'https:' (URL lowercases the scheme, so 'HTTPS://' is fine), hostname non-empty, no username/password in the URL; rejects http:, javascript:, data:, ftp:, relative and garbage. profileLinkInput = z.object({ platform: z.enum(SOCIAL_PLATFORMS), url: profileLinkUrl }). updateProfileInput = z.strictObject (unknown keys such as verified, role, email, username give 400) { displayName: 1-60 trimmed required, bio: trimmed max 500 default '', location: trimmed max 80, optional/nullable, empty string normalized to null, links: z.array(profileLinkInput).max(6) default [] }. Duplicate platforms allowed. profileLink = {platform, url}; profileCrate = {id, name, color, label (nullable), albumCount}; publicProfile = z.object({ username, displayName, bio, location: nullable, avatarUrl: nullable, verified: boolean, links: profileLink[], crates: profileCrate[] }) with a 'Data classification: PUBLIC' comment and no id/email/role. setVerifiedInput = z.strictObject({ verified: z.boolean() }). Extend publicUser (the private /auth shape) with avatarUrl: string.nullable() and verified: boolean. Export types PublicProfile, ProfileLink, ProfileLinkInput, UpdateProfileInput, UpdateProfileRequest (z.input), SocialPlatform, SetVerifiedInput. (2) apps/api/src/db/schema.ts: users gain bio text not null default '', location text nullable, avatarPath (column avatar_path) text nullable, verified integer mode boolean not null default false. New table user_links (const userLinks): id pk autoincrement, user_id integer not null references users.id ON DELETE CASCADE, platform text with enum SOCIAL_PLATFORMS, not null, url text not null, position integer not null, index user_links_user_position_idx on (user_id, position) (unique is fine); relations and inferred types (UserLink, NewUserLink). 6-per-user limit is app-level (shared zod plus service). (3) Generate with `npm run db:generate -w apps/api -- --name user_profiles` (or plain db:generate if --name is not supported); never edit 0000-0003 or hand-edit 0004. Inspect: only CREATE TABLE/CREATE INDEX/ALTER TABLE ADD; contains ON DELETE cascade; no DROP/RENAME. Re-run generate to confirm 'No schema changes'. (4) apps/api/src/services/users.ts toPublicUser adds avatarUrl: user.avatarPath ?? null and verified: user.verified (sessions.ts already selects the full users row; touch it only if typecheck needs). (5) Fix every PublicUser fixture that breaks typecheck in the listed test files (add avatarUrl: null, verified: false) without changing behavior. (6) Tests: migration.test.ts gets a describe 'migration 0004' in the existing 0003 style (DB at 0003 with users, session, crates, albums, tracks; apply 0004; all rows intact; bio '', location/avatar_path NULL, verified 0/false, zero user_links rows); schema.test.ts asserts new columns, defaults and cascade (deleting a user removes their links); new apps/api/test/shared-profile.test.ts covers the AC5 matrix; auth-accounts.test.ts asserts /auth/me, signup and login include avatarUrl null and verified false. Do not touch apps/api/test/helpers.ts (owned by T3).","criteria":["AC1","AC2","AC3","AC4","AC5","AC13","AC14"],"files":["packages/shared/src/index.ts","apps/api/src/db/schema.ts","apps/api/drizzle/0004_*.sql","apps/api/drizzle/meta/0004_snapshot.json","apps/api/drizzle/meta/_journal.json","apps/api/src/services/users.ts","apps/api/src/services/sessions.ts","apps/api/test/migration.test.ts","apps/api/test/schema.test.ts","apps/api/test/shared-profile.test.ts","apps/api/test/auth-accounts.test.ts","apps/api/test/shared-auth.test.ts","apps/api/test/bootstrap.test.ts","apps/web/src/views/editControls.test.ts","apps/web/src/utils/permissions.test.ts","apps/web/src/stores/session.test.ts"],"dependsOn":[]},{"id":"T2","title":"API: public profile, PATCH /api/me/profile, admin verified flag","description":"New apps/api/src/services/profiles.ts: getPublicProfile(db, username) looks up via findUserByUsername (lower-cased), 404 via notFound('User') when missing, maps with a dedicated toPublicProfile mapper (never toPublicUser), links ordered by position asc, crates owned by the user ordered by sortOrder with albumCount (reuse crate service query helpers or a Drizzle count; no string-built SQL). updateOwnProfile(db, user, input): requireUser (401), then in one db.transaction update users (displayName, bio, location) and delete then insert user_links with position = array index; enforce links.length \u003c= 6 again server-side; returns the caller's public profile. setVerified(db, actor, username, verified): requireUser 401, then requireAdmin 403 (add requireAdmin to permissions.ts; role check only, applies to admins' own and others' usernames; regular users get 403 even on their own name), then 404 unknown user, update, return public profile. New apps/api/src/routes/profiles.ts (profileRoutes, FastifyPluginAsyncZod): GET '/users/:username' (params usernameParams, response publicProfile), PATCH '/me/profile' (body updateProfileInput, response publicProfile), PATCH '/users/:username/verified' (params usernameParams, body setVerifiedInput, response publicProfile). Order of checks for PATCH /me/profile: 401 must win over 400 for signed-out callers; if the zod body validation runs first, add a preValidation hook that calls requireUser. No reply.code(4xx) in routes; errors only via HttpError. Register profileRoutes in app.ts under /api after coverRoutes and before webPlugin. Tests in new apps/api/test/profiles.test.ts using existing helpers (signUp, createAdmin, addCrate) without editing helpers.ts, with describe names exactly 'public profile', 'update profile', 'cannot self', 'verified'. Cover: anonymous 200 with exactly the public keys; JSON string lacks the email; role key undefined; case-insensitive lookup (/api/users/ALICE); unknown 404; empty profile gives bio '' and links []; crates listed. Update: 401 signed out; round-trip of all fields; link order preserved; [] clears; 7 links, http url, javascript: url, bad platform, bio 501, location 81 each 400 and nothing changed afterwards (atomic). 'cannot self': verified:true, role:'admin', email, username each give 400 and GET shows nothing changed; no :username edit route exists. 'verified': admin set/unset reflected in GET; 401; 403 for a user including own username; 404; bad body 400. Also a test named with 'no email' asserting crate list and crate detail JSON for an owned crate contain no 'email' key and no 'role' key (AC13).","criteria":["AC1","AC6","AC7","AC8","AC9","AC13","AC14","AC21"],"files":["apps/api/src/services/profiles.ts","apps/api/src/routes/profiles.ts","apps/api/src/services/permissions.ts","apps/api/src/app.ts","apps/api/test/profiles.test.ts"],"dependsOn":["T1"]},{"id":"T3","title":"API: avatar upload/delete, shared multipart registration, /avatars static and routing","description":"Shared upload refactor (this task is the only one touching multipart): new apps/api/src/plugins/uploads.ts (fastify-plugin) registers @fastify/multipart exactly once with limits { fileSize: Math.max(MAX_COVER_BYTES, MAX_AVATAR_BYTES), files: 1, fields: 0 }; remove the multipart registration from plugins/covers.ts; covers route passes its own limit via req.file({ limits: { fileSize: MAX_COVER_BYTES } }) so cover behavior and covers.test.ts stay unchanged. New apps/api/src/plugins/avatars.ts (mkdir, decorate app.avatarsDir, second @fastify/static with prefix AVATARS_URL_PREFIX '/avatars/', decorateReply false, immutable, maxAge 365d). paths.ts: DEFAULT_AVATARS_DIR = process.env.AVATARS_DIR ?? resolve(DATA_DIR, 'avatars'); do not change DATA_DIR, crate.db or covers paths. New apps/api/src/services/avatars.ts mirroring covers.ts: AVATAR_SIZE = 400, processAvatar (rotate for EXIF, resize 400x400 fit cover, jpeg q82 mozjpeg, same 50 MP limitInputPixels guard, non-image gives badRequest 400), file name `${userId}-${randomBytes(4).toString('hex')}.jpg`, DB stores only '/avatars/\u003cfile>' in users.avatar_path, deleteAvatarFile uses basename() and ignores ENOENT, setAvatar writes file then updates DB with try/catch cleanup of the new file on failure and deletes the old file after success, removeAvatar clears and deletes (200 no-op when none). Both return the caller's public profile via getPublicProfile from services/profiles.ts (T2). New apps/api/src/routes/avatars.ts (avatarRoutes): POST '/me/avatar' (requireUser before reading the stream; field must be 'avatar' else 400; req.file({ limits: { fileSize: MAX_AVATAR_BYTES } }) and toBuffer gives 413 over the limit), DELETE '/me/avatar'; responses publicProfile; no reply.code(4xx). app.ts: AppOptions.avatarsDir (default DEFAULT_AVATARS_DIR); register uploadsPlugin before coversPlugin, avatarsPlugin after it, avatarRoutes under /api before webPlugin. plugins/web.ts: SPA fallback also excludes '/avatars/' (so /u/someone gets index.html and /avatars/missing.jpg gets the JSON 404). apps/web/vite.config.ts: proxy '/avatars' like '/covers' (leave the test block alone). docker/Caddyfile proxies everything already; no change expected. helpers.ts (sole owner): buildTestApp gets a temp avatarsDir (mkdtemp 'frisson-avatars-', removed on close unless opts.avatarsDir given), plus any small image fixture helper (e.g. pngBuffer via sharp). Tests: new apps/api/test/avatars.test.ts covering every AC10 item (sharp metadata 400x400 jpeg, file in avatarsDir, GET /avatars/\u003cfile> 200 image/jpeg, replace deletes old, DELETE clears and deletes, DELETE with none 200, 401, non-image 400, over MAX_AVATAR_BYTES 413, wrong field 400, EXIF orientation 6 input becomes upright like covers.test); web.test.ts gains a describe named 'avatars' asserting GET /u/someone 200 index.html and GET /avatars/missing.jpg 404 JSON. No new dependency.","criteria":["AC1","AC10","AC11","AC12","AC14","AC21"],"files":["apps/api/src/plugins/uploads.ts","apps/api/src/plugins/covers.ts","apps/api/src/plugins/avatars.ts","apps/api/src/routes/covers.ts","apps/api/src/routes/avatars.ts","apps/api/src/services/avatars.ts","apps/api/src/paths.ts","apps/api/src/plugins/web.ts","apps/api/src/app.ts","apps/web/vite.config.ts","apps/api/test/helpers.ts","apps/api/test/avatars.test.ts","apps/api/test/web.test.ts"],"dependsOn":["T1","T2"]},{"id":"W1","title":"Web foundation: profiles API client, session refresh, routes, verified badge","description":"New apps/web/src/api/profiles.ts using request() and shared types: getProfile(username) GET /api/users/:username (encodeURIComponent anyway), updateProfile(input: UpdateProfileRequest) PATCH /api/me/profile, uploadAvatar(file: File) POST /api/me/avatar as FormData field 'avatar', removeAvatar() DELETE /api/me/avatar, setVerified(username, verified) PATCH /api/users/:username/verified; all return PublicProfile. Add a 'Data classification: PUBLIC' comment. Session store (stores/session.ts): add refresh() that re-fetches /api/auth/me and replaces user, plus saveProfile(input), saveAvatar(file), deleteAvatar() wrappers that call the api and then refresh(); keep existing behavior. Extend stores/session.test.ts to prove refresh after each change. router.ts: add { path: '/u/:username', name: 'profile', component: () => import('./views/ProfileView.vue'), props: route => ({ username: String(route.params.username) }) } (no requiresAuth) and { path: '/profile/edit', name: 'profile-edit', component: () => import('./views/EditProfileView.vue'), meta: { requiresAuth: true } }, both before the catch-all. Create minimal placeholder views ProfileView.vue (prop username) and EditProfileView.vue that W2 and W3 replace (placeholders must lint/typecheck; EditProfileView must not contain the word 'verified'). New apps/web/src/router.test.ts: signed-out visitor to /profile/edit is redirected to login with next=/profile/edit; /u/someone resolves without redirect (mock fetch or the session store). New apps/web/src/components/profile/VerifiedBadge.vue: inline SVG or text badge with role='img' and aria-label='Verified' (title 'Verified'), styled ks and the badge toggle. CrateView.vue: show the current crate's owner as 'by \u003cRouterLink to=/u/ownerUsername>ownerDisplayName ?? ownerUsername\u003c/RouterLink>' when ownerUsername is non-null and nothing when null; extract it to a small apps/web/src/components/crate/OwnerLink.vue (props username, displayName) so it is testable; new apps/web/src/views/ownerLink.test.ts covers both cases. No v-html anywhere.","criteria":["AC1","AC16","AC17","AC19"],"files":["apps/web/src/views/ProfileView.vue","apps/web/src/views/ProfileView.test.ts","apps/web/src/App.vue","apps/web/src/App.test.ts","apps/web/src/views/CrateView.vue","apps/web/src/components/crate/OwnerLink.vue","apps/web/src/views/ownerLink.test.ts"],"dependsOn":["W1"]},{"id":"W3","title":"Web: edit profile page","description":"Replace the EditProfileView.vue placeholder (requiresAuth route). Loads current values via getProfile(session.user.username). Form: displayName (maxlength 60), bio textarea (maxlength 500 with a live 'n/500' counter), location (maxlength 80), links editor in new apps/web/src/components/profile/LinksEditor.vue (v-model of ProfileLinkInput[]; add, remove, move up/down; platform \u003cselect> options from SOCIAL_PLATFORMS; url input type=url; the Add button is disabled at 6 and add() refuses a 7th). Save sends updateProfile via session.saveProfile with exactly { displayName, bio, location (null when blank), links } in display order; shows API validation errors (errorMessage and issues per field when present). Avatar: new apps/web/src/components/profile/AvatarUpload.vue (accept image/jpeg,image/png,image/webp; client-side reject over MAX_AVATAR_BYTES with a message; hint '5 MB'; preview via object URL; Remove button) wired to session.saveAvatar / session.deleteAvatar immediately. After save, link to /u/\u003cusername>. The file EditProfileView.vue must not contain the string 'verified' anywhere (including comments) and offers no verified control. Plain text bindings only, no v-html. New Edi s schema, migration 0004. Commit 7d81910.\n\n- Shared: Profiles section (SOCIAL_PLATFORMS, MAX_AVATAR_BYTES, MAX_PROFILE_LINKS, usernameParams, profileLinkUrl, profileLinkInput, updateProfileInput strict, profileLink, profileCrate, publicProfile PUBLIC, setVerifiedInput) and types. Username rule extracted to `usernameField`, reused by signupInput. publicUser gains avatarUrl and verified.\n- Schema: users bio/location/avatar_path/verified; user_links with cascade FK and (user_id, position) index; relations and UserLink/NewUserLink.\n- Migration generated by `db:generate -- --name user_profiles`; only CREATE/ALTER ADD; regenerate reports no changes. Generated JSON prettier-formatted (whitespace only).\n- toPublicUser maps avatarPath and verified.\n- Tests: migration 0004 describe, schema defaults/cascade, shared-profile.test.ts (AC5 matrix), auth-accounts avatarUrl/verified, fixture fixes.\n- All five gates green. No new dependencies.\n"},{"id":"dev-T2","body":"# dev-T2\n\nTask T2: API public profile, PATCH /api/me/profile, admin verified flag. Commit 967d91e.\n\n- services/profiles.ts: toPublicProfile (explicit public fields only), getPublicProfile (lower-cased lookup, 404 'User not found'), updateOwnProfile (requireUser, server-side 6-link cap, one transaction: update users, delete+insert links with position = index), setVerified (requireAdmin, 404, update). Crates via Drizzle leftJoin + count, ordered sortOrder, id.\n- permissions.ts: requireAdmin (401 then 403, role check only).\n- routes/profiles.ts: three routes; preValidation requireUser / requireAdmin so 401/403 win over 400. No reply.code.\n- app.ts: profileRoutes under /api after coverRoutes, before webPlugin.\n- test/profiles.test.ts: describes 'public profile', 'update profile', 'cannot self', 'verified', 'crate responses: no email' (26 tests).\n- api typecheck, tests (205), eslint, prettier green. Full repo gates not run (parallel web/docs work). No new deps.\n- Uncommitted backup.ts/restore.ts edits in tree are not T2's.\n"},{"id":"dev-T3","body":"# dev-T3\n\nTask T3: avatar upload/delete, shared multipart registration, /avatars static and routing. Commit 10a7668.\n\n- plugins/uploads.ts registers @fastify/multipart once (fileSize max(cover, avatar), files 1, fields 0); covers.ts no longer registers it; covers route passes MAX_COVER_BYTES per request.\n- plugins/avatars.ts: mkdir, app.avatarsDir, @fastify/static at /avatars/ (immutable, 365d).\n- paths.ts: DEFAULT_AVATARS_DIR = AVATARS_DIR ?? DATA_DIR/avatars. Other paths unchanged.\n- services/avatars.ts mirrors covers: 400x400 JPEG q82 mozjpeg, rotate, 50 MP guard, server-generated names, basename deletes, write-then-update with cleanup. Returns getPublicProfile.\n- routes/avatars.ts: POST/DELETE /me/avatar, requireUser before stream, field 'avatar', no reply.code.\n- web.ts SPA fallback excludes /avatars/; vite proxies /avatars.\n- helpers: temp avatarsDir, pngBuffer. Tests: avatars.test.ts (15), web.test.ts 'avatars'.\n- All five root gates green. No new deps.\n"},{"id":"dev-W1","body":"# dev-W1\n\nTask W1: web profiles API client, session refresh and save wrappers, profile routes, placeholder views, VerifiedBadge. Commit 5b8ba91.\n\n- `api/profiles.ts` (PUBLIC): getProfile (encodeURIComponent), updateProfile PATCH /me/profile, uploadAvatar POST /me/avatar FormData `avatar`, removeAvatar DELETE, setVerified PATCH /users/:username/verified. Returns PublicProfile.\n- Session store: `refresh()`, `saveProfile`, `saveAvatar`, `deleteAvatar` (API then refresh; return profile). Existing behaviour unchanged.\n- Router: `/u/:username` (profile, public, props username) and `/profile/edit` (profile-edit, requiresAuth) before the catch-all.\n- Tests: session refresh describe (5), router.test.ts (3), VerifiedBadge.test.ts (1). Web gates green (127 tests). No new dependencies.\n"},{"id":"dev-W2","body":"# dev-W2\n\nTask W2: public profile page, header profile links, crate owner link. Commit e43bb6e.\n\n- `views/ProfileView.vue`: getProfile(username) with watch immediate; loading / not-found (\"Profile not found.\") / error (Try again) / ready. Avatar or initials placeholder, displayName + VerifiedBadge when verified, @username, location, bio (pre-line), links (`target=_blank rel=\"noopener noreferrer\"`, platform label + url text), crates (swatch, label ?? name, name sub, record count). Owner sees Edit profile (route name `profile-edit`). Text only via `{{ }}`.\n- `App.vue`: `a.who` RouterLink to `/u/\u003cusername>` with badge, Edit profile link, Log out kept.\n- `components/crate/OwnerLink.vue` used in CrateView under the tabs; nothing for null owners.\n- Tests: ProfileView.test.ts (14, incl. \"plain text\"), App.test.ts (5), ownerLink.test.ts (4). Web gates green, 167 tests. No v-html, no new deps.\n- Note: ran `prettier --write apps/web/src` once, which may have reformatted W3's in-progress files (formatting only).\n"},{"id":"dev-W3","body":"# dev-W3\n\nTask W3: edit profile page. Commit 0341332.\n\n- `views/EditProfileView.vue`: loads via getProfile(session.user.username); displayName (60), bio (500, live n/500), location (80); saves exactly { displayName, bio, location|null, links } through session.saveProfile; shows API message plus per-field issues; links to /u/\u003cusername> after save. No v-html, no forbidden word, no extra controls.\n- `components/profile/LinksEditor.vue`: v-model ProfileLinkInput[]; add/remove/move up/down; platform select from SOCIAL_PLATFORMS; type=url; add disabled and refused at 6.\n- `components/profile/AvatarUpload.vue`: accept jpeg/png/webp, client size check vs MAX_AVATAR_BYTES ('5 MB' hint), object URL preview, Remove; calls session.saveAvatar/deleteAvatar immediately.\n- Tests: EditProfileView.test.ts (10), LinksEditor.test.ts (7). Web gates green (167). No new dependencies.\n"},{"id":"intake-1","body":"# Intake notes, Frisson Phase 2 (user profiles)\n\nRead: intake agent spec, Phase 1 brief and report, schema.ts, covers plugin/service/route, paths.ts, app.ts, users service, permissions, web plugin, router, shared index, migration test, test helpers.\n\nKey findings from the code\n- Covers pipeline: sharp, 800px square JPEG, 50 MP guard, random file name, basename-guarded delete, multipart registered inside coversPlugin (limit MAX_COVER_BYTES, files 1, fields 0). Registering multipart a second time for avatars will conflict; plan a shared registration.\n- web.ts SPA fallback excludes only /api/ and /covers/; /avatars/ must be added.\n- publicUser (shared) includes email and role and is the private /auth shape; toPublicUser must NOT be reused for public profiles.\n- crate schema already has ownerId and ownerUsername; crate pages need only link them (plus optional display name).\n- Username charset [a-z0-9_-], 3-32, lower-cased: safe in URLs.\n- Phase 1 drizzle-kit dropped an ON DELETE action on an ALTER ADD FK; new FK is on CREATE TABLE so should be fine but check.\n- Backup/restore scripts and DEPLOY.md only mention covers; avatars need the same note.\n- No git base tag; base is HEAD 8eaedeb.\n\nJudgment calls (all in assumptions): full-replace PATCH semantics for links, 5 MB / 400px avatar, field name 'avatar', no host-platform matching, duplicate platforms allowed.\nMemory: no relevant stored facts used beyond the Never edit Pennant org constraint.\n"},{"id":"manager-1","body":"# manager-1 notes\n\nRead: manager.md, brief.json, codebase-map.json, intake-1.md, ledger.md, and source files app.ts, plugins/covers.ts, plugins/web.ts, routes/covers.ts, paths.ts, services/users.ts, services/sessions.ts, shared index.ts, router.ts, Caddyfile, and the backup/restore hints.\n\nDecisions\n- 7 tasks: T1 (contracts+schema+migration) -> T2, W1, D1 -> T3 (after T2, shared app.ts), W2, W3 (after W1). Ownership validated by script: no file shared between unordered tasks; AC1-AC22 all covered.\n- AC naming wins over brief prose: the table is `user_links` and the column is `avatar_path`.\n- updateProfileInput and setVerifiedInput are strict (400 on unknown keys) rather than stripping.\n- All profile mutations and avatar endpoints return publicProfile; the web refreshes /auth/me afterwards.\n- Multipart: T3 moves the single registration into plugins/uploads.ts and passes per-route limits to req.file(). Covers behavior must not change.\n- helpers.ts is owned by T3 only (temp avatarsDir). T2 uses the existing helpers as they are.\n- W1 creates placeholder ProfileView/EditProfileView so router.ts typechecks; W2 and W3 replace them.\n- T1 owns the PublicUser fixture fixes in api and web tests (new required fields avatarUrl and verified). session.test.ts is then handed to W1, which depends on T1.\n- Links accept any https URL for any platform; duplicates are allowed; credentials in a URL are rejected.\n- Caddyfile proxies everything, so no change is needed; Docker and the volume are untouched.\n- Test-name contract from the brief is kept as written: 'migration 0004', 'public profile', 'update profile', 'cannot self', 'verified', 'avatars', 'plain text', and 'no email'.\n\nRisks for review: the 0004 SQL must show ON DELETE cascade and no DROP; PATCH /me/profile must give 401 before body validation; also check how vue-tsc handles the placeholder views.\nMemory: used only the stored rule never to touch the Pennant org (already in constraints).\n"},{"id":"reporter-1","body":"# reporter-1 notes\nWrote report.md from state.json, ledger.md, brief.json, cycles/1/test-report.json, tester-1 and dev-W2 notes, and git log 8eaedeb..HEAD. Verdict shipped. Included tester flags and W2 prettier note. Did not touch the repo.\n"},{"id":"surveyor-1","body":"# Surveyor 1: structure and tests (Frisson)\n\nMonorepo (npm workspaces): packages/shared, apps/api (Fastify, native TS), apps/web (Vue/Vite).\n\napp.ts buildApp order: error-handler, db, auth (cookie + req.user from frisson_session via onRequest hook), covers, then routes under /api: health, auth (own rate limit), crates, albums, covers, then web plugin last. server.ts adds bootstrapFromEnv for the first admin.\n\nTests: vitest in api (no config) and web (happy-dom in vite.config.ts, no setup file). API helpers in apps/api/test/helpers.ts: buildTestApp, signUp (real signup, returns cookie/headers), createAdmin (direct insert plus session), addCrate, multipart.\n\nRoot: npm test, npm run typecheck, lint, format:check, build. CI runs format:check, lint, typecheck, test, build, plus a Docker smoke test.\n\nNot verified: auth route paths beyond signup/logout/me were not opened; nothing was run.\n"},{"id":"surveyor-2","body":"# Surveyor 2 notes: conventions and documentation\nTarget /home/claude/crate-digger (Frisson). Details in survey-conventions-docs.json.\n- API: routes thin, services own logic and call services/permissions.ts, errors via HttpError into {statusCode,error,message,issues?}.\n- Shared zod contract in packages/shared/src/index.ts; publicUser includes email, crate carries public owner username/displayName only.\n- Web: Pinia setup stores, api/client.ts request(), canEditCrate UI mirror, scoped styles on base.css tokens (cardboard/paper/ink, Courier display).\n- Docs: nothing on profiles or social anywhere. SPEC data model/API predate accounts. Next ADR is 0005. README API table and Layout need updates for new routes.\n"},{"id":"surveyor-3","body":"# Surveyor 3 notes (relevant)\n- Stack: Fastify + zod type provider, drizzle/better-sqlite3, sharp, Vue 3 + pinia + vue-router; npm workspaces (apps/api, apps/web, packages/shared).\n- Admin = user.role === 'admin' (permissions.ts:21-25); no admin-only helper yet.\n- Cover pipeline is the model for avatars: processCover (800px JPEG), random filename, deleteCoverFile, multipart field name, static serving at /covers/ only. Avatars would need a new dir/prefix or reuse covers dir; web.ts SPA fallback (web.ts:34) and vite proxy only know /api and /covers.\n- multipart registered globally with fields:0, files:1 (plugins/covers.ts:23-25).\n- Crate owner info already in API (ownerUsername/ownerDisplayName) but not rendered anywhere in web.\n- Session store has no way to update user after profile edit; header shows plain text name.\n- Absent: users GET route, profile fields, social links table, verified flag, profile views/routes.\n- Memory preference noted: never edit Pennant GitHub org (not relevant here); none else applicable.\n"},{"id":"tester-1","body":"# tester-1 notes (cycle 1)\n\nVerdict: AC1..AC22 all pass. Smoke pass. Report: cycles/1/test-report.json.\n\n## What I did\n- Ran the full gate chain once: exit 0 (api 16 files / 222 tests, web 23 files / 167 tests, vite build ok).\n- Ran every `check` from brief.json: each named vitest filter (all matched tests, none 0-match), every grep/ls/diff, and `npx drizzle-kit generate` (\"No schema changes\").\n- Read the assertions in migration, profiles, avatars, shared-profile, web, auth-accounts and the web ProfileView, EditProfileView, router, App, ownerLink and session tests. None are trivial. They check status codes and also the resulting state: DB rows deep-equal to the snapshot, the profile unchanged after a rejected PATCH, files present or absent in the avatars dir, sharp metadata, and exact key sets.\n- Smoke: extracted base 8eaedeb with git archive into /tmp/sy2-base and ran it on /tmp/sy2-data. Seeded user dee, a crate and an album, then ran the branch server on the same DATA_DIR with ADMIN_EMAIL/ADMIN_PASSWORD in production mode. Everything listed in the brief behaved: migration preserved the data and gave empty profiles, the old session still works, the public profile has no email or role, PATCH accepts and rejects the right payloads, the avatar is served as a 400x400 JPEG with immutable caching, DELETE removes the file, admin verified works and a non-admin gets 403, and cover upload still works. Both servers killed.\n\n## Flags for the harbormaster\n1. Not a defect: base signup returned 500 during seeding (ResponseSerializationError, avatarUrl/verified missing). That is because I symlinked node_modules from the repo, so the base API loaded the branch's @frisson/shared. The user, session and crate were created anyway. Future testers should use a separate `npm ci` for a clean base run.\n2. AC21: the literal credential grep on `git diff` has 3 hits (the README note about SESSION_SECRET, plus `'secret'` mocks in shared-auth.test.ts). All 3 are unchanged context lines. A grep limited to added and removed lines is empty.\n3. AC4: the 6-link limit is enforced in the app (zod max 6), not by a DB CHECK. The criterion allows either.\n\n## Worktree\nI touched no tracked files. git status shows only the untracked run dir. Temp files are in /tmp/sy2-base, /tmp/sy2-data, /tmp/sy2-img, /tmp/sy2-scripts and /tmp/*.log|jar.\n"}],"runDir":"/home/claude/crate-digger/.shipyard/runs/2026-11-07T07-53-30","live":false,"stages":["intake","survey","plan","build","test","fix","report","done"],"tree":{"files":[{"path":"apps/api/drizzle/0004_user_profiles.sql","add":14,"del":0,"wip":false},{"path":"apps/api/drizzle/meta/_journal.json","add":7,"del":0,"wip":false},{"path":"apps/api/drizzle/meta/0004_snapshot.json","add":536,"del":0,"wip":false},{"path":"apps/api/src/app.ts","add":13,"del":2,"wip":false},{"path":"apps/api/src/db/backup.ts","add":3,"del":1,"wip":false},{"path":"apps/api/src/db/restore.ts","add":1,"del":1,"wip":false},{"path":"apps/api/src/db/schema.ts","add":30,"del":1,"wip":false},{"path":"apps/api/src/paths.ts","add":1,"del":0,"wip":false},{"path":"apps/api/src/plugins/avatars.ts","add":29,"del":0,"wip":false},{"path":"apps/api/src/plugins/covers.ts","add":3,"del":10,"wip":false},{"path":"apps/api/src/plugins/uploads.ts","add":14,"del":0,"wip":false},{"path":"apps/api/src/plugins/web.ts","add":5,"del":3,"wip":false},{"path":"apps/api/src/routes/avatars.ts","add":25,"del":0,"wip":false},{"path":"apps/api/src/routes/covers.ts","add":3,"del":2,"wip":false},{"path":"apps/api/src/routes/profiles.ts","add":47,"del":0,"wip":false},{"path":"apps/api/ <script>
const D = JSON.parse(document.getElementById('run-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

const st = D.state || {};
const verdict = (st.verdict || 'pending').toLowerCase();
const crit = st.criteria || {};
const critKeys = Object.keys(crit);
const statements = {};
(D.brief?.acceptanceCriteria || []).forEach(c => { statements[c.id] = c.statement; });
const keys = critKeys.length ? critKeys : Object.keys(statements);
const counts = { pass: 0, fail: 0, untested: 0 };
keys.forEach(k => { counts[(crit[k] || 'untested')] = (counts[(crit[k] || 'untested')] || 0) + 1; });
const total = keys.length || 1;

const parts = [];

const nowIdx = D.stages.indexOf(st.stage);
const T = s => { const t = Date.parse(s); return Number.isFinite(t) ? t : null; };
const dur = ms => {
  if (ms == null || ms < 0) return '';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}h${String(m).padStart(2, '0')}m` : m ? `${m}m${String(r).padStart(2, '0')}s` : `${r}s`;
};
// Elements carrying data-since tick every second, so the page looks alive
// between renders even while one long agent is working.
const since = (iso, end) => {
  const a = T(iso); if (a == null) return '—';
  const b = T(end);
  return b != null ? dur(b - a) : `<span data-since="${a}">${dur(Date.now() - a)}</span>`;
};
const times = st.stageTimes || {};
const pipeline = D.stages.filter(s => s !== 'done').map((s, i) => {
  const cls = D.live && i === nowIdx ? 'now' : (nowIdx > i || !D.live ? 'done' : '');
  const t = times[s];
  const clock = t?.start ? `<small>${since(t.start, (D.live && i === nowIdx) ? null : (t.end || null))}</small>` : '';
  return `<div class="${cls}">${s.toUpperCase()}${clock}</div>`;
}).join('');
const quietMs = D.stateMtime ? Date.now() - D.stateMtime : 0;
const active = Array.isArray(st.active) ? st.active : [];

parts.push(`
<header>
  <h1>SHIPYARD<small>AUTONOMOUS DEV YARD // ${D.live ? 'YARD ACTIVE' : 'RUN RECORD'}</small></h1>
  <div class="meta">
    ${D.live
      ? '<span class="chip verdict live"><span class="dot"></span>WORKING</span>'
      : `<span class="chip verdict v-${esc(verdict)}">${esc(verdict)}</span>`}
    <span class="chip">RUN <b>${esc(st.runId || '—')}</b></span>
    ${st.startedAt ? `<span class="chip">ELAPSED <b>${since(st.startedAt, D.live ? null : st.endedAt)}</b></span>` : ''}
    ${D.live && active.length ? `<span class="chip live">CREW <b>${active.length}</b></span>` : ''}
    ${D.live ? `<span class="chip nosignal" id="nosignal" data-mtime="${D.stateMtime}" style="display:none">NO SIGNAL <b></b></span>` : ''}
    <span class="chip">CYCLE <b>${esc(st.cycle || '?')}/${esc(st.maxCycles || 3)}</b></span>
    ${st.fixRound ? `<span class="chip">FIX ROUND <b>${esc(st.fixRound)}/${esc(st.maxFixRounds || 3)}</b></span>` : ''}
    <span class="chip">BRANCH <b>${esc(st.branch || '—')}</b></span>
    <span class="chip">TARGET <b>${esc(st.target || '—')}</b></span>
    ${(st.fastPaths || []).map(f => `<span class="chip fast">FAST PATH <b>${esc(f)}</b></span>`).join('')}
  </div>
  <div class="pipe">${pipeline}</div>
  <div class="tele">
    <span>${D.live ? '◉ TELEMETRY LIVE — REFRESHING EVERY 4s' : '· TRANSMISSION ENDED'}</span>
    <span>STAGE: ${esc((st.stage || 'unknown').toUpperCase())}</span>
  </div>
</header>
${D.live ? '<div class="scan"><i></i></div>' : ''}
<div class="hazard"></div>`);

if (D.live && active.length) {
  parts.push(`<section><h2>Crew on deck — ${active.length} working</h2><div class="body"><div class="crew">
    ${active.map(a => {
      const t = T(a.since);
      const slow = t != null && Date.now() - t > 15 * 60 * 1000;
      return `<div class="hand${slow ? ' slow' : ''}"><div class="role"><span class="dot"></span>${esc(a.role || 'agent')}<span class="clock">${since(a.since)}</span></div>
        <div class="who">${esc(a.id || '?')}</div>
        ${a.task ? `<div class="sub" style="color:var(--grey);font-size:11px">${esc(a.task)}</div>` : ''}</div>`;
    }).join('')}
  </div></div></section>`);
}

if (D.tree && D.tree.total) {
  const wip = D.tree.files.filter(f => f.wip).length;
  const rows = D.tree.files.map(f => `<tr>
      <td class="mono">${f.wip ? '<span class="wip">●</span> ' : ''}${esc(f.path)}</td>
      <td class="num">${f.add == null ? (f.isNew ? '<span class="add">new</span>' : '') : f.add ? '<span class="add">+' + f.add + '</span>' : ''}</td>
      <td class="num">${f.del ? '<span class="del">−' + f.del + '</span>' : ''}</td></tr>`).join('');
  parts.push(`<section><h2>Working tree — ${D.tree.total} file${D.tree.total === 1 ? '' : 's'} changed${wip ? ', ' + wip + ' uncommitted' : ''}</h2><div class="body">
    <table><thead><tr><th>File ${wip ? '(● = being written)' : ''}</th><th style="text-align:right">Added</th><th style="text-align:right">Removed</th></tr></thead><tbody>${rows}</tbody></table>
    ${D.tree.total > D.tree.files.length ? '<p class="empty">Showing the first ' + D.tree.files.length + '.</p>' : ''}
  </div></section>`);
}

if (st.request || D.brief?.goal) {
  parts.push(`<section><h2>Work order</h2><div class="body">
    <pre>${esc(D.brief?.goal || st.request)}</pre>
    ${(D.brief?.assumptions || []).length ? '<p style="margin:11px 0 4px;color:var(--amber-dim);font-size:11px;letter-spacing:.2em">ASSUMPTIONS MADE</p><ul>' + D.brief.assumptions.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : ''}
  </div></section>`);
}

// Acceptance criteria
const bar = `<div class="bar">
  <i class="p" style="width:${counts.pass / total * 100}%"></i>
  <i class="f" style="width:${counts.fail / total * 100}%"></i>
  <i class="u" style="width:${counts.untested / total * 100}%"></i>
</div>`;
const cards = keys.length ? keys.map(k => {
  const s = crit[k] || 'untested';
  return `<div class="crit"><span class="id">${esc(k)}</span><span class="st ${esc(s)}">${s === 'pass' ? '◉ PASS' : s === 'fail' ? '✗ FAIL' : '· UNTESTED'}</span>
    <p>${esc(statements[k] || '')}</p></div>`;
}).join('') : '<p class="empty">No acceptance criteria recorded — intake did not complete.</p>';
parts.push(`<section><h2>Acceptance criteria — ${counts.pass}/${keys.length || 0} pass</h2><div class="body">${keys.length ? bar : ''}<div class="grid">${cards}</div></div></section>`);

// Cycles
(D.cycles || []).forEach(c => {
  const tasks = (c.plan?.tasks || []);
  const taskState = st.tasks || {};
  const rows = tasks.length ? tasks.map(t => {
    const s = taskState[t.id] || 'todo';
    return `<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.goal)}</td>
      <td class="mono">${esc((t.ownsFiles || []).join(', '))}</td>
      <td class="mono">${esc((t.dependsOn || []).join(', ') || '—')}</td>
      <td><span class="tag t-${esc(s)}">${esc(s)}</span></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No plan produced for this cycle.</td></tr>';

  parts.push(`<section><h2>Cycle ${esc(c.n)}</h2><div class="body">
    <div class="cycle-head"><h3>DELEGATION</h3></div>
    <table><thead><tr><th>Task</th><th>Goal</th><th>Owns files</th><th>After</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>
    ${c.spec ? '<details><summary>Manager spec — what it intended to build</summary><div class="inner"><pre>' + esc(c.spec) + '</pre></div></details>' : ''}
    ${c.testReport ? '<details><summary>Tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.testReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.defects ? '<details><summary>Triaged defects</summary><div class="inner"><pre>' + esc(JSON.stringify(c.defects, null, 2)) + '</pre></div></details>' : ''}
  </div></section>`);
});

// Deaths
if ((st.deaths || []).length) {
  parts.push(`<section><h2>Agent losses — ${st.deaths.length}</h2><div class="body"><table>
    <thead><tr><th>Agent</th><th>Reason</th><th>Detail</th></tr></thead><tbody>
    ${st.deaths.map(d => `<tr><td><b>${esc(d.agentId || d.agent || '?')}</b></td><td class="fail">${esc(d.reason)}</td><td class="mono">${esc(d.detail)}</td></tr>`).join('')}
    </tbody></table></div></section>`);
}

if (D.reportMd) {
  parts.push(`<section><h2>Report</h2><div class="body"><pre>${esc(D.reportMd)}</pre></div></section>`);
}

if ((D.agents || []).length) {
  parts.push(`<section><h2>Crew logs — ${D.agents.length} agents</h2><div class="body">
    ${D.agents.map(a => '<details><summary>' + esc(a.id) + '</summary><div class="inner"><pre>' + esc(a.body) + '</pre></div></details>').join('')}
  </div></section>`);
}

if (D.ledger) {
  parts.push(`<section><h2>Harbormaster log</h2><div class="body"><pre>${esc(D.ledger)}</pre></div></section>`);
}

parts.push(`<div class="hazard"></div><footer>
  SHIPYARD // ${esc(D.runDir)}<br>
  ${D.live
    ? 'YARD ACTIVE — this page reloads itself. Leave the tab open.'
    : 'TRANSMISSION ENDED — this page is final and will not reload.'}
</footer>`);
document.getElementById('app').innerHTML = parts.join('');

// Tick the clocks between reloads, and raise NO SIGNAL if the harbormaster
// has not written state.json for a long time while the run claims to be live.
(function tick(){
  const fmt = ms => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + 'h' + String(m).padStart(2, '0') + 'm' : m ? m + 'm' + String(r).padStart(2, '0') + 's' : r + 's';
  };
  const QUIET = 20 * 60 * 1000;
  function step(){
    document.querySelectorAll('[data-since]').forEach(n => { n.textContent = fmt(Date.now() - +n.dataset.since); });
    const ns = document.getElementById('nosignal');
    if (ns && +ns.dataset.mtime) {
      const q = Date.now() - +ns.dataset.mtime;
      ns.style.display = q > QUIET ? '' : 'none';
      ns.querySelector('b').textContent = fmt(q);
    }
  }
  step(); setInterval(step, 1000);
})();

// A meta-refresh is a full reload, which would slam every <details> shut and
// jump you back to the top mid-read. Persist what the reader opened and where
// they were, keyed by run so two tabs do not fight. sessionStorage, not local:
// this is view state, and it should die with the tab.
(function preserveReadingState(){
  const KEY = 'shipyard:' + (D.state?.runId || 'run');
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}') } catch {}

  const summaries = () => [...document.querySelectorAll('details')];

  summaries().forEach(d => {
    const label = d.querySelector('summary')?.textContent?.trim();
    if (label && saved.open && saved.open.includes(label)) d.open = true;
    d.addEventListener('toggle', save);
  });

  if (typeof saved.scroll === 'number') window.scrollTo(0, saved.scroll);

  function save(){
    const open = summaries().filter(d => d.open)
      .map(d => d.querySelector('summary')?.textContent?.trim())
      .filter(Boolean);
    try { sessionStorage.setItem(KEY, JSON.stringify({ open, scroll: window.scrollY })) } catch {}
  }

  let t;
  window.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(save, 150) }, { passive: true });
  window.addEventListener('beforeunload', save);
})();
</script>
</body>
</html>
