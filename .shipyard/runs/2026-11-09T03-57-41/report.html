gger/.shipyard/runs/2026-11-09T03-57-41\nCommit: 5dbda2e `fix(web): hide crate page actions on crates that aren't the viewer's` (base 1c455a7)\n\n## Decisions for the owner to confirm\n\nI made three interpretation calls. Please confirm each one or tell me to change it.\n\n1. **/shelf still shows both actions on another user's crate.**\n   - The change covers /crates/:id only.\n   - On /shelf, with another user's crate selected as the tab, \"Edit crates\" and \"+ Add a record\" still show at 1280px and 390px.\n   - On /shelf the Add link is plain /albums/new, with no crateId, so it does not preselect that crate.\n   - I left /shelf alone because it is a browse-everything page. Apart from /list, its toolbar is the only always-present route to making a crate. Hiding it could strand a new user whose selected crate belongs to someone else.\n   - Extending the rule to /shelf is a small change if you want it. Severity: medium.\n2. **Admins also lose the actions on other users' crates.**\n   - I read \"someones crate that I didnt make\" literally.\n   - If you sign in as the ADMIN_EMAIL admin, a fix based on the existing canEditCrate would change nothing for you.\n   - Admins keep the actions on their own crates and on ownerless (ownerId null) crates.\n   - Admins can still add records via /shelf or /list, and edit records from the album page.\n3. **\"New crate stuff\" was read as the \"Edit crates\" link.**\n   - No control on /crates/:id is labelled \"New crate\".\n   - That heading is on the /crates page, which \"Edit crates\" opens.\n   - The /crates page itself is unchanged.\n\n## What was asked for\n\nOn /crates/:id, stop showing the signed-in viewer \"+ Add a record\" and \"Edit crates\" when the crate belongs to another user. The viewer's own crates keep both actions.\n\nConstraints:\n- Web client only.\n- Hide by not rendering the controls, not by disabling them or using CSS.\n- Do not change canEditCrate, because spin counting and edit access in other views depend on it.\n- Leave /shelf, /list, /albums/:id, /albums/new and /crates unchanged.\n\n## Acceptance criteria\n\n| ID | Check | Status | Evidence |\n|---|---|---|---|\n| AC1 | unit: non-admin on another user's crate sees neither action | pass | crateActions.test.ts |\n| AC2 | unit: non-admin on own crate sees both, with correct hrefs | pass | crateActions.test.ts |\n| AC3 | unit: admin on another user's crate sees neither, empty-crate section has no Add link, spin POST still fires | pass | crateActions.test.ts |\n| AC4 | unit: admin on own or ownerless crate sees both. Non-admin on an ownerless crate sees neither | pass | crateActions.test.ts |\n| AC5 | unit: signed-out visitor sees neither, nav links remain | pass | crateActions.test.ts |\n| AC6 | unit: hidden while loading, on error and on \"Crate not found\" | pass | crateActions.test.ts |\n| AC7 | unit: actions react to router.push between crates | pass | crateActions.test.ts |\n| AC8 | unit: /shelf and /list keep both actions | pass | crateActions.test.ts |\n| AC9 | unit: browsing controls and nav intact. \"Pull it out\" opens the album with no spin POST for a non-admin | pass | crateActions.test.ts |\n| AC10 | command: typecheck, lint, format:check, test | pass | all four exited 0 |\n| AC11 | browser: no actions on another user's crate at 1280px and 390px | pass | crate-actions.check.mjs printed PASS AC11 |\n| AC12 | browser: own-crate clicks land correctly, no actions via /u/\u003cB> | pass | same run printed PASS AC12 |\n\n## What was built\n\nDiffstat against 1c455a7: 6 files changed, 435 insertions, 8 deletions.\n\n- apps/web/src/components/LibraryToolbar.vue (7 lines changed)\n- apps/web/src/utils/permissions.ts (+14) and permissions.test.ts (41 lines changed)\n- apps/web/src/views/CrateView.vue (24 lines changed)\n- apps/web/src/views/crateActions.test.ts (new, 355 lines, 20 tests)\n- apps/web/src/views/editControls.test.ts (2 lines changed): the Add link assertion was updated in the test that encoded the old behaviour. Its spin and navigation assertions are kept.\n\nThe browser check is at .shipyard/checks/crate-actions.check.mjs, with a helper in lib.mjs. Both are committed with this run.\n\n## Test results\n\n- Checklist tester: AC1-AC10 pass, tree clean. Baseline `npm test` exited 0 before the change.\n- The 20 tests in crateActions.test.ts pass.\n- There were no failures, so there is no failure output to quote and no defects.json.\n- Browser tester (temp DB, port 4327, users alice and bob confirmed as role 'user'):\n  - **Other user's crate:** on bob's non-empty and empty crates, at 1280px and 390px, at normal speed and with every API call delayed 500ms, neither action text appeared. A MutationObserver and rAF recorder installed before the app scripts logged none.\n  - **Control:** the same recorder did log both actions on alice's own crate, so the recorder works.\n  - **Layout:** Crates and List links were visible. There was no horizontal overflow (1280/1280 and 390/390) and no page errors.\n  - **Click paths:** \"Add a record\" on alice's second crate landed on /albums/new?crateId=2 with picker value 2. \"Edit crates\" landed on /crates with the \"New crate\" heading. Bob's card on /u/bob opened his crate with no actions, and so did reaching it via /shelf, the owner link and the profile card without a reload.\n- The harbormaster re-ran the checks and they were green. It then restored the tracked PNGs that browser.mjs rewrites on every run (a known limit).\n\n## What went wrong\n\nNothing failed. There were no fix rounds.\n\nOne addition beyond the task: the dev added an OWN_EMPTY fixture and test, plus `enableAutoUnmount` in crateActions.test.ts. It also proved the tests can fail by making three temporary mutations, then reverted them.\n\n## Observations from report-notes.json\n\nChoose which of these to act on:\n\n1. **/shelf scope (medium).** Same as decision 1 above. /shelf with another user's crate selected still shows both actions, and the Add link has no crateId. It matches AC8 and the brief's assumption, but your request could be read as covering it.\n2. **Admin assumption.** Same as decision 2 above.\n3. **\"New crate stuff\" assumption.** Same as decision 3 above.\n4. **Extra test scaffolding.** The OWN_EMPTY fixture and `enableAutoUnmount` were added beyond the task (see \"What went wrong\").\n\n## Recommended next steps\n\n1. Answer the three decisions above. If you want /shelf covered too, that is a small follow-up using the same rule.\n2. Known risk accepted: a brand-new user who only reaches other users' crates via /crates/:id loses the shortcut there. They can still use the Crates and List nav from /shelf or /list.\n## Token use\n\nSize: standard. Reported total: 287,808 tokens across 7 agents.\n\n| Role | Agents | Tokens | Share |\n|---|---|---|---|\n| browser-tester | 1 | 81,025 | 28% |\n| dev | 1 | 49,374 | 17% |\n| intake | 1 | 47,408 | 16% |\n| manager | 1 | 41,366 | 14% |\n| surveyor | 1 | 34,163 | 12% |\n| tester | 1 | 19,373 | 7% |\n| reporter | 1 | 15,099 | 5% |\n\n| Agent | Model | Tokens | Tool uses | Seconds |\n|---|---|---|---|---|\n| surveyor-relevant | sonnet | 34,163 | 19 | 47 |\n| intake | opus | 47,408 | 25 | 87 |\n| manager | opus | 41,366 | 13 | 98 |\n| dev-T1 | opus | 49,374 | 24 | 120 |\n| tester | sonnet | 19,373 | 5 | 11 |\n| browser-tester | opus | 81,025 | 14 | 142 |\n| reporter | sonnet | 15,099 | 7 | 21 |\n\nThe harbormaster's own tokens are not included: no figure was available.\n\n### Dev models across 3 run(s)\n\n| Model | Tasks | Fix agents | Fixes per task | Tokens |\n|---|---|---|---|---|\n| sonnet | 2 | 1 | 0.50 | 46,027 |\n| opus | 2 | 1 | 0.50 | 104,932 |\n","cycles":[{"n":"1","spec":"# Hide crate actions on other people's crates\n\n## What this is for\n\nThe single-crate page, `/crates/:id`, shows every signed-in viewer the same two toolbar actions: **+ Add a record** and **Edit crates**, the route to the New crate form. On a crate that belongs to someone else, these actions suggest the viewer can change something they can't. The API already rejects unauthorised writes, so this is about how the page looks, not about security. Browsing someone else's crate should look read-only, and the viewer's own crates should keep both actions.\n\n## The rule\n\nOn `/crates/:id`, the actions render only when all of these hold:\n\n- The viewer is signed in.\n- The crate has loaded and the library store is `ready`.\n- Either `crate.ownerId === user.id`, or `crate.ownerId` is null and the viewer is an admin.\n\nIn every other case they are not rendered at all: signed out, loading, error, crate not found, another user's crate. Nothing is disabled or hidden with CSS, and no replacement content is added.\n\nThe empty-crate **Add a record** link on `/crates/:id` follows the same rule, so an admin no longer sees it on another user's empty crate.\n\n## Why this isn't `canEditCrate`\n\n`canEditCrate` answers whether a viewer may change a crate, and admins may change any crate. It still decides spin counting, album editing and the `/list` tools, and it must stay as it is. Reusing it for the toolbar would pass for ordinary users and change nothing for an admin, and the owner may well sign in as the admin.\n\nSo `apps/web/src/utils/permissions.ts` gains a separate, narrower helper, `showsCrateActions(user, crate)`. An admin on another user's crate therefore loses the shortcuts but keeps the abilities: pulling out a record still counts a spin, and the album page still offers Edit.\n\n## Where the change sits\n\nCrateView serves both `/shelf` and `/crates/:id`, and LibraryToolbar is also used by `/list`, so the scoping matters.\n\n- **`LibraryToolbar.vue`** gains an optional `hideActions` boolean prop. It stays unaware of crates and ownership. Because the prop defaults to false, `/list` needs no edit.\n- **`CrateView.vue`** decides whether to hide the actions, and only when `crateId` is set, which is what distinguishes `/crates/:id` from `/shelf`.\n\nThe Crates/List nav sits outside the gated block and is unaffected.\n\n## Two traps\n\n**Default to hidden.** The toolbar renders above the loading state, before the crate exists. A condition like \"hide if known to be someone else's\" would flash the actions while another user's crate loads, so the condition has to confirm ownership before showing anything.\n\n**Crate presence doesn't mean loaded.** The library store keeps its `crates` array during a forced reload and after a failed one. If a viewer goes to an unknown crate id, the reload fails, and they then navigate to their own crate, the crate resolves while the page body shows the error. That is why the toolbar condition checks `library.status === 'ready'` as well as ownership, and it gets its own regression test beyond the plain error case in AC6.\n\nReused-component navigation (`/crates/1` to `/crates/2`) needs no special handling, because `props.crateId` and the `crate` computed are reactive. AC7 tests this directly.\n\n## What stays the same\n\n- `/shelf` and `/list` toolbars, including `/shelf` when another user's crate is selected\n- The per-crate add links and tools on `/list`\n- The `/albums/:id` Edit button, `/albums/new` and `/crates`\n- Spin counting\n- The browsing controls, owner link and nav on `/crates/:id`\n\nNo API, schema or shared-type changes are needed. `README.md` and `docs/SPEC.md` describe who may edit, which is unchanged, so no docs need updating.\n\n## One interpretation to check\n\nThe brief says the empty-crate link follows the same rule, but defines that rule for `/crates/:id` and says the change covers only that page. I read that as: on `/shelf`, the empty-crate link keeps its `canEditCrate` behaviour, so an admin still sees it on another user's empty crate there. A test pins this. If the owner wants the link gone on `/shelf` too, it is a one-line change.\n\n## Testing\n\nA new `apps/web/src/views/crateActions.test.ts` covers AC1 to AC9 with its own fixtures. Keeping them separate matters because the counts in `editControls.test.ts` depend on its shared fixture. `permissions.test.ts` gains a table of cases for the helper.\n\nThe one existing test that encodes the old behaviour, in `editControls.test.ts`, changes its Add link assertion and keeps its spin and navigation assertions. AC10 is the repo's typecheck, lint, format and test commands.\n\nAC11 and AC12 run in a real browser on a temp DB with two ordinary users. The browser tester writes that check under `.shipyard/checks/`, in a separate file so `browser.mjs` doesn't rewrite its tracked PNGs. The owner's real DB is not touched.\n\n## Open questions for the owner\n\nThe brief makes these assumptions and asks for confirmation. The plan follows them as written:\n\n1. \"Add to crate\" means **+ Add a record**, and \"new crate stuff\" means the **Edit crates** link. No control on `/crates/:id` is literally labelled New crate.\n2. The change covers `/crates/:id` only. `/shelf` keeps its toolbar so a new user whose selected crate is someone else's still has a way to make a crate.\n3. Admins also lose these actions on other users' crates. They can still add via `/shelf` or `/list`, and can still edit records from the album page.\n\n## Known cost\n\nA new user who only ever reaches other users' crates through `/crates/:id` loses the shortcut on that page. The Crates and List nav still takes them to `/shelf` or `/list`, where it remains.\n","plan":{"summary":"One dev task. Add a new ownership helper to permissions.ts, a hideActions prop to LibraryToolbar, and a /crates/:id-only condition in CrateView that defaults to hidden, then cover it with component tests. canEditCrate, /shelf and /list do not change. The files are tightly coupled and the change is small, so parallel tasks would save nothing. The browser tester verifies AC11 and AC12.","tasks":[{"id":"T1","goal":"On /crates/:id, render 'Edit crates' and '+ Add a record' (and the empty-crate 'Add a record' link) only for the viewer's own crate, or for an ownerless crate when the viewer is an admin, with tests for every case.","description":"Web client only. Make no API, schema or shared-type changes. Do not change canEditCrate. Hide controls by not rendering them (no disabled state, no CSS).\n\n1. apps/web/src/utils/permissions.ts: leave canEditCrate exactly as it is and add a new export next to it:\n\nexport function showsCrateActions(user: PublicUser | null, crate: { ownerId: number | null } | null | undefined): boolean {\n  if (!user || !crate) return false\n  if (crate.ownerId === null) return user.role === 'admin'\n  return crate.ownerId === user.id\n}\n\nAdd a doc comment saying this is narrower than canEditCrate: an admin keeps edit rights on other users' crates but does not get the add/manage shortcuts on that crate's page. Add cases to permissions.test.ts: no user, no crate, owner, non-owner, admin on another user's crate, admin on own crate, admin on ownerless crate, non-admin on ownerless crate.\n\n2. apps/web/src/components/LibraryToolbar.vue: change to defineProps\u003c{ addToCrateId?: number; hideActions?: boolean }>() and change line 21 to v-if=\"session.signedIn && !hideActions\". An absent boolean prop is false, so LibraryView's bare \u003cLibraryToolbar /> is unaffected; do not edit LibraryView. Update the comment at lines 6-7 so it no longer implies the actions always show. The Crates/List nav stays outside the v-if.\n\n3. apps/web/src/views/CrateView.vue: leave canEditThisCrate and the canEditCrate call in open() untouched, because spin counting must not change. Add two computeds:\n\nconst hideToolbarActions = computed(() => props.crateId !== undefined && !(library.status === 'ready' && showsCrateActions(session.user, crate.value)))\nconst canAddFromEmptyCrate = computed(() => props.crateId === undefined ? canEditThisCrate.value : showsCrateActions(session.user, crate.value))\n\nThen use \u003cLibraryToolbar :hide-actions=\"hideToolbarActions\" :add-to-crate-id=\"canEditThisCrate ? crate?.id : undefined\" /> and change the empty-crate link's v-if (line 149) to canAddFromEmptyCrate.\n\nThe library.status === 'ready' check is required. The library store keeps its crates array during a forced reload and after a failed one. Example: visit /crates/999, the forced reload fails, then router.push to the viewer's own /crates/1. crate.value is defined, status is 'error', and the body shows the error, so without the status check the actions would leak onto the error state. On /shelf (crateId undefined), both the toolbar and the empty-crate link keep today's behaviour. props.crateId and crate are already reactive across reused-component navigation, so do not add a key or a watcher.\n\n4. apps/web/src/views/editControls.test.ts: in the test titled \"a crate page on someone else's crate counts no spin and preselects nothing\", replace the addRecord href assertion with wrapper.find('a[href^=\"/albums/new\"]').exists() being false. Keep its title and its spin and navigation assertions. Do not add crates to this file's shared fixture, because its counts (4 tools, 8 order buttons) depend on it.\n\n5. New file apps/web/src/views/crateActions.test.ts, with its own fixtures. Follow the visit() pattern in editControls.test.ts: createPinia, setActivePinia, session.user = user, session.loaded = true, memory router, mount a RouterView wrapper, flushPromises. Register routes library (/shelf, CrateView), crate (/crates/:id(\\\\d+), CrateView, props crateId: Number), list (/list, LibraryView), crates (/crates), album-new (/albums/new), album (/albums/:id(\\\\d+)), album-edit (/albums/:id(\\\\d+)/edit), profile (/u/:username), login (/login); use a Blank component for every route except library, crate and list. Stub fetch for GET /api/crates, GET /api/albums and POST /api/albums/\u003cid>/spins (returns { spinCount: 1 }), and make the stub configurable so a test can use a never-resolving promise or a 500. Users: a non-admin (id 1, role 'user') and an admin (id 9, role 'admin'). Crate type fields: id, name, color, label, sortBy, sortOrder, albumCount, ownerId, ownerUsername, ownerDisplayName. Fixtures need a crate owned by user 1, one owned by user 2 with ownerUsername set (so OwnerLink renders), one owned by user 9, one with ownerId null, and an empty crate owned by user 2.\n\nCover each criterion with a test named for it:\n- AC1: non-admin on another user's crate, no 'Edit crates' or '+ Add a record' text, no link with href starting /albums/new or equal to /crates.\n- AC2: non-admin on own crate, 'Edit crates' href /crates and '+ Add a record' href /albums/new?crateId=\u003cid>.\n- AC3: admin on another user's crate sees neither action; on that user's empty crate there is no 'Add a record' link in the 'Nothing in here yet.' section; on a non-empty crate, clicking button.pull POSTs /api/albums/\u003cid>/spins.\n- AC4: admin on own crate and on an ownerless crate sees both, with the crateId href; non-admin on an ownerless crate sees neither.\n- AC5: signed-out visitor sees neither on any crate, and the Crates and List nav links remain.\n- AC6: signed-in non-admin sees neither while fetch never resolves, after a 500 load, and on 'Crate not found'. Also add the retained-store case from step 3: load succeeds, go to an unknown id, the forced reload fails, router.push to own crate, actions absent. A pending forced reload should also hide them.\n- AC7: same mount, router.push from own crate to another user's crate and back, with flushPromises after each; both actions go and come back with the correct crateId.\n- AC8: non-admin at /shelf with another user's crate selected (click its button.tab) and at /list still sees both actions.\n- AC9: on another user's non-empty crate, '◀ Back', 'Flip ▶', 'Pull it out', the owner link and the Crates/List nav render; clicking 'Pull it out' routes to /albums/\u003cid> with no POST for a non-admin.\n\nAlso add one /shelf assertion that an admin on another user's empty crate still sees the empty-crate 'Add a record' <script>
const D = JSON.parse(document.getElementById('run-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

const st = D.state || {};
const verdict = (st.verdict || 'pending').toLowerCase();
const crit = st.criteria || {};
const critKeys = Object.keys(crit);
const statements = {};
const checks = {};
(D.brief?.acceptanceCriteria || []).forEach(c => { statements[c.id] = c.statement; checks[c.id] = c.check; });
const keys = critKeys.length ? critKeys : Object.keys(statements);
const counts = { pass: 0, fail: 0, untested: 0 };
keys.forEach(k => { counts[(crit[k] || 'untested')] = (counts[(crit[k] || 'untested')] || 0) + 1; });
const total = keys.length || 1;

const parts = [];

const nowIdx = D.stages.indexOf(st.stage);
const T = s => { const t = Date.parse(s); return Number.isFinite(t) ? t : null; };
const dur = ms => {
  if (ms == null || ms < 0) return '';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}h${String(m).padStart(2, '0')}m` : m ? `${m}m${String(r).padStart(2, '0')}s` : `${r}s`;
};
// Elements carrying data-since tick every second, so the page looks alive
// between renders even while one long agent is working.
const since = (iso, end) => {
  const a = T(iso); if (a == null) return '—';
  const b = T(end);
  return b != null ? dur(b - a) : `<span data-since="${a}">${dur(Date.now() - a)}</span>`;
};
const times = st.stageTimes || {};
const pipeline = D.stages.filter(s => s !== 'done').map((s, i) => {
  const cls = D.live && i === nowIdx ? 'now' : (nowIdx > i || !D.live ? 'done' : '');
  const t = times[s];
  const clock = t?.start ? `<small>${since(t.start, (D.live && i === nowIdx) ? null : (t.end || null))}</small>` : '';
  return `<div class="${cls}">${s.toUpperCase()}${clock}</div>`;
}).join('');
const quietMs = D.stateMtime ? Date.now() - D.stateMtime : 0;
const active = Array.isArray(st.active) ? st.active : [];
const usage = Array.isArray(st.usage) ? st.usage : [];
const tokenTotal = usage.reduce((sum, u) => sum + (u.tokens ?? 0), 0);

parts.push(`
<header>
  <h1>SHIPYARD<small>AUTONOMOUS DEV YARD // ${D.live ? 'YARD ACTIVE' : 'RUN RECORD'}</small></h1>
  <div class="meta">
    ${D.live
      ? '<span class="chip verdict live"><span class="dot"></span>WORKING</span>'
      : `<span class="chip verdict v-${esc(verdict)}">${esc(verdict)}</span>`}
    <span class="chip">RUN <b>${esc(st.runId || '—')}</b></span>
    ${st.size ? `<span class="chip">SIZE <b>${esc(st.size)}</b></span>` : ''}
    ${usage.length ? `<span class="chip">TOKENS <b>${tokenTotal.toLocaleString('en-US')}</b></span>` : ''}
    ${st.startedAt ? `<span class="chip">ELAPSED <b>${since(st.startedAt, D.live ? null : st.endedAt)}</b></span>` : ''}
    ${D.live && active.length ? `<span class="chip live">CREW <b>${active.length}</b></span>` : ''}
    ${D.live ? `<span class="chip nosignal" id="nosignal" data-mtime="${D.stateMtime}" style="display:none">NO SIGNAL <b></b></span>` : ''}
    <span class="chip">CYCLE <b>${esc(st.cycle || '?')}/${esc(st.maxCycles || 3)}</b></span>
    ${st.fixRound ? `<span class="chip">FIX ROUND <b>${esc(st.fixRound)}/${esc(st.maxFixRounds || 3)}</b></span>` : ''}
    <span class="chip">BRANCH <b>${esc(st.branch || '—')}</b></span>
    <span class="chip">TARGET <b>${esc(st.target || '—')}</b></span>
    ${(st.fastPaths || []).map(f => `<span class="chip fast">FAST PATH <b>${esc(f)}</b></span>`).join('')}
  </div>
  <div class="pipe">${pipeline}</div>
  <div class="tele">
    <span>${D.live ? '◉ TELEMETRY LIVE — REFRESHING EVERY 4s' : '· TRANSMISSION ENDED'}</span>
    <span>STAGE: ${esc((st.stage || 'unknown').toUpperCase())}</span>
  </div>
</header>
${D.live ? '<div class="scan"><i></i></div>' : ''}
<div class="hazard"></div>`);

if (D.live && active.length) {
  parts.push(`<section><h2>Crew on deck — ${active.length} working</h2><div class="body"><div class="crew">
    ${active.map(a => {
      const t = T(a.since);
      const slow = t != null && Date.now() - t > 15 * 60 * 1000;
      return `<div class="hand${slow ? ' slow' : ''}"><div class="role"><span class="dot"></span>${esc(a.role || 'agent')}<span class="clock">${since(a.since)}</span></div>
        <div class="who">${esc(a.id || '?')}</div>
        ${a.task ? `<div class="sub" style="color:var(--grey);font-size:11px">${esc(a.task)}</div>` : ''}</div>`;
    }).join('')}
  </div></div></section>`);
}

if (D.tree && D.tree.total) {
  const wip = D.tree.files.filter(f => f.wip).length;
  const rows = D.tree.files.map(f => `<tr>
      <td class="mono">${f.wip ? '<span class="wip">●</span> ' : ''}${esc(f.path)}</td>
      <td class="num">${f.add == null ? (f.isNew ? '<span class="add">new</span>' : '') : f.add ? '<span class="add">+' + f.add + '</span>' : ''}</td>
      <td class="num">${f.del ? '<span class="del">−' + f.del + '</span>' : ''}</td></tr>`).join('');
  parts.push(`<section><h2>Working tree — ${D.tree.total} file${D.tree.total === 1 ? '' : 's'} changed${wip ? ', ' + wip + ' uncommitted' : ''}</h2><div class="body">
    <table><thead><tr><th>File ${wip ? '(● = being written)' : ''}</th><th style="text-align:right">Added</th><th style="text-align:right">Removed</th></tr></thead><tbody>${rows}</tbody></table>
    ${D.tree.total > D.tree.files.length ? '<p class="empty">Showing the first ' + D.tree.files.length + '.</p>' : ''}
  </div></section>`);
}

if (st.request || D.brief?.goal) {
  parts.push(`<section><h2>Work order</h2><div class="body">
    <pre>${esc(D.brief?.goal || st.request)}</pre>
    ${(D.brief?.assumptions || []).length ? '<p style="margin:11px 0 4px;color:var(--amber-dim);font-size:11px;letter-spacing:.2em">ASSUMPTIONS MADE</p><ul>' + D.brief.assumptions.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : ''}
  </div></section>`);
}

// Acceptance criteria
const bar = `<div class="bar">
  <i class="p" style="width:${counts.pass / total * 100}%"></i>
  <i class="f" style="width:${counts.fail / total * 100}%"></i>
  <i class="u" style="width:${counts.untested / total * 100}%"></i>
</div>`;
const cards = keys.length ? keys.map(k => {
  const s = crit[k] || 'untested';
  return `<div class="crit"><span class="id">${esc(k)}</span><span class="st ${esc(s)}">${s === 'pass' ? '◉ PASS' : s === 'fail' ? '✗ FAIL' : '· UNTESTED'}</span>
    <p>${esc(statements[k] || '')}</p>${checks[k] ? `<span class="tag">${esc(checks[k])}</span>` : ''}</div>`;
}).join('') : '<p class="empty">No acceptance criteria recorded — intake did not complete.</p>';
parts.push(`<section><h2>Acceptance criteria — ${counts.pass}/${keys.length || 0} pass</h2><div class="body">${keys.length ? bar : ''}<div class="grid">${cards}</div></div></section>`);

// Token use. The figures come straight from state.json's usage list.
if (usage.length) {
  const byRole = {};
  usage.forEach(u => {
    const r = byRole[u.role] || (byRole[u.role] = { agents: 0, tokens: 0 });
    r.agents++;
    r.tokens += u.tokens ?? 0;
  });
  const fmt = n => Number(n).toLocaleString('en-US');
  const roleRows = Object.entries(byRole).sort((a, b) => b[1].tokens - a[1].tokens).map(([role, r]) =>
    `<tr><td><b>${esc(role)}</b></td><td class="num">${r.agents}</td><td class="num">${fmt(r.tokens)}</td><td class="num">${tokenTotal ? Math.round(r.tokens / tokenTotal * 100) : 0}%</td></tr>`).join('');
  const agentRows = usage.map(u =>
    `<tr><td class="mono">${esc(u.agent)}${u.fixOf ? ' (fix of ' + esc(u.fixOf) + ')' : ''}</td><td>${esc(u.role)}</td><td>${esc(u.model || '—')}</td><td class="num">${u.tokens == null ? 'unavailable' : fmt(u.tokens)}</td><td class="num">${u.toolUses ?? '—'}</td></tr>`).join('');
  const unknown = usage.filter(u => u.tokens == null).length;
  const hasHarbormaster = usage.some(u => u.role === 'harbormaster');
  parts.push(`<section><h2>Token use — ${fmt(tokenTotal)} reported</h2><div class="body">
    <table><thead><tr><th>Role</th><th style="text-align:right">Agents</th><th style="text-align:right">Tokens</th><th style="text-align:right">Share</th></tr></thead><tbody>${roleRows}</tbody></table>
    ${hasHarbormaster ? '' : "<p class=\"empty\">The harbormaster's own tokens are not included: no figure was available.</p>"}
    ${unknown ? '<p class="empty">' + unknown + ' agent(s) reported no figure and count as 0, so the real total is higher.</p>' : ''}
    <details><summary>Per agent</summary><div class="inner"><table><thead><tr><th>Agent</th><th>Role</th><th>Model</th><th style="text-align:right">Tokens</th><th style="text-align:right">Tool uses</th></tr></thead><tbody>${agentRows}</tbody></table></div></details>
  </div></section>`);
}

// Cycles
(D.cycles || []).forEach(c => {
  const tasks = (c.plan?.tasks || []);
  const taskState = st.tasks || {};
  const rows = tasks.length ? tasks.map(t => {
    const s = taskState[t.id] || 'todo';
    return `<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.goal)}${t.model ? ` <span class="tag">${esc(t.model)}</span>` : ''}</td>
      <td class="mono">${esc((t.ownsFiles || []).join(', '))}</td>
      <td class="mono">${esc((t.dependsOn || []).join(', ') || '—')}</td>
      <td><span class="tag t-${esc(s)}">${esc(s)}</span></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No plan produced for this cycle.</td></tr>';

  parts.push(`<section><h2>Cycle ${esc(c.n)}</h2><div class="body">
    <div class="cycle-head"><h3>DELEGATION</h3></div>
    <table><thead><tr><th>Task</th><th>Goal</th><th>Owns files</th><th>After</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>
    ${c.spec ? '<details><summary>Manager spec — what it intended to build</summary><div class="inner"><pre>' + esc(c.spec) + '</pre></div></details>' : ''}
    ${c.testReport ? '<details><summary>Tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.testReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.browserReport ? '<details><summary>Browser tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.browserReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.defects ? '<details><summary>Triaged defects</summary><div class="inner"><pre>' + esc(JSON.stringify(c.defects, null, 2)) + '</pre></div></details>' : ''}
  </div></section>`);
});

// Deaths
if ((st.deaths || []).length) {
  parts.push(`<section><h2>Agent losses — ${st.deaths.length}</h2><div class="body"><table>
    <thead><tr><th>Agent</th><th>Reason</th><th>Detail</th></tr></thead><tbody>
    ${st.deaths.map(d => `<tr><td><b>${esc(d.agentId || d.agent || '?')}</b></td><td class="fail">${esc(d.reason)}</td><td class="mono">${esc(d.detail)}</td></tr>`).join('')}
    </tbody></table></div></section>`);
}

if (D.reportMd) {
  parts.push(`<section><h2>Report</h2><div class="body"><pre>${esc(D.reportMd)}</pre></div></section>`);
}

if ((D.agents || []).length) {
  parts.push(`<section><h2>Crew logs — ${D.agents.length} agents</h2><div class="body">
    ${D.agents.map(a => '<details><summary>' + esc(a.id) + '</summary><div class="inner"><pre>' + esc(a.body) + '</pre></div></details>').join('')}
  </div></section>`);
}

if (D.ledger) {
  parts.push(`<section><h2>Harbormaster log</h2><div class="body"><pre>${esc(D.ledger)}</pre></div></section>`);
}

parts.push(`<div class="hazard"></div><footer>
  SHIPYARD // ${esc(D.runDir)}<br>
  ${D.live
    ? 'YARD ACTIVE — this page reloads itself. Leave the tab open.'
    : 'TRANSMISSION ENDED — this page is final and will not reload.'}
</footer>`);
document.getElementById('app').innerHTML = parts.join('');

// Tick the clocks between reloads, and raise NO SIGNAL if the harbormaster
// has not written state.json for a long time while the run claims to be live.
(function tick(){
  const fmt = ms => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + 'h' + String(m).padStart(2, '0') + 'm' : m ? m + 'm' + String(r).padStart(2, '0') + 's' : r + 's';
  };
  const QUIET = 20 * 60 * 1000;
  function step(){
    document.querySelectorAll('[data-since]').forEach(n => { n.textContent = fmt(Date.now() - +n.dataset.since); });
    const ns = document.getElementById('nosignal');
    if (ns && +ns.dataset.mtime) {
      const q = Date.now() - +ns.dataset.mtime;
      ns.style.display = q > QUIET ? '' : 'none';
      ns.querySelector('b').textContent = fmt(q);
    }
  }
  step(); setInterval(step, 1000);
})();

// A meta-refresh is a full reload, which would slam every <details> shut and
// jump you back to the top mid-read. Persist what the reader opened and where
// they were, keyed by run so two tabs do not fight. sessionStorage, not local:
// this is view state, and it should die with the tab.
(function preserveReadingState(){
  const KEY = 'shipyard:' + (D.state?.runId || 'run');
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}') } catch {}

  const summaries = () => [...document.querySelectorAll('details')];

  summaries().forEach(d => {
    const label = d.querySelector('summary')?.textContent?.trim();
    if (label && saved.open && saved.open.includes(label)) d.open = true;
    d.addEventListener('toggle', save);
  });

  if (typeof saved.scroll === 'number') window.scrollTo(0, saved.scroll);

  function save(){
    const open = summaries().filter(d => d.open)
      .map(d => d.querySelector('summary')?.textContent?.trim())
      .filter(Boolean);
    try { sessionStorage.setItem(KEY, JSON.stringify({ open, scroll: window.scrollY })) } catch {}
  }

  let t;
  window.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(save, 150) }, { passive: true });
  window.addEventListener('beforeunload', save);
})();
</script>
</body>
</html>
