<!doctype html>
<html lang="en">
<head>

<title>SHIPYARD // 2026-11-08T19-49-05</title>
<style>
:root{
  --bg:#0b0a08; --panel:#15120d; --panel2:#1d1812;
  --amber:#ffb53d; --amber-dim:#8a6224; --amber-glow:rgba(255,181,61,.25);
  --green:#7ddba0; --red:#ff6b4a; --grey:#6b6354;
  --rule:#3a3024;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  color:var(--amber); font-size:13px; line-height:1.55;
  padding:24px; max-width:1180px; margin:0 auto;
  text-shadow:0 0 1px var(--amber-glow);
}
/* CRT scanlines */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:98;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);
}
a{color:var(--amber)}
.hazard{height:8px;background:repeating-linear-gradient(45deg,var(--amber-dim) 0 10px,#0b0a08 10px 20px);margin:14px 0;opacity:.6}
header{border:2px solid var(--amber-dim);background:var(--panel);padding:14px 16px;position:relative}
header h1{margin:0;font-size:22px;letter-spacing:.42em;font-weight:700}
header h1 small{letter-spacing:.1em;font-size:11px;color:var(--amber-dim);display:block;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{border:1px solid var(--rule);background:var(--panel2);padding:3px 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-dim)}
.chip b{color:var(--amber);font-weight:600}
.verdict{border-width:2px;padding:4px 12px;font-weight:700;letter-spacing:.2em}
.v-shipped{border-color:var(--green);color:var(--green)}
.v-failed{border-color:var(--red);color:var(--red)}
.v-partial,.v-pending{border-color:var(--amber);color:var(--amber)}
section{border:1px solid var(--rule);background:var(--panel);margin:18px 0}
section>h2{
  margin:0;padding:8px 14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  background:var(--panel2);border-bottom:1px solid var(--rule);color:var(--amber-dim);
}
section>.body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.crit{border:1px solid var(--rule);padding:9px 11px;background:var(--panel2)}
.crit .id{font-weight:700;letter-spacing:.14em}
.crit .st{float:right;font-size:11px;letter-spacing:.14em}
.pass{color:var(--green)} .fail{color:var(--red)} .untested{color:var(--grey)}
.crit p{margin:6px 0 0;color:#d9c9a6;font-size:12px}
.bar{height:16px;border:1px solid var(--rule);background:#0c0a07;display:flex;margin-bottom:14px}
.bar i{display:block;height:100%}
.bar i.p{background:var(--green)} .bar i.f{background:var(--red)} .bar i.u{background:#2a2419}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--amber-dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
td.mono{color:#d9c9a6}
.tag{border:1px solid var(--rule);padding:1px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-dim)}
.t-done{border-color:var(--green);color:var(--green)}
.t-blocked{border-color:var(--red);color:var(--red)}
pre{background:#0c0a07;border:1px solid var(--rule);padding:11px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#d9c9a6;font-size:12px;margin:0}
details{border:1px solid var(--rule);background:var(--panel2);margin:7px 0}
details>summary{padding:7px 11px;cursor:pointer;letter-spacing:.14em;font-size:11px;text-transform:uppercase;color:var(--amber-dim)}
details[open]>summary{border-bottom:1px solid var(--rule);color:var(--amber)}
details .inner{padding:11px}
.cycle-head{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.cycle-head h3{margin:0;font-size:13px;letter-spacing:.26em}
.empty{color:var(--grey);font-style:italic}
footer{color:var(--grey);font-size:11px;letter-spacing:.14em;text-align:center;padding:18px 0}
@media print{body::before,body::after{display:none}}

/* ── live telemetry ─────────────────────────────────────── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(420%)}}
@keyframes flicker{0%,100%{opacity:1}97%{opacity:1}98%{opacity:.82}99%{opacity:1}}
header{animation:flicker 7s infinite}
.live{border-color:var(--green)!important;color:var(--green)!important}
.live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;animation:pulse 1.1s infinite;box-shadow:0 0 6px var(--green)}
.scan{position:relative;overflow:hidden;height:3px;background:#0c0a07;border:1px solid var(--rule);border-left:0;border-right:0;margin:0}
.scan i{position:absolute;top:0;left:0;height:100%;width:24%;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 2.4s linear infinite}
/* stage pipeline */
.pipe{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--rule);background:#0c0a07}
.pipe div{flex:1;text-align:center;padding:7px 2px;font-size:10px;letter-spacing:.18em;color:#3b3225;border-right:1px solid var(--rule);position:relative}
.pipe div:last-child{border-right:0}
.pipe div.done{color:var(--amber-dim);background:#140f09}
.pipe div.now{color:#0b0a08;background:var(--amber);font-weight:700;animation:pulse 1.6s infinite}
.tele{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--grey);margin-top:6px}
.pipe div small{display:block;font-size:9px;letter-spacing:.08em;margin-top:2px;opacity:.85}
.nosignal{border-color:var(--red)!important;color:var(--red)!important;animation:pulse 1.6s infinite}
.fast{border-color:var(--green);color:var(--green)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hand{border:1px solid var(--green);background:var(--panel2);padding:9px 11px}
.hand .role{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.hand .role .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.1s infinite}
.hand .who{font-weight:700;margin:4px 0 2px}
.hand .clock{float:right;color:#e8d5ad}
.hand.slow{border-color:var(--amber)}
td.num{text-align:right;white-space:nowrap}
.add{color:var(--green)} .del{color:var(--red)}
.wip{color:var(--green);animation:pulse 1.1s infinite}
</style>
</head>

sson from a single crate-browsing screen into a four-page app: Home (/, demo music news plus recommended crates), Following (/following, follow demo or real collectors and see their crates), Profile (/profile, the signed-in user's own profile) and About (/about), with a persistent follow system and demo content that reaches the owner's already-seeded database on the next API start without changing any existing data.","constraints":["Stack stays as it is: Vue 3, Pinia, vue-router on the web; Fastify, Drizzle, SQLite on the API; Zod contracts in packages/shared. No new external services and no network calls for news or recommendations.","Schema changes go through a new generated Drizzle migration (0005 or later) that only adds to the schema. Existing migrations 0000-0004 are not edited.","`npm run db:seed` wipes crates, albums, tracks and covers, so delivering demo content must not depend on it. Delivery runs at API start from server.ts next to bootstrapFromEnv, not in buildApp, so buildTestApp keeps starting from an empty database.","Nothing in the build or test process may write to the owner's real data/ folder. Any run against the owner's data uses a copy of data/crate.db, crate.db-wal and crate.db-shm through DATABASE_PATH or DATA_DIR.","Demo content lives in a clearly named module (for example apps/api/src/db/demo-content.ts) with a comment saying it is fictional demo data.","Demo users are invented. They must not use the name or likeness of a real person. They have no social links, are never verified and are never admins.","News items describe fictional artists, labels and venues only. They make no claims about real people or companies.","The UI must not claim that a live AI model produced the recommendations.","API responses for follows, the feed and news keep the existing public-data rule: no email, password hash, role or numeric user id.","User-typed and seeded text renders through Vue {{ }} escaping, never v-html.","Existing routes /list, /crates, /albums/*, /u/:username, /profile/edit, /login and /signup keep working. New routes use the masthead visual language in apps/web/src/styles/base.css."],"assumptions":["The request's premise that seeding ran on init is not how the code works: seeding only happens through the manual, destructive `npm run db:seed`, and nothing seeds at startup. The owner's data/crate.db has 2 crates (ids 24 and 25, both with no owner), 10 albums and one non-admin user, swenkly. New content is therefore delivered by an idempotent, non-destructive step at API start.","'AI recommended' has no AI behind it: recommendations are a seeded editorial flag on crates, labelled on Home as curated demo picks with an explicit note that no AI model is involved. It is the same list for every viewer and is not personalised. A real model is a separate piece of work.","News is seeded, stored in SQLite and served by GET /api/news. Items are fictional, labelled Demo in the UI, show their full text in place, and have no outbound links or detail page.","Page 'Following' means collectors you follow and their crates. The feed lists crates only, newest first. There is no per-album activity, notifications, likes or comments.","A new or existing user is not auto-followed to anyone. Following starts empty and shows suggested demo collectors to follow.","Follows are public-count but the follower and following lists of other users are not exposed in this scope. Profiles show counts only.","Demo crates are ordinary crates owned by demo users. They therefore also appear on the shelf, in /list search and on demo profiles, and are read-only to non-admin viewers through the existing permission rules.","The current crate browser (CrateView) moves from / to /shelf and stays reachable from Home and from the existing toolbar. /crates/:id deep-links to one crate on that browser. It is not a fifth top-level nav entry.","/profile renders the owner's profile using the existing ProfileView rather than redirecting to /u/:username, so the nav item stays active. /u/:username stays the public URL.","Demo content is applied by default when NODE_ENV is not production. In production it is skipped unless SEED_DEMO_DATA=true, so a real deployment does not get fake users by default. A production deployment without the flag shows Home empty states.","Demo rows are matched by a stable seed key. They are inserted if missing and never overwritten. A demo row someone deleted comes back on the next start. This is also what makes content return after `npm run db:seed`.","Demo users cannot log in: their password_hash is a non-scrypt sentinel, which verifyPassword rejects, and their emails use the reserved .invalid domain.","The owner's ownerless crates 24 and 25 stay ownerless. This feature does not change how they get an owner, and swenkly remains a non-admin. ADMIN_EMAIL/ADMIN_PASSWORD behaviour is unchanged."],"risks":["Moving CrateView off / breaks the many references that treat / as the crate browser: 'Back to the crates' links in AlbumView, NotFoundView and CratesView, LibraryToolbar's exact-active link, the logout redirect in AccountMenu, and fixtures in App.test.ts and editControls.test.ts.","/crates (manage page, requires auth) and the new /crates/:id (public crate view) share a prefix, so guards and active states must be checked separately.","The crate picker tabs were designed for 2 crates. Six or more extra demo crates could overflow at 320px, and the library store loads every album on every shelf visit.","Matching demo rows by name instead of seed key would duplicate them after a rename or clash with a real user's crate or username.","A real user may already hold a demo username, in which case seeding must skip that user and their dependent crates without taking over the account.","The owner's real data sits partly in crate.db-wal (about 300 KB), so copying crate.db alone gives a stale test database.","eslint.config.js does not ignore .shipyard, and untracked scripts such as .shipyard/render-report.mjs may affect `npm run lint` results independently of this feature.","Owner intent risk: seeding fake users into a database with real accounts means fake collectors are visible to anyone on that instance until removed. No removal command is in scope beyond the production default."],"acceptance_criteria":[{"id":"AC1","text":"The masthead on every route contains a nav landmark with exactly four links, in order: Home (/), Following (/following), Profile (/profile), About (/about), for both signed-in and signed-out visitors.","verify":"In a browser, signed in and signed out, on /, /about, /list and /albums/\u003cid>, read the nav's links and hrefs. App.test.ts asserts the same."},{"id":"AC2","text":"Exactly one nav link has aria-current=\"page\" when on /, /following, /profile or /about, and it is the link for that URL. On /u/\u003canother-user>, /shelf and /list no nav link has aria-current=\"page\".","verify":"Component test plus browser check, reading aria-current on the nav links at each URL."},{"id":"AC3","text":"Against the production build served by Fastify, a direct GET and a browser reload of /, /following, /profile, /about, /shelf and /crates/\u003cid> return the app and render the right page (or the login redirect for signed-out /following and /profile). /api/does-not-exist still returns a JSON 404, not index.html.","verify":"`npm run build`, start the API, curl each path for 200 text/html, curl the API path for a 404 JSON body, and reload each page in a browser."},{"id":"AC4","text":"At viewport widths 320, 390 and 1280, on /, /following, /profile, /about and /shelf: document.documentElement.scrollWidth is less than or equal to window.innerWidth, and all four nav links are visible without opening a menu or scrolling horizontally.","verify":"Real-browser check at each width, evaluating scrollWidth and innerWidth and checking each nav link's bounding box lies inside the viewport."},{"id":"AC5","text":"/ renders the Home view with a heading 'Music news' and a heading 'Recommended crates'. document.title is 'Home · Frisson'. The page is viewable signed out, and the 3D crate box is no longer rendered at /.","verify":"Browser check signed out, and a HomeView component test."},{"id":"AC6","text":"GET /api/news is public and returns at least 6 items, each with title, summary, source and an ISO publishedAt, sorted newest first. On Home each item shows its title, summary, date and a visible 'Demo' label.","verify":"API test on a database with demo content applied: status 200 without a cookie, length at least 6, sort order and fields. Browser or component test for the rendering."},{"id":"AC7","text":"No demo news item, demo user name or demo crate name uses a real person's name. Every demo news source, artist, label and venue is invented, and the demo content module has a header comment stating the data is fictional demo data.","verify":"Read the demo content module and list every proper noun used in news items and user names. The module must also contain the header comment. Fail on any name that is a known real person, artist or company."},{"id":"AC8","text":"GET /api/crates/recommended is public and returns at least 6 crates, none of them the owner's existing Guitars or Beats & Bass, each with at least 4 albums and its owner's username and display name. Home renders one card per crate with its name, record count and owner.","verify":"API test on a database with demo content applied, asserting count, album counts and owner fields. Browser check that the number of cards equals the number returned."},{"id":"AC9","text":"The Recommended crates section on Home contains the exact text 'Curated demo picks. No AI model is involved yet.' and contains no other occurrence of 'AI'.","verify":"Component test on the section's text, plus a browser read of the section."},{"id":"AC10","text":"Clicking a recommended crate card navigates to /crates/\u003cid>, showing that crate selected with its albums in the crate browser. Reloading that URL shows the same crate. Choosing another crate's tab updates the URL to that crate's id. /crates/999999 shows 'Crate not found' rather than a different crate.","verify":"Browser check: click a card, confirm URL and owner label, reload, click a tab and read the URL, then visit the missing id."},{"id":"AC11","text":"The previous crate browser is at /shelf and lists all crates, including the owner's Guitars and Beats & Bass. Home has a link with the text 'Browse all crates' to /shelf. Every 'Back to the crates' link and the toolbar's Crates link goes to /shelf. /list and the /crates manage page behave as before.","verify":"Browser check following each link from /, /albums/\u003cid>, a not-found URL and /crates. Existing web tests updated and passing."},{"id":"AC12","text":"PUT /api/users/:username/follow and DELETE /api/users/:username/follow return 204 for a signed-in user, and repeating either returns 204 with no duplicate row. Signed out returns 401, an unknown username returns 404, and following yourself returns 400. A unique constraint on (follower, followee) exists, and deleting a user removes their follow rows.","verify":"New API tests in apps/api/test/follows.test.ts covering every status listed, plus a direct database assertion for row count and cascade."},{"id":"AC13","text":"GET /api/users/:username includes followerCount and followingCount for everyone, and viewerFollows (true or false, false when signed out). Counts change by exactly 1 after a follow and after an unfollow. The response still has no email, role or numeric id.","verify":"API test comparing values before and after, and asserting the absence of those keys at every nesting level."},{"id":"AC14","text":"GET /api/me/following and GET /api/me/feed return 401 signed out. For a signed-in user, following returns the followed users' public summaries, and feed returns crates owned by followed users, newest created first, with owner username and album count, limited to 50. Neither includes crates from users the viewer does not follow, or any email, role or numeric user id.","verify":"API test with three users and crates at different created_at values: asserts inclusion, exclusion, order, the limit and the absence of those keys."},{"id":"AC15","text":"Signed out, visiting /following or /profile redirects to /login?next=\u003cthat path>, and after logging in the visitor lands back on that path. Logging out while on /following or /profile lands on /.","verify":"Browser check for both paths, and router or AccountMenu tests."},{"id":"AC16","text":"/following shows a 'Following' list and a 'Crates from people you follow' feed. A user following nobody sees an empty-state message and a 'Suggested collectors' list containing every demo user they do not follow, each with a Follow button.","verify":"Browser check with a freshly signed-up user, and a FollowingView component test."},{"id":"AC17","text":"Clicking Follow on /following adds that user to the Following list and their crates to the feed without a full page load, and both are still there after a reload. Clicking Unfollow removes both, and that also survives a reload. A failed request shows an error message and leaves the button's state matching the server.","verify":"Browser check with reloads and a read of /api/me/following after each step. Component test with a rejected API call for the failure case."},{"id":"AC18","text":"On /u/\u003cother-user> a signed-in visitor sees a Follow or Unfollow button matching viewerFollows, and it changes the follower count shown. A signed-out visitor sees a 'Log in to follow' link to /login?next=/u/\u003cother-user>. A user viewing their own profile sees no follow control.","verify":"ProfileView component tests for the three viewer states, plus a browser check of one follow and the updated count."},{"id":"AC19","text":"/profile, signed in, shows the signed-in user's own display name, username, crates, follower count and following count, plus a link to /profile/edit, with the URL staying /profile. A profile edit saved at /profile/edit appears on /profile after a reload.","verify":"Browser check signed in as a test user, including an edit followed by a reload. Component or router test for the route."},{"id":"AC20","text":"/about is public, has the heading 'About Frisson' and document.title 'About · Frisson', describes crates, following and the self-hosted nature of the app, and states that news, recommendations and demo collectors are demo data.","verify":"Browser check signed out, and an AboutView component test on the heading and on the words 'crates', 'following', 'self-hosted' and 'demo'."},{"id":"AC21","text":"Starting the API against a copy of the owner's existing database (data/crate.db with -wal and -shm, migrations through 0004 only) applies the new migration and adds the demo content with no manual command: GET /api/news and /api/crates/recommended meet their minimum counts and at least 5 demo users exist. All rows previously in users, user_links, sessions, crates, albums and tracks are unchanged, apart from any columns added by the migration, which take their defaults.","verify":"Copy the three files to a temp dir, dump the old tables and their original columns with sqlite3, start the API with DATABASE_PATH pointing at the copy, query the API, then dump and diff. Also confirm data/ itself has unchanged checksums."},{"id":"AC22","text":"Starting the API a second and third time adds no rows: counts of users, crates, albums, tracks and news are identical after each start. After renaming a demo crate directly in the database and restarting, there is no duplicate crate and the new name is kept. After `npm run db:seed` and a restart, the demo crates and recommended list are present again.","verify":"Automated API test calling the seed function repeatedly on one database, plus a manual run on a temp copy for the db:seed case, comparing counts each time."},{"id":"AC23","text":"Demo users are identifiable and inert: each has a demo marker in the database, a username beginning 'demo-', an @*.invalid email, verified false, role 'user' and no user_links. POST /api/auth/login with a demo email and any password returns 401. If a real account already holds a demo username, seeding leaves that account and its crates unchanged and makes no follow, crate or role change to it. Demo profile pages show a visible 'Demo' label.","verify":"API tests for the field values, for the login rejection and for the pre-existing username collision, plus a browser check of one demo profile."},{"id":"AC24","text":"With NODE_ENV=production and SEED_DEMO_DATA unset, a start adds no demo rows, and Home shows an empty-state message in both sections with no error. With SEED_DEMO_DATA=true the content is added. buildTestApp's database still starts with no demo rows. README, .env.example and compose.yaml all document or pass through SEED_DEMO_DATA.","verify":"Start against temp databases in both configurations and count rows. Grep the three files for SEED_DEMO_DATA. Existing tests that assume empty databases pass unchanged."},{"id":"AC25","text":"When a Home or Following data request fails, that section shows a role=\"alert\" message with a 'Try again' button that re-requests the data, and the other section on the page still renders. While loading, each section shows a status message.","verify":"Component tests with one rejected API call and one resolved call, including a click on Try again."},{"id":"AC26","text":"`npm run format:check`, `npm run lint`, `npm run typecheck`, `npm test` and `npm run build` all exit 0, with new tests present for follows, feed, news, recommended crates, demo seeding, and the Home, Following and About views. The README's routes, API table and database section describe the new pages and endpoints and no longer imply / is the crate browser.","verify":"Run the five commands and record exit codes. List the new test files. Read the README sections."},{"id":"AC27","text":"End-to-end smoke in a real browser against the production build, using a temp copy of the owner's database: open /, confirm news and recommended crates, open a recommended crate, go to /about, sign up a new user, follow a demo collector on /following, reload and confirm it persists, confirm that collector's crates are in the feed, open /profile and confirm following count 1, unfollow, reload and confirm the count is 0, at 1280 and again for the page checks at 390. The browser console shows no errors throughout (excluding expected 401s from /api/auth/me while signed out).","verify":"Run the sequence in Chrome, capture screenshots and console output, and record pass or fail for each step in the run's report."}]},"map":{"commit":"2e3e66f5237d7a94ed216ac0e67b2cf6346ff5d1","structure":{"name":"frisson (repo crate-digger)","language":"TypeScript, ESM, Node >=22.18 (.nvmrc), runs .ts directly via node (no api build step)","workspaces":{"tool":"npm workspaces","dirs":["packages/shared (@frisson/shared, zod schemas, src/index.ts, sorting.ts)","apps/api (@frisson/api, Fastify 5 + drizzle-orm + better-sqlite3, sharp, fastify-type-provider-zod)","apps/web (@frisson/web, Vue 3.5 + vue-router + pinia + Vite 6)"]},"dev":"npm run dev (concurrently api + web). api: node --watch src/server.ts on PORT env default 3000; web: vite on 5173, proxies /api, /covers, /avatars to 127.0.0.1:3000","build":"npm run build (web vite build only; api has no build)","database":"SQLite file data/crate.db (DATABASE_PATH env); drizzle-orm schema apps/api/src/db/schema.ts; migrations SQL in apps/api/drizzle (0000..0004 + meta/_journal.json); applied automatically on startup via migrate() in apps/api/src/db/client.ts; generate with `npm run db:generate -w apps/api`; also db:seed, db:studio, db:backup, db:restore","other":"Dockerfile, compose.yaml (needs ADMIN_EMAIL/ADMIN_PASSWORD, DOMAIN in .env), GitHub CI .github/workflows/ci.yml, prettier + eslint flat config at root"},"tests":{"runner":"vitest 3 (api: node env; web: happy-dom + @vue/test-utils configured in apps/web/vite.config.ts). shared has no tests.","commands":{"all":"npm test","api":"npm test -w apps/api","web":"npm test -w apps/web","single":"npx vitest run \u003cfile> (from within apps/api or apps/web)","typecheck":"npm run typecheck (api/shared: tsc --noEmit; web: vue-tsc --noEmit)","lint":"npm run lint (eslint .)","format":"npm run format:check","ci_order":"format:check, lint, typecheck, test, build"},"locations":{"api":"apps/api/test/*.test.ts (albums, auth-accounts, avatars, bootstrap, covers, crates, health, migration, ownership, passwords, profiles, schema, shared-auth, shared-profile, sorting, web)","web":"colocated *.test.ts next to source in apps/web/src (components, views, stores, utils, composables, router, App)"},"helpers":"apps/api/test/helpers.ts: buildTestApp() (in-memory sqlite, temp covers/avatars dirs, generous rate limit; call app.close()), pngBuffer(), SignedIn type and signup/login helpers using app.inject","e2e":"absent (no playwright/cypress)"},"conventions":{"tooling":"npm workspaces (apps/api, apps/web, packages/shared @frisson/shared); Node>=22.18, API runs native TS (.ts import suffixes); Prettier no-semi, single quotes, width 100, trailing commas; ESLint flat config (vue essential + ts recommended, prettier skip-formatting); Vitest both apps, tests colocated in web (*.test.ts), apps/api/test in api","api":"routes/ thin (FastifyPluginAsyncZod, zod schema params/body/response, preValidation requireUser/requireAdmin), services/ hold logic and throw HttpError via notFound/badRequest (errors.ts), plugins/ for db/auth/uploads/static; drizzle schema in db/schema.ts, migrations via drizzle-kit (0004 latest); routes under /api, e.g. GET /users/:username, PATCH /me/profile; public output only via publicProfile/toPublicProfile (never email/role/id); header comments state 'Data classification'","shared":"packages/shared/src/index.ts holds zod schemas: input schemas vs response schemas, requiredText/optionalText helpers, friendly messages, strictObject for no self-escalation","web":"Vue3 script-setup, Pinia stores (session, library), api/ typed fetch wrappers over request() in client.ts, views/ lazy-loaded via router with props functions, meta.requiresAuth guard; components/ flat (AccountMenu, LibraryToolbar); utils/ small pure helpers with tests; views have route '/' = CrateView named 'library'; existing routes: /, /list, /crates, /login, /signup, /albums/*, /u/:username (profile), /profile/edit, catch-all not-found; no /home, /following or /about routes","styling":"plain CSS with tokens in apps/web/src/styles/base.css :root (--cardboard, --paper, --ink, --ink-soft, --marker-red, --ok-green, --star, --font-display Courier New, --font-body system-ui); shared classes .btn .status-note; focus-visible red outline; 90s record shop feel; reduced-motion respected","commits":"Conventional Commits with scope: feat(api|web|shared), fix, chore(shipyard), docs, refactor; squash per milestone; branches feat/ fix/ chore/; PR template checklist lint+typecheck+test"},"documentation":{"files":["README.md","docs/SPEC.md","docs/DEPLOY.md","docs/adr/0001-0005","docs/adr/0005-user-profiles.md",".github/pull_request_template.md",".shipyard/PROJECT-REPORT.md"],"absent":"no CONTRIBUTING, no CLAUDE.md, no docs/ roadmap file, no brand voice notes; 'Frisson 1.0' appears only in .shipyard/PROJECT-REPORT.md as Phase 1 (accounts) and Phase 2 (profiles); no mention of Home, Following, About pages anywhere in docs","constraints":"ADR 0005 lists follows, feed, favorites, likes, B-Side, email verification as out of scope (so Following has no backing data/API yet); anyone can browse signed-out; profiles are public and must never expose email/role; no new services/dependencies; ADRs expected for significant decisions; spec says update Spec/ADRs if a decision changes; tagline: 'Your music collection as 90s record crates. Flip through the sleeves, pull one out, and spin it.'; self-hosted, manually curated, no external music APIs"},"relevant":{"monorepo":"npm workspaces: packages/shared (zod schemas, @frisson/shared), apps/api (Fastify+Drizzle+better-sqlite3, node --watch src/server.ts), apps/web (Vue 3 + vue-router + Pinia). Project name 'frisson' (repo crate-digger).","web_routing":"apps/web/src/router.ts:15-70. '/' name 'library' -> CrateView (eager, lines 5,18); '/list' LibraryView; '/crates' (requiresAuth); /login /signup; /albums/:id, /albums/new, /albums/:id/edit; '/u/:username' name 'profile' (public, ProfileView, props username :58-63); '/profile/edit' requiresAuth; catch-all NotFound. Global guard router.beforeEach :73-79 awaits session.load() and redirects to login?next= when meta.requiresAuth. No /following, /about, /home, /me route exists. No own-profile alias route (own profile = /u/\u003csession.user.username>).","app_shell":"apps/web/src/App.vue: header.masthead with RouterLink 'Frisson' to '/', tagline, absolute-positioned .account (AccountMenu if session.user else Log in/Sign up links). NO primary nav exists (no page tabs); main.page max-width 52rem. Add nav here.","account_menu":"apps/web/src/components/AccountMenu.vue: avatar button + dropdown with View profile (/u/username), Edit profile, Log out (logOut at ~line 63 pushes to 'library' if route requiresAuth). Uses UserAvatar.vue (avatarUrl or initials), VerifiedBadge.","crates_listing_view":"apps/web/src/views/CrateView.vue (route '/'): uses useLibraryStore (apps/web/src/stores/library.ts) load() -> listCrates + listAlbums; crate tabs, OwnerLink, CrateBox (flip-through crate) with albums, 'Pull it out' spins album then router.push album. LibraryToolbar. LibraryView (/list) is list alternative; CratesView is crate manager.","profile_view":"apps/web/src/views/ProfileView.vue (+ .test.ts): prop username, getProfile(username) from api/profiles.ts, statuses loading/ready/not-found/error, isOwner via session.user.username, shows links (PLATFORM_LABELS), crates (profileCrate: id,name,color,label,albumCount), VerifiedBadge, initials fallback. EditProfileView.vue at /profile/edit.","web_api_layer":"apps/web/src/api/client.ts: request\u003cT>(path) fetch to /api (vite proxy in dev), throws ApiRequestError; errorMessage(). Per-domain modules api/{albums,auth,crates,profiles}.ts. Types come from @frisson/shared (packages/shared/src/index.ts: crate :118, publicUser :160, publicProfile :283, profileCrate :273, usernameParams :227, apiError :299, idParams :22). Pinia stores: stores/library.ts, stores/session.ts. No hooks dir other than composables/ (useAlbumSearch, useCrateFlip).","api_registration":"apps/api/src/app.ts: buildApp(opts) registers plugins errorHandler, db, auth, uploads, covers, avatars then routes under prefix /api: health, auth, crates, albums, covers, profiles, avatars (lines ~55-61), then webPlugin last. Routes are FastifyPluginAsyncZod in apps/api/src/routes/*.ts; services in src/services/*.ts take (db, user, input). New routes need a register line in app.ts.","auth_session":"API: plugins/auth.ts sets req.user (PublicUser|null) in onRequest from cookie 'frisson_session' (opaque token, sha256 hash stored in sessions table; services/sessions.ts findSessionUser). Require a user: requireUser(req.user) in services/permissions.ts:16 (401), used as route preValidation (routes/profiles.ts:~20); requireAdmin also there; canEditOwner/assertCanEditCrate. Web: GET /api/auth/me (routes/auth.ts:73) -> session store (stores/session.ts): user, loaded, signedIn, isAdmin, load(), logIn/signUp/logOut/refresh. publicUser has id,email,username,displayName,role,avatarUrl,verified.","db_schema":"apps/api/src/db/schema.ts. users (:21-34): id, email, username, displayName, passwordHash, role(user|admin), createdAt, bio, location, avatarPath, verified. user_links, sessions. crates (:68-80): id, name, color, label, sortBy, sortOrder, ownerId (nullable FK users, set null), created/updated. NO visibility/public/private field on crates (all crates public via GET /api/crates). albums: crateId (restrict), title, artist, year, genre, format, coverPath, sleeveColor, rating, notes, position, spinCount. tracks: albumId, side A-D, position, title, durationSec. No follows/news/recommendation tables.","migrations":"apps/api/drizzle/: latest is 0004_user_profiles.sql (journal idx 4, meta/_journal.json); next is 0005. Generate with `npm run db:generate -w apps/api` (drizzle-kit, drizzle.config.ts). Migrations auto-applied in db/client.ts createDb() via migrate() on every open. test/migration.test.ts and schema.test.ts exist.","seed":"apps/api/src/db/seed.ts, run ONLY manually via `npm run db:seed -w apps/api` (apps/api/package.json:11; README:79). NOT run on server start, not in Dockerfile/compose/CI. It is a DESTRUCTIVE script: refuses if NODE_ENV=production; rm -rf DEFAULT_COVERS_DIR; in one transaction deletes all tracks, albums, crates (users untouched) and re-inserts. No skip-if-seeded guard; every run wipes crates. Data: const SEED = [{name,label,color,albums:[{title,artist,year,genre,rating,sleeveColor,notes?,sides?:{A:[titles],B:..}}]}] -- 2 crates ('Guitars' 4 albums, 'Beats & Bass' 6 albums), 10 albums; tracks only as title lists per side (no durations); no coverPath (generated sleeves); crates inserted WITHOUT ownerId (null = legacy; bootstrap assigns to admin only when server starts with ADMIN_EMAIL/ADMIN_PASSWORD, services/bootstrap.ts bootstrapFromEnv, called in src/server.ts:10 each start). Seed creates no users, no avatars. DB lives at \u003crepo>/data/crate.db (paths.ts; data/ has avatars, covers, crate.db).","seed_wipe_hazard":"Re-running seed deletes ALL crates/albums including any user-created ones and any new seeded content has to be added inside this wipe script or a new idempotent script; deleting crates also leaves users' ownership irrelevant. Seeded users would need createUser (services/users.ts) which hashes password.","avatar_handling":"avatarPath stores public URL path '/avatars/\u003cfile>' (services/avatars.ts:21,72); files in data/avatars served by plugins/avatars.ts static. UserAvatar.vue falls back to initials when avatarUrl null, so seeded fake users need no image files.","cover_rendering":"apps/web/src/components/crate/SleeveArt.vue: if album.coverPath -> \u003cimg :src=coverPath> (served from /covers/ by plugins/covers.ts); else generated sleeve using sleeveColor background, readableInk(utils/color.ts) text, and a motif picked by album.id % 4 ('rings','stripes','sun','grid'), with edge strip + sticker showing title/artist/year. So seeded albums need only sleeveColor (hex) + title/artist/year. Crate color/label drive CrateBox tape labels (utils/crateLayout.ts).","existing_follow_news_reco":"ABSENT. grep for follow/news/recommend finds nothing in source (no tables, routes, schemas, views). No external HTTP/news client, no AI code in repo.","test_fixtures":"API (vitest-style via node test? files apps/api/test/*.test.ts): test/helpers.ts exports buildTestApp() (in-memory sqlite, temp covers/avatars dirs, app.inject), signUp(app, overrides)->{user,cookie,headers}, createAdmin(app), addCrate(app,name,sortOrder,ownerId), pngBuffer(), multipart(). Example tests: profiles.test.ts, ownership.test.ts, shared-profile.test.ts. Web: vitest + @vue/test-utils; App.test.ts mounts App with createPinia + memory router (mountApp(path)); router.test.ts; ProfileView.test.ts; stores/session.test.ts, library.test.ts.","other":"Docs: docs/adr/0004-user-accounts.md, 0005-user-profiles.md, docs/SPEC.md. Git branch is shipyard/home-following-profile-about; recent commits added avatar menu and profiles. Profile API: GET /api/users/:username (public, publicProfile incl crates), PATCH /api/me/profile; no 'list users' endpoint exists."},"verified_commands":{"test":"npm test","typecheck":"npm run typecheck","lint":"npm run lint","format":"npm run format:check"}},"ledger":"# Ledger 2026-11-08T19-49-05\n\n- Preflight done. No survey cache; 175 tracked files, running full 3-surveyor survey alongside intake.\n- Baseline: test exit=0 in 7s, typecheck=0, lint=0\n- Survey merged. Finding: db:seed is manual and destructive (wipes tracks/albums/crates, covers dir); no follow/news/recs; ADR 0005 lists follows/feed as out of scope. Baseline green: 180 tests.\n- Intake accepted: 27 criteria. Manager dispatched.\n- Plan validated: 10 tasks. T1 dispatched.\n- T1 done (85b4479). T2, T3 dispatched.\n- T2 done (396de6b). T4, T6 dispatched.\n- T6 done (1cf8e15). T7, T8 dispatched.\n- T4 done (88309b8). T5 waits on T3.\n- T3 done (bedafa1). T5 dispatched.\n- T8 done (0b8468e). T9 waits on T7. Queued: singular follower label.\n- T7 done (0326e4c). T9 dispatched.\n- T5 done (37ac1ee). T10 waits on T9.\n- T9 done (1776cf2). T10 dispatched. Queued: stale store on /crates/:id.\n- T10 done (28bbf18). Build complete. Tester dispatched.\n- Test 1: 26 pass, AC10 fail. Tree clean, data checksums unchanged. Fix round 1 direct-fix F1 dispatched.\n- F1 done (3769352). Scoped retest dispatched.\n- Retest passed: 27/27. Reporter dispatched.\n- Reporter text saved by harbormaster after its write was refused. Verdict: shipped, 27/27, 1 cycle, 1 fix round.\n","reportMd":"# Run report 2026-11-08T19-49-05\n\n**Verdict: SHIPPED. 27/27 acceptance criteria pass after 1 cycle and 1 fix round. Nothing is merged or deployed, and the owner's database is unchanged.**\n\nBranch: shipyard/home-following-profile-about-2026-11-08T19-49-05 (11 commits after 2e3e66f).\n\n## Asked\n\n\"3 page system\" (four pages enumerated): Home (news plus AI-recommended crates), Following (seeded fake users), own Profile, About. The request said seeding ran on init.\n\n## Must-know\n\n- Seeding does NOT run on init. `db:seed` is manual and destructive (wipes crates, albums, tracks, covers). Demo data arrives at API start via an idempotent, non-destructive step in server.ts. It is on by default outside production; production needs SEED_DEMO_DATA=true.\n- \"AI recommended\" has no AI behind it. It is a curated demo flag, and the UI says \"Curated demo picks. No AI model is involved yet.\"\n- News is fictional seeded data, not a live feed. Items are labelled Demo and have no outbound links.\n- The owner's database has not been changed. Migration 0005 and the demo data (7 fake users, 9 crates, 9 news items) apply on the next API start on this branch. All testing used temp copies, and the data/ checksums were unchanged.\n- Demo names were checked from model knowledge only, without a web lookup.\n- Unreproduced click: in the retest, one real click on a recommended card's record count did not navigate. It worked on the next 3 attempts (1 miss in 9 clicks). The cause was not established; the hidden-pane view-transition stall is suspected but unconfirmed.\n\n## Final criteria\n\nFirst test pass for all, overridden by the retest for AC4, 9, 10, 17, 18 and 19. All 27 are pass: AC1-3, 5-8, 11-16, 20-27 from the first pass; AC4, 9, 10, 17, 18, 19 from the retest. AC10 failed in the first pass and passed after the fix.\n\n## Built\n\n- Migration 0005 (additive only): follows, news_items, demo_seed_key columns, crates.recommended_rank.\n- Follow, following, feed and suggested-collectors routes; public news and recommended routes.\n- Demo seeding by stable key (7 users, 9 crates, 36 albums, 135 tracks, 9 news items). Demo users cannot log in.\n- Web: masthead nav; Home, Following, Profile, About; crate browser moved to /shelf with /crates/:id deep links; follow button; Demo tag.\n- README, .env.example and compose.yaml document or pass SEED_DEMO_DATA.\n- Commits: 85b4479, 396de6b, 1cf8e15, 88309b8, bedafa1, 0b8468e, 0326e4c, 37ac1ee, 1776cf2, 28bbf18, and the fix 3769352.\n\n## Tests (final run, after the fix)\n\n- npm test: exit 0. API 21 files, 360 tests. Web 31 files, 316 tests. The baseline was 180 tests.\n- typecheck, lint, format:check and build all exit 0.\n\n## What went wrong: AC10 first pass\n\nEvidence, quoted from the first test pass:\n\n> FAIL on the first clause: clicking a recommended crate card does not navigate unless the click lands on the tape-label link. Real trusted click on the crate name, recorded by a capture listener: [254,384,'P','crate-name',true], location stayed '/'. HomeView.vue:84 wraps only the label in RouterLink... Link is 146x18 of a 259x145 card (7% of its area), no ::after stretch, card cursor auto. Also the link's accessible name is the tape label, not the crate name.\n\nThe other AC10 sub-steps passed.\n\nFix F1 (3769352), a direct fix:\n\n- The whole card is now a link, with the crate name in its accessible name.\n- Keyboard focus shows a ring around the whole card.\n- The scoped retest used trusted clicks on name, count and owner, and all went to /crates/\u003cid>.\n- Reload and the /crates/999999 \"Crate not found\" case also passed.\n\nF1 also covered four tester observations that were not criteria:\n\n- Feed cards now show the crate name.\n- Crates on /profile and /u/\u003cuser> are now links.\n- The count label is singular (\"1 follower\").\n- A stale library store no longer gives \"Crate not found\".\n\nAll four were verified in the retest.\n\n## Caveats\n\n- AC27 (the end-to-end smoke) was not re-run after the fix. The first pass opened the crate via the label link.\n- The retest ran with NODE_ENV unset, so it did not test production-mode behaviour. AC24 production mode was covered in the first pass.\n- AC4 on /about and /shelf was not re-measured after the fix.\n- Compose was checked only with `docker compose config`.\n- Hidden-pane view-transition stalls were treated as harness artefacts.\n\n## Remaining low-severity observations (unfixed)\n\n- The crate picker stacks about one tab per row at 320 and 390 with 11 or more crates.\n- The 7-card grid leaves an orphan on the last row.\n- @demo-\\* handles wrap at the hyphen.\n- Titles stay plain \"Frisson\" on /list and not-found (not checked against main).\n- Form field names come from placeholders (not checked against main).\n- The Edit profile button sits a few pixels off from the counts above it.\n- Recommended has no album-count filter.\n- Deleted demo tracks do not return.\n- `npm run dev` now seeds a developer database.\n\n## Next steps\n\n1. Web-check demo-content.ts for real-name collisions.\n2. Start the API once on this branch against a copy of your data, then on the real one, and click through all four pages.\n3. Set SEED_DEMO_DATA=false before first start if fake collectors on the real instance are unwanted.\n4. Re-run the AC27 smoke in a visible browser pane, which will also show whether the missed click recurs.\n5. Fix the crate-picker layout at 320 and 390 before adding more demo crates.\n6. Decide separately whether a real recommendation model is wanted.\n","cycles":[{"n":"1","spec":"# Spec: Home, Following, Profile and About\n\n## What we are building\n\nFrisson today is one screen. The 3D crate browser sits at `/`, and everything else hangs off it. This work turns it into a four-page app with a permanent masthead nav:\n\n- **Home** (`/`) shows demo music news and recommended crates.\n- **Following** (`/following`) shows the collectors you follow and a feed of their crates.\n- **Profile** (`/profile`) shows your own profile.\n- **About** (`/about`) explains the app.\n\nIt also adds a real follow system, stored in SQLite, that works with both invented and real collectors.\n\nThe crate browser is not removed. It moves to `/shelf`, and `/crates/:id` deep-links to a single crate on it. Neither is a fifth nav entry.\n\n## The premise we are correcting\n\nThe request assumed that seed data arrives on init. It does not. Seeding only happens through the manual `npm run db:seed`, and that command wipes crates, albums, tracks and covers. The owner's database holds two ownerless crates, ten albums and one real non-admin account, and none of it may change.\n\nSo demo content needs its own delivery route. A separate, non-destructive step runs at API start from `server.ts`, next to `bootstrapFromEnv`. It stays out of `buildApp`, so `buildTestApp` keeps starting empty and the existing tests stay valid.\n\n## Data model\n\nMigration `0005_follows_news_demo` is generated and only adds to the schema:\n\n- **`follows`** has a unique index on (follower, followee), cascades when a user is deleted, and refuses self-follows.\n- **`news_items`** holds the demo news. It has its own `seed_key`.\n- **`demo_seed_key`** is a new nullable, unique column on `users`, `crates` and `albums`.\n- **`crates.recommended_rank`** is a new nullable column. It is the editorial flag behind the recommended list.\n\nStable keys are the core of the design. Rows are matched by key, inserted if missing, and never overwritten. That gives the behaviour the brief asks for:\n\n- Restarts add nothing.\n- A renamed demo crate keeps its new name and does not duplicate.\n- Demo crates return after `db:seed`, because the keys are matched against rows that are now gone.\n- A real account that already holds a demo username is left alone, along with its crates, because that account has no key. Those demo rows are skipped.\n\nTracks have no key. They are inserted only with a newly inserted album. A single deleted demo track therefore does not return, and we accept that to avoid a key column on the largest table.\n\nThe step runs in one transaction. A failure is logged and does not stop the server, since demo content should never take down someone's real collection.\n\n## Demo content\n\n`apps/api/src/db/demo-content.ts` is data only and opens with a comment saying it is fictional. Names need real care:\n\n- Every person, artist, label, venue and publication has to be invented, and each is checked for clashes with real ones.\n- Demo users are `demo-*`, use `.invalid` emails, are never verified or admin, and have no links.\n- Demo users cannot log in, because their password hash is a sentinel that `verifyPassword` rejects.\n\nOne constraint is easy to miss. AC9 allows only one occurrence of \"AI\" in the Recommended section, and tape labels are upper case. A crate called \"Train Songs\" or a collector called \"Blair\" would break it. Demo crate and user names therefore avoid the letters \"ai\" in any case, and a test enforces this.\n\nDelivery defaults to on outside production. In production it is off unless `SEED_DEMO_DATA=true`, and a production instance without it shows Home's empty states. We also honour an explicit `SEED_DEMO_DATA=false` everywhere. The brief did not ask for this, but it is one condition and gives a development instance a way out.\n\n## API\n\nAll new endpoints sit behind the existing routes, services and shared-schema pattern. The new response shapes land in `packages/shared` first.\n\n| Endpoint | Access | Returns |\n| --- | --- | --- |\n| `PUT`/`DELETE /api/users/:username/follow` | signed in | 204, idempotent |\n| `GET /api/me/following` | signed in | `collectorSummary[]` |\n| `GET /api/me/feed` | signed in | `crateCard[]`, newest first, limit 50 |\n| `GET /api/me/suggested-collectors` | signed in | demo users you don't follow |\n| `GET /api/news` | public | `newsItem[]`, newest first |\n| `GET /api/crates/recommended` | public | `crateCard[]` in rank order |\n\n`GET /api/me/suggested-collectors` is not named in the brief, but AC16 needs it because no user-listing endpoint exists.\n\n`crateCard` is a new shape rather than a reuse of `crate`, because `crate` exposes numeric `ownerId` and the public-data rule forbids that here.\n\n`publicProfile` gains `followerCount`, `followingCount`, `viewerFollows` and `isDemo`. The demo marker reaches the UI only as that boolean, so a real user who signs up as `demo-something` gets no Demo label. Self-follow returns 400 on `PUT`. `DELETE` on yourself is a harmless 204.\n\n## Web\n\nThe nav uses `RouterLink`'s own `aria-current`, which is set on exact match only. That is what AC2 wants: none on `/u/x` or `/shelf`, and none on `/profile/edit`. Two details matter:\n\n- The \"Frisson\" sign links to `/` and would otherwise carry a second `aria-current`, so it renders as a plain anchor.\n- The masthead's side padding leaves only 168px at a 320px viewport, and the nav does not fit in that. The nav gets its own full-width row.\n\nThe route name `library` moves with the crate browser to `/shelf`. Most existing `{ name: 'library' }` links then follow automatically, and only the hard-coded `to=\"/\"` links in `AlbumView` and `NotFoundView`, the logout redirect and the toolbar's active state need edits. Logout from an auth-only page now goes to `home`.\n\n`CrateView` must not fall back to the first crate when given an id. The store's `selectedCrate` does that today, and it would show `/crates/999999` as a different crate. Tab clicks use `router.replace`, so Back returns to Home rather than walking through tabs.\n\nHome and Following load each section independently through a small composable, so one failed request leaves the others working (AC25). Home deliberately avoids the library store, which loads every album. `/profile` is a thin wrapper around `ProfileView` using the session's username, so the URL and nav state stay put.\n\nFollow buttons are not optimistic. They wait for the server, which keeps the failure case in AC17 simple and correct.\n\n## Order of work\n\nThe schema comes first. Shared contracts and the profile shape follow, and the demo seeder runs alongside them. From there API and web run in parallel:\n\n```\nT1 schema ─┬─ T2 contracts ─┬─ T4 follows API ─┐\n           │                │                  ├─ T5 news + recommended ─┐\n           └─ T3 demo seed ─┼──────────────────┘                         │\n                            └─ T6 web pieces ─┬─ T7 Home, About ─┐       ├─ T10 docs\n                                              └─ T8 Following,   ├─ T9 ──┘\n                                                 Profile ────────┘\n```\n\n- **`app.ts`** is touched by T4 and T5, so T5 waits for T4.\n- **T2 updates existing test fixtures** because it makes profile fields required. This keeps the tree green rather than leaving breakage for later tasks.\n- **The router comes after the views** (T9), so no task needs stub views and no file is shared across parallel tasks.\n- **Docs come last** and cover ADR 0006, `docs/SPEC.md`, the README, `DEPLOY.md`, `.env.example` and `compose.yaml`. ADR 0005 gets a one-line pointer, because it lists follows and the feed as out of scope.\n\n## Safety\n\nNothing in this work may write to the owner's `data/` folder. Tests use in-memory or temp databases. Any manual run sets `DATA_DIR` to a temp directory holding a copy of all three SQLite files, because recent data sits in the `-wal` file. `db:seed` is never run against the real folder.\n\n## Out of scope\n\nThese are left out by the brief:\n\n- A real recommendation model or personalisation\n- Live news, outbound links or detail pages for news\n- Per-album activity, notifications, likes or comments\n- Follower and following lists for other users (counts only)\n- Auto-following anyone\n- A removal command for demo data, recorded as a known consequence in ADR 0006\n- Changes to who owns crates 24 and 25\n","plan":{"tasks":[{"id":"T1","title":"Additive schema and generated migration 0005","description":"Extend apps/api/src/db/schema.ts, then generate the migration with `npm run db:generate -w apps/api -- --name follows_news_demo` (produces drizzle/0005_follows_news_demo.sql, meta/0005_snapshot.json and a journal entry). This task is the only owner of the migration and snapshot files. Do not hand-edit them or edit 0000-0004.\n\nAdd:\n- Table `follows` (Drizzle export `follows`): id integer PK autoincrement; follower_id and followee_id, integer not null, FK users.id ON DELETE CASCADE; created_at timestamp default unixepoch. uniqueIndex `follows_follower_followee_unique` on (follower_id, followee_id); index `follows_followee_idx` on followee_id; check `follows_no_self` follower_id \u003c> followee_id. Data-classification header comment.\n- Table `news_items` (export `newsItems`): id integer PK autoincrement; seed_key text not null unique; title, summary, source text not null; published_at integer timestamp not null; created_at default unixepoch.\n- Nullable columns: users.demo_seed_key text unique (`demoSeedKey`, non-null means demo user); crates.demo_seed_key text unique; crates.recommended_rank integer (`recommendedRank`, null means not recommended, lower ranks first); albums.demo_seed_key text unique.\n- Relations for follows and $inferSelect/$inferInsert types (Follow, NewsItem, NewNewsItem).\n\nThe generated SQL must only contain CREATE TABLE, ALTER TABLE ADD COLUMN and CREATE INDEX statements. If drizzle produces a table rebuild (`__new_` tables), restructure so it does not. Extend test/migration.test.ts with a 'migration 0005' case modelled on the 0004 one (database at 0000-0004 with users, sessions, links, crates, albums, tracks; opening through createDb keeps every row with new columns NULL). Extend test/schema.test.ts with the unique constraint, cascade on user delete and self-follow check.\n\nSafety: tests use ':memory:' or mkdtemp databases only. Never open or write the real data/ folder. Do not run db:seed, db:studio, or the server without DATA_DIR pointing at a temp dir.","criteria":["AC12","AC21","AC23"],"files":["apps/api/src/db/schema.ts","apps/api/drizzle/0005_follows_news_demo.sql","apps/api/drizzle/meta/0005_snapshot.json","apps/api/drizzle/meta/_journal.json","apps/api/test/migration.test.ts","apps/api/test/schema.test.ts"],"depends_on":[]},{"id":"T2","title":"Shared zod contracts and the extended public profile","description":"In packages/shared/src/index.ts add response schemas with inferred types, each with a 'Data classification: PUBLIC' comment:\n- `newsItem` / NewsItem: { id: int, title, summary, source, publishedAt: ISO 8601 string }.\n- `collectorSummary` / CollectorSummary: { username, displayName, avatarUrl: string|null, verified: boolean, isDemo: boolean }.\n- `crateCard` / CrateCard: { id, name, color, label: string|null, albumCount, createdAt: ISO string, ownerUsername: string, ownerDisplayName: string }. Do NOT reuse `crate`, because it carries numeric ownerId, which the feed and recommended list must not expose.\n\nExtend `publicProfile` with required followerCount: int, followingCount: int, viewerFollows: boolean, isDemo: boolean.\n\nIn apps/api/src/services/profiles.ts, change to `toPublicProfile(db, user, viewerId: number | null = null)` and `getPublicProfile(db, username, viewer: PublicUser | null = null)`. followerCount counts follows where followee_id = user, followingCount where follower_id = user, viewerFollows is true only when viewerId has a follows row for the user, isDemo = user.demoSeedKey !== null. Keep the explicit field list and never emit demoSeedKey, id, email or role. updateOwnProfile and setVerified pass the acting user's id. services/avatars.ts keeps its two-argument call via the default. In routes/profiles.ts pass req.user in GET /users/:username.\n\nUpdate fixtures and key assertions that the required fields break: PUBLIC_KEYS in test/profiles.test.ts, the parsed key list and input in test/shared-profile.test.ts, and the typed PublicProfile fixtures in apps/web/src/views/ProfileView.test.ts, EditProfileView.test.ts and stores/session.test.ts (fixture fields only). Add tests that a fresh user has zero counts and viewerFollows false, that a nested-key walk finds no email/role/id at user level, and that crateCard and collectorSummary strip unknown keys.\n\nTests use in-memory databases only; never touch data/.","criteria":["AC13","AC23"],"files":["packages/shared/src/index.ts","apps/api/src/services/profiles.ts","apps/api/src/routes/profiles.ts","apps/api/test/profiles.test.ts","apps/api/test/shared-profile.test.ts","apps/web/src/views/ProfileView.test.ts","apps/web/src/views/EditProfileView.test.ts","apps/web/src/stores/session.test.ts"],"depends_on":["T1"]},{"id":"T3","title":"Fictional demo content and idempotent start-up seeding","description":"Create apps/api/src/db/demo-content.ts, data only, with a header comment stating the module is fictional demo data. Contents: at least 6 demo users; at least 8 demo crates, each with at least 4 albums and short track lists, of which at least 6 have a recommendedRank; at least 8 news items with fixed published dates in the past, all distinct. Every row has a stable seedKey (for example 'user:vera-lindqvist-demo' style keys, 'crate:...', 'album:...', 'news:...').\n\nContent rules: usernames start 'demo-'; emails are '\u003cusername>@frisson.invalid'; no links; no avatars. Every person, artist, label, venue, publication, album and crate name is invented; check each for a clash with a known real person, band, label or company and replace on doubt. Crate createdAt values are fixed and distinct, so feed order is meaningful. Crate names, crate labels, and demo usernames and display names must not contain the letters 'ai' in any case (for example not RAIN, TRAIN, Blair), because AC9 forbids any other 'AI' in the Recommended section, and tape labels are upper case. Use #rrggbb colours for crates and sleeves. No cover files.\n\nCreate apps/api/src/services/demo-seed.ts exporting:\n- `DEMO_PASSWORD_HASH`, a non-scrypt sentinel such as 'demo-account-no-login', which verifyPassword rejects.\n- `shouldSeedDemo(env)`: SEED_DEMO_DATA='true' always yes; SEED_DEMO_DATA='false' always no; otherwise yes unless NODE_ENV='production'. Empty string counts as unset, since Compose passes ''.\n- `seedDemoContent(db, log?)`: synchronous, one transaction, returns inserted counts. Inserts missing rows only and never updates existing rows. Users are matched by demo_seed_key. If no key match exists and the username or email is already held by a row with a NULL key, skip that user and every crate and album of theirs, and log a warning, never touching the account. Crates are matched by demo_seed_key; new ones get sort_order after the current maximum so existing shelf order is unchanged, plus owner_id and recommended_rank. Albums are matched by demo_seed_key and inserted only when their crate exists; tracks are inserted only together with a newly inserted album. News is matched by seed_key. role 'user', verified false, no user_links, no follow rows.\n- `seedDemoFromEnv(db, env, log)`.\n\nIn apps/api/src/server.ts call seedDemoFromEnv after bootstrapFromEnv and before listen. A seeding failure is logged and does not stop the server. Do NOT call it from buildApp, so buildTestApp stays empty.\n\nCreate test/demo-seed.test.ts covering: minimum counts; every field rule in AC23; running three times adds no rows; a renamed demo crate keeps its name with no duplicate; deleting all crates/albums/tracks the way seed.ts does and re-running restores them; a deleted demo album returns; the pre-existing username collision leaves that account, its crates and its role unchanged; login with a demo email returns 401 through app.inject; shouldSeedDemo truth table; buildTestApp starts with zero demo rows; no owner's existing row changes; no name matches /ai/i. seed.ts itself is unchanged.\n\nTests use in-memory or mkdtemp databases. Any manual run must set DATA_DIR to a temp dir. Never write data/.","criteria":["AC6","AC7","AC8","AC21","AC22","AC23","AC24"],"files":["apps/api/src/db/demo-content.ts","apps/api/src/services/demo-seed.ts","apps/api/src/server.ts","apps/api/test/demo-seed.test.ts"],"depends_on":["T1"]},{"id":"T4","title":"Follow, following, feed and suggestions API","description":"Create apps/api/src/services/follows.ts and routes/follows.ts (FastifyPluginAsyncZod with data-classification comment) and register `followRoutes` under /api in app.ts, before webPlugin.\n\nRoutes, all with preValidation requireUser so signed-out callers get 401 first:\n- PUT /users/:username/follow: 204. Unknown username 404. Self 400 (badRequest). Repeat is 204 with no new row (onConflictDoNothing).\n- DELETE /users/:username/follow: 204, repeat 204. Unknown username 404. Self is a no-op 204.\n- GET /me/following: collectorSummary[], most recently followed first (created_at desc, id desc).\n- GET /me/feed: crateCard[] for crates owned by followed users, crates.created_at desc then id desc, limit 50, albumCount via left join, createdAt ISO.\n- GET /me/suggested-collectors: collectorSummary[] of users with demo_seed_key not null that the viewer does not follow and is not, ordered by username. Empty list when no demo data exists.\n\nUse the shared schemas as response schemas. Build summaries from explicit field lists; never select email, role, id or demo keys into a response.\n\nTests: test/follows.test.ts covers every status in AC12, row counts, cascade on user delete by direct db access, and AC13 counts changing by exactly 1 after follow and unfollow, including viewerFollows true/false/signed-out. test/feed.test.ts uses three users and crates with set created_at values and asserts inclusion, exclusion, order, the limit of 50 and a recursive absence of email/role/id/ownerId at user level; also covers suggested-collectors by inserting rows with a demo_seed_key directly.\n\nUse buildTestApp (in-memory). Never touch data/.","criteria":["AC12","AC13","AC14","AC16"],"files":["apps/api/src/services/follows.ts","apps/api/src/routes/follows.ts","apps/api/src/app.ts","apps/api/test/follows.test.ts","apps/api/test/feed.test.ts"],"depends_on":["T2"]},{"id":"T5","title":"News and recommended crates API","description":"Create services/news.ts and routes/news.ts: public GET /api/news returns newsItem[], published_at desc then id desc, publishedAt as ISO via toISOString; the seed_key is not exposed. Register `newsRoutes` under /api in app.ts.\n\nAdd `listRecommendedCrates(db)` to services/crates.ts: crates with recommended_rank not null, inner join owner, left join albums for albumCount, order by rank then id, mapped to crateCard (no ownerId, no demo key). Add public GET /crates/recommended to routes/crates.ts, response crateCard.array(); it must resolve ahead of /crates/:id. Existing /crates shapes do not change.\n\nTests: test/news.test.ts and test/recommended.test.ts use buildTestApp, assert empty arrays before seeding, then call seedDemoContent(app.db) from services/demo-seed.ts and assert: 200 without a cookie, news length >= 6 with fields and newest-first sort; recommended length >= 6, every crate albumCount >= 4 with owner username and display name, none named Guitars or Beats & Bass even when those exist, no key ownerId/email/role. Extend the it.each in test/web.test.ts with /following, /profile, /about, /shelf and /crates/5, and keep the /api 404 JSON check.\n\nIn-memory databases only; never touch data/.","criteria":["AC3","AC6","AC8"],"files":["apps/api/src/services/news.ts","apps/api/src/routes/news.ts","apps/api/src/services/crates.ts","apps/api/src/routes/crates.ts","apps/api/src/app.ts","apps/api/test/news.test.ts","apps/api/test/recommended.test.ts","apps/api/test/web.test.ts"],"depends_on":["T2","T3","T4"]},{"id":"T6","title":"Web API clients and shared follow and section pieces","description":"Add typed clients over request():\n- api/news.ts: listNews().\n- api/crates.ts: add listRecommendedCrates() -> CrateCard[] from /crates/recommended.\n- api/follows.ts: follow(username) PUT, unfollow(username) DELETE, listFollowing(), getFeed() from /me/feed, listSuggestedCollectors() from /me/suggested-collectors.\n\nAdd components/DemoTag.vue: a small inline stamp with the exact text 'Demo', styled with base.css tokens.\n\nAdd components/profile/FollowButton.vue: props username, following (boolean). Renders a button.btn labelled 'Follow' or 'Unfollow', aria-busy and disabled while in flight, not optimistic: it waits for the request, then emits `changed` with the new boolean. On failure it shows errorMessage in a role=\"alert\" element and keeps the label matching the prop.\n\nAdd composables/useAsyncSection.ts: `useAsyncSection\u003cT>(loader)` returning { data, status: 'loading'|'ready'|'error', error, load(), refresh() }. load() shows the loading status; refresh() re-requests silently and keeps old data until new data arrives, moving to error if it fails. Home and Following use one instance per section, so one failure never affects another.\n\nColocated tests: FollowButton.test.ts (both labels, emit on success, alert and unchanged label on rejection) and useAsyncSection.test.ts. Tests stub fetch or mock the API modules; no real server.","criteria":["AC17","AC18","AC25"],"files":["apps/web/src/api/news.ts","apps/web/src/api/crates.ts","apps/web/src/api/follows.ts","apps/web/src/components/DemoTag.vue","apps/web/src/components/profile/FollowButton.vue","apps/web/src/components/profile/FollowButton.test.ts","apps/web/src/composables/useAsyncSection.ts","apps/web/src/composables/useAsyncSection.test.ts"],"depends_on":["T2"]},{"id":"T7","title":"Home and About views","description":"Create views/HomeView.vue, document.title 'Home · Frisson', public, with no CrateBox and no library store (it must not load every album). Two independent sections via useAsyncSection:\n- h2 'Music news': one article per item with title, summary, source, formatted date in a \u003ctime datetime> element, and DemoTag. Full text in place, no links.\n- h2 'Recommended crates': the exact sentence 'Curated demo picks. No AI model is involved yet.' always present, then one card per crate with RouterLink to { name: 'crate', params: { id } }, showing label or name, record count ('1 record'/'n records'), owner display name and @username.\nEach section has a status-note while loading, role=\"alert\" with a 'Try again' button on failure, and an empty-state message when the list is empty (production without demo data). Nothing else in the Recommended section may contain 'AI': do not apply text-transform: uppercase to its copy or the 'Try again' button, and word empty-state text to avoid 'ai' in any case. A RouterLink with text 'Browse all crates' to { name: 'library' } sits on the page outside the news section.\n\nCreate views/AboutView.vue, document.title 'About · Frisson', public, h1 'About Frisson', covering crates, following and the self-hosted nature of the app (use the words 'crates', 'following', 'self-hosted', 'demo'), and stating news, recommendations and demo collectors are demo data. It may state recommendations are curated by hand and no AI model is involved.\n\nAll text through {{ }}, no v-html, base.css tokens, usable at 320px with no overflow (long names wrap with overflow-wrap).\n\nTests: HomeView.test.ts covers headings, title, Demo label, card count and link, exact note text with a single /AI/ occurrence in the section, one section rejected while the other renders, Try again re-requesting, loading status, empty states. AboutView.test.ts covers heading, title and words. Tests use a local memory router defining 'home', 'crate' and 'library' routes with blank components. The real routes arrive in T9, so do not edit router.ts.","criteria":["AC4","AC5","AC6","AC8","AC9","AC11","AC20","AC24","AC25"],"files":["apps/web/src/views/HomeView.vue","apps/web/src/views/HomeView.test.ts","apps/web/src/views/AboutView.vue","apps/web/src/views/AboutView.test.ts"],"depends_on":["T6"]},{"id":"T8","title":"Following view, own profile view, and follow controls on profiles","description":"Create views/FollowingView.vue, document.title 'Following · Frisson'. Three independent useAsyncSection sections:\n- h2 'Following': followed collectors, each linking to /u/\u003cusername>, with DemoTag when isDemo and a FollowButton (following=true). Empty-state message when empty.\n- h2 'Crates from people you follow': crateCards linking to { name: 'crate', params: { id } } with owner and record count. Empty-state message when empty.\n- h2 'Suggested collectors': listSuggestedCollectors with FollowButton (following=false) and DemoTag. Rendered whenever the list is non-empty.\nOn a FollowButton `changed`, refresh() all three sections without a page load. Each section has a loading status and role=\"alert\" with 'Try again' on failure, and others keep rendering.\n\nUpdate views/ProfileView.vue:\n- Show follower and following counts with the labels 'followers' and 'following' for everyone.\n- Show DemoTag beside the name when profile.isDemo.\n- Other user + signed in: FollowButton matching viewerFollows; on `changed` update viewerFollows and adjust followerCount by exactly 1.\n- Other user + signed out: RouterLink text 'Log in to follow' to { name: 'login', query: { next: `/u/${username}` } }.\n- Own profile: no follow control. Keep the existing Edit profile link.\nDecide the signed-in state from session.user, so a logout during the visit shows the right control.\n\nCreate views/MyProfileView.vue: thin wrapper `\u003cProfileView v-if=\"session.user\" :username=\"session.user.username\" />`, so the URL stays /profile and logout does not crash.\n\nTests: FollowingView.test.ts (empty state with suggestions and Follow buttons; follow moves a user into Following and their crates into the feed; rejected follow shows alert and keeps button state; one section rejected while others render; Try again). Extend ProfileView.test.ts for the three viewer states, count change, Demo label; add a 'login' route to its local router. MyProfileView.test.ts (signed-in username passed through, shows profile-edit link, renders nothing when signed out). Tests mock API modules. No real server or data/ access. Do not edit router.ts.","criteria":["AC4","AC16","AC17","AC18","AC19","AC23","AC25"],"files":["apps/web/src/views/FollowingView.vue","apps/web/src/views/FollowingView.test.ts","apps/web/src/views/ProfileView.vue","apps/web/src/views/ProfileView.test.ts","apps/web/src/views/MyProfileView.vue","apps/web/src/views/MyProfileView.test.ts"],"depends_on":["T6"]},{"id":"T9","title":"Router, masthead nav and moving the crate browser to /shelf","description":"router.ts routes:\n- '/' name 'home' HomeView.\n- '/shelf' name 'library' CrateView (keeping the name 'library' means existing { name: 'library' } links in CratesView, AlbumEditorView and LibraryToolbar follow the move).\n- '/crates/:id(\\\\d+)' name 'crate' CrateView, public, props { crateId: Number(id) }; '/crates' stays requiresAuth and is a separate record.\n- '/following' name 'following' FollowingView, requiresAuth.\n- '/profile' name 'my-profile' MyProfileView, requiresAuth; '/profile/edit' unchanged.\n- '/about' name 'about' AboutView.\nLazy-load all except HomeView. Do not change /list, /u/:username, /albums/*, /login or /signup. In scrollBehavior, keep position when moving between 'library' and 'crate' so tab clicks do not jump.\n\nApp.vue: add `\u003cnav class=\"main-nav\" aria-label=\"Main\">` with exactly four RouterLinks in order: Home (/), Following (/following), Profile (/profile), About (/about), for all visitors on every route. RouterLink's own aria-current=\"page\" on exact match provides AC2. The nav must be a full-width row in the masthead, outside the side padding that clears the account control: 25 characters of Courier do not fit in the 168px left at 320px with 4.75rem padding. Keep it single-line, no wrapping menu, no horizontal scroll; size font and gaps so all four fit in 320px. Render the 'Frisson' sign link with RouterLink `custom` plus a plain \u003ca> so it does not carry a second aria-current on /. Keep existing selectors .account, .tagline, nav.user-menu. Active link style from base.css tokens.\n\nAccountMenu.vue: logOut pushes { name: 'home' } when the route requiresAuth. Keep 'View profile' at /u/\u003cusername>.\n\nCrateView.vue: optional prop crateId. With crateId, crate = library.crateById(crateId), no fallback to crates[0]; a loaded store with no such crate shows status-note 'Crate not found' and a link to { name: 'library' }; a watch selects that crate in the store. A tab click calls selectCrate synchronously and router.replace({ name: 'crate', params: { id } }) on both /shelf and /crates/:id. document.title 'Crates · Frisson'. Tabs must wrap within 320px with long labels (overflow-wrap, max-width 100%).\n\nLibraryToolbar.vue: Crates link stays { name: 'library' }; mark it active on both 'library' and 'crate' routes via a computed class instead of exact-active-class.\n\nAlbumView.vue and NotFoundView.vue: 'Back to the crates' links to { name: 'library' }.\n\nTests: App.test.ts: fixture routes gain home ('/') and library ('/shelf'); assert the nav's four links, order and hrefs signed in and out, aria-current at each URL and none on /shelf, /list, /u/x; logout expectations move to 'home'. router.test.ts: guards for /following and /profile redirect to login?next, public /, /about, /shelf, /crates/5, /crates still guarded, /crates/abc is not-found. editControls.test.ts: fixture uses '/shelf' with 'library' and adds 'crate'; visits use /shelf; flush after tab clicks. New CrateView.test.ts: deep link selects the crate, missing id shows 'Crate not found', tab click updates the URL.\n\nSafety: if you run the app, build and start with DATA_DIR set to a mkdtemp copy; never against data/. Verify scrollWidth at 320 in a real browser if available; the tester repeats this.","criteria":["AC1","AC2","AC3","AC4","AC5","AC10","AC11","AC15","AC19","AC27"],"files":["apps/web/src/router.ts","apps/web/src/router.test.ts","apps/web/src/App.vue","apps/web/src/App.test.ts","apps/web/src/components/AccountMenu.vue","apps/web/src/components/LibraryToolbar.vue","apps/web/src/views/CrateView.vue","apps/web/src/views/CrateView.test.ts","apps/web/src/views/AlbumView.vue","apps/web/src/views/NotFoundView.vue","apps/web/src/views/editControls.test.ts","apps/web/src/styles/base.css"],"depends_on":["T7","T8"]},{"id":"T10","title":"ADR 0006, spec, README, deployment docs and config","description":"Create docs/adr/0006-following-home-and-demo-content.md in the existing ADR format (Status, Date 2026-11-08, Builds on ADR 0005, Context, Decision, Consequences, Alternatives considered). Record: the four-page structure and crate browser move to /shelf; follows table and public-count rule; recommendat y again recovers' (role=alert, click Try again, alert gone), 'shows a status message in each section while loading'. Not separately exercised in a browser."},"AC26":{"status":"pass","evidence":"All five commands exit 0 (see commands). New tests present: apps/api/test/follows, feed, news, recommended, demo-seed; apps/web HomeView, FollowingView, AboutView, MyProfileView, FollowButton, useAsyncSection. README: Pages table lists / as Home and /shelf as the crate browser; line 20 says Web opens on Home, flip crates at /shelf; API table has follow, me/following, me/feed, me/suggested-collectors, news, crates/recommended; Database section describes migration 0005 and Demo content."},"AC27":{"status":"pass","evidence":"Production build, temp copy, fresh tab, real clicks. 1280: / with 9 news and 7 cards; opened Kitchen Table Jazz via its label link -> /crates/28, 'by Junia Marrowby', pressed; clicked About -> About Frisson; signed up tv_beta -> /; /following Follow Odessa -> following list and 2 feed cards; reload persisted, feed API Slow Tide Ambient and Lamplit Dub Hours; /profile '0 followers / 1 following'; Unfollow; reload empty; /profile '0 following'. 390 (innerWidth 390, scrollWidth 390 on every page): / 9 news, 7 cards, AI note; crate via label link, pressed, owner shown; About; Follow Tomasz -> 2 feed cards; reload persisted; /profile '1 following'; Unfollow; reload; /profile '0 following'. Console for the whole run: only 3 'Failed to load resource: 401', matching the 3 GET /api/auth/me 401s while signed out. No other errors. Two PUT/DELETE 204 entries read 'FAILED: net::ERR_ABORTED' in the network log; server state confirms they succeeded, so this is a CDP artefact for empty bodies. Harness: with the pane hidden, a view transition can stall until a screenshot forces a frame; a click immediately after an SPA navigation missed twice and worked once a screenshot had been taken. 1280 emulation scales coordinates by 0.625, so ref clicks missed there; coordinate clicks
