<title>SHIPYARD // 2026-11-07T06-59-04</title>
<style>
:root{
  --bg:#0b0a08; --panel:#15120d; --panel2:#1d1812;
  --amber:#ffb53d; --amber-dim:#8a6224; --amber-glow:rgba(255,181,61,.25);
  --green:#7ddba0; --red:#ff6b4a; --grey:#6b6354;
  --rule:#3a3024;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  color:var(--amber); font-size:13px; line-height:1.55;
  padding:24px; max-width:1180px; margin:0 auto;
  text-shadow:0 0 1px var(--amber-glow);
}
/* CRT scanlines */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:98;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);
}
a{color:var(--amber)}
.hazard{height:8px;background:repeating-linear-gradient(45deg,var(--amber-dim) 0 10px,#0b0a08 10px 20px);margin:14px 0;opacity:.6}
header{border:2px solid var(--amber-dim);background:var(--panel);padding:14px 16px;position:relative}
header h1{margin:0;font-size:22px;letter-spacing:.42em;font-weight:700}
header h1 small{letter-spacing:.1em;font-size:11px;color:var(--amber-dim);display:block;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{border:1px solid var(--rule);background:var(--panel2);padding:3px 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-dim)}
.chip b{color:var(--amber);font-weight:600}
.verdict{border-width:2px;padding:4px 12px;font-weight:700;letter-spacing:.2em}
.v-shipped{border-color:var(--green);color:var(--green)}
.v-failed{border-color:var(--red);color:var(--red)}
.v-partial,.v-pending{border-color:var(--amber);color:var(--amber)}
section{border:1px solid var(--rule);background:var(--panel);margin:18px 0}
section>h2{
  margin:0;padding:8px 14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  background:var(--panel2);border-bottom:1px solid var(--rule);color:var(--amber-dim);
}
section>.body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.crit{border:1px solid var(--rule);padding:9px 11px;background:var(--panel2)}
.crit .id{font-weight:700;letter-spacing:.14em}
.crit .st{float:right;font-size:11px;letter-spacing:.14em}
.pass{color:var(--green)} .fail{color:var(--red)} .untested{color:var(--grey)}
.crit p{margin:6px 0 0;color:#d9c9a6;font-size:12px}
.bar{height:16px;border:1px solid var(--rule);background:#0c0a07;display:flex;margin-bottom:14px}
.bar i{display:block;height:100%}
.bar i.p{background:var(--green)} .bar i.f{background:var(--red)} .bar i.u{background:#2a2419}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--amber-dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
td.mono{color:#d9c9a6}
.tag{border:1px solid var(--rule);padding:1px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-dim)}
.t-done{border-color:var(--green);color:var(--green)}
.t-blocked{border-color:var(--red);color:var(--red)}
pre{background:#0c0a07;border:1px solid var(--rule);padding:11px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#d9c9a6;font-size:12px;margin:0}
details{border:1px solid var(--rule);background:var(--panel2);margin:7px 0}
details>summary{padding:7px 11px;cursor:pointer;letter-spacing:.14em;font-size:11px;text-transform:uppercase;color:var(--amber-dim)}
details[open]>summary{border-bottom:1px solid var(--rule);color:var(--amber)}
details .inner{padding:11px}
.cycle-head{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.cycle-head h3{margin:0;font-size:13px;letter-spacing:.26em}
.empty{color:var(--grey);font-style:italic}
footer{color:var(--grey);font-size:11px;letter-spacing:.14em;text-align:center;padding:18px 0}
@media print{body::before,body::after{display:none}}

/* ── live telemetry ─────────────────────────────────────── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(420%)}}
@keyframes flicker{0%,100%{opacity:1}97%{opacity:1}98%{opacity:.82}99%{opacity:1}}
header{animation:flicker 7s infinite}
.live{border-color:var(--green)!important;color:var(--green)!important}
.live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;animation:pulse 1.1s infinite;box-shadow:0 0 6px var(--green)}
.scan{position:relative;overflow:hidden;height:3px;background:#0c0a07;border:1px solid var(--rule);border-left:0;border-right:0;margin:0}
.scan i{position:absolute;top:0;left:0;height:100%;width:24%;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 2.4s linear infinite}
/* stage pipeline */
.pipe{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--rule);background:#0c0a07}
.pipe div{flex:1;text-align:center;padding:7px 2px;font-size:10px;letter-spacing:.18em;color:#3b3225;border-right:1px solid var(--rule);position:relative}
.pipe div:last-child{border-right:0}
.pipe div.done{color:var(--amber-dim);background:#140f09}
.pipe div.now{color:#0b0a08;background:var(--amber);font-weight:700;animation:pulse 1.6s infinite}
.tele{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--grey);margin-top:6px}
.pipe div small{display:block;font-size:9px;letter-spacing:.08em;margin-top:2px;opacity:.85}
.nosignal{border-color:var(--red)!important;color:var(--red)!important;animation:pulse 1.6s infinite}
.fast{border-color:var(--green);color:var(--green)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hand{border:1px solid var(--green);background:var(--panel2);padding:9px 11px}
.hand .role{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.hand .role .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.1s infinite}
.hand .who{font-weight:700;margin:4px 0 2px}
.hand .clock{float:right;color:#e8d5ad}
.hand.slow{border-color:var(--amber)}
td.num{text-align:right;white-space:nowrap}
.add{color:var(--green)} .del{color:var(--red)}
.wip{color:var(--green);animation:pulse 1.1s infinite}
</style>

d to the current user. Crate JSON gains ownerId (nullable) and owner username/display name for UI; album JSON unchanged except any needed field is additive.","Existing cookie name frisson_session is reused with a new opaque value; old signed 'admin:' cookies become invalid and users re-login once.","SESSION_SECRET is no longer needed to sign cookies (tokens are opaque and hashed server-side); it may be left documented as deprecated/ignored or removed from docs; compose must not break if it is still passed.","CSRF is mitigated by SameSite=Lax plus all writes being non-GET JSON/multipart; no CSRF token added.","Web routes /signup and /login; /login keeps the ?next= redirect. Router requiresEdit guard becomes: requires sign-in; per-crate edit controls use a canEditCrate(crate) helper (admin or ownerId === user.id).","Web store tests (vitest) are acceptable for UI logic; no browser/E2E tooling exists in the repo."],"risks":["Rewriting open-mode tests is large; sloppy rewrites could weaken coverage of existing album/crate behaviour.","Migration adding owner_id to a populated crates table: SQLite ALTER ADD COLUMN with FK must be nullable/default NULL; drizzle-kit may emit a table rebuild instead, which risks data loss with foreign_keys=ON (albums reference crates ON DELETE restrict). Verify the generated SQL and run the data-survival test.","Account enumeration through timing: unknown email path must still run a scrypt verify against a dummy hash.","Authorization gaps: any route that mutates albums/tracks/covers but looks up the crate indirectly (move album across crates, reorder) could skip the owner check.","Bootstrap ordering: admin creation and NULL-owner backfill must be idempotent and run after migrations, before listening, and not in buildApp for tests unless env is set.","Rate limiter keyed by IP is wrong behind Caddy unless TRUST_PROXY=true; compose already sets it.","Deployed instances that set only ADMIN_PASSWORD (no ADMIN_EMAIL) will have no admin after upgrade and be unable to edit; docs must call this out.","scrypt is CPU/memory heavy: login rate limit and sensible params (N=16384, r=8, p=1, keylen 64) needed to avoid event-loop stalls; use async scrypt."],"acceptanceCriteria":[{"id":"AC1","text":"Repo gates are green.","check":"From /home/claude/crate-digger each exits 0: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build"},{"id":"AC2","text":"A new drizzle-kit generated migration exists, old migrations are untouched, and it creates users and sessions tables and adds crates.owner_id.","check":"ls apps/api/drizzle/*.sql shows exactly 0000_init.sql, 0001_crate_sort_by.sql, 0002_album_spin_count.sql plus one new 0003_*.sql; apps/api/drizzle/meta/_journal.json has 4 entries; the three old .sql files and their snapshots are byte-identical to the base commit (git diff base -- apps/api/drizzle/0000_init.sql apps/api/drizzle/0001_crate_sort_by.sql apps/api/drizzle/0002_album_spin_count.sql is empty); grep -Ei 'CREATE TABLE .users.|CREATE TABLE .sessions.|owner_id' apps/api/drizzle/0003_*.sql matches all three; cd apps/api && npx drizzle-kit generate reports 'No schema changes'."},{"id":"AC3","text":"Existing data survives the migration.","check":"vitest test named 'migration 0003 preserves existing crates, albums and tracks' in apps/api/test/migration.test.ts passes: it applies migrations 0000-0002 to a file DB, inserts rows, applies 0003, and asserts all rows intact and crates.owner_id is NULL. Run: npm test -w apps/api -- migration"},{"id":"AC4","text":"Password hashing uses node:crypto scrypt with salt and constant-time verify, with no new native dependency.","check":"grep -rn \"scrypt\" apps/api/src | grep -q . and grep -rn \"timingSafeEqual\" apps/api/src/services/passwords.ts (or wherever hashing lives) matches; git diff base -- package.json apps/*/package.json packages/*/package.json shows no added dependency named bcrypt, bcryptjs, argon2 or node-gyp-based package; vitest tests 'has e","owner_id","scrypt/password hashing (only sha256 timing compare)","signup/me endpoints","ADMIN_EMAIL","signup page","header user menu","per-route preHandler","request.user"]},"testCommand":"npm run format:check && npm run typecheck && npm run lint && npm test && npm run build"},"ledger":"# Ledger\n\n- 2026-11-07T06:59:04Z preflight: branched shipyard/user-accounts-auth-2026-11-07T06-59-04 from b628a8defcdbc00c7ff1578a963673267c01e4f4. Owner override: merge and push to main when shipped.\n- 2026-11-07T06:59:04Z survey cache invalid (package.json changed since cached commit): full survey, 3 surveyors, dispatched with intake. PROJECT-REPORT.md read: prior run notes npm_config_nodedir=/opt/node22.\n- 2026-11-07T07:02:46Z brief AC1..AC18 accepted (ids unique, all checkable). Survey complete, cache refreshed. Baseline gates green in 44s. manager-1 dispatched.\n- 2026-11-07T07:07:48Z plan validated: 7 tasks, uncovered=[], conflicts=0.\n- 2026-11-07T07:07:48Z dispatched dev-T1.\n- 2026-11-07T07:13:00Z dev-T1 blocker: shared crate schema adds owner fields; web fixtures in library.test.ts and CrateBox.test.ts fail typecheck. Harbormaster grants T1 those two files (later tasks are ordered after T1, so no concurrency conflict). Noted: owner_id FK lacks ON DELETE SET NULL; user deletion out of scope, flag for a later phase.\n- 2026-11-07T07:15:39Z done: T1.\n- 2026-11-07T07:15:39Z dispatched dev-T2.\n- 2026-11-07T07:25:47Z done: T2.\n- 2026-11-07T07:25:47Z harbormaster flags for triage: (a) ADMIN_PASSWORD under 8 chars aborts startup, which could break an existing deploy with a short password; should warn and skip bootstrap instead. (b) logout 400 on empty JSON body; web client must not trip it.\n- 2026-11-07T07:25:47Z dispatched dev-T3, dev-T5, dev-T7.\n- 2026-11-07T07:31:26Z done: T3, T5, T7.\n- 2026-11-07T07:31:26Z T7 left ADR 0003 and the Dockerfile comment stale (not its files); reassigned to T4 (concurrent T6 owns neither). Tree clean; the staged session.ts deletion landed correctly in T5's commit.\n- 2026-11-07T07:31:27Z dispatched dev-T4, dev-T6.\n- 2026-11-07T07:37:12Z done: T4, T6.\n- 2026-11-07T07:37:12Z build complete (7 tasks). T6 added editControls.test.ts outside its list (unowned, accepted). tester-1 dispatched on AC1..AC18.\n- 2026-11-07T07:42:33Z tester-1: 18/18 pass, end-to-end smoke on a base-commit database passes. Tree unchanged. reporter-1 dispatched.\n- 2026-11-07T07:44:09Z verdict shipped. Fast-forward merge to main and push per owner override.\n","reportMd":"# Run report: Frisson 1.0 Phase 1, user accounts and auth\n\n**Verdict: shipped.** All 7 tasks done, 18 of 18 acceptance criteria pass, and the end-to-end smoke test on a database created by the base commit passes. The owner asked for a direct merge and push to main (no PR). This report covers the work on branch `shipyard/user-accounts-auth-2026-11-07T06-59-04`. I have no evidence in the run artifacts that the merge or push has happened, so it is not claimed here.\n\n## What was asked\n\nFrisson 1.0 Phase 1. Replace the single ADMIN_PASSWORD cookie with real user accounts: signup, login, logout, server-side sessions, admin and user roles, and per-crate ownership. Anyone can browse. Signed-in users create crates and edit or delete only their own. Admins edit anything. Out of scope: profiles, social links, favorites, follows, email verification, password reset and OAuth.\n\n## Acceptance criteria\n\n| AC | Criterion | Status |\n|---|---|---|\n| AC1 | Repo gates green (format, lint, typecheck, test, build) | pass |\n| AC2 | Generated migration 0003 only; old migrations untouched | pass |\n| AC3 | Existing data survives the migration | pass |\n| AC4 | scrypt, salt, timingSafeEqual, no new dependency | pass |\n| AC5 | Signup normalises, enforces uniqueness, never returns the hash | pass |\n| AC6 | Login, me, logout, generic failure message | pass |\n| AC7 | Hashed session tokens, 30 day expiry, cookie flags | pass |\n| AC8 | Per-IP rate limit on login and signup | pass |\n| AC9 | Idempotent bootstrap admin and crate backfill | pass |\n| AC10 | Anonymous browse; writes return 401 | pass |\n| AC11 | Owner-only edits (403 for others), admin override | pass |\n| AC12 | Old single-password flow removed | pass |\n| AC13 | Shared zod auth schemas | pass |\n| AC14 | Web signup and login pages, header with Log out | pass |\n| AC15 | Edit controls only where permitted | pass |\n| AC16 | ADMIN_EMAIL documented; data paths unchanged | pass (see note) |\n| AC17 | Parameterized queries, no committed secrets | pass |\n| AC18 | Errors go through HttpError | pass |\n\nNotes from the tester:\n- AC16: the literal Dockerfile grep is not empty. It hits a usage comment that was re-wrapped to add `-e ADMIN_EMAIL`. The volume mount text is identical and no real path moved. Judged pass on the criterion text.\n- AC13: `loginInput` was renamed `credentialsInput` because AC12 forbids the old name.\n\n## What was built (7 task commits)\n\n| Task | Commit | Summary |\n|---|---|---|\n| T1 | cb34d03 | Accounts schema, 0003 migration, scrypt password hashing |\n| T2 | c0ce0fd | Sessions, `/api/auth` routes, rate limiting, bootstrap admin |\n| T3 | c51c28c | Ownership checks on crate writes |\n| T7 | 4ad9025 | Docs and deploy config: ADMIN_EMAIL, upgrade notes, ADR 0004 |\n| T5 | 9b5474f | Web: signup and login pages, session store, header user menu |\n| T6 | be8910a | Web: per-crate edit controls (`canEditCrate`) |\n| T4 | 0a1b027 | Ownership checks on album, track and cover writes; stale ADR 0003 and Dockerfile comment fixed |\n\nNo dependencies were added.\n\n## Test results\n\nFull gate chain `npm run format:check && npm run lint && npm run typecheck && npm test && npm run build` exited 0:\n- API: `Test Files 13 passed (13), Tests 132 passed (132)`\n- Web: `Test Files 16 passed (16), Tests 118 passed (118)`\n- Build: `✓ built in 2.23s`\n- `npx drizzle-kit generate`: \"No schema changes, nothing to migrate\"\n\n**End-to-end smoke on a base-commit database.** The tester ran the base commit b628a8d in open mode and seeded the crate \"Legacy Jazz\" with the album \"Kind of Blue\" and the track \"So What\". It then ran the branch server on the same data directory with ADMIN_EMAIL and ADMIN_PASSWORD set.\n- Startup log: \"Created admin account admin\" and \"Assigned 1 ownerless crate(s) to the admin\".\n- The legacy crate and album survived. The crate now has `ownerId 1` and `ownerUsername 'admin'`.\n- Signup returned 201 with the email normalised to `thom@smoke.test`. Login returned 200 with a cookie of `HttpOnly; SameSite=Lax`, expiring 30 days out.\n- Unknown email and wrong password both returned 401 with identical bodies: `{\"message\":\"Email or password is incorrect\"}`.\n- A regular user got 403 on the admin-owned crate and album. An admin edit of the user's crate returned 200.\n- After logout (204) the old cookie returned 401.\n- An anonymous `POST /api/crates` returned 401 \"Sign in to make changes\". `POST /api/session` returned 404.\n\n## What went wrong and why\n\n- **T1 blocker.** Adding owner fields to the shared crate schema broke typechecking of the web test fixtures in `library.test.ts` and `CrateBox.test.ts`, which were outside T1's file list. Resolved by granting T1 those two files. Later tasks were ordered after T1, so there was no concurrency conflict.\n- **Stale docs.** T7 left ADR 0003 and the Dockerfile comment describing the old model, because they were not its files. Both were reassigned to T4 and fixed there.\n- **Minor.** T7's first commit briefly included another dev's staged deletion. It was recommitted with only T7's paths, and the deletion landed correctly in T5's commit. T6 added `editControls.test.ts` outside its file list; accepted.\n- **FK action missing.** The schema declares `owner_id` with ON DELETE SET NULL, but drizzle-kit's SQLite `ALTER TABLE ADD` emitted `REFERENCES users(id)` with no action. The migrated database reports `NO ACTION`. The SQL was not hand-edited, per the rules.\n\n## Before you deploy\n\n1. **Add `ADMIN_EMAIL` to the VPS `.env`.** Compose refuses to start without it.\n2. **`ADMIN_PASSWORD` must be 8 or more characters.** A shorter one makes the app exit at startup. Check any existing short password first.\n3. **Everyone is signed out once.** Old signed cookies are invalid, so everyone logs in again.\n4. **Set `TRUST_PROXY` behind Caddy.** Without it, the per-IP rate limits key on the proxy's address.\n5. **Existing crates are handed to the admin on first start.** Only admins can edit them until reassigned. Data paths and the `crate-data` volume are unchanged.\n\n## Known limits\n\n- `owner_id` has no ON DELETE SET NULL in the real database. Fix it with a later migration that rebuilds `crates` before any user-deletion feature, or deleting an owner will fail with an FK error.\n- Crate reorder is effectively admin-only. A non-admin can reorder only when they own every crate on the shelf.\n- Spins now need edit permission. They are no longer open to anyone.\n\n## Next\n\nPhase 2: profiles and social links.\n","cycles":[{"n":"1","spec":"# Cycle 1 spec: user accounts and per-crate ownership (Frisson 1.0, phase 1)\n\n## What we are building\n\nToday Frisson has one shared `ADMIN_PASSWORD`. `plugins/auth.ts` signs an `admin:\u003cts>` cookie, a global `onRequest` hook blocks writes under `/api/` unless that cookie is present, and three modes (open, read-only, login) decide who may edit. `routes/session.ts` is the whole login API. README's \"Who can edit\" table and ADR 0001 (\"single-user collection\") describe that model.\n\nThis cycle replaces it with real accounts. There is a `users` table with scrypt hashes and a `sessions` table that holds only the sha256 of an opaque random token. The routes are `/api/auth/{signup,login,logout,me}`. Each crate gets an `owner_id`. Anyone can browse. You need a session to write (401 without one). A user may change only crates they own, plus the albums, tracks and covers inside them (403 otherwise). Admins may change anything. On startup the first admin is created from `ADMIN_EMAIL` + `ADMIN_PASSWORD`, so `ADMIN_PASSWORD` still means \"the admin password\". The web gets Sign up and Log in pages, a header user menu with Log out, and edit controls only where `canEditCrate(user, crate)` is true. The old modes, the cookie format, `checkPassword`/`logIn`/`logOut`, `/api/session` and the password-only LoginView are deleted, not kept alongside.\n\n## Key decisions\n\n- **Contract first.** T1 adds `publicUser`, `signupInput`, `credentialsInput` and the crate owner fields (`ownerId`, `ownerUsername`, `ownerDisplayName`) to `@frisson/shared`, following its `xInput` naming. The login schema is deliberately not called `loginInput`: AC12 bans that identifier. The old `sessionInfo`/`loginInput` stay until T5 removes the last web consumer, so every task leaves the gates green.\n- **Migration safety.** `0003_accounts.sql` comes from drizzle-kit and is never hand-edited. If drizzle-kit rebuilds `crates` to add the FK column, that rebuild clashes with `foreign_keys=ON` (albums reference crates with restrict). The fix goes in app code: `createDb` turns FKs off around `migrate()` and then runs `foreign_key_check`. `migration.test.ts` proves the data survives by applying 0000-0002 to a file DB, inserting rows, then letting `createDb` apply 0003.\n- **Backfill in code.** `bootstrapAdmin` runs from `server.ts`, not `buildApp`, so tests stay hermetic. It does nothing without both env vars and never resets an existing admin's password. On every start it assigns NULL-owner crates to the admin. NULL owner means only admins can edit.\n- **Auth plumbing.** `authPlugin` is registered after `dbPlugin` and sets `request.user`. Authorization goes through one module, `services/permissions.ts` (`requireUser`, `canEditOwner`, `assertCanEditCrate`, `assertCanEditAlbum`), which throws literal `HttpError(401/403)`. Routes pass `request.user` into it, and services never touch `reply`. Album moves check both the source and the target crate. Crate reorder needs every id to be editable. Spins count as a write.\n- **Security.** scrypt (N=16384, r=8, p=1, 64-byte key, 16-byte random salt) runs async with `timingSafeEqual`. An unknown email still runs a dummy verify, and both failure cases return the same 401 body. Sessions last 30 days. The cookie keeps the name `frisson_session`, unsigned and opaque, with httpOnly, SameSite=Lax, and Secure in production. Logout deletes the row. `@fastify/rate-limit` (already installed) is scoped to signup and login, keyed per IP (with `TRUST_PROXY` behind Caddy), 10 per 15 min by default, and tests can configure it via `AppOptions.auth.rateLimit`. No new dependencies.\n- **Test churn ownership.** T2 owns `test/helpers.ts` (`signUp`, `createAdmin`, `addCrate(..., ownerId)`, configurable `buildTestApp`) and deletes the old `auth.test.ts`. After T2, writes are temporarily unguarded, so the untouched tests stay green. T3 guards crates and rewrites `crates.test.ts` (including its album writes) to sign in. T4 does the same for albums, covers and their tests. `ownership.test.ts` is started by T3 and finished by T4, in sequence.\n- **Web.** `api/auth.ts` replaces `api/session.ts`. The session store exposes `user`, `signedIn`, `isAdmin`, `load`, `logIn`, `signUp` and `logOut`. `utils/permissions.ts` has `canEditCrate`. The router meta becomes `requiresAuth` and there is a new `/signup` route. `/login` keeps `?next=`. T5 leaves a temporary `canEdit` alias so the views compile. T6 switches the views to `canEditCrate` and deletes the alias.\n\n## Task graph\n\nT1 → T2 → {T3 → T4, T5 → T6, T7}. At most 3 tasks run at once, and no two unordered tasks share a file.\n\n## Out of scope\n\nProfiles, favorites, likes, follows, feed, B-Side, email verification, password reset, OAuth, user deletion, CSRF tokens.\n\n## Flagged for owner\n\nSpins need edit permission. Duplicate signups return 409, which reveals that an account exists. Compose now requires `ADMIN_EMAIL`. Upgraded deploys without it have no admin, and their legacy crates stay locked. Everyone logs in again once after the upgrade.\n","plan":{"cycle":1,"tasks":[{"id":"T1","title":"Foundation: shared auth contract, DB schema + 0003 migration, password hashing","description":"Lay the contracts every other task builds on. (1) packages/shared/src/index.ts: add a new '── Accounts ──' section with USER_ROLES ['user','admin'], publicUser {id, email, username, displayName, role} (NO password field of any kind), signupInput {email: trimmed+lower-cased email, username: trimmed+lower-cased 3-32 of [a-z0-9_-], displayName optional 1-60 (defaults to username server-side), password string min(8,'At least 8 characters') max(200)} built with z.object (unknown keys such as role are stripped), credentialsInput {email trimmed+lower-cased, password min(1) max(200)} (do NOT name it loginInput; that name is banned by AC12), and types PublicUser/SignupInput/CredentialsInput. Extend the crate schema with ownerId: number|null, ownerUsername: string|null, ownerDisplayName: string|null. Do NOT remove sessionInfo/loginInput/SessionInfo yet (T5 removes them once the web stops importing them). (2) apps/api/src/db/schema.ts: users table (id pk autoinc, email text notNull unique, username text notNull unique, display_name text notNull, password_hash text notNull, role text enum USER_ROLES notNull default 'user', created_at integer timestamp default unixepoch like other tables); sessions table (id text pk = sha256 hex of the token, user_id integer notNull references users.id onDelete cascade, created_at, expires_at integer timestamp notNull, index on user_id); crates.owner_id integer nullable references users.id onDelete 'set null'; relations. (3) Generate the migration with `npm run db:generate -w apps/api -- --name accounts` (drizzle-kit). Never edit 0000-0002 or their snapshots, and never hand-edit the generated 0003 SQL. Inspect the SQL: if drizzle-kit emitted a crates table rebuild (__new_crates, DROP TABLE), the rebuild will fail or cascade with foreign_keys=ON because albums reference crates; fix this in app code in apps/api/src/db/client.ts by switching `foreign_keys = OFF` before migrate() and back ON after, followed by `PRAGMA foreign_key_check` that throws if it returns rows. Re-run `cd apps/api && npx drizzle-kit generate` and confirm 'No schema changes'. (4) apps/api/src/services/crates.ts: only change the select (crateColumns) to also return ownerId and the owner's username/displayName via LEFT JOIN users (group by still crates.id), so crate responses satisfy the new shared schema. No authorization logic here (T3 owns that). (5) apps/api/src/services/passwords.ts: async hashPassword(plain) using node:crypto scrypt (promisified, N=16384 r=8 p=1 keylen 64, maxmem sized accordingly) with a 16-byte crypto.randomBytes salt per call, stored as 'scrypt$\u003csaltB64>$\u003chashB64>' (or similar self-describing format); throws new HttpError(400, ...) for passwords under 8 chars; async verifyPassword(plain, stored) using timingSafeEqual (length-checked) and returning false on malformed input; export verifyAgainstDummy(plain) (or a DUMMY_HASH constant) so login can spend the same scrypt time for unknown emails. No new dependencies. (6) Tests: apps/api/test/migration.test.ts with test 'migration 0003 preserves existing crates, albums and tracks': copy 0000-0002 SQL + a 3-entry _journal.json into a temp migrations folder, migrate a temp FILE db with it (better-sqlite3 + drizzle migrate, foreign_keys ON), insert crates/albums/tracks rows with raw bound statements, close, then open the same file with createDb(path) (full migrations) and assert every row/column intact, crates.owner_id NULL, users and sessions tables exist. apps/api/test/passwords.test.ts with exactly 'hashes with a random salt (same password gives different hashes)', 'verifies the right password and rejects a wrong one', 'rejects passwords shorter than 8 characters'. apps/api/test/shared-auth.test.ts with 'signupInput rejects short passwords' plus normalisation/role-stripping cases. Update apps/api/test/schema.test.ts only if it enumerates tables. All gates green before committing.","criteria":["AC1","AC2","AC3","AC4","AC13","AC17"],"files":["packages/shared/src/index.ts","apps/api/src/db/schema.ts","apps/api/src/db/client.ts","apps/api/drizzle/0003_accounts.sql","apps/api/drizzle/meta/_journal.json","apps/api/drizzle/meta/0003_snapshot.json","apps/api/src/services/crates.ts","apps/api/src/services/passwords.ts","apps/api/test/migration.test.ts","apps/api/test/passwords.test.ts","apps/api/test/shared-auth.test.ts","apps/api/test/schema.test.ts","apps/web/src/stores/library.test.ts","apps/web/src/components/crate/CrateBox.test.ts"],"dependsOn":[]},{"id":"T2","title":"API auth core: users/sessions services, auth plugin, /api/auth routes, bootstrap admin, test helpers","description":"Replace the single-password auth with accounts. (1) apps/api/src/services/users.ts: createUser(db, input, role='user') (hashes via passwords.ts, displayName defaults to username, maps UNIQUE violations or pre-checks to new HttpError(409, 'Email already registered' / 'Username taken')), findUserByEmail, getUserById, toPublicUser (never includes passwordHash). (2) apps/api/src/services/sessions.ts: SESSION_TTL_MS = 30 days; createSession(db, userId) -> {token, expiresAt} with token = crypto.randomBytes(32).toString('base64url') and only sha256(token) hex stored as sessions.id; findSessionUser(db, token) returning PublicUser|null (rejects and deletes expired rows); deleteSession(db, token). (3) apps/api/src/services/permissions.ts (consumed by T3/T4, so get the signatures right): requireUser(user: PublicUser|null): PublicUser throws new HttpError(401, 'Sign in to make changes'); canEditOwner(user, ownerId: number|null): boolean (admin always; otherwise ownerId !== null && ownerId === user.id); assertCanEditCrate(db, user, crateId): requires user, 404 via notFound if crate missing, new HttpError(403, ...) if not permitted; assertCanEditAlbum(db, user, albumId): looks up the album's crate then same rules; returns the user. Literal `new HttpError(401|403|409|429...)` calls must appear (AC18 greps for them). (4) apps/api/src/plugins/auth.ts: rewrite. Options {production?: boolean}. Must be registered AFTER dbPlugin (needs app.db). Keeps SESSION_COOKIE = 'frisson_session'; decorateRequest('user', null) typed PublicUser|null via module augmentation; an onRequest hook reads the cookie (plain, unsigned) and sets request.user via findSessionUser; decorates helpers to set the cookie (httpOnly, sameSite 'lax', path '/', secure only when production, expires = session expiry) and clear it. Remove the global write gate, the open/read-only/login modes, checkPassword/logIn/logOut, the 'admin:' signed cookie and SESSION_SECRET usage. Writes become unguarded until T3/T4 add per-route checks; that is expected for this task. Do not use identifiers adminPassword, canLogIn, checkPassword, loginInput anywhere. (5) apps/api/src/routes/auth.ts: authRoutes under prefix /api: POST /auth/signup (body signupInput, response publicUser, 201, sets cookie), POST /auth/login (body credentialsInput; unknown email still runs a dummy scrypt verify; both failure paths throw the identical new HttpError(401, 'Email or password is incorrect')), POST /auth/logout (deletes the session row, clears cookie, 204; fine when signed out), GET /auth/me (publicUser or new HttpError(401, ...)). Register @fastify/rate-limit inside this plugin (global: false) and apply config.rateLimit to signup and login only, keyed by IP, max/timeWindow from plugin options (default 10 per 15 minutes); the 429 must reach the client through the error handler (use errorResponseBuilder returning new HttpError(429, ...) or let the error-handler map it; no reply.code(...).send in this file). (6) Delete apps/api/src/routes/session.ts and apps/api/test/auth.test.ts. (7) apps/api/src/app.ts: AppOptions.auth becomes {production?: boolean; rateLimit?: {max: number; timeWindow: number}}; register errorHandler, db, auth (production from NODE_ENV unless overridden), covers, health, authRoutes, crates, albums, covers, web. No ADMIN_PASSWORD/SESSION_SECRET reading in buildApp. (8) apps/api/src/services/bootstrap.ts: bootstrapAdmin(db, {email, password}, log?) : if either is missing log a warning and skip creation; if no user with role 'admin' exists, create one with username 'admin' (suffix -2, -3... if taken), displayName 'Admin', role 'admin'; never change an existing admin's password; then assign every crate with owner_id NULL to the earliest admin (runs every startup, idempotent). Export bootstrapFromEnv(db, env = process.env, log) reading ADMIN_EMAIL/ADMIN_PASSWORD. apps/api/src/server.ts awaits bootstrapFromEnv(app.db, process.env, app.log) after buildApp and before listen. (9) apps/api/test/helpers.ts (owned here; T3/T4 depend on it): buildTestApp(opts?) passes auth {production:false, rateLimit: generous default} and accepts overrides; signUp(app, overrides?) -> {user, cookie, headers} using unique email/username per call; createAdmin(app) -> same (insert via createUser with role admin + createSession); addCrate(app, name, sortOrder, ownerId?: number|null) keeps its old positional signature. Keep multipart helper. (10) Tests: apps/api/test/auth-accounts.test.ts with every test name listed in AC5, AC6, AC7, AC8 verbatim (rate-limit tests build an app with a small max, e.g. 3). apps/api/test/bootstrap.test.ts with every name in AC9 verbatim ('bootstrap admin can log in with ADMIN_PASSWORD' calls bootstrapAdmin then POST /api/auth/login). Existing crates/albums/covers/web/health tests must still pass unchanged (they still run with open writes at this point).","criteria":["AC1","AC5","AC6","AC7","AC8","AC9","AC12","AC17","AC18"],"files":["apps/api/src/services/users.ts","apps/api/src/services/sessions.ts","apps/api/src/services/permissions.ts","apps/api/src/services/bootstrap.ts","apps/api/src/plugins/auth.ts","apps/api/src/plugins/error-handler.ts","apps/api/src/routes/auth.ts","apps/api/src/routes/session.ts","apps/api/src/app.ts","apps/api/src/server.ts","apps/api/test/helpers.ts","apps/api/test/auth.test.ts","apps/api/test/auth-accounts.test.ts","apps/api/test/bootstrap.test.ts"],"dependsOn":["T1"]},{"id":"T3","title":"Crate ownership: guard crate routes, set owner on create, start ownership.test.ts","description":"Using services/permissions.ts from T2: POST /api/crates requires a user (401) and sets owner_id = user.id; PATCH /crates/:id and DELETE /crates/:id call assertCanEditCrate (401/403/404); PUT /api/crates/order requires a user and, unless admin, every crate in the list must be owned by them (any unowned/other-owned id -> new HttpError(403, ...)). Pass request.user from routes into services; services take the user as a parameter and never touch reply. Keep the DB queries in the Drizzle builder (no sql.raw). Rewrite apps/api/test/crates.test.ts so every write signs in via helpers.signUp and uses crates owned by that user (addCrate(app, name, order, user.id)); this includes the album writes in that file (POST /api/albums, PATCH position): send the same cookie so they keep passing after T4 adds album checks. Keep every existing assertion's intent; do not weaken coverage. Create apps/api/test/ownership.test.ts with describe blocks for crates containing these AC10/AC11 tests verbatim: 'anonymous can GET crates, crate, albums and album', 'anonymous POST /api/crates returns 401', 'anonymous PATCH crate returns 401', 'anonymous DELETE crate returns 401', 'anonymous PUT /api/crates/order returns 401', 'creating a crate sets ownerId to the current user', 'owner can patch and delete own crate', 'non-owner gets 403 patching another user's crate', 'non-owner gets 403 deleting another user's crate', 'non-owner gets 403 reordering crates they do not own', 'ownerless crate is editable only by admin' (crate part; T4 may extend), and a crate-only portion of 'admin can edit and delete any user's crate and album' is left for T4 to write in full. Do not touch albums/covers routes, services or tests (T4) or packages/shared (T5).","criteria":["AC1","AC10","AC11","AC17","AC18"],"files":["apps/api/src/routes/crates.ts","apps/api/src/services/crates.ts","apps/api/test/crates.test.ts","apps/api/test/ownership.test.ts"],"dependsOn":["T2"]},{"id":"T4","title":"Album, track and cover ownership; finish ownership.test.ts","description":"Guard every album/track/cover write with services/permissions.ts: POST /api/albums -> assertCanEditCrate(target crateId); PATCH /albums/:id and PUT /albums/:id/tracks and DELETE /albums/:id -> assertCanEditAlbum; when a PATCH or move/position request changes crateId, also assertCanEditCrate on the TARGET crate (and the source via the album); album reorder/position -> assertCanEditAlbum (and target crate); POST /albums/:id/spins requires a session and edit permission like the rest; POST/DELETE /albums/:id/cover -> assertCanEditAlbum. Anonymous gets 401 (check before 404 lookups are fine either way, but anonymous must never get 200). Rewrite apps/api/test/albums.test.ts and apps/api/test/covers.test.ts to sign in via helpers.signUp and use crates owned by that user; keep every existing assertion's intent. Append to apps/api/test/ownership.test.ts (created by T3; keep its tests) these verbatim: 'anonymous POST/PATCH/DELETE album returns 401', 'anonymous cover upload and delete return 401', 'non-owner gets 403 adding an album to another user's crate', 'non-owner gets 403 patching and deleting an album in another user's crate', 'non-owner gets 403 moving an album into someone else's crate', 'non-owner gets 403 on cover upload for another user's album', 'owner can add, edit and delete albums and tracks in own crate', 'admin can edit and delete any user's crate and album', and extend 'ownerless crate is editable only by admin' to cover albums if useful. Do not touch crates routes/services or packages/shared. Also (harbormaster): update ADR 0003 to note it is superseded by ADR 0004, and the Dockerfile usage comment for ADMIN_EMAIL + an 8+ char ADMIN_PASSWORD.","criteria":["AC1","AC10","AC11","AC17","AC18"],"files":["apps/api/src/routes/albums.ts","apps/api/src/services/albums.ts","apps/api/src/routes/covers.ts","apps/api/src/services/covers.ts","apps/api/test/albums.test.ts","apps/api/test/covers.test.ts","apps/api/test/ownership.test.ts","docs/adr/0003-deployment.md","Dockerfile"],"dependsOn":["T3"]},{"id":"T5","title":"Web accounts core: auth API client, session store, permissions helper, Sign up / Log in pages, router, header user menu","description":"(1) Replace apps/web/src/api/session.ts with apps/web/src/api/auth.ts: me() GET /api/auth/me (treat 401 as signed out -> null), signUp(input) POST /api/auth/signup, logIn(credentials) POST /api/auth/login, logOut() POST /api/auth/logout; delete api/session.ts. (2) apps/web/src/stores/session.ts: setup store with user ref (PublicUser|null), loaded flag, signedIn and isAdmin computeds, load(), logIn(email,password), signUp(input), logOut(). Keep a TEMPORARY `canEdit = computed(() => signedIn.value)` export so existing views still typecheck; T6 removes it and all its uses. Remove canLogIn and the password-only logIn. (3) apps/web/src/utils/permissions.ts: canEditCrate(user: PublicUser|null, crate: {ownerId: number|null}|null|undefined): boolean (admin -> true incl. ownerless; owner -> true; else false). Tests: apps/web/src/stores/session.test.ts with 'session store loads the current user, logs in, signs up and logs out' (mock the api module with vi.mock) and apps/web/src/utils/permissions.test.ts with exactly 'canEditCrate is false when signed out', 'canEditCrate is true for the owner', 'canEditCrate is false for another user', 'canEditCrate is true for admin on any crate', 'canEditCrate is true for admin on ownerless crate and false for a user'. (4) apps/web/src/views/LoginView.vue: email (type=\"email\") + password form using session.logIn, keeps ?next= via safeRedirect, generic error display via errorMessage, link to /signup; remove 'Staff only' copy. New apps/web/src/views/SignupView.vue: email, username (hint: 3-32 lower-case letters, digits, - or _), optional display name, password (min 8) with client-side check via signupInput.safeParse, shows 409/400 messages, signs in and redirects to next or library. Match LoginView's existing styling. (5) apps/web/src/router.ts: add { path: '/signup', name: 'signup', props next } route; rename meta requiresEdit to requiresAuth; beforeEach loads the session and redirects signed-out users to login?next=. (6) apps/web/src/App.vue: header user menu in the masthead: signed out -> 'Log in' and 'Sign up' links; signed in -> display name/username and a 'Log out' button (after logout, leave requiresAuth routes); remove the footer 'Staff log in' link. (7) packages/shared/src/index.ts: delete sessionInfo, loginInput and SessionInfo (the old contract) once nothing imports them; nothing else in shared changes. Do not edit LibraryView, CrateView, AlbumView, CratesView, AlbumEditorView or components (T6).","criteria":["AC1","AC12","AC13","AC14","AC15"],"files":["apps/web/src/api/auth.ts","apps/web/src/api/session.ts","apps/web/src/stores/session.ts","apps/web/src/stores/session.test.ts","apps/web/src/utils/permissions.ts","apps/web/src/utils/permissions.test.ts","apps/web/src/views/LoginView.vue","apps/web/src/views/SignupView.vue","apps/web/src/router.ts","apps/web/src/App.vue","packages/shared/src/index.ts"],"dependsOn":["T2"]},{"id":"T6","title":"Web per-crate edit controls","description":"Replace every session.canEdit use with canEditCrate(session.user, crate) where a specific crate is in play, and session.signedIn where the action is global (create crate, add album: only offer crates the user can edit in the album form's crate picker). Sites (from the codebase map): components/LibraryToolbar.vue L15, components/crate
