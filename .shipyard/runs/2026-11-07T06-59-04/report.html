docs/adr/0003-deployment.md","Dockerfile"],"filesDeleted":[],"gates":{"npm run format:check (root)":0,"npm run typecheck (root)":0,"npm run lint (root)":0,"npm test (root)":0,"npm run build (root)":0},"criteriaSelfCheck":{"AC1":"All five root gates exit 0 at commit time (api: 132 tests). First format:check run flagged apps/web/src/views/editControls.test.ts (other dev's file); it passed on re-run after their commit be8910a. Not touched by me.","AC10":"'anonymous POST/PATCH/DELETE album returns 401' (also covers position, tracks, spins) and 'anonymous cover upload and delete return 401' pass, alongside T3's crate 401 tests.","AC11":"All album/cover tests named in AC11 pass verbatim; T3's crate-part admin test replaced by \"admin can edit and delete any user's crate and album\"; 'ownerless crate is editable only by admin' extended to albums (user 403 on PATCH and POST, admin 200).","AC17":"Album/cover changes only call permissions.ts (Drizzle builders); the AC17 SQL grep returns nothing. The password git grep DOES match apps/web/src/stores/session.test.ts lines 47 and 62 (test fixtures in a web test, outside my files; the exemption only names apps/api/test). Tester/owner should decide.","AC18":"Errors via permissions.ts HttpError(401/403) and notFound/badRequest; routes never set error codes."},"dependenciesAdded":[],"findings":["Service signatures changed: createAlbum(db, user, input), updateAlbum(db, user, id, input), moveAlbum(db, user, id, input), addSpin(db, user, id), deleteAlbum(db, user, id), replaceTracks(db, user, id, tracks), setCover(db, coversDir, user, id, upload), removeCover(db, coversDir, user, id). No other callers.","Check order keeps old status codes: create = 401, 400 missing crate, 403. Move/patch with crateId = 401, 404 missing album, 403 source, 400 missing target, 403 target. Target crate checked only when crateId changes.","POST /albums/:id/cover checks permission in the route before reading the multipart body, so anonymous/non-owner uploads are refused without buffering the file; setCover checks again.","Spins now need edit permission (as planned): anonymous visitors can no longer count plays. Web must only call spins for editable albums or ignore 401/403.","Schema validation still runs before services, so an anonymous request with an invalid body gets 400, not 401."]},{"id":"T5","status":"done-pending-test","committed":true,"commit":"9b5474f","filesChanged":["apps/web/src/api/auth.ts","apps/web/src/stores/session.ts","apps/web/src/stores/session.test.ts","apps/web/src/utils/permissions.ts","apps/web/src/utils/permissions.test.ts","apps/web/src/views/LoginView.vue","apps/web/src/views/SignupView.vue","apps/web/src/router.ts","apps/web/src/App.vue","packages/shared/src/index.ts"],"filesDeleted":["apps/web/src/api/session.ts"],"gates":{"typecheck -w apps/web":0,"test -w apps/web":0,"build -w apps/web":0,"eslint apps/web packages/shared":0,"prettier --check apps/web packages/shared":0,"npm run typecheck (all workspaces)":0},"criteriaSelfCheck":{"AC1":"web/shared gates above exit 0 (web 110 tests); full repo test/build not run by me (other devs editing in parallel)","AC12":"grep returns no matches in apps or packages","AC13":"sessionInfo/loginInput/SessionInfo removed; signupInput, publicUser unchanged from T1","AC14":"SignupView/LoginView exist; signup route; 'Log out' in App.vue; type=\"email\" in LoginView; named store test passes","AC15":"PARTIAL by design: the 5 canEditCrate tests pass; view/component use of canEditCrate and removal of session.canEdit are T6 (temporary canEdit computed kept in store)"},"dependenciesAdded":[],"findings":["logOut sends POST /api/auth/logout with no body, so request() adds no JSON content-type (avoids T2's 400).","beforeEach now awaits session.load() on every navigation (one /api/auth/me per app load, cached).","Header user menu hides until the first load settles (success or failure) to avoid a flash of Log in links.","T6 must remove the temporary canEdit computed in stores/session.ts and its uses in LibraryView, CrateView, AlbumView, LibraryToolbar, EmptyShelf."]},{"id":"T6","status":"done-pending-test","committed":true,"commit":"be8910a","filesChanged":["apps/web/src/components/LibraryToolbar.vue","apps/web/src/components/crate/EmptyShelf.vue","apps/web/src/stores/session.ts","apps/web/src/views/AlbumEditorView.vue","apps/web/src/views/AlbumView.vue","apps/web/src/views/CrateView.vue","apps/web/src/views/CratesView.vue","apps/web/src/views/LibraryView.vue"],"filesAdded":["apps/web/src/views/editControls.test.ts"],"filesUntouched":["apps/web/src/components/crate/CrateBox.vue","apps/web/src/components/crate/CrateBox.test.ts","apps/web/src/components/crate/CrateSettings.vue","apps/web/src/components/forms/AlbumForm.vue"],"gates":{"typecheck -w apps/web":0,"test -w apps/web":0,"build -w apps/web":0,"eslint apps/web":0,"prettier --check apps/web":0},"criteriaSelfCheck":{"AC1":"web gates above exit 0 (16 files, 118 tests); full repo gates not run (apps/api being edited in parallel)","AC15":"5 named canEditCrate tests pass (T5); canEditCrate appears in CrateView, AlbumView, LibraryView (plus CratesView, AlbumEditorView); grep for session.canEdit / .canEdit returns nothing"},"dependenciesAdded":[],"findings":["editControls.test.ts is a new file outside the owned list (no other task owns it); 8 view tests mounting real views behind a memory router with stubbed fetch.","CratesView lists only editable crates; reorder buttons and move() only for admins.","AlbumEditorView: edit route redirects (router.replace) to the album page when the album's crate is not editable; new route ignores a crateId the user cannot edit and falls back to their first crate; empty state now links to the crates page instead of the obsolete db:seed / M8 note.","LibraryView: drag, drop highlight/drop, arrows and Move-to need both source and target crates editable; Move-to lists only editable crates.","CrateView only passes addToCrateId to the toolbar when the selected crate is editable; spins are counted only for records in editable crates (the API spin endpoint itself is unguarded).","AlbumForm, CrateSettings, CrateBox needed no changes: the parent passes the filtered crate list."]},{"id":"T7","status":"done-pending-test","committed":true,"commit":"9b5474f","filesChanged":[".env.example","compose.yaml","docs/DEPLOY.md","README.md","docs/SPEC.md","docs/adr/0004-user-accounts.md",".github/workflows/ci.yml"],"dependenciesAdded":[],"checks":{"prettierCheckOwnFiles":0,"npmRunFormatCheck":0,"yamlParses":true,"composeConfigFailsWithoutAdminEmail":true,"composeConfigOkWithBoth":true},"criteriaSelfCheck":{"AC1":"format:check exits 0; lint/typecheck/test/build not run by T7 (docs-only; other devs' work in progress in the tree)","AC16":"ADMIN_EMAIL matches in .env.example, compose.yaml, docs/DEPLOY.md, README.md; ADMIN_PASSWORD still matches in all three; crate-data: and crate.db unchanged; Dockerfile and docker/ untouched","AC17":"no source code touched by T7"},"findings":["CI smoke password changed from ci-only (7 chars) to ci-only-password: with ADMIN_EMAIL set, bootstrap rejects passwords under 8 and the app exits.","compose.yaml no longer passes SESSION_SECRET; existing .env files that set it still work (value is just unused).","docs/adr/0003-deployment.md 'Fail closed' bullet and the Dockerfile usage comment (-e ADMIN_PASSWORD only) still describe the old model; not owned by T7. ADR 0004 marks the relevant 0003 parts as superseded.","There is no in-app password change; DEPLOY.md says so and drops the old 'Change the admin password' row.","First commit attempt accidentally swept in apps/web/src/api/session.ts deletion that another dev had staged; soft-reset and recommitted with only T7 paths. That deletion is still staged for its owner."]}]}],"agents":[{"id":"dev-T1","body":"# DEV report: T1 (foundation: auth contract, schema, 0003 migration, password hashing)\n\n## Status: committed (cb34d03), awaiting tester\n\nThe earlier blocker is resolved. Harbormaster gave T1 `apps/web/src/stores/library.test.ts` and `apps/web/src/components/crate/CrateBox.test.ts`. I added `ownerId: null, ownerUsername: null, ownerDisplayName: null` to their 3 `Crate` fixtures and changed nothing else in them.\n\nGates (all exit 0): format:check, lint, typecheck, test (api 94, web 102), build.\n\nEarlier blocker, kept for the record: the typecheck failed in those 3 fixtures because the crate schema now requires the owner fields.\n\n## What changed\n\n- `packages/shared/src/index.ts`: new Accounts section with `USER_ROLES`, `publicUser` (no password field), `signupInput` and `credentialsInput`, plus the types `UserRole`, `PublicUser`, `SignupInput` and `CredentialsInput`.\n  - `signupInput`: email is trimmed, lower-cased and checked with `z.email`, max 254. Username is trimmed, lower-cased, 3-32 characters of `[a-z0-9_-]`. `displayName` is optional, trimmed, 1-60. Password is min(8, 'At least 8 characters') and max(200).\n  - `credentialsInput`: password min(1) and max(200).\n  - Both are plain `z.object`, so unknown keys such as `role` are stripped.\n  - The crate schema gains the three owner fields. `sessionInfo`, `loginInput` and `SessionInfo` are kept.\n- `apps/api/src/db/schema.ts`:\n  - `users` table: unique email and username, `display_name`, `password_hash`, a `role` enum defaulting to 'user', and `created_at`.\n  - `sessions` table: text pk (sha256 hex), `user_id` FK with cascade, `created_at`, `expires_at`, and the index `sessions_user_id_idx`.\n  - `crates.owner_id` FK to users with set null.\n  - New relations and inferred types. Data-classification comments added.\n- `apps/api/drizzle/0003_accounts.sql`, `meta/0003_snapshot.json` and `meta/_journal.json`: generated by `npm run db:generate -w apps/api -- --name accounts`. The SQL was not edited. The two JSON files were run through Prettier, which format:check requires, as it did for the earlier snapshots. A second `npx drizzle-kit generate` reports \"No schema changes\".\n- `apps/api/src/services/crates.ts`: `crateColumns` adds `ownerId`, `ownerUsername` and `ownerDisplayName` via a LEFT JOIN on users in `listCrates` and `getCrate`. It still groups by crates.id. No authorization logic.\n- `apps/api/src/services/passwords.ts`: uses node:crypto `scrypt` (async, N=16384 r=8 p=1, 64-byte key, maxmem 32 MiB) with a fresh 16-byte salt per hash.\n  - Hash format: `scrypt$N$r$p$saltB64$hashB64`.\n  - `hashPassword` throws `HttpError(400)` for passwords under 8 characters.\n  - `verifyPassword` parses strictly and returns false on malformed input: wrong prefix or part count, empty parts, N not a power of two, or out-of-range parameters. It compares with a length check plus `timingSafeEqual`.\n  - `verifyAgainstDummy(plain)` checks against a lazily created random hash and always resolves false.\n- Tests:\n  - `test/migration.test.ts`: 'migration 0003 preserves existing crates, albums and tracks'. It migrates a temp file DB with only 0000-0002 (3-entry journal, FKs ON) and inserts rows with bound statements. It then opens the DB with `createDb(path)` and asserts every row and column is unchanged, `owner_id` is NULL, users and sessions exist, `foreign_key_check` is empty, and the owner FK targets users.\n  - `test/passwords.test.ts`: the 3 named tests, plus malformed-hash and dummy-verify tests.\n  - `test/shared-auth.test.ts`: 'signupInput rejects short passwords', plus tests for normalisation, role stripping, username and displayName rules, credentialsInput, and publicUser dropping password fields.\n\n## Not changed\n\n- `apps/api/src/db/client.ts`: drizzle-kit used `ALTER TABLE ... ADD` and did not rebuild crates, so turning foreign keys off around migrate() was not needed. The migration test passes with foreign_keys ON.\n- `apps/api/test/schema.test.ts`: it does not list tables.\n\n## Finding for the owner and tester\n\ndrizzle-kit's ALTER does not carry the FK action: `ALTER TABLE crates ADD owner_id integer REFERENCES users(id);` has no `ON DELETE SET NULL`. In real databases the FK is therefore NO ACTION, while schema.ts and the snapshot say set null. Deleting a user who owns crates will fail with a FK error until a later migration rebuilds crates. User deletion is out of scope this cycle. I did not hand-edit the SQL, per the rules.\n\n## Dependencies\n\nNone added.\n"},{"id":"dev-T2","body":"# DEV report: T2 (API auth core)\n\nCommit c0ce0fd on shipyard/user-accounts-auth-2026-11-07T06-59-04. No dependencies added.\n\n## What was built\n- services/users.ts: createUser (lower-cases email/username, displayName defaults to username, 409 'Email already registered' / 'Username taken' via pre-check plus UNIQUE-violation mapping for races), findUserByEmail, findUserByUsername, getUserById, toPublicUser (no hash).\n- services/sessions.ts: SESSION_TTL_MS = 30 days; createSession stores sha256 hex of a 32-byte base64url token, expiry rounded to whole seconds so cookie and row agree; findSessionUser deletes expired rows; deleteSession.\n- services/permissions.ts: requireUser (401), canEditOwner, assertCanEditCrate (404/403), assertCanEditAlbum (album's crate, 404/403). Signatures take `PublicUser | null` and return the user.\n- plugins/auth.ts: registers @fastify/cookie unsigned, decorateRequest('user', null) with module augmentation, onRequest hook sets request.user, `app.auth.setSessionCookie(reply, token, expiresAt)` / `app.auth.clearSessionCookie(reply)` (httpOnly, SameSite=Lax, path /, Secure only in production). Old modes, write gate and SESSION_SECRET gone.\n- routes/auth.ts: signup (201), login (dummy scrypt verify for unknown email, identical 401), logout (204, idempotent), me (401 when signed out). @fastify/rate-limit scoped to signup/login, keyed by req.ip, errorResponseBuilder throws HttpError(429) so the error handler formats it.\n- app.ts: order errorHandler, db, auth, coversPlugin, health, authRoutes, crates, albums, coverRoutes, web. `AppOptions.auth = { production?, rateLimit? }`.\n- services/bootstrap.ts + server.ts: bootstrapAdmin / bootstrapFromEnv, awaited before listen. Smoke-tested: real server created the admin and login returned 200 with the cookie.\n- test/helpers.ts: buildTestApp(opts), signUp, createAdmin, addCrate(app, name, sortOrder, ownerId = null), multipart.\n- Deleted routes/session.ts and test/auth.test.ts. error-handler.ts needed no change.\n\n## Gates\nformat:check 0, lint 0, typecheck 0, test 0 (api 110, web 102), build 0.\n\n## Criteria self-check (tester decides)\nAC1, AC5, AC6, AC7, AC8, AC9, AC17, AC18: checks pass locally.\nAC12: partial by design. No matches in apps/api and session.ts is gone, but canLogIn remains in apps/web (App.vue, router.ts, stores/session.ts) and sessionInfo/loginInput in packages/shared. The spec leaves those to T5.\n\n## Findings\nSee cycles/1/tasks/T2.json findings: web still calls /api/session until T5; logout with an empty JSON body returns 400; ADMIN_EMAIL colliding with an existing user is warned and skipped; a short ADMIN_PASSWORD crashes startup on purpose; docs/compose/.env.example still describe the old auth (not owned); the production-cookie test prints some log lines.\n"},{"id":"dev-T3","body":"# DEV report: T3 (crate ownership)\n\nCommit c51c28c on shipyard/user-accounts-auth-2026-11-07T06-59-04. No dependencies added. Only T3's four files committed.\n\n## What was built\n- services/crates.ts: writes take `PublicUser | null`. createCrate requires a user (401) and sets ownerId. updateCrate/deleteCrate call assertCanEditCrate (401/404/403) first. reorderCrates: requireUser, existing \"every crate once\" 400, then for non-admins a Drizzle query (inArray + isNull/ne) finds any listed crate not theirs and throws HttpError(403, 'You can only reorder crates you own').\n- routes/crates.ts: passes req.user through; reads stay public.\n- test/crates.test.ts: every write signs up via helpers.signUp and uses crates owned by that user; position moves send the cookie; assertions kept (create also checks ownerId; sort PATCH now asserts 200).\n- test/ownership.test.ts: 'ownership: crates' block with the AC10/AC11 crate tests verbatim, a crate-only admin test for T4 to finish, and a 404-vs-401 test.\n\n## Gates\napi typecheck, tests (123), eslint, prettier: all 0. Full repo gates not run (others mid-change).\n\n## Findings\nSee cycles/1/tasks/T3.json. Main one: non-admin reorder only works when they own every crate on the shelf.\n"},{"id":"dev-T4","body":"# DEV report: T4 (album, track and cover ownership)\n\nCommit 0a1b027 on shipyard/user-accounts-auth-2026-11-07T06-59-04. Only T4's nine files committed. No dependencies added.\n\n## What was built\n- services/albums.ts, services/covers.ts: every write takes `PublicUser | null` and calls permissions.ts. Create checks the target crate (400 missing kept, then 403); patch/position/tracks/spins/delete check the album (source crate) and, when crateId changes, the target crate.\n- routes: pass req.user; cover upload checks permission before reading the file.\n- albums.test.ts, covers.test.ts: sign in via signUp, crates owned by that user, assertions kept; added a spins 401 test.\n- ownership.test.ts: 'ownership: albums and covers' block with the AC10/AC11 tests verbatim, full admin test replacing T3's crate-part one, ownerless test extended to albums, plus a 404-vs-401 album test.\n- ADR 0003 marked partly superseded by ADR 0004; Dockerfile usage shows ADMIN_EMAIL and the 8+ char password.\n\n## Gates\nAll five root gates exit 0 (132 api tests).\n\n## Findings\nSee cycles/1/tasks/T4.json. AC17 password grep matches apps/web/src/stores/session.test.ts (not mine).\n"},{"id":"dev-T5","body":"# dev-T5\n\nTask T5: web accounts core. Commit 9b5474f.\n\n- Replaced api/session.ts with api/auth.ts (me/signUp/logIn/logOut; me maps 401 to null; logout sent without body).\n- stores/session.ts: user, loaded, signedIn, isAdmin, load, logIn(email, password), signUp, logOut; temporary canEdit = signedIn for T6.\n- utils/permissions.ts canEditCrate plus the 5 named tests; session.test.ts with the named AC14 test plus 2 extras.\n- LoginView (email + password, link to signup), new SignupView (zod safeParse client check, per-field 400 issues, 409 message).\n- router: /signup route, requiresAuth meta, guard loads session and redirects to login?next=.\n- App.vue: masthead user menu (Log in / Sign up, or name + Log out); footer staff link removed.\n- shared: removed sessionInfo, loginInput, SessionInfo.\n\nGates (web typecheck/test/build, eslint, prettier, all-workspace typecheck) exit 0. AC15 view wiring is T6.\n"},{"id":"dev-T6","body":"# dev-T6\n\nTask T6: web per-crate edit controls. Commit be8910a.\n\n- Removed temporary `canEdit` from stores/session.ts; grep for session.canEdit / .canEdit is empty.\n- Global actions (LibraryToolbar Edit crates / Add a record, EmptyShelf first crate) use `session.signedIn`.\n- LibraryView: tools, add link, draggable, drop targets and Move-to options gated per crate with canEditCrate (source and target).\n- CrateView: spin and \"Add a record\" link per crate; toolbar preselect only for editable crate.\n- AlbumView: Edit button via the album's crate from the library store.\n- CratesView: lists editable crates only; reorder buttons admin-only.\n- AlbumEditorView: crate picker filtered; edit route redirects to album page if not editable.\n- New apps/web/src/views/editControls.test.ts (8 tests; file not in owned list, flagged).\n\nWeb gates (typecheck, test 118, build, eslint, prettier) exit 0.\n"},{"id":"dev-T7","body":"# DEV report: T7 (docs and deploy config for accounts)\n\nCommit 9b5474f on shipyard/user-accounts-auth-2026-11-07T06-59-04. No dependencies added. No code changed.\n\n## What changed\n- .env.example: ADMIN_EMAIL beside ADMIN_PASSWORD (first admin on first start; changing the password later does not change an existing admin); SESSION_SECRET marked unused.\n- compose.yaml: ADMIN_EMAIL required with a :? message; SESSION_SECRET passthrough removed (old .env files still fine). Volume, /data untouched. Verified with docker compose config.\n- docs/DEPLOY.md: ADMIN_EMAIL setup, \"Upgrading to user accounts\" (add ADMIN_EMAIL or no admin and existing crates stay locked; password at least 8; everyone signed out once; no data moves), Accounts section incl. TRUST_PROXY for per-IP limits; removed the \"change admin password\" row.\n- README.md: accounts model replaces the \"Who can edit\" table, env var table with ADMIN_EMAIL, /api/auth routes replace /api/session.\n- docs/SPEC.md section 8 and new docs/adr/0004-user-accounts.md.\n- ci.yml smoke run: -e ADMIN_EMAIL=ci@example.invalid, password lengthened to ci-only-password (the old 7-char one would make the app exit).\n\n## Checks\nprettier --check on own files 0; npm run format:check 0. Other gates not run (docs-only).\n\n## Findings\nSee cycles/1/tasks/T7.json. Notably ADR 0003 and the Dockerfile comment still describe the old model (not owned), and my first commit briefly included another dev's staged deletion; fixed by recommitting only T7 paths.\n"},{"id":"intake-1","body":"# Intake notes (run 2026-11-07T06-59-04)\n\nRead: auth plugin, session routes, app.ts, schema, db client, route list, web router/session store, compose/.env.example/DEPLOY.md, prior brief format.\n\nKey findings\n- Current auth has three modes (open/read-only/password). Open mode is relied on by existing tests; removing it forces a test rewrite via a sign-in helper. Brief assumes this.\n- drizzle-kit may rebuild the crates table for owner_id; the data-survival test (AC3) is the guard. Backfill is done in app code at startup, not by editing the generated migration.\n- Mutating routes beyond crates: albums (create/patch/delete/move/reorder/spin), PUT /crates/order, covers upload/delete. Ownership must be enforced on all.\n- Rate limiting: @fastify/rate-limit is already a dependency; no new dependency needed.\n- Judgement calls flagged for the owner: spin-count requires a session; signup returns 409 on duplicates; admin-less upgrade if ADMIN_EMAIL is missing; compose now requires ADMIN_EMAIL.\n- AC2/AC16/AC17 reference \"base\"; the builder should substitute the branch's merge-base (git merge-base HEAD main).\n"},{"id":"manager-1","body":"# manager-1 notes (cycle 1)\n\nPlanned 7 tasks: T1 foundation (shared contract, schema, 0003 migration, passwords, migration test), T2 API auth core (users/sessions/permissions/bootstrap services, auth plugin rewrite, /api/auth routes, helpers.ts, auth-accounts + bootstrap tests, delete session.ts and auth.test.ts), T3 crate ownership (+ crates.test.ts rewrite, starts ownership.test.ts), T4 album/cover ownership (+ albums/covers tests, finishes ownership.test.ts), T5 web core (api/auth, store, permissions, Login/Signup, router, App header, removes old shared session schemas), T6 web per-crate controls (removes temporary canEdit alias), T7 docs/compose/.env/CI.\n\nGraph: T1 -> T2 -> {T3 -> T4, T5 -> T6, T7}. Verified by script that no unordered pair shares a file and AC1..AC18 are all covered.\n\nJudgement calls:\n- The login schema is named credentialsInput because AC12's grep bans `loginInput` while AC13 accepts any of signupInput/loginInput/publicUser.\n- Shared crate gets the owner fields in T1 (and the services/crates.ts select), so web T5/T6 can run in parallel with T3 without touching shared.\n- Writes are deliberately unguarded between T2 and T3/T4, so old tests stay green, and each ownership task rewrites its own tests.\n- A possible drizzle-kit table rebuild for crates.owner_id is handled in createDb (FK off around migrate + foreign_key_check), not in the SQL.\n- AC12's banned identifiers (adminPassword, canLogIn, checkPassword) are called out in T2. Bootstrap reads env through bootstrapFromEnv, called from server.ts.\n- T2 lists error-handler.ts in case the rate-limit 429 needs mapping through HttpError.\n"},{"id":"reporter-1","body":"# reporter-1\nWrote report.md from state.json, ledger.md, brief.json, test-report.json, tester-1.md and dev notes. Verdict shipped. Commit list taken from git log. Merge/push to main not evidenced in artifacts, so report does not claim it. Dev-T7 notes cite commit 9b5474f, but git log shows 4ad9025 for the docs commit; I used git log.\n"},{"id":"surveyor-1","body":"Surveyor 1: structure and tests for crate-digger. Findings are in survey-structure-tests.json. Note: an earlier run's survey (06-38-49) named packages @crate-digger/*; current manifests say @frisson/*. Read-only otherwise; no installs or tests run.\n"},{"id":"surveyor-2","body":"# Surveyor 2 notes: conventions and documentation\nTarget /home/claude/crate-digger (product now Frisson, scope @frisson/*). See survey-conventions-docs.json.\n- Style enforced by Prettier (no semi, single quotes, 100, trailing commas) and ESLint flat config.\n- API pattern: routes thin, services plain functions throwing HttpError, errorHandlerPlugin yields { statusCode, error, message, issues? }.\n- Auth is one shared ADMIN_PASSWORD with signed cookie; docs match code; no future-accounts docs exist.\n- Remaining crate-digger strings in DEPLOY.md (clone URL, crate.db, crate-data volume, crate-backup).\n- SPEC section 8 headed \"(later)\" is out of date vs README Status.\n"},{"id":"surveyor-3","body":"# Surveyor 3, concern: relevant\n\nAuth is one Fastify plugin (apps/api/src/plugins/auth.ts) with a single signed cookie `frisson_session` = `admin:\u003cts>`, three modes (open / read-only / password), and one global onRequest hook (L98) that gates every POST/PUT/PATCH/DELETE under /api/ except /api/session. Routes and services have no auth awareness and no user param.\n\nKey gotchas for the change:\n- authPlugin registers before dbPlugin in app.ts (L43 vs L49), so it has no app.db at register time.\n- Migrations auto-run via createDb() (db/client.ts L27); journal has 3 entries (0000-0002); a backfill needs hand-edited SQL in a generated migration.\n- test helpers addCrate inserts crates without owner; buildTestApp passes no auth opts (relies on open mode).\n- seed.ts wipes and inserts crates with no owner.\n- ADMIN_PASSWORD required in compose.yaml L27, ci.yml L44, Dockerfile L8 comment, README, DEPLOY.md, ADR 0003.\n- Web gating is purely session.canEdit / canLogIn (7 components); router meta requiresEdit.\n- Previous survey-relevant.json in run 06-38-49 is a rename survey, unrelated.\n"},{"id":"tester-1","body":"# tester-1 notes (cycle 1)\n\nVerdict: AC1..AC18 all pass. Smoke pass. Report: cycles/1/test-report.json.\n\n## What I did\n- Ran the full gate chain once: exit 0 (api 13 files / 132 tests, web 16 files / 118 tests, vite build ok).\n- Listed every test name with the verbose reporter and matched each name in brief.json. All present and passing.\n- Read migration, passwords, auth-accounts, bootstrap, ownership, shared-auth tests, the api test helpers and the web session/permissions tests. None are trivial: each checks status codes plus the resulting DB or API state (unchanged names, album lists, covers dir, session rows, hashes).\n- Ran each grep/ls check from brief.json, plus `npx drizzle-kit generate` (\"No schema changes\").\n- Smoke: extracted the base commit with git archive into /tmp/sy-base, ran it in open mode on /tmp/sy-data, seeded a crate, album and track, stopped it. Then ran the branch server on the same DATA_DIR with ADMIN_EMAIL/ADMIN_PASSWORD. Legacy data survived, the crate was backfilled to the new admin, and signup, login, me, create crate, 403 on the admin crate/album, admin override, logout (old cookie then 401) and anonymous write 401 all behaved. POST /api/session is 404. Both servers killed.\n\n## Flags for the harbormaster\n1. AC16: the literal `git diff base -- Dockerfile docker | grep ...` is not empty. It hits the Dockerfile header comment `docker run ... -v crate-data:/data ...`, re-wrapped to add `-e ADMIN_EMAIL`. The mount text is unchanged and no real path moved, so I passed it on the criterion text. Your call if the literal grep must be empty.\n2. Non-blocking: schema.ts says `owner_id` uses onDelete 'set null', but drizzle-kit's SQLite `ALTER TABLE ADD` emitted `REFERENCES users(id)` with no ON DELETE. The migrated DB reports on_delete NO ACTION. That doesn't matter yet (no user deletion this phase), but it differs from the brief's assumption and will matter when user deletion arrives.\n3. AC17: the password-literal grep has 2 hits, both mock inputs in apps/web/src/stores/session.test.ts (a test file). There are no secrets in non-test source.\n\n## Worktree\nI touched no tracked files. git status shows only the untracked run dir. Temp files are in /tmp/sy-base, /tmp/sy-data and /tmp/*.log|jar.\n"}],"runDir":"/home/claude/crate-digger/.shipyard/runs/2026-11-07T06-59-04","live":false,"stages":["intake","survey","plan","build","test","fix","report","done"],"tree":{"files":[{"path":".env.example","add":7,"del":4,"wip":false},{"path":".github/workflows/ci.yml","add":3,"del":1,"wip":false},{"path":"apps/api/drizzle/0003_accounts.sql","add":22,"del":0,"wip":false},{"path":"apps/api/drizzle/meta/_journal.json","add":7,"del":0,"wip":false},{"path":"apps/api/drizzle/meta/0003_snapshot.json","add":445,"del":0,"wip":false},{"path":"apps/api/src/app.ts","add":12,"del":10,"wip":false},{"path":"apps/api/src/db/schema.ts","add":46,"del":1,"wip":false},{"path":"apps/api/src/plugins/auth.ts","add":29,"del":78,"wip":false},{"path":"apps/api/src/routes/albums.ts","add":9,"del":7,"wip":false},{"path":"apps/api/src/routes/auth.ts","add":77,"del":0,"wip":false},{"path":"apps/api/src/routes/covers.ts","add":5,"del":2,"wip":false},{"path":"apps/api/src/routes/crates.ts","add":5,"del":4,"wip":false},{"path":"apps/api/src/routes/session.ts","add":0,"del":38,"wip":false},{"path":"apps/api/src/server.ts","add":3,"del":0,"wip":false},{"path":"apps/api/src/services/albums.ts","add":42,"del":7,"wip":false},{"path":"apps/api/src/services/bootstrap.ts","add":109,"del":0,"wip":false},{"path":"apps/api/src/services/covers.ts","add":6,"del":1,"wip":false},{"path":"apps/api/src/services/crates.ts","add":46,"del":10,"wip":false},{"path":"apps/api/src/services/passwords.ts","add":88,"del":0,"wip":false},{"path":"apps/api/src/services/permissions.ts","add":56,"del":0,"wip":false},{"path":"apps/api/src/services/sessions.ts","add":51,"del":0,"wip":false},{"path":"apps/api/src/services/users.ts","add":78,"del":0,"wip":false},{"path":"apps/api/test/albums.test.ts","add":50,"del":12,"wip":false},{"path":"apps/api/test/auth-accounts.test.ts","add":373,"del":0,"wip":false},{"path":"apps/api/test/auth.test.ts","add":0,"del":142,"wip":false},{"path":"apps/api/test/bootstrap.test.ts","add":155,"del":0,"wip":false},{"path":"apps/api/test/covers.test.ts","add":22,"del":5,"wip":false},{"path":"apps/api/test/crates.test.ts","add":42,"del":17,"wip":false},{"path":"apps/api/test/helpers.ts","add":82,"del":9,"wip":false},{"path":"apps/api/test/migration.test.ts","add":90,"del":0,"wip":false},{"path":"apps/api/test/ownership.test.ts","add":515,"del":0,"wip":false},{"path":"apps/api/test/passwords.test.ts","add":49,"del":0,"wip":false},{"path":"apps/api/test/shared-auth.test.ts","add":73,"del":0,"wip":false},{"path":"apps/web/src/api/auth.ts","add":29,"del":0,"wip":false},{"path":"apps/web/src/api/session.ts","add":0,"del":14,"wip":false},{"path":"apps/web/src/App.vue","add":48,"del":14,"wip":false},{"path":"apps/web/src/components/crate/CrateBox.test.ts","add":3,"del":0,"wip":false},{"path":"apps/web/src/components/crate/EmptyShelf.vue","add":1,"del":1,"wip":false},{"path":"apps/web/src/components/LibraryToolbar.vue","add":3,"del":1,"wip":false},{"path":"apps/web/src/router.ts","add":16,"del":9,"wip":false},{"path":"apps/web/src/stores/library.test.ts","add":6,"del":0,"wip":false},{"path":"apps/web/src/stores/session.test.ts","add":89,"del":0,"wip":false},{"path":"apps/web/src/stores/session.ts","add":33,"del":14,"wip":false},{"path":"apps/web/src/utils/permissions.test.ts","add":39,"del":0,"wip":false},{"path":"apps/web/src/utils/permissions.ts","add":15,"del":0,"wip":false},{"path":"apps/web/src/views/AlbumEditorView.vue","add":17,"del":5,"wip":false},{"path":"apps/web/src/views/AlbumView.vue","add":6,"del":6,"wip":false},{"path":"apps/web/src/views/CratesView.vue","add":17,"del":5,"wip":false},{"path":"apps/web/src/views/CrateView.vue","add":8,"del":4,"wip":false},{"path":"apps/web/src/views/editControls.test.ts","add":249,"del":0,"wip":false},{"path":"apps/web/src/views/LibraryView.vue","add":26,"del":10,"wip":false},{"path":"apps/web/src/views/LoginView.vue","add":41,"del":9,"wip":false},{"path":"apps/web/src/views/SignupView.vue","add":215,"del":0,"wip":false},{"path":"compose.yaml","add":3,"del":2,"wip":false},{"path":"Dockerfile","add":5,"del":1,"wip":false},{"path":"docs/adr/0003-deployment.md","add":5,"del":2,"wip":false},{"path":"docs/adr/0004-user-accounts.md","add":57,"del":0,"wip":false},{"path":"docs/DEPLOY.md","add":43,"del":11,"wip":false},{"path":"docs/SPEC.md","add":3,"del":1,"wip":false},{"path":"packages/shared/src/index.ts","add":47,"del":8,"wip":false},{"path":"README.md","add":30,"del":14,"wip":false}],"total":61},"stateMtime":1794037449552.5457,"renderedAt":1794037449671}</script>
<script>
const D = JSON.parse(document.getElementById('run-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

const st = D.state || {};
const verdict = (st.verdict || 'pending').toLowerCase();
const crit = st.criteria || {};
const critKeys = Object.keys(crit);
const statements = {};
(D.brief?.acceptanceCriteria || []).forEach(c => { statements[c.id] = c.statement; });
const keys = critKeys.length ? critKeys : Object.keys(statements);
const counts = { pass: 0, fail: 0, untested: 0 };
keys.forEach(k => { counts[(crit[k] || 'untested')] = (counts[(crit[k] || 'untested')] || 0) + 1; });
const total = keys.length || 1;

const parts = [];

const nowIdx = D.stages.indexOf(st.stage);
const T = s => { const t = Date.parse(s); return Number.isFinite(t) ? t : null; };
const dur = ms => {
  if (ms == null || ms < 0) return '';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}h${String(m).padStart(2, '0')}m` : m ? `${m}m${String(r).padStart(2, '0')}s` : `${r}s`;
};
// Elements carrying data-since tick every second, so the page looks alive
// between renders even while one long agent is working.
const since = (iso, end) => {
  const a = T(iso); if (a == null) return '—';
  const b = T(end);
  return b != null ? dur(b - a) : `<span data-since="${a}">${dur(Date.now() - a)}</span>`;
};
const times = st.stageTimes || {};
const pipeline = D.stages.filter(s => s !== 'done').map((s, i) => {
  const cls = D.live && i === nowIdx ? 'now' : (nowIdx > i || !D.live ? 'done' : '');
  const t = times[s];
  const clock = t?.start ? `<small>${since(t.start, (D.live && i === nowIdx) ? null : (t.end || null))}</small>` : '';
  return `<div class="${cls}">${s.toUpperCase()}${clock}</div>`;
}).join('');
const quietMs = D.stateMtime ? Date.now() - D.stateMtime : 0;
const active = Array.isArray(st.active) ? st.active : [];

parts.push(`
<header>
  <h1>SHIPYARD<small>AUTONOMOUS DEV YARD // ${D.live ? 'YARD ACTIVE' : 'RUN RECORD'}</small></h1>
  <div class="meta">
    ${D.live
      ? '<span class="chip verdict live"><span class="dot"></span>WORKING</span>'
      : `<span class="chip verdict v-${esc(verdict)}">${esc(verdict)}</span>`}
    <span class="chip">RUN <b>${esc(st.runId || '—')}</b></span>
    ${st.startedAt ? `<span class="chip">ELAPSED <b>${since(st.startedAt, D.live ? null : st.endedAt)}</b></span>` : ''}
    ${D.live && active.length ? `<span class="chip live">CREW <b>${active.length}</b></span>` : ''}
    ${D.live ? `<span class="chip nosignal" id="nosignal" data-mtime="${D.stateMtime}" style="display:none">NO SIGNAL <b></b></span>` : ''}
    <span class="chip">CYCLE <b>${esc(st.cycle || '?')}/${esc(st.maxCycles || 3)}</b></span>
    ${st.fixRound ? `<span class="chip">FIX ROUND <b>${esc(st.fixRound)}/${esc(st.maxFixRounds || 3)}</b></span>` : ''}
    <span class="chip">BRANCH <b>${esc(st.branch || '—')}</b></span>
    <span class="chip">TARGET <b>${esc(st.target || '—')}</b></span>
    ${(st.fastPaths || []).map(f => `<span class="chip fast">FAST PATH <b>${esc(f)}</b></span>`).join('')}
  </div>
  <div class="pipe">${pipeline}</div>
  <div class="tele">
    <span>${D.live ? '◉ TELEMETRY LIVE — REFRESHING EVERY 4s' : '· TRANSMISSION ENDED'}</span>
    <span>STAGE: ${esc((st.stage || 'unknown').toUpperCase())}</span>
  </div>
</header>
${D.live ? '<div class="scan"><i></i></div>' : ''}
<div class="hazard"></div>`);

if (D.live && active.length) {
  parts.push(`<section><h2>Crew on deck — ${active.length} working</h2><div class="body"><div class="crew">
    ${active.map(a => {
      const t = T(a.since);
      const slow = t != null && Date.now() - t > 15 * 60 * 1000;
      return `<div class="hand${slow ? ' slow' : ''}"><div class="role"><span class="dot"></span>${esc(a.role || 'agent')}<span class="clock">${since(a.since)}</span></div>
        <div class="who">${esc(a.id || '?')}</div>
        ${a.task ? `<div class="sub" style="color:var(--grey);font-size:11px">${esc(a.task)}</div>` : ''}</div>`;
    }).join('')}
  </div></div></section>`);
}

if (D.tree && D.tree.total) {
  const wip = D.tree.files.filter(f => f.wip).length;
  const rows = D.tree.files.map(f => `<tr>
      <td class="mono">${f.wip ? '<span class="wip">●</span> ' : ''}${esc(f.path)}</td>
      <td class="num">${f.add == null ? (f.isNew ? '<span class="add">new</span>' : '') : f.add ? '<span class="add">+' + f.add + '</span>' : ''}</td>
      <td class="num">${f.del ? '<span class="del">−' + f.del + '</span>' : ''}</td></tr>`).join('');
  parts.push(`<section><h2>Working tree — ${D.tree.total} file${D.tree.total === 1 ? '' : 's'} changed${wip ? ', ' + wip + ' uncommitted' : ''}</h2><div class="body">
    <table><thead><tr><th>File ${wip ? '(● = being written)' : ''}</th><th style="text-align:right">Added</th><th style="text-align:right">Removed</th></tr></thead><tbody>${rows}</tbody></table>
    ${D.tree.total > D.tree.files.length ? '<p class="empty">Showing the first ' + D.tree.files.length + '.</p>' : ''}
  </div></section>`);
}

if (st.request || D.brief?.goal) {
  parts.push(`<section><h2>Work order</h2><div class="body">
    <pre>${esc(D.brief?.goal || st.request)}</pre>
    ${(D.brief?.assumptions || []).length ? '<p style="margin:11px 0 4px;color:var(--amber-dim);font-size:11px;letter-spacing:.2em">ASSUMPTIONS MADE</p><ul>' + D.brief.assumptions.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : ''}
  </div></section>`);
}

// Acceptance criteria
const bar = `<div class="bar">
  <i class="p" style="width:${counts.pass / total * 100}%"></i>
  <i class="f" style="width:${counts.fail / total * 100}%"></i>
  <i class="u" style="width:${counts.untested / total * 100}%"></i>
</div>`;
const cards = keys.length ? keys.map(k => {
  const s = crit[k] || 'untested';
  return `<div class="crit"><span class="id">${esc(k)}</span><span class="st ${esc(s)}">${s === 'pass' ? '◉ PASS' : s === 'fail' ? '✗ FAIL' : '· UNTESTED'}</span>
    <p>${esc(statements[k] || '')}</p></div>`;
}).join('') : '<p class="empty">No acceptance criteria recorded — intake did not complete.</p>';
parts.push(`<section><h2>Acceptance criteria — ${counts.pass}/${keys.length || 0} pass</h2><div class="body">${keys.length ? bar : ''}<div class="grid">${cards}</div></div></section>`);

// Cycles
(D.cycles || []).forEach(c => {
  const tasks = (c.plan?.tasks || []);
  const taskState = st.tasks || {};
  const rows = tasks.length ? tasks.map(t => {
    const s = taskState[t.id] || 'todo';
    return `<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.goal)}</td>
      <td class="mono">${esc((t.ownsFiles || []).join(', '))}</td>
      <td class="mono">${esc((t.dependsOn || []).join(', ') || '—')}</td>
      <td><span class="tag t-${esc(s)}">${esc(s)}</span></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No plan produced for this cycle.</td></tr>';

  parts.push(`<section><h2>Cycle ${esc(c.n)}</h2><div class="body">
    <div class="cycle-head"><h3>DELEGATION</h3></div>
    <table><thead><tr><th>Task</th><th>Goal</th><th>Owns files</th><th>After</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>
    ${c.spec ? '<details><summary>Manager spec — what it intended to build</summary><div class="inner"><pre>' + esc(c.spec) + '</pre></div></details>' : ''}
    ${c.testReport ? '<details><summary>Tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.testReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.defects ? '<details><summary>Triaged defects</summary><div class="inner"><pre>' + esc(JSON.stringify(c.defects, null, 2)) + '</pre></div></details>' : ''}
  </div></section>`);
});

// Deaths
if ((st.deaths || []).length) {
  parts.push(`<section><h2>Agent losses — ${st.deaths.length}</h2><div class="body"><table>
    <thead><tr><th>Agent</th><th>Reason</th><th>Detail</th></tr></thead><tbody>
    ${st.deaths.map(d => `<tr><td><b>${esc(d.agentId || d.agent || '?')}</b></td><td class="fail">${esc(d.reason)}</td><td class="mono">${esc(d.detail)}</td></tr>`).join('')}
    </tbody></table></div></section>`);
}

if (D.reportMd) {
  parts.push(`<section><h2>Report</h2><div class="body"><pre>${esc(D.reportMd)}</pre></div></section>`);
}

if ((D.agents || []).length) {
  parts.push(`<section><h2>Crew logs — ${D.agents.length} agents</h2><div class="body">
    ${D.agents.map(a => '<details><summary>' + esc(a.id) + '</summary><div class="inner"><pre>' + esc(a.body) + '</pre></div></details>').join('')}
  </div></section>`);
}

if (D.ledger) {
  parts.push(`<section><h2>Harbormaster log</h2><div class="body"><pre>${esc(D.ledger)}</pre></div></section>`);
}

parts.push(`<div class="hazard"></div><footer>
  SHIPYARD // ${esc(D.runDir)}<br>
  ${D.live
    ? 'YARD ACTIVE — this page reloads itself. Leave the tab open.'
    : 'TRANSMISSION ENDED — this page is final and will not reload.'}
</footer>`);
document.getElementById('app').innerHTML = parts.join('');

// Tick the clocks between reloads, and raise NO SIGNAL if the harbormaster
// has not written state.json for a long time while the run claims to be live.
(function tick(){
  const fmt = ms => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + 'h' + String(m).padStart(2, '0') + 'm' : m ? m + 'm' + String(r).padStart(2, '0') + 's' : r + 's';
  };
  const QUIET = 20 * 60 * 1000;
  function step(){
    document.querySelectorAll('[data-since]').forEach(n => { n.textContent = fmt(Date.now() - +n.dataset.since); });
    const ns = document.getElementById('nosignal');
    if (ns && +ns.dataset.mtime) {
      const q = Date.now() - +ns.dataset.mtime;
      ns.style.display = q > QUIET ? '' : 'none';
      ns.querySelector('b').textContent = fmt(q);
    }
  }
  step(); setInterval(step, 1000);
})();

// A meta-refresh is a full reload, which would slam every <details> shut and
// jump you back to the top mid-read. Persist what the reader opened and where
// they were, keyed by run so two tabs do not fight. sessionStorage, not local:
// this is view state, and it should die with the tab.
(function preserveReadingState(){
  const KEY = 'shipyard:' + (D.state?.runId || 'run');
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}') } catch {}

  const summaries = () => [...document.querySelectorAll('details')];

  summaries().forEach(d => {
    const label = d.querySelector('summary')?.textContent?.trim();
    if (label && saved.open && saved.open.includes(label)) d.open = true;
    d.addEventListener('toggle', save);
  });

  if (typeof saved.scroll === 'number') window.scrollTo(0, saved.scroll);

  function save(){
    const open = summaries().filter(d => d.open)
      .map(d => d.querySelector('summary')?.textContent?.trim())
      .filter(Boolean);
    try { sessionStorage.setItem(KEY, JSON.stringify({ open, scroll: window.scrollY })) } catch {}
  }

  let t;
  window.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(save, 150) }, { passive: true });
  window.addEventListener('beforeunload', save);
})();
</script>
</body>
</html>
