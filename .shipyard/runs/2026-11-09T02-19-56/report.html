ometry and hitAt exist there.","unverified":"The surveyor did not run the app, so the actual hit overlap is unconfirmed."}},"ledger":"# Ledger, run 2026-11-09T02-19-56\n\n- Preflight: tree clean, branched from ffb78fa. Size standard, named by the request.\n- Prior run 2026-11-09T01-05-12 recorded this defect as a known limit, and its lesson: a click check on one strip proves nothing.\n- Survey cache rejected: package.json and package-lock.json changed since its commit. Full survey, three surveyors (391 tracked files).\n- Intake and survey dispatched together.\n- Baseline: npm test exit 0, 326 tests in 31 files, 8s.\n- Plan: one task, T1 (sonnet). Dev dispatched.\n- T1 done, f5f99b5. npm test: exit 0, 327 tests. Testers dispatched: checklist (AC5), browser (AC1-3, writes the check). Harbormaster runs AC4 and AC6 as commands once the check exists.\n- Tester-browser: AC1-3 pass, flagged (a) forward only. AC4 and AC6 run by harbormaster, pass. Harbormaster failed AC1 on the backward-flip window. Direct fix round 1 dispatched. Check committed; pre-fix commit b7918c1b647775928ef0e5b59cc144cdf4eb6ff0.\n- Fix round 1: 7622a3e. Scoped re-test dispatched, because the check was too weak: (a) has to assert backward flips.\n- Re-test: AC1 pass. Harbormaster re-ran AC4 and AC6 on the final check. All 6 criteria pass. Reporter dispatched.\n","reportMd":"# Run report: crate-sleeve-click-fix (run 2026-11-09T02-19-56)\n\n**Verdict: shipped. 6 of 6 criteria pass, 1 cycle, 1 fix round. Not merged or pushed.** The work is on branch `shipyard/crate-sleeve-click-fix-2026-11-09T02-19-56`, based on ffb78fa.\n\n## What was asked\n\nRequest: \"issue: clicks after a flip: an invisible sleeve sits over the crate front, so clicking the tape label moves back one record. This wasn't re-tested after the fix.\"\n\nGoal from `brief.json`:\n- After a flip, no invisible flipped sleeve catches clicks.\n- Clicking the crate front or tape label does nothing.\n- The visible art still opens the record on show.\n- All flip controls keep working.\n- All of this is proven with real mouse and touch input sampled across the crate, not on one strip.\n\nConstraints:\n- Bug fix only, in `CrateBox.vue` and possibly `crateLayout.ts`.\n- The flip-out animation stays. No `v-if` or `display:none`.\n- Proof goes in `.shipyard/checks/browser.mjs`. Existing checks may be added to but not loosened.\n- No merge or push.\n- Out of scope, as known limits: phone swipe never scrolling the crate, \"Back to the crates\" returning to /shelf, and Firefox and Safari coverage.\n\n## Acceptance criteria\n\n| ID | Criterion (short) | Final | Evidence |\n|---|---|---|---|\n| AC1 | Crate front does nothing after a flip, across viewports, positions, input methods and sample points, plus (a) no-wait, (b) album and Back, (c) /shelf | pass | `cycles/1/browser-output-fix1.txt`: PASS AC1, 104 samples. Pre-fix source b7918c1 gives 6 of 104 failing (`retest-prefix1-output.txt`). |\n| AC2 | Visible art opens the record on show | pass | PASS AC2, 21 of 21 samples. Back restores the crate URL and `.count`. Sweeps show `dead=[]`. |\n| AC3 | Flip controls still work | pass | PASS AC3, 12 of 12 samples: back-sleeve edge click, Back button, ArrowUp, wheel -120 on the label, drag up and down. |\n| AC4 | `node .shipyard/checks/browser.mjs` exits 0 with no FAIL, one line per sample, old checks kept | pass | Harbormaster ran it on the final check: exit 0. The earlier run (`ac4-output.txt`) found the only removed line vs ffb78fa was the old `process.exit`, relocated. |\n| AC5 | Unit test for flipped sleeves still drawn, transform and opacity unchanged | pass | Test \"keeps flipped sleeves drawn for the flip-out animation, without catching clicks\". The existing \"flips to a record further back when you click its edge\" test is unmodified. |\n| AC6 | Check fails without the fix, and `npm test`, typecheck and lint pass with it | pass | ffb78fa source gives exit 1, AC1 failing 53 of 103, with 49 FAIL lines naming the tape label. With the fix, `npm test` (328 tests), typecheck and lint exit 0. |\n\n### AC1 was failed by the harbormaster, against the tester\n\nThe browser tester passed AC1. It asserted the no-wait click (a) after forward flips only, and flagged that limit.\n\nThe harbormaster read \"a flip\" in (a) as either direction and failed AC1 instead of narrowing the criterion. This was a harbormaster decision overruling the tester's forward-only reading. The tester's own evidence supported the failure: ArrowUp followed by a label-centre click at 0, 10 and 20ms opened /albums/N, while clicks at 30 and 40ms did nothing.\n\nA direct fix round followed, and AC1 passed after it.\n\n## What was built\n\n1. **T1, commit f5f99b5.**\n   - In `CrateBox.vue`, each flipped sleeve (`offset \u003c 0`) gets inline `pointerEvents: 'none'`. Same element, transform, opacity and transition, so the flip-out animation is unchanged.\n   - Added a CrateBox unit test for it.\n   - Diagnosis from the code was confirmed in the browser: before the fix, label-centre clicks landed on `div.motif (in non-current .sleeve)` and moved the crate back.\n2. **Browser check, commit b7918c1.** The tester extended `.shipyard/checks/browser.mjs`. Details:\n   - Sample points: 9 per position.\n   - Viewports and inputs: 1280 mouse, 390 mouse, 390 touch (Flip-button taps).\n   - Reached by: ArrowDown, plus wheel and drag at 1280.\n   - Positions: 2/4 and 3/4.\n   - Cases (a), (b) and (c) on /shelf.\n   - AC2 and AC3 sections.\n3. **T1-fix1, commit 7622a3e (direct fix).**\n   - Cause: after a backward flip, the new current sleeve (offset 0) animates up from the tipped pose in front of the panel, with pointer events on. A click in the first 20 to 30ms opened the album.\n   - Fix: `onSleeveClick` now takes the click event. For offset 0 it returns early when the click's clientX/clientY fall inside the `.panel.front` bounding rect. A zero-size rect never counts, so happy-dom's all-zero rects still open the record.\n   - Added test \"ignores a click on the current sleeve that lands inside the crate front\".\n4. **Commit 2d93752** turned the backward no-wait observation into six asserted AC1(a) samples at 1280px: ArrowUp then a label-centre click at 0, 10 and 20ms, from 3/4 and from 2/4.\n\n`crateLayout.ts` and `useCrateFlip.ts` were not touched. The dev for the fix round did not run the browser check. The harbormaster and the re-test tester did.\n\n## Test results\n\nThe pre-fix runs below were done on scratch copies of the source.\n\n**Against ffb78fa source with the new check** (`ac6-output-fix1.txt`): exit 1, `FAIL AC1 (53 of 103 samples failed)`. Examples:\n```\nFAIL AC1 1280-mouse pos=2 / 4 via=ArrowDown point=\"tape label centre\" at=(640.0,749.0) hit=div.motif (in non-current .sleeve) count=2 / 4->1 / 4 url=/crates/4\nFAIL AC1 390-touch pos=2 / 4 via=Flip-tap point=\"8px inside panel left at label height\" at=(45.7,481.0) hit=div.panel.front count=2 / 4->1 / 4 url=/crates/4\nFAIL AC1 (c) 1280-mouse /shelf crate=Crate 3 pos=2 / 4 via=ArrowDown point=\"tape label centre\" ... count=2 / 4->1 / 4 url=/shelf\n```\nAC2 and AC3 passed on that source.\n\n**Against b7918c1 source (T1 fix only, before fix round 1)** (`retest-prefix1-output.txt`): exit 1, `FAIL AC1 (6 of 104 samples failed)`. All six were the backward no-wait samples:\n```\nFAIL AC1 (a) 1280-mouse pos=3 / 4 via=ArrowUp point=\"tape label centre, 0ms after\" at=(640.0,749.0) hit=div.motif (in .sleeve) count=3 / 4->null (expect 2 / 4) url=/albums/14\nFAIL AC1 (a) 1280-mouse pos=2 / 4 via=ArrowUp point=\"tape label centre, 20ms after\" ... count=2 / 4->null (expect 1 / 4) url=/albums/13\n```\nThis is what the harbormaster used to fail AC1, and it shows the new assertions detect it.\n\n**Final check on current code:** exit 0, PASS AC12, AC1, AC2, AC3, no FAIL line. Final `npm test` (328 tests), typecheck and lint exit 0. Baseline before the work was 326 tests.\n\n## What went wrong and why\n\n- **The first fix was incomplete.**\n  - The spec's `offset \u003c 0` rule covered flipped sleeves only. It did not cover the offset 0 sleeve animating back into place after an ArrowUp, which is also in front of the panel for about 20 to 30ms.\n  - The tester found it but scoped criterion (a) to forward flips, so the first AC1 result was a pass. The harbormaster overruled that, which cost one fix round and a scoped re-test.\n- **Process note.** dev-T1 did not write its report file, citing a standing rule against report files. The harbormaster saved its final message as `agents/dev-T1.md`.\n- **No agent deaths.** The test stage took about 18 minutes, mostly the browser tester at about 12.5 minutes.\n\n## What the cycle learned\n\n- A hit-test defect has to be checked in both flip directions and in the first frames after a flip. A settled-state sample matrix misses the transition window.\n- The earlier lesson from the prior run held: a click check on one strip proves nothing. Here, \"just above tape label\" and the 390-touch \"8px inside panel\" points failed pre-fix where the label centre alone would not have shown the full spread.\n- The spec's hand-estimated catch-zone geometry was not relied on. The check samples the panel instead.\n\n## Limits (from `report-notes.json` notes)\n\n- **Hit testing during a backward flip.** For about 20ms the sleeve is still the hit target over the panel, and the click is ignored by the rect guard. The backward no-wait samples therefore assert count and URL but not the hit element. The pointer cursor could show for that moment.\n- **Narrow coverage of the backward no-wait clicks.** They are asserted at 1280px mouse on the label centre only. They are not asserted at 390px, with touch, or at the points just outside the panel sides, where the rect guard does not apply.\n- **Timing was measured in headless Chromium.** 20ms is not a guaranteed bound on slower machines.\n- **Touch flips use the Flip button.** Playwright's touchscreen only taps, so touch-drag after the fix is not exercised.\n- **Chromium only.** The out-of-scope known limits still stand: phone swipe, \"Back to the crates\", and Firefox and Safari.\n\n## Observations for the owner to choose from\n\n1. **Offset-13 invisible sleeve catches clicks (medium). Confirmed, not fixed here.**\n   - Evidence: in a 16-record crate at 1/16 and 1280px, a click above the visible stack hit `p.edge` in an opacity 0 sleeve (top about 348 against 353 for the last visible sleeve) and jumped to 14/16 with no visible target.\n   - This is a different defect from the flipped sleeves, and the 4-record check cannot see it. A fix round might not have taken it.\n   - The manager suggests the pointer-events condition could become `pose.opacity === 0`.\n2. **Tracked PNGs modified on every run (low).**\n   - The check writes `.shipyard/checks/ac12-long-*.png`, which are tracked, so every run leaves them modified. The harbormaster restored them after each run in this one.\n   - The owner should decide whether to commit them, untrack them, or have the check write elsewhere.\n3. **Wheel step (low).** One -120 wheel event moves one record though `WHEEL_STEP` is 60, apparently because `goTo` reads a model value not yet updated in that tick. AC3(d) depends on this.\n4. **Drag down from the tape label (low).** It leaves `.scene` after about 40px, so that drag ends early and moves one record rather than two.\n\n## Recommended next steps\n\n1. Review and merge the branch if satisfied. Nothing was merged or pushed.\n2. Open a follow-up for the offset-13 defect first, probably with the `pose.opacity === 0` condition. Add a long-crate (14 or more records) sample to the browser check.\n3. Decide how to handle the tracked `ac12-long-*.png` files.\n4. Optionally widen the backward no-wait assertions to 390px and touch, if the 20ms window matters to you. If it does not, a cursor-only flicker is the residual effect.\n5. Confirm the assumption that clicking the crate front or tape label should do nothing. If the owner wants the label to open the record, AC1 changes.\n\nRun artifacts: `/Users/thomasfuhriman/code/crate-digger/.shipyard/runs/2026-11-09T02-19-56/` (spec, defects, test reports and outputs under `cycles/1/`; agent notes under `agents/`).\n## Token use\n\nSize: standard. Reported total: 453,276 tokens across 11 agents.\n\n| Role | Agents | Tokens | Share |\n|---|---|---|---|\n| tester | 3 | 228,937 | 51% |\n| surveyor | 3 | 66,348 | 15% |\n| reporter | 1 | 55,059 | 12% |\n| intake | 1 | 39,231 | 9% |\n| dev | 2 | 34,138 | 8% |\n| manager | 1 | 29,563 | 7% |\n\n| Agent | Model | Tokens | Tool uses | Seconds |\n|---|---|---|---|---|\n| surveyor-structure-tests | sonnet | 14,424 | 10 | 15 |\n| surveyor-relevant | sonnet | 22,885 | 9 | 22 |\n| surveyor-conventions-docs | sonnet | 29,039 | 18 | 30 |\n| intake-1 | opus | 39,231 | 16 | 122 |\n| manager-1 | opus | 29,563 | 8 | 79 |\n| dev-T1 | sonnet | 18,347 | 10 | 40 |\n| tester-checklist | sonnet | 49,857 | 4 | 14 |\n| tester-browser | opus | 123,423 | 21 | 751 |\n| dev-T1-fix1 (fix of T1) | sonnet | 15,791 | 6 | 34 |\n| tester-retest-1 | sonnet | 55,657 | 7 | 242 |\n| reporter-1 | sonnet | 55,059 | 14 | 39 |\n\nThe harbormaster's own tokens are not included: no figure was available.\n\n### Dev models across 2 run(s)\n\n| Model | Tasks | Fix agents | Fixes per task | Tokens |\n|---|---|---|---|---|\n| sonnet | 2 | 1 | 0.50 | 46,027 |\n| opus | 1 | 1 | 1.00 | 55,558 |\n","cycles":[{"n":"1","spec":"# Stop invisible flipped sleeves catching clicks\n\n## The problem\n\nCommit 57302be fixed one hit-testing bug in the crate and exposed another. The `.crate` element is a transparent tilted plane that swallowed clicks meant for the sleeves, so that commit set `pointer-events: none` on it and restored `auto` on all of its children. Those children include flipped sleeves.\n\nA flipped sleeve is invisible only because its opacity is 0. It is still in the DOM, and its pose tips it forward around its bottom edge, so from the code its top edge sits in front of the front panel's `translateZ(70px)`. A click on the crate front or tape label can therefore land on a sleeve the user cannot see. `onSleeveClick` receives a negative offset and calls `goTo(index + offset)`, so the crate moves back a record. At position 3 or later two flipped sleeves are drawn, because `visibleRange` starts at `index - 2`.\n\nThis diagnosis comes from reading the code. Nobody has reproduced it yet, and the catch-zone geometry in the brief is a hand estimate. The test stage has to confirm it, and AC6 does that by requiring the new check to fail against the unfixed source.\n\n## What will change\n\nFlipped sleeves stop taking part in hit testing. In `apps/web/src/components/crate/CrateBox.vue`, the inline style on each `div.sleeve` gains `pointerEvents: 'none'` when `offset \u003c 0`. Everything else about those sleeves stays the same: same element, transform, opacity and transition, so the flip-out animation is unaffected.\n\nThe result at each kind of input:\n\n- **Crate front and tape label:** the click lands on `.panel.front`, which has no click handler, so nothing happens. It still bubbles to `.scene`, which only handles pointer, wheel and key events.\n- **Just outside the panel sides:** the estimated spill of the tipped sleeve past the panel disappears with it, because nothing in a flipped sleeve can be hit.\n- **Visible art:** the current sleeve still receives clicks and opens the record on show.\n- **Visible back-sleeve edges:** these still flip forward to that record.\n- **Going back:** the Back button, ArrowUp, wheel up and drag up do not depend on flipped sleeves. Wheel and drag listeners are on `.scene`, so they work from the tape label too.\n\nThe style applies as soon as the index changes, so a click with no wait after a flip cannot land on a sleeve that is still animating out. `/shelf` uses the same `CrateBox` and gets the fix without further work.\n\n## Alternatives rejected\n\n- **`pointer-events: none` on the panel:** clicks would pass through to the current sleeve and open the album, which breaks AC1.\n- **Ignoring `offset \u003c 0` in the click handler:** the invisible sleeve would remain the hit target and still show a pointer cursor, and `elementFromPoint` would return it, which also breaks AC1.\n- **`v-if`, `display: none` or filtering `drawn`:** this removes the flip-out animation, which the brief says must stay.\n- **A CSS class instead of an inline style:** this would work, but happy-dom does not apply scoped CSS, so a unit test could only check that the class is present. The inline style is also where the rest of the pose is already applied.\n\n## How it is proven\n\nThe dev adds a named test in `CrateBox.test.ts` that mounts at index 2 and asserts both flipped sleeves are still rendered with `translateZ(40px) rotateX(-55deg)` and opacity 0 (AC5), plus inline `pointer-events: none`. That test guards the animation constraint, but it cannot prove the bug is gone, because happy-dom does no layout or hit testing.\n\nThe real proof is `.shipyard/checks/browser.mjs`, written by the browser tester at test stage. It uses real mouse and touch input on a temp DB, sampling across the panel at several viewports and positions rather than on one strip (AC1 to AC4). It must then fail against the source at ffb78fa and pass with the fix (AC6). The fix task lists those criteria in its `criteriaIds` because its change is what they verify, but it does not write that check.\n\n## Scope and known limits\n\nThe change is limited to `CrateBox.vue` and its test. `crateLayout.ts` is allowed by the brief but not needed, so it stays untouched, as does `useCrateFlip.ts`. These remain out of scope as recorded known limits:\n\n- Phone swipe on the crate never scrolling.\n- \"Back to the crates\" returning to `/shelf`.\n- Firefox and Safari coverage.\n\nTouch flips in the check use the Flip button because Playwright's touchscreen API only taps, so touch dragging after the fix is not exercised.\n\n## One thing left alone, for the owner\n\nSleeves at offset 13 are also rendered with opacity 0 and can be hit, as the code stands. In a crate of 14 or more records, such a sleeve might catch a click above the visible stack and flip forward 13 records. This is unconfirmed, and it is a different defect: the sleeve is not flipped and the area is not the crate front. The brief's 4-record check will not exercise it, and this fix does not address it. If it proves real, changing the condition to `pose.opacity === 0` would likely cover both cases.\n","plan":{"summary":"One task: make flipped sleeves (offset \u003c 0) ignore hit testing in CrateBox.vue while they stay drawn with the same transform and opacity, and add the AC5 unit test. The browser tester writes the real-input proof at test stage.","tasks":[{"id":"T1","goal":"Stop flipped sleeves catching pointer input, without changing how they are drawn, and pin the retained rendering with a named unit test.","description":"Defect (diagnosed from code, not yet reproduced): in apps/web/src/components/crate/CrateBox.vue, the rule `.crate > * { pointer-events: auto; }` from commit 57302be applies to every sleeve. A flipped sleeve has offset \u003c 0 and pose transform 'translateZ(40px) rotateX(-55deg)', opacity 0, zIndex 101. Its tipped top edge comes forward of the front panel's translateZ(70px), so it takes clicks aimed at the panel, and onSleeveClick(offset, album) then calls flip.goTo(index.value + offset), which moves back. Up to two flipped sleeves exist, because visibleRange(index, count) starts at index - 2.\n\nFix in CrateBox.vue: add one entry to the existing :style object on div.sleeve: `pointerEvents: offset \u003c 0 ? 'none' : undefined`. Use the inline style instead of a class because the object already holds the pose, inline beats `.crate > *` without a specificity argument, and it can be asserted in happy-dom, which does not apply scoped CSS. pointer-events inherits, so SleeveArt and .divider-tab inside a flipped sleeve are covered too (nothing in them sets pointer-events: auto). The value applies as soon as index changes, so a sleeve still animating out is also excluded. Extend the comment at the `.crate` rule, or add one beside the new style entry, saying why flipped sleeves are excluded: they are invisible but tipped in front of the panel.\n\nDo not change: sleevePose, visibleRange or anything else in crateLayout.ts; onSleeveClick; useCrateFlip.ts; the .panel.front markup or its pointer events (pointer-events: none on the panel would let clicks reach the current sleeve and open the album, failing AC1). Do not remove flipped sleeves with v-if or display:none, and do not filter them out of `drawn`. Do not only add an offset \u003c 0 guard in the click handler, because the invisible sleeve would still be the hit target. Keep the visible back-sleeve behaviour (offset > 0 flips forward) and offset 0 opening the record.\n\nUnit test in apps/web/src/components/crate/CrateBox.test.ts: add a new `it` in the top-level describe with a clear name, e.g. 'keeps flipped sleeves drawn for the flip-out animation, without catching clicks'. Use the existing helper mountCrate(2); its fixture has three albums, so index 2 gives two flipped sleeves (offsets -2 and -1) plus the current one. Take `wrapper.findAll('.sleeve').filter((s) => !s.classes().includes('current'))`, assert length 2, and for each read `(s.element as HTMLElement).style` and assert transform === 'translateZ(40px) rotateX(-55deg)', opacity === '0' (adjust only the comparison form if happy-dom serialises it differently, not the meaning) and pointerEvents === 'none'. Also assert the `.sleeve.current` element has no inline 'none' for pointerEvents. The existing test 'flips to a record further back when you click its edge' must stay byte-for-byte unmodified.\n\nDo not create or edit .shipyard/checks/browser.mjs; the browser tester owns it. AC1, AC2, AC3, AC4 and AC6 are verified at test stage and depend on this fix being the only behaviour change.\n\nConventions: Prettier (no semis, single quotes, width 100, trailing commas). Commit as e.g. fix(web): stop invisible flipped sleeves catching clicks. No merge or push.\n\nBefore handing back, from the repo root run: npm test --workspace apps/web, npm test, npm run typecheck, npm run lint, npm run format:check. All must exit 0.","ownsFiles":["apps/web/src/components/crate/CrateBox.vue","apps/web/src/components/crate/CrateBox.test.ts"],"dependsOn":[],"criteriaIds":["AC1","AC2","AC3","AC4","AC5","AC6"],"model":"sonnet"}]},"testReport":{"criteria":[{"id":"AC5","verdict":"pass","evidence":"Test 'keeps flipped sleeves drawn for the flip-out animation, without catching clicks' exists in CrateBox.test.ts (line 84). It mounts at index 2 (mountCrate(2)), asserts exactly 2 non-current .sleeve elements are rendered, each with transform 'translateZ(40px) rotateX(-55deg)', opacity '0', pointerEvents 'none', and that the current sleeve is not pointer-events none. test-output.txt shows CrateBox.test.ts 10 tests passed; web suite 327/327 passed, no failures. 'flips to a record further back when you click its edge' (line 74) is unmodified: git diff ffb78fa HEAD on the file shows 16 insertions only, none touching that test; it asserts update:index [[2]] and no open."},{"id":"AC4","verdict":"pass","evidence":"Run by the harbormaster: node .shipyard/checks/browser.mjs exit 0, no FAIL line, PASS AC12/AC1/AC2/AC3, 99s. Only removed line against ffb78fa is the old process.exit, relocated. Output: cycles/1/ac4-output.txt"},{"id":"AC6","verdict":"pass","evidence":"Run by the harbormaster on a temp export of ffb78fa with the updated check: exit 1, FAIL AC1 (47 of 97), with FAIL lines naming tape label centre, left end and right end. With the fix, npm test, typecheck and lint exit 0. Output: cycles/1/ac6-output.txt"}],"observations":[]},"browserReport":{"criteria":[{"id":"AC1","verdict":"pass","evidence":"`node .shipyard/checks/browser.mjs` printed PASS AC1 with 98 of 98 samples ok (output: .shipyard/runs/2026-11-09T02-19-56/cycles/1/browser-output.txt). Covers 9 points at 2/4 and 3/4 for 1280 mouse, 390 mouse, 390 touch via Flip tap, and 1280 reached by wheel and by drag, plus (a), (b), (c). Example: '1280-mouse pos=2 / 4 via=ArrowDown point=\"tape label centre\" at=(640.0,749.0) hit=span.crate-label count=2 / 4->2 / 4 url=/crates/4'. Discrimination: the same script run on a scratch copy of ffb78fa source exited 1 with AC1 at 47 of 97 failing, e.g. 'FAIL AC1 1280-mouse pos=2 / 4 via=ArrowDown point=\"tape label centre\" ... hit=div.motif (in non-current .sleeve) count=2 / 4->1 / 4'. So the defect is reproduced and the fix removes it. Limit: (a) was asserted for forward flips (ArrowDown), the way AC1 reaches its positions. A no-wait click after a backward flip opens the album; see the first observation. If the owner reads 'a flip' in (a) to include backward flips, this criterion fails."},{"id":"AC2","verdict":"pass","evidence":"PASS AC2 with 21 of 21 samples ok. Mouse at 25%, 50%, 75% and 2px above panel top, touch at 50%, at 1280, 390 and 390 touch, positions 2/4 and 3/4, each opening the .now h2 a href, with Back restoring the crate URL and .count. Example: '1280-mouse pos=2 / 4 via=ArrowDown point=\"2px above panel top\" at=(640.0,665.7) hit=div.motif (in current .sleeve) opened=/albums/14 expected=/albums/14 backCount=2 / 4 backUrl=/crates/4'. Also 9-point deadSpots sweeps across the visible art (1280 at both positions, 390 at 3/4): dead=[]."},{"id":"AC3","verdict":"pass","evidence":"PASS AC3 with 12 of 12 samples ok at 1280. (a) scan found hit=p.edge (in non-current .sleeve) at y=465.5, click moved 2/4->3/4 with URL unchanged, 3-point sweep along the edge dead=[]. (b) Back button 2/4->1/4; 9-point sweeps of Back and Flip dead=[]. (c) ArrowUp 2->1 and 3->2. (d) wheel -120 on tape label 2->1 and 3->2; 3/4 was added because the clamp at 1/4 would hide a double step. (e) drag 80px from tape label: down 2->3, up 2->1, up 3->1, URL unchanged, no album opened."}],"observations":[{"what":"Clicking the tape label within about 20-30ms of a backward flip opens the album. Repeatable: ArrowUp then a click at delays of 0, 10 and 20ms opened /albums/N, while 30ms and 40ms did nothing, and it reproduces from both 3/4 and 2/4. Cause: the new current sleeve animates back from the tipped pose, in front of the panel, with pointer events on. A person would rarely hit a window this short. The script prints this as an OBS line and does not assert it. It is outside the fix's offset\u003c0 rule and may predate it (not checked on ffb78fa, where the same click landed on a flipped sleeve instead).","severity":"low"},{"what":"Confirmed the spec's open question: an invisible sleeve at offset 13 catches clicks. In a 16-record crate at 1/16 and 1280px, clicking above the visible stack (hit p.edge in a sleeve with opacity 0, top about 348 against 353 for the last visible sleeve) jumped to 14 / 16 with no visible target. This is a different defect from the flipped sleeves and the 4-record check cannot see it.","severity":"medium"},{"what":"The existing partA writes .shipyard/checks/ac12-long-{1280,390,320}.png, and these are tracked, so every run of the check leaves them modified in git status. They sit inside .shipyard and I left that code alone under AC4, but someone should decide whether to commit or restore them. .shipyard/checks/browser.mjs is also tracked and now modified.","severity":"low"},{"what":"Wheel: one -120 event moves one record even though WHEEL_STEP is 60, apparently because goTo reads a model value that has not yet updated within the tick. AC3(d) depends on this behaviour. A code reader would expect two steps.","severity":"low"},{"what":"Full script runtime was about 100s on the fixed build, of which AC1 to AC3 take about 76s. Dragging down from the tape label leaves .scene and its panel after about 40px, so that drag ends early and moves one record (2/4->3/4) rather than two.","severity":"low"}]},"defects":{"round":1,"defects":[{"id":"D1","criterion":"AC1","cause":"After a backward flip the new current sleeve (offset 0, pointer events on) animates up from the tipped pose, in front of the front panel. A click in the first 20-30ms lands on it and opens the album. Evidence: ArrowUp then label click at 0, 10 and 20ms opened /albums/N; 30 and 40ms did nothing; from 3/4 and 2/4.","verdictNote":"Tester passed AC1 with (a) asserted on forward flips only and flagged the limit. Harbormaster reads a flip as either direction, so AC1 fails.","task":"T1-fix1","files":["apps/web/src/components/crate/CrateBox.vue","apps/web/src/components/crate/CrateBox.test.ts"],"attempts":[{"round":0,"tried":"pointerEvents none on offset\u003c0 sleeves","result":"Fixes flipped sleeves; does not cover offset 0 sleeve animating back."}]}]},"tasks":[{"id":"T1","status":"done","commit":"f5f99b5","filesChanged":["apps/web/src/components/crate/CrateBox.vue","apps/web/src/components/crate/CrateBox.test.ts"],"report":"agents/dev-T1.md"}]}],"agents":[{"id":"dev-T1-fix1","body":"# dev-T1-fix1 report (saved by the harbormaster from the agent's final message)\n\nCommitted as 7622a3e. In CrateBox.vue, onSleeveClick takes the click event and, for offset 0, returns early when the click's clientX/clientY fall inside the .panel.front bounding rect. A zero-size rect never counts, so happy-dom's all-zero rects still open the record. Test added: 'ignores a click on the current sleeve that lands inside the crate front'. npm test (328), typecheck, lint and format:check pass. The dev did not run the browser check.\n"},{"id":"dev-T1","body":"# dev-T1 report (saved by the harbormaster from the agent's final message)\n\nT1 is done and committed as f5f99b5. It touches only the two owned files. The dev did not write this file, citing a standing rule against report files, so the harbormaster saved its message.\n\n- Fix: In apps/web/src/components/crate/CrateBox.vue, the :style object on div.sleeve now has `pointerEvents: offset \u003c 0 ? 'none' : undefined`, with a comment saying why. Nothing else changed, so onSleeveClick, crateLayout.ts, useCrateFlip.ts and the front panel are untouched.\n- Test: In apps/web/src/components/crate/CrateBox.test.ts the dev added 'keeps flipped sleeves drawn for the flip-out animation, without catching clicks'. At index 2 it checks the two flipped sleeves keep transform translateZ(40px) rotateX(-55deg) and opacity 0. It also checks they have pointerEvents none and that the current sleeve does not. The existing back-click test is unmodified.\n- Checks: npm test --workspace apps/web, npm test, npm run typecheck, npm run lint and npm run format:check all exited 0.\n- Not verified: The fix is not checked with real mouse or touch input. That is left to the browser tester.\n"}],"runDir":".shipyard/runs/2026-11-09T02-19-56","live":false,"stages":["intake","survey","plan","build","test","fix","report","done"],"tree":{"files":[{"path":"apps/web/src/components/crate/CrateBox.test.ts","add":29,"del":0,"wip":false},{"path":"apps/web/src/components/crate/CrateBox.vue","add":25,"del":3,"wip":false}],"total":2},"stateMtime":1794193025585.9521,"renderedAt":1794193025714}</script>
<script>
const D = JSON.parse(document.getElementById('run-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

const st = D.state || {};
const verdict = (st.verdict || 'pending').toLowerCase();
const crit = st.criteria || {};
const critKeys = Object.keys(crit);
const statements = {};
const checks = {};
(D.brief?.acceptanceCriteria || []).forEach(c => { statements[c.id] = c.statement; checks[c.id] = c.check; });
const keys = critKeys.length ? critKeys : Object.keys(statements);
const counts = { pass: 0, fail: 0, untested: 0 };
keys.forEach(k => { counts[(crit[k] || 'untested')] = (counts[(crit[k] || 'untested')] || 0) + 1; });
const total = keys.length || 1;

const parts = [];

const nowIdx = D.stages.indexOf(st.stage);
const T = s => { const t = Date.parse(s); return Number.isFinite(t) ? t : null; };
const dur = ms => {
  if (ms == null || ms < 0) return '';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}h${String(m).padStart(2, '0')}m` : m ? `${m}m${String(r).padStart(2, '0')}s` : `${r}s`;
};
// Elements carrying data-since tick every second, so the page looks alive
// between renders even while one long agent is working.
const since = (iso, end) => {
  const a = T(iso); if (a == null) return '—';
  const b = T(end);
  return b != null ? dur(b - a) : `<span data-since="${a}">${dur(Date.now() - a)}</span>`;
};
const times = st.stageTimes || {};
const pipeline = D.stages.filter(s => s !== 'done').map((s, i) => {
  const cls = D.live && i === nowIdx ? 'now' : (nowIdx > i || !D.live ? 'done' : '');
  const t = times[s];
  const clock = t?.start ? `<small>${since(t.start, (D.live && i === nowIdx) ? null : (t.end || null))}</small>` : '';
  return `<div class="${cls}">${s.toUpperCase()}${clock}</div>`;
}).join('');
const quietMs = D.stateMtime ? Date.now() - D.stateMtime : 0;
const active = Array.isArray(st.active) ? st.active : [];
const usage = Array.isArray(st.usage) ? st.usage : [];
const tokenTotal = usage.reduce((sum, u) => sum + (u.tokens ?? 0), 0);

parts.push(`
<header>
  <h1>SHIPYARD<small>AUTONOMOUS DEV YARD // ${D.live ? 'YARD ACTIVE' : 'RUN RECORD'}</small></h1>
  <div class="meta">
    ${D.live
      ? '<span class="chip verdict live"><span class="dot"></span>WORKING</span>'
      : `<span class="chip verdict v-${esc(verdict)}">${esc(verdict)}</span>`}
    <span class="chip">RUN <b>${esc(st.runId || '—')}</b></span>
    ${st.size ? `<span class="chip">SIZE <b>${esc(st.size)}</b></span>` : ''}
    ${usage.length ? `<span class="chip">TOKENS <b>${tokenTotal.toLocaleString('en-US')}</b></span>` : ''}
    ${st.startedAt ? `<span class="chip">ELAPSED <b>${since(st.startedAt, D.live ? null : st.endedAt)}</b></span>` : ''}
    ${D.live && active.length ? `<span class="chip live">CREW <b>${active.length}</b></span>` : ''}
    ${D.live ? `<span class="chip nosignal" id="nosignal" data-mtime="${D.stateMtime}" style="display:none">NO SIGNAL <b></b></span>` : ''}
    <span class="chip">CYCLE <b>${esc(st.cycle || '?')}/${esc(st.maxCycles || 3)}</b></span>
    ${st.fixRound ? `<span class="chip">FIX ROUND <b>${esc(st.fixRound)}/${esc(st.maxFixRounds || 3)}</b></span>` : ''}
    <span class="chip">BRANCH <b>${esc(st.branch || '—')}</b></span>
    <span class="chip">TARGET <b>${esc(st.target || '—')}</b></span>
    ${(st.fastPaths || []).map(f => `<span class="chip fast">FAST PATH <b>${esc(f)}</b></span>`).join('')}
  </div>
  <div class="pipe">${pipeline}</div>
  <div class="tele">
    <span>${D.live ? '◉ TELEMETRY LIVE — REFRESHING EVERY 4s' : '· TRANSMISSION ENDED'}</span>
    <span>STAGE: ${esc((st.stage || 'unknown').toUpperCase())}</span>
  </div>
</header>
${D.live ? '<div class="scan"><i></i></div>' : ''}
<div class="hazard"></div>`);

if (D.live && active.length) {
  parts.push(`<section><h2>Crew on deck — ${active.length} working</h2><div class="body"><div class="crew">
    ${active.map(a => {
      const t = T(a.since);
      const slow = t != null && Date.now() - t > 15 * 60 * 1000;
      return `<div class="hand${slow ? ' slow' : ''}"><div class="role"><span class="dot"></span>${esc(a.role || 'agent')}<span class="clock">${since(a.since)}</span></div>
        <div class="who">${esc(a.id || '?')}</div>
        ${a.task ? `<div class="sub" style="color:var(--grey);font-size:11px">${esc(a.task)}</div>` : ''}</div>`;
    }).join('')}
  </div></div></section>`);
}

if (D.tree && D.tree.total) {
  const wip = D.tree.files.filter(f => f.wip).length;
  const rows = D.tree.files.map(f => `<tr>
      <td class="mono">${f.wip ? '<span class="wip">●</span> ' : ''}${esc(f.path)}</td>
      <td class="num">${f.add == null ? (f.isNew ? '<span class="add">new</span>' : '') : f.add ? '<span class="add">+' + f.add + '</span>' : ''}</td>
      <td class="num">${f.del ? '<span class="del">−' + f.del + '</span>' : ''}</td></tr>`).join('');
  parts.push(`<section><h2>Working tree — ${D.tree.total} file${D.tree.total === 1 ? '' : 's'} changed${wip ? ', ' + wip + ' uncommitted' : ''}</h2><div class="body">
    <table><thead><tr><th>File ${wip ? '(● = being written)' : ''}</th><th style="text-align:right">Added</th><th style="text-align:right">Removed</th></tr></thead><tbody>${rows}</tbody></table>
    ${D.tree.total > D.tree.files.length ? '<p class="empty">Showing the first ' + D.tree.files.length + '.</p>' : ''}
  </div></section>`);
}

if (st.request || D.brief?.goal) {
  parts.push(`<section><h2>Work order</h2><div class="body">
    <pre>${esc(D.brief?.goal || st.request)}</pre>
    ${(D.brief?.assumptions || []).length ? '<p style="margin:11px 0 4px;color:var(--amber-dim);font-size:11px;letter-spacing:.2em">ASSUMPTIONS MADE</p><ul>' + D.brief.assumptions.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : ''}
  </div></section>`);
}

// Acceptance criteria
const bar = `<div class="bar">
  <i class="p" style="width:${counts.pass / total * 100}%"></i>
  <i class="f" style="width:${counts.fail / total * 100}%"></i>
  <i class="u" style="width:${counts.untested / total * 100}%"></i>
</div>`;
const cards = keys.length ? keys.map(k => {
  const s = crit[k] || 'untested';
  return `<div class="crit"><span class="id">${esc(k)}</span><span class="st ${esc(s)}">${s === 'pass' ? '◉ PASS' : s === 'fail' ? '✗ FAIL' : '· UNTESTED'}</span>
    <p>${esc(statements[k] || '')}</p>${checks[k] ? `<span class="tag">${esc(checks[k])}</span>` : ''}</div>`;
}).join('') : '<p class="empty">No acceptance criteria recorded — intake did not complete.</p>';
parts.push(`<section><h2>Acceptance criteria — ${counts.pass}/${keys.length || 0} pass</h2><div class="body">${keys.length ? bar : ''}<div class="grid">${cards}</div></div></section>`);

// Token use. The figures come straight from state.json's usage list.
if (usage.length) {
  const byRole = {};
  usage.forEach(u => {
    const r = byRole[u.role] || (byRole[u.role] = { agents: 0, tokens: 0 });
    r.agents++;
    r.tokens += u.tokens ?? 0;
  });
  const fmt = n => Number(n).toLocaleString('en-US');
  const roleRows = Object.entries(byRole).sort((a, b) => b[1].tokens - a[1].tokens).map(([role, r]) =>
    `<tr><td><b>${esc(role)}</b></td><td class="num">${r.agents}</td><td class="num">${fmt(r.tokens)}</td><td class="num">${tokenTotal ? Math.round(r.tokens / tokenTotal * 100) : 0}%</td></tr>`).join('');
  const agentRows = usage.map(u =>
    `<tr><td class="mono">${esc(u.agent)}${u.fixOf ? ' (fix of ' + esc(u.fixOf) + ')' : ''}</td><td>${esc(u.role)}</td><td>${esc(u.model || '—')}</td><td class="num">${u.tokens == null ? 'unavailable' : fmt(u.tokens)}</td><td class="num">${u.toolUses ?? '—'}</td></tr>`).join('');
  const unknown = usage.filter(u => u.tokens == null).length;
  const hasHarbormaster = usage.some(u => u.role === 'harbormaster');
  parts.push(`<section><h2>Token use — ${fmt(tokenTotal)} reported</h2><div class="body">
    <table><thead><tr><th>Role</th><th style="text-align:right">Agents</th><th style="text-align:right">Tokens</th><th style="text-align:right">Share</th></tr></thead><tbody>${roleRows}</tbody></table>
    ${hasHarbormaster ? '' : "<p class=\"empty\">The harbormaster's own tokens are not included: no figure was available.</p>"}
    ${unknown ? '<p class="empty">' + unknown + ' agent(s) reported no figure and count as 0, so the real total is higher.</p>' : ''}
    <details><summary>Per agent</summary><div class="inner"><table><thead><tr><th>Agent</th><th>Role</th><th>Model</th><th style="text-align:right">Tokens</th><th style="text-align:right">Tool uses</th></tr></thead><tbody>${agentRows}</tbody></table></div></details>
  </div></section>`);
}

// Cycles
(D.cycles || []).forEach(c => {
  const tasks = (c.plan?.tasks || []);
  const taskState = st.tasks || {};
  const rows = tasks.length ? tasks.map(t => {
    const s = taskState[t.id] || 'todo';
    return `<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.goal)}${t.model ? ` <span class="tag">${esc(t.model)}</span>` : ''}</td>
      <td class="mono">${esc((t.ownsFiles || []).join(', '))}</td>
      <td class="mono">${esc((t.dependsOn || []).join(', ') || '—')}</td>
      <td><span class="tag t-${esc(s)}">${esc(s)}</span></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No plan produced for this cycle.</td></tr>';

  parts.push(`<section><h2>Cycle ${esc(c.n)}</h2><div class="body">
    <div class="cycle-head"><h3>DELEGATION</h3></div>
    <table><thead><tr><th>Task</th><th>Goal</th><th>Owns files</th><th>After</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>
    ${c.spec ? '<details><summary>Manager spec — what it intended to build</summary><div class="inner"><pre>' + esc(c.spec) + '</pre></div></details>' : ''}
    ${c.testReport ? '<details><summary>Tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.testReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.browserReport ? '<details><summary>Browser tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.browserReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.defects ? '<details><summary>Triaged defects</summary><div class="inner"><pre>' + esc(JSON.stringify(c.defects, null, 2)) + '</pre></div></details>' : ''}
  </div></section>`);
});

// Deaths
if ((st.deaths || []).length) {
  parts.push(`<section><h2>Agent losses — ${st.deaths.length}</h2><div class="body"><table>
    <thead><tr><th>Agent</th><th>Reason</th><th>Detail</th></tr></thead><tbody>
    ${st.deaths.map(d => `<tr><td><b>${esc(d.agentId || d.agent || '?')}</b></td><td class="fail">${esc(d.reason)}</td><td class="mono">${esc(d.detail)}</td></tr>`).join('')}
    </tbody></table></div></section>`);
}

if (D.reportMd) {
  parts.push(`<section><h2>Report</h2><div class="body"><pre>${esc(D.reportMd)}</pre></div></section>`);
}

if ((D.agents || []).length) {
  parts.push(`<section><h2>Crew logs — ${D.agents.length} agents</h2><div class="body">
    ${D.agents.map(a => '<details><summary>' + esc(a.id) + '</summary><div class="inner"><pre>' + esc(a.body) + '</pre></div></details>').join('')}
  </div></section>`);
}

if (D.ledger) {
  parts.push(`<section><h2>Harbormaster log</h2><div class="body"><pre>${esc(D.ledger)}</pre></div></section>`);
}

parts.push(`<div class="hazard"></div><footer>
  SHIPYARD // ${esc(D.runDir)}<br>
  ${D.live
    ? 'YARD ACTIVE — this page reloads itself. Leave the tab open.'
    : 'TRANSMISSION ENDED — this page is final and will not reload.'}
</footer>`);
document.getElementById('app').innerHTML = parts.join('');

// Tick the clocks between reloads, and raise NO SIGNAL if the harbormaster
// has not written state.json for a long time while the run claims to be live.
(function tick(){
  const fmt = ms => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + 'h' + String(m).padStart(2, '0') + 'm' : m ? m + 'm' + String(r).padStart(2, '0') + 's' : r + 's';
  };
  const QUIET = 20 * 60 * 1000;
  function step(){
    document.querySelectorAll('[data-since]').forEach(n => { n.textContent = fmt(Date.now() - +n.dataset.since); });
    const ns = document.getElementById('nosignal');
    if (ns && +ns.dataset.mtime) {
      const q = Date.now() - +ns.dataset.mtime;
      ns.style.display = q > QUIET ? '' : 'none';
      ns.querySelector('b').textContent = fmt(q);
    }
  }
  step(); setInterval(step, 1000);
})();

// A meta-refresh is a full reload, which would slam every <details> shut and
// jump you back to the top mid-read. Persist what the reader opened and where
// they were, keyed by run so two tabs do not fight. sessionStorage, not local:
// this is view state, and it should die with the tab.
(function preserveReadingState(){
  const KEY = 'shipyard:' + (D.state?.runId || 'run');
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}') } catch {}

  const summaries = () => [...document.querySelectorAll('details')];

  summaries().forEach(d => {
    const label = d.querySelector('summary')?.textContent?.trim();
    if (label && saved.open && saved.open.includes(label)) d.open = true;
    d.addEventListener('toggle', save);
  });

  if (typeof saved.scroll === 'number') window.scrollTo(0, saved.scroll);

  function save(){
    const open = summaries().filter(d => d.open)
      .map(d => d.querySelector('summary')?.textContent?.trim())
      .filter(Boolean);
    try { sessionStorage.setItem(KEY, JSON.stringify({ open, scroll: window.scrollY })) } catch {}
  }

  let t;
  window.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(save, 150) }, { passive: true });
  window.addEventListener('beforeunload', save);
})();
</script>
