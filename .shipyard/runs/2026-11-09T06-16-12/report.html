<title>SHIPYARD // 2026-11-09T06-16-12</title>
<style>
:root{
  --bg:#0b0a08; --panel:#15120d; --panel2:#1d1812;
  --amber:#ffb53d; --amber-dim:#8a6224; --amber-glow:rgba(255,181,61,.25);
  --green:#7ddba0; --red:#ff6b4a; --grey:#6b6354;
  --rule:#3a3024;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  color:var(--amber); font-size:13px; line-height:1.55;
  padding:24px; max-width:1180px; margin:0 auto;
  text-shadow:0 0 1px var(--amber-glow);
}
/* CRT scanlines */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:98;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);
}
a{color:var(--amber)}
.hazard{height:8px;background:repeating-linear-gradient(45deg,var(--amber-dim) 0 10px,#0b0a08 10px 20px);margin:14px 0;opacity:.6}
header{border:2px solid var(--amber-dim);background:var(--panel);padding:14px 16px;position:relative}
header h1{margin:0;font-size:22px;letter-spacing:.42em;font-weight:700}
header h1 small{letter-spacing:.1em;font-size:11px;color:var(--amber-dim);display:block;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{border:1px solid var(--rule);background:var(--panel2);padding:3px 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-dim)}
.chip b{color:var(--amber);font-weight:600}
.verdict{border-width:2px;padding:4px 12px;font-weight:700;letter-spacing:.2em}
.v-shipped{border-color:var(--green);color:var(--green)}
.v-failed{border-color:var(--red);color:var(--red)}
.v-partial,.v-pending{border-color:var(--amber);color:var(--amber)}
section{border:1px solid var(--rule);background:var(--panel);margin:18px 0}
section>h2{
  margin:0;padding:8px 14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  background:var(--panel2);border-bottom:1px solid var(--rule);color:var(--amber-dim);
}
section>.body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.crit{border:1px solid var(--rule);padding:9px 11px;background:var(--panel2)}
.crit .id{font-weight:700;letter-spacing:.14em}
.crit .st{float:right;font-size:11px;letter-spacing:.14em}
.pass{color:var(--green)} .fail{color:var(--red)} .untested{color:var(--grey)}
.crit p{margin:6px 0 0;color:#d9c9a6;font-size:12px}
.bar{height:16px;border:1px solid var(--rule);background:#0c0a07;display:flex;margin-bottom:14px}
.bar i{display:block;height:100%}
.bar i.p{background:var(--green)} .bar i.f{background:var(--red)} .bar i.u{background:#2a2419}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--amber-dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
td.mono{color:#d9c9a6}
.tag{border:1px solid var(--rule);padding:1px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-dim)}
.t-done{border-color:var(--green);color:var(--green)}
.t-blocked{border-color:var(--red);color:var(--red)}
pre{background:#0c0a07;border:1px solid var(--rule);padding:11px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#d9c9a6;font-size:12px;margin:0}
details{border:1px solid var(--rule);background:var(--panel2);margin:7px 0}
details>summary{padding:7px 11px;cursor:pointer;letter-spacing:.14em;font-size:11px;text-transform:uppercase;color:var(--amber-dim)}
details[open]>summary{border-bottom:1px solid var(--rule);color:var(--amber)}
details .inner{padding:11px}
.cycle-head{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.cycle-head h3{margin:0;font-size:13px;letter-spacing:.26em}
.empty{color:var(--grey);font-style:italic}
footer{color:var(--grey);font-size:11px;letter-spacing:.14em;text-align:center;padding:18px 0}
@media print{body::before,body::after{display:none}}

/* ── live telemetry ─────────────────────────────────────── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(420%)}}
@keyframes flicker{0%,100%{opacity:1}97%{opacity:1}98%{opacity:.82}99%{opacity:1}}
header{animation:flicker 7s infinite}
.live{border-color:var(--green)!important;color:var(--green)!important}
.live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;animation:pulse 1.1s infinite;box-shadow:0 0 6px var(--green)}
.scan{position:relative;overflow:hidden;height:3px;background:#0c0a07;border:1px solid var(--rule);border-left:0;border-right:0;margin:0}
.scan i{position:absolute;top:0;left:0;height:100%;width:24%;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 2.4s linear infinite}
/* stage pipeline */
.pipe{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--rule);background:#0c0a07}
.pipe div{flex:1;text-align:center;padding:7px 2px;font-size:10px;letter-spacing:.18em;color:#3b3225;border-right:1px solid var(--rule);position:relative}
.pipe div:last-child{border-right:0}
.pipe div.done{color:var(--amber-dim);background:#140f09}
.pipe div.now{color:#0b0a08;background:var(--amber);font-weight:700;animation:pulse 1.6s infinite}
.tele{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--grey);margin-top:6px}
.pipe div small{display:block;font-size:9px;letter-spacing:.08em;margin-top:2px;opacity:.85}
.nosignal{border-color:var(--red)!important;color:var(--red)!important;animation:pulse 1.6s infinite}
.fast{border-color:var(--green);color:var(--green)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hand{border:1px solid var(--green);background:var(--panel2);padding:9px 11px}
.hand .role{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.hand .role .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.1s infinite}
.hand .who{font-weight:700;margin:4px 0 2px}
.hand .clock{float:right;color:#e8d5ad}
.hand.slow{border-color:var(--amber)}
td.num{text-align:right;white-space:nowrap}
.add{color:var(--green)} .del{color:var(--red)}
.wip{color:var(--green);animation:pulse 1.1s infinite}
</style>
</head>

Uses":28,"durationMs":279023},{"agent":"dev-dev-admin","role":"dev","model":"opus","tokens":92282,"toolUses":33,"durationMs":346403},{"agent":"dev-admin-web","role":"dev","model":"opus","tokens":115751,"toolUses":37,"durationMs":669326},{"agent":"tester","role":"tester","model":"sonnet","tokens":27601,"toolUses":8,"durationMs":29724},{"agent":"browser-tester","role":"browser-tester","model":"opus","tokens":140764,"toolUses":37,"durationMs":945061},{"agent":"reporter","role":"reporter","model":"sonnet","tokens":20078,"toolUses":7,"durationMs":23816}]},"brief":{"goal":"Add an admin-only panel at /admin. It lists all news, all crates (suggested and user-created) and all users, and lets an admin grant or revoke the verified tag. Admins can also create news and crates, singly or in bulk, that appear on the public front end. An admin@frisson.com / admin login is added to the existing users idempotently, with no data reset, and never in production.","constraints":["Admin account path: add a new idempotent step (for example ensureDevAdmin in apps/api/src/services/) called from apps/api/src/server.ts after bootstrapFromEnv. It only ever inserts one users row. It must not call db:seed, delete or update any existing row, or change an existing account's password or role.","The existing bootstrapAdmin cannot be reused as it stands, for two reasons. It does nothing when any admin already exists. Its createUser call goes through hashPassword, which throws 400 for passwords under 8 characters, and a thrown error in that server.ts try block exits the process. So ADMIN_PASSWORD=admin would stop the app from starting.","The 8-character minimum stays in force for signup, hashPassword's public behaviour and ADMIN_EMAIL/ADMIN_PASSWORD bootstrap. The short password is allowed only inside the dev-admin step, through a narrowly scoped internal hash path. apps/api/test/passwords.test.ts and the signup test in apps/api/test/auth-accounts.test.ts must pass unchanged.","Production guard: the dev-admin step never runs when NODE_ENV=production, whatever other variables are set. The Dockerfile already sets NODE_ENV=production. SEED_DEV_ADMIN=false disables it in other environments, following the shouldSeedDemo pattern, and SEED_DEV_ADMIN=true cannot override production. Production admins continue to come only from ADMIN_EMAIL/ADMIN_PASSWORD. A failure in this step is logged and must not stop the API from starting.","The plaintext password must never be logged. password_hash must never appear in any API response.","All new endpoints live under /api/admin/*, are registered in a new routes file with prefix /api, and call the existing requireAdmin from apps/api/src/services/permissions.ts, which stays the single authority. Verification reuses the existing PATCH /api/users/:username/verified route and setVerified.","Suggested means crates.recommended_rank is non-NULL, the same column that drives Home's Recommended crates section. Do not add a second flag.","Admin-created news uses the existing news_items table. seed_key is NOT NULL UNIQUE, so generate a key such as admin:\u003cuuid>. It must never collide with the demo 'news:' keys and must not appear in any response. Any migration must be additive and must keep existing rows.","Follow the repo's conventions: Vue view plus Pinia session store (session.isAdmin), a router meta guard next to requiresAuth, shared zod schemas in packages/shared, Prettier and ESLint, Conventional Commits, data-classification comments. The users list is CONFIDENTIAL PII.","Document the dev-admin step and SEED_DEV_ADMIN in README.md, docs/DEPLOY.md and .env.example.","Browser and command checks run on a temporary DATA_DIR or a temporary copy of the database, never on the owner's data/crate.db.","Out of scope: changing roles, deleting or suspending users, password reset or change, audit log, deleting demo rows permanently, and any real news feed or AI recommendations."],"assumptions":["'crates by the suggestions, by user created' is read as one crates view with two sections: Suggested (recommended_rank set, in rank order) and User created (all other crates, each showing its owner). Please confirm.","'Seed ... as the console admin' is read, as the brief instructs, as creating content from the panel UI, plus a bulk JSON paste form for crates-with-records and news. No CLI seed command is added.","Admin-created crates are owned by the signed-in admin. There is no 'create on behalf of another user'.","Records are added to a single-form crate through the existing /albums/new?crateId= editor, which admins can already use, or through the bulk form. Crate editing and deletion stay on the existing /crates page, which the panel links to. Deleting a crate that still holds records keeps the existing 409.","'Any other admin like things' is limited to: overview counts, the suggested on/off toggle, and news edit and delete. Anything further is left for a later run so this contract stays small.","The login is dev-only, as decided in this brief from the repo's existing NODE_ENV and Dockerfile pattern. On a production deployment the owner would set ADMIN_EMAIL=admin@frisson.com with a strong ADMIN_PASSWORD. If the owner really wants password 'admin' in production, that decision has to be made explicitly.","If admin@frisson.com already belongs to an ordinary account, the step refuses to promote it. It logs a warning and leaves the row untouched, matching bootstrap's existing 'refuse to promote silently' rule. The owner's data/crate.db was not inspected, so whether that email already exists there is unknown.","The account's username is 'admin', or the next free admin-N if that is taken, the same rule as freeAdminUsername. The display name is 'Admin'.","Non-admins who open /admin are redirected to home rather than shown a 403 page. Signed-out visitors go to login with ?next=/admin.","New news defaults publishedAt to the current time, which places it above the demo news (all dated in the past). Bulk import is not de-duplicated, so pasting the same JSON twice creates duplicates."],"risks":["Password 'admin' is trivially guessable and below the app's own 8-character policy. It is requested by the owner and accepted for local development only. The guard is the NODE_ENV=production refusal plus the API's default loopback bind (HOST 127.0.0.1).","The guard fails open if NODE_ENV is unset on an internet-facing host started outside the Dockerfile or Compose. The same weakness exists in shouldSeedDemo. DEPLOY.md must say so.","The credential travels with the data. A dev database restored to production through db:backup/db:restore, or a copied file, carries the working admin/admin row, and the production guard only stops creation. DEPLOY.md must tell operators to remove that row or use a clean production database. A startup check that detects it is a sensible follow-up.","If the target database has no admin yet and ADMIN_EMAIL is unset, the dev admin becomes the earliest admin. The existing bootstrap then assigns every ownerless crate to it on the next start. That changes owner_id on those crates, by existing design. Running after bootstrapFromEnv keeps a real ADMIN_EMAIL admin first, and when an earlier admin exists nothing changes.","Demo rows come back after deletion. seedDemoContent re-inserts any missing demo news or crate on every start while seeding is on, which is the default outside production. A demo news item deleted from the panel returns on restart, though admin-created rows do not. Edited demo rows stay edited because they are matched by key. The panel should state this next to delete, or the owner may read it as a bug.","Panel-created content is real data in the owner's database. There is no audit trail and no undo, and bulk import can add many rows at once. Run db:backup before bulk imports.","The API's body size limit may constrain large bulk pastes, because the repo sets no explicit bodyLimit and Fastify's default of about 1 MB applies. An oversized paste must fail as a clean error with nothing written, not partially.","The users list exposes every email address to any admin, by design. Only admin-only routes may return it.","Browser checks run in Chromium only, as in earlier runs."],"acceptanceCriteria":[{"id":"AC1","statement":"A test in apps/api/test/ populates a database with users, crates, albums, tracks, follows and news, then runs the dev-admin step with NODE_ENV unset. Exactly one new users row exists, with email admin@frisson.com and role admin, and logging in through the existing login endpoint with admin@frisson.com / admin returns 200. Every row that existed before is deep-equal to its earlier value. A second run adds no row and leaves that account's password_hash byte-identical.","check":"unit"},{"id":"AC2","statement":"Tests prove each of the following. (a) NODE_ENV=production creates no row, including with SEED_DEV_ADMIN=true. (b) SEED_DEV_ADMIN=false creates no row. (c) If admin@frisson.com already belongs to a role=user account, that row is unchanged (role and hash), a warning is logged, and nothing throws. (d) If username 'admin' is taken by another account, the new account gets admin-2 and that other account is unchanged. (e) No log output contains the plaintext password. (f) Signup with a 5-character password still returns 400, and hashPassword('admin') still rejects.","check":"unit"},{"id":"AC3","statement":"Start the real API (node apps/api/src/server.ts, with NODE_ENV unset and SEED_DEMO_DATA=false) against a temporary database already holding users, crates, albums and news, then stop it and start it again. After both starts, every table's pre-existing rows are identical to a dump taken before the first start (the only allowed difference is the one added admin users row), and the users count has risen by exactly 1. POST login with admin@frisson.com / admin returns 200, and the session's user has role admin. A third start with NODE_ENV=production on a separate temporary database that has no such account does not create it, and login there returns 401.","check":"command"},{"id":"AC4","statement":"A test enumerates every route registered under /api/admin (collected from the Fastify app with an onRoute hook, not a hand-written list), and asserts the list is non-empty, plus PATCH /api/users/:username/verified. Each route returns 401 when signed out and 403 when signed in as a role=user account. Table row counts are unchanged after those refused calls. The same test confirms that an admin session does not receive 401 or 403 on those routes.","check":"api"},{"id":"AC5","statement":"As an admin, GET /api/admin/overview returns correct counts of users, crates, suggested crates, albums and news for a known fixture. GET /api/admin/users returns every user, including role=user and demo users, each with id, email, username, displayName, role, verified, an isDemo boolean, createdAt and crateCount. A recursive check of the serialized response finds no passwordHash, password_hash or demoSeedKey key. After PATCH /api/users/:username/verified with {verified:true}, that user shows verified:true in GET /api/admin/users and on the public profile response. After {verified:false}, both show false.","check":"api"},{"id":"AC6","statement":"As an admin, GET /api/admin/crates returns every crate, including ownerless ones, with id, name, ownerUsername (null if ownerless), albumCount, recommendedRank and createdAt. POST /api/admin/crates with {name, suggested:true} creates a crate owned by the admin, which appears in public GET /api/crates and last in public recommended-crates order. PATCH /api/admin/crates/:id/suggested with {suggested:false} sets recommendedRank to null and removes it from the recommended list; {suggested:true} adds it back at the end. Suggesting an ownerless crate returns 409, and an unknown id returns 404.","check":"api"},{"id":"AC7","statement":"As an admin: POST /api/admin/news with title, summary and source returns 201, and the item appears first in public GET /api/news (signed out) with no seedKey field. PATCH /api/admin/news/:id changes the fields seen in public GET /api/news. DELETE /api/admin/news/:id removes the item from it. A missing or blank title, summary or source returns 400 and writes no row. An unknown id returns 404. After running seedDemoContent, the admin-created item is still present and unchanged, and there are no duplicate rows.","check":"api"},{"id":"AC8","statement":"As an admin, POST /api/admin/import with {crates:[{name, label?, color?, suggested?, albums?:[{title, artist, year?, genre?, format?, tracks?}]}], news:[{title, summary, source, publishedAt?}]} creates everything and returns the created counts. The crates, their albums and tracks, and the news are then readable through the public crate, album and news endpoints. A payload with one invalid entry anywhere (for example, the last album with no artist) returns 400 naming the failing entry, and all table row counts are unchanged, proving all-or-nothing.","check":"api"},{"id":"AC9","statement":"Web unit tests: visiting /admin signed out redirects to login with next=/admin, as role=user redirects to home, and as admin renders the panel with sections labelled News, Suggested crates, User created crates and Users. Those sections show fixture items from each API list, including owner names. The account menu shows an Admin link for an admin and no such link for role=user. A failed API load shows an error message, not an empty list.","check":"unit"},{"id":"AC10","statement":"Real browser, temporary database, 1280px wide. Type admin@frisson.com and admin into the /login form and submit, open the account menu, and click Admin, which lands on /admin. Use the panel forms to create a news item and a crate with Suggested on; both appear in the panel without a page reload. In a separate signed-out browser context, / shows the news item under Music news and the crate under Recommended crates, and /list shows the crate. In a third context, signed in as a role=user account, going to /admin directly ends on / with no panel content visible.","check":"browser"},{"id":"AC11","statement":"Same browser pass, as admin. Click the verify control on a user in the Users section; without a reload the row shows verified, and that user's public /u/:username page in a signed-out context shows the verified badge. Click it again and the badge is gone after a reload. Paste a valid JSON payload holding a crate with 2 albums and a news item into the bulk form and submit: a success count shows, the crate opens at /crates/:id showing both records, and the news shows on /. Pasting invalid JSON shows an inline error and adds nothing. At 1280px and 390px wide, /admin has no page-level horizontal overflow (document scrollWidth \u003c= viewport width), and the verify and create controls can be clicked with real mouse and touch input at those widths respectively.","check":"browser"},{"id":"AC12","statement":"From the repo root, npm run format:check, npm run lint, npm run typecheck, npm test and npm run build all exit 0. Every test in the baseline (717 tests: 360 API, 357 web) still passes, or any that had to change is listed with the reason in the run report; passwords.test.ts and auth-accounts.test.ts must not be among those changed.","check":"command"}]},"map":{"commit":"8f53e0411f0821d4812a7dc33cda9aefd07cde0f","testCommand":"npm test","structure":{"layout":"npm workspaces monorepo (packages/*, apps/*), ESM, Node >=22.18, package name frisson","language":"TypeScript ~5.8.3; the API runs .ts directly via node","packages":{"apps/web":"@frisson/web. Vue 3, Vue Router, Pinia SPA on Vite 6. Typecheck with vue-tsc. Sources in apps/web/src (components, views, stores, composables, utils, forms, router, App).","apps/api":"@frisson/api. Fastify 5 with zod type provider. SQLite via better-sqlite3 and drizzle-orm. Tests in apps/api/test.","packages/shared":"@frisson/shared. Zod schemas and sorting. Typecheck only."},"buildSystem":"Root scripts: dev, build, typecheck, test, lint (eslint .), format, format:check. Playwright ^1.65 is a root dev dependency."},"tests":{"runner":"vitest ^3.2 in apps/web (happy-dom, @vue/test-utils) and apps/api","testCommand":"npm test","notes":"Run from the repo root. Single file: npm test -w apps/web -- src/views/CrateView.test.ts. Typecheck: npm run typecheck. Lint: npm run lint.","locations":"apps/api/test/*.test.ts; apps/web/src/**/*.test.ts colocated with source","baseline":"exit 0, 357 tests in 32 files, about 8s","browser":"No Playwright config or e2e script. .shipyard/checks/browser.mjs is a Playwright script printing PASS/FAIL per criterion. README documents DATA_DIR temp + SEED_DEMO_DATA=false for browser checks."},"conventions":{"formatting":"Prettier: no semis, single quotes, width 100, trailing commas all. Editorconfig: lf, 2 spaces.","lint":"ESLint 9 flat config with eslint-plugin-vue flat/essential and @vue/eslint-config-typescript. Prettier owns style.","ci":".github/workflows/ci.yml: npm ci, format:check, lint, typecheck, test, build, plus docker smoke test","webStructure":"src/api, stores (Pinia), views (*View.vue), components by feature (album/, crate/, forms/, profile/), composables (useXxx.ts), utils (plain functions)","naming":"Vue files PascalCase; composables useXxx.ts; tests *.test.ts next to source","git":"Conventional Commits with scope, e.g. fix(web): ...; ADRs for significant decisions"},"documentation":{"files":["README.md","docs/SPEC.md","docs/DEPLOY.md","docs/adr/0001-0006",".github/pull_request_template.md"],"gaps":"No CLAUDE.md, CONTRIBUTING or CHANGELOG. docs/SPEC.md repo tree is an early plan and differs from the actual files."},"relevant":{"stack":"npm workspaces: apps/api (Fastify + zod type provider, drizzle-orm + better-sqlite3), apps/web (Vue 3, vue-router, pinia, vitest), packages/shared (@frisson/shared, zod schemas in packages/shared/src/index.ts). Docs: docs/SPEC.md, docs/adr/0006-following-home-and-demo-content.md.","user_model_and_auth":{"table":"users in /Users/thomasfuhriman/code/crate-digger/apps/api/src/db/schema.ts: id, email(unique, lowercased), username(unique, lowercased), displayName, passwordHash, role enum USER_ROLES=['user','admin'] default 'user', createdAt, bio, location, avatarPath, verified (boolean, default false, 'set by admins only'), demoSeedKey(unique, nullable). Related: user_links, sessions, follows.","password_hashing":"scrypt, format scrypt$N$r$p$salt$hash, /apps/api/src/services/passwords.ts. hashPassword throws 400 under MIN_PASSWORD_LENGTH=8. Shared signup schema (packages/shared/src/index.ts ~line 198) requires password min 8, max 200. Login schema (~line 204) is email + password min(1), so login with password 'admin' passes validation, but a stored 'admin' hash can't be created through createUser/hashPassword (it would throw 400 for 5 chars). A seed would have to bypass the length check.","session":"Opaque random token in cookie 'frisson_session' (httpOnly, sameSite lax, secure in production). DB sessions.id = sha256 of the token, expiresAt. apps/api/src/plugins/auth.ts sets request.user (PublicUser|null) in an onRequest hook via services/sessions.ts findSessionUser. No JWT. Login route in apps/api/src/routes/auth.ts (rate limited, verifyPassword plus verifyAgainstDummy for timing). services/users.ts: createUser(db,input,role), findUserByEmail/Username, toPublicUser (id,email,username,displayName,role,avatarUrl,verified).","existing_admin_role":"Yes. Role 'admin' exists. services/permissions.ts has requireUser, canEditOwner, assertCanEditCrate/Album (admins edit everything), and requireAdmin(user) (401/403). No admin route prefix, no admin plugin or middleware, no /api/admin routes.","only_existing_admin_endpoint":"PUT-style route '/users/:username/verified' in apps/api/src/routes/profiles.ts (~line 33), guarded by requireAdmin, calling setVerified in services/profiles.ts (~line 147). Web client in apps/web/src/api/profiles.ts.","admin_bootstrap":"apps/api/src/services/bootstrap.ts bootstrapAdmin/bootstrapFromEnv, run in apps/api/src/server.ts on every start, before listen. If no admin exists and ADMIN_EMAIL and ADMIN_PASSWORD are both set, it creates one via createUser (username 'admin', or admin-2 etc if taken, displayName 'Admin'). It never changes an existing admin's password. It also assigns all ownerless crates (ownerId NULL) to the earliest admin. /Users/thomasfuhriman/code/crate-digger/.env currently has ADMIN_EMAIL=trf@frission.com (so an admin may already exist with that email in the DB; .env.example has ADMIN_EMAIL= and SEED_DEMO_DATA=). Dockerfile comments document ADMIN_EMAIL/ADMIN_PASSWORD (min 8 chars). Test: apps/api/test/bootstrap.test.ts."},"db_schema_and_migrations":{"mechanism":"drizzle-kit generated SQL in apps/api/drizzle/ (0000_init, 0001_crate_sort_by, 0002_album_spin_count, 0003_accounts, 0004_user_profiles, 0005_follows_news_demo) with meta/_journal.json and snapshots. Generate with `npm run db:generate -w apps/api`; drizzle.config.ts in apps/api. createDb() in apps/api/src/db/client.ts runs migrate() automatically on open (foreign_keys ON, WAL), so migrations apply at API start, including buildApp via plugins/db.ts. Tests use ':memory:'.","tables":"users, user_links, sessions, crates, albums, tracks, follows, news_items.","non_destructive_data_at_start":"server.ts after buildApp: bootstrapFromEnv, then seedDemoFromEnv (services/demo-seed.ts) inside try/catch. Both are idempotent, insert-only, matched by seed key. The pattern to extend is: add a step in server.ts or a service that upserts a user by email/key without touching existing rows. The `npm run db:seed` script (apps/api/src/db/seed.ts) also exists.","demo_seed":"services/demo-seed.ts seedDemoContent/seedDemoFromEnv/shouldSeedDemo (SEED_DEMO_DATA 'true' always, 'false' never, else on unless NODE_ENV=production). Content in apps/api/src/db/demo-content.ts (DEMO_USERS, DEMO_CRATES with recommendedRank and albums/sides, DEMO_NEWS). Demo users get passwordHash 'demo-account-no-login' (can never log in), verified false, role user. One transaction; collision on username/email skips that demo user and its crates. Tests: apps/api/test/demo-seed.test.ts, migration.test.ts, schema.test.ts."},"news":{"model":"news_items: id, seedKey (NOT NULL unique), title, summary, source, publishedAt, createdAt. No author, no published flag, no url, no image.","api":"GET /api/news only (apps/api/src/routes/news.ts, public), services/news.ts listNews (newest first, no seedKey in response). Shared schema newsItem {id,title,summary,source,publishedAt}. No create/update/delete route exists.","frontend":"apps/web/src/views/HomeView.vue 'Music news' section (uses useAsyncSection(listNews) from apps/web/src/api/news.ts); AboutView.vue says news is demo data. Tests: apps/api/test/news.test.ts, feed.test.ts; apps/web/src/views/HomeView.test.ts."},"crates":{"model":"crates: id, name, color, label, sortBy, sortOrder, ownerId (FK users, set null on delete; NULL = legacy admin-only), demoSeedKey (unique, nullable = demo crate), recommendedRank (nullable; non-null = recommended, ascending order on Home), timestamps. albums (crateId restrict FK, demoSeedKey) and tracks (cascade).","suggested_vs_user_created":"No 'suggestion' table or status. The closest concept is crates.recommendedRank (curated/recommended on Home; only set by seed data, no API to set it) and demoSeedKey (demo vs real). User-created = ownerId set to a real user. The word 'suggest' does not appear as a feature.","api":"apps/api/src/routes/crates.ts: GET /crates, GET /crates/recommended (crateCard: id,name,color,label,albumCount,createdAt,ownerUsername,ownerDisplayName), GET /crates/:id, POST /crates, PATCH /crates/:id, DELETE /crates/:id (409 if it has records), PUT /crates/order. Logic in services/crates.ts (listRecommendedCrates ~line 64 filters isNotNull recommendedRank). Albums routes: routes/albums.ts, covers: routes/covers.ts.","frontend":"HomeView.vue (recommended crates + news + following), CrateView.vue (/shelf and /crates/:id), CratesView.vue (/crates, requiresAuth, uses session.isAdmin for actions), LibraryView.vue (/list), ProfileView/MyProfileView/FollowingView, CrateBox.vue, CrateSettings.vue, apps/web/src/api/crates.ts, utils/permissions.ts (admin or owner may edit). Tests: apps/api/test/crates.test.ts, ownership.test.ts, recommended.test.ts, sorting.test.ts; web CrateView.test.ts, crateActions.test.ts, editControls.test.ts, CrateBox.test.ts, utils/permissions.test.ts."},"verified_badge":"Exists. users.verified column, publicUser.verified, apps/web/src/components/profile/VerifiedBadge.vue (+ test), shown in AccountMenu.vue, ProfileView.vue, FollowingView.vue. Admin toggle API exists (route above) but no admin UI calls it that I confirmed beyond apps/web/src/api/profiles.ts. Tests in apps/api/test/profiles.test.ts (26 hits), shared-profile.test.ts, ProfileView.test.ts.","web_routing":"apps/web/src/router.ts. Routes: / home, /shelf, /list, /crates (requiresAuth), /crates/:id, /following (requiresAuth), /about, /login, /signup, /albums/:id, /albums/new, /albums/:id/edit, /u/:username, /profile, /profile/edit (requiresAuth), catch-all not-found. Guard router.beforeEach: awaits session.load(); only checks meta.requiresAuth and redirects to login with ?next. No admin-only meta or guard; no /admin route. Meta type declares requiresAuth only (line ~10). router.test.ts tests routes. Session store: apps/web/src/stores/session.ts (isAdmin computed from user.role, signedIn). Nav: apps/web/src/App.vue (not opened) and components/AccountMenu.vue (shows VerifiedBadge); App.test.ts exists.","reports_moderation":"Absent. No report, flag, or moderation tables, routes or UI. Grep hits for report/flag/suggest are unrelated (follows, form code).","other_notes":"Public-data rule: numeric user ids are avoided in public payloads (follows). Shared exports needed for new API shapes live in packages/shared/src/index.ts. apps/api/dist/ contains stale built JS, ignore it. Test helpers: apps/api/test/helpers.ts. Email in .env is 'frission.com' while the request says admin@frisson.com."}},"ledger":"# Ledger 2026-11-09T06-16-12\n\n- 2026-11-09T06:16:21Z Preflight done. Size standard (requested). Branch shipyard/admin-panel-2026-11-09T06-16-12.\n- 2026-11-09T06:16:54Z Baseline: npm test exit 0, 357 tests in 32 files, ~8s wall. Survey cache accepted (27 files changed, no manifests); relevant surveyor only. Intake and surveyor dispatched in parallel.\n- 2026-11-09T06:19:36Z Brief accepted (12 AC, 2 browser). .env sets no NODE_ENV, so the dev-admin step will run on the owner's local DB at next API start. Playwright already present. Manager dispatched.\n- 2026-11-09T06:29:46Z admin-api done (90dead2). Guard removal made 3 AC4 tests fail, restored.\n- 2026-11-09T06:31:06Z dev-admin done (6f8406a). Owner dev server (node --watch) restarted on edits, may have inserted the admin row into data/crate.db, as the owner requested.\n- 2026-11-09T06:31:15Z Read-only check of data/crate.db: dev admin present, sole admin, 0 ownerless crates. admin-web dispatched.\n- 2026-11-09T06:42:47Z admin-web done (e47d46c). Foreign uncommitted App.vue edit found, left untouched; gate run on clean export of HEAD.\n- 2026-11-09T06:43:30Z Owner confirmed the App.vue edit was theirs and removed it; tree clean. Gate exit 0 on all five commands. Testers dispatched.\n- 2026-11-09T06:59:28Z Browser tester: AC10 and AC11 pass, check 99 steps 0 failures on temp DB. 12/12, no fix round. Reporter dispatched.\n- 2026-11-09T07:00:14Z Verdict shipped.\n","reportMd":"# Run report: admin panel (2026-11-09T06-16-12)\n\n**Verdict: shipped. 12/12 acceptance criteria pass, 1 cycle, 0 fix rounds, 3 tasks.**\n\n## What the owner needs to know first\n\n- **The login is already on your local database.** Your dev server (node --watch) restarted while the work was being built. It applied the dev admin to `data/crate.db`. A read-only check afterwards found 9 users, 1 admin and 0 ownerless crates, so no crate ownership was reassigned.\n- **It is dev-only.** `admin@frisson.com` / `admin` is never created when `NODE_ENV=production`. That holds even with `SEED_DEV_ADMIN=true`. `SEED_DEV_ADMIN=false` turns it off in other environments. `.env` sets no `NODE_ENV`, so locally it runs. Intake chose the dev-only reading, so please confirm it.\n- **It is now the only admin on that database, and the earliest.** The existing bootstrap only acts when no admin exists. So `ADMIN_EMAIL` in `.env` will not create a second admin on this database.\n- **Credential travels with the data.** A dev database restored into production would carry the working admin/admin row. The guard only stops creation. `docs/DEPLOY.md` says to remove that row or use a clean production database.\n\n## How the two crate sections were read\n\nThe brief's phrase \"crates by the suggestions, by user created\" was read as one crates view with two sections:\n- **Suggested crates:** crates with `recommended_rank` set, in rank order. This is the same column that drives Home's Recommended crates. No second flag was added.\n- **User created crates:** every other crate, each showing its owner.\n\nThis was an assumption, not something the owner confirmed. Please check it.\n\n## What was asked for\n\nAn admin-only `/admin` panel that:\n- lists all news, crates and users;\n- lets an admin grant or revoke the verified tag;\n- lets an admin create news and crates, singly or in bulk, that show on the public front end;\n- adds an `admin@frisson.com` / `admin` login idempotently, with no data reset, and never in production.\n\n## Acceptance criteria\n\n| AC | Check | Status |\n|---|---|---|\n| AC1 | Dev-admin step on a populated DB: one new row, existing rows deep-equal, login 200, second run idempotent (unit) | Pass |\n| AC2 | Production, `SEED_DEV_ADMIN=false`, email clash, `admin-2` username, no plaintext in logs, 8-char minimum intact (unit) | Pass |\n| AC3 | Real API, two starts on a temp DB, only one row added, hash identical, login 200 as admin; production start creates nothing and login gives 401 (command) | Pass |\n| AC4 | Every `/api/admin` route, collected by hook, plus PATCH verified: 401 signed out, 403 as user, counts unchanged (api) | Pass |\n| AC5 | Overview counts, users list with no password hash or seed key, verified toggle reflected in the admin list and on the public profile (api) | Pass |\n| AC6 | Admin crates list, create, suggested toggle, 409 for ownerless, 404 for unknown id (api) | Pass |\n| AC7 | News create, edit, delete, validation 400s, survives the demo seed with no duplicates (api) | Pass |\n| AC8 | Bulk import, publicly readable afterwards, all-or-nothing on a bad entry (api) | Pass |\n| AC9 | Web unit tests: route guard redirects, four section headings, owners shown, error on failed load, Admin menu link (unit) | Pass |\n| AC10 | Browser: login form, Admin link, create news and a Suggested crate, signed-out Home and /list show them, non-admin is bounced from /admin (browser) | Pass |\n| AC11 | Browser: verify toggle and public badge, bulk paste success and invalid-JSON error, no overflow at 1280 or 390px, mouse and touch work (browser) | Pass |\n| AC12 | `format:check`, `lint`, `typecheck`, `test`, `build` all exit 0; `passwords.test.ts` and `auth-accounts.test.ts` unchanged (command) | Pass |\n\n## What was built\n\n37 files changed, 4,272 insertions and 12 deletions across three commits:\n- `90dead2` is the admin-only API (overview, users, crates, news, import).\n- `6f8406a` is the insert-only dev admin login.\n- `e47d46c` is the admin panel, its route guard and the account menu link.\n\nOther additions:\n- an ADR, `docs/adr/0007-dev-admin-login.md`;\n- documentation in `README.md`, `docs/DEPLOY.md` and `.env.example`;\n- a `check:dev-admin` script;\n- the browser check `.shipyard/checks/admin-panel.check.mjs`.\n\n## Test results\n\n- The final gate ran on a clean export of HEAD. All five commands exited 0, with 428 API tests and 400 web tests passing.\n- Browser check: 99 steps, 0 failures, on a temporary database, in Chromium only.\n- The only existing test file touched was `apps/web/src/router.test.ts` (22 lines added).\n- No failures occurred, so there is no failure output to quote.\n- The baseline figure was corrected twice during planning (326, then 357, then 717 = 360 API + 357 web). The checklist tester could not reconcile the 357 figure per workspace. It judged by the unchanged pre-existing tests instead.\n\n## What went wrong\n\nNothing failed. There were three process incidents:\n- Removing the admin guard made 3 AC4 tests fail while the API was being built. That showed the tests do catch it. The guard was restored.\n- An uncommitted `apps/web/src/App.vue` edit appeared during the build. The owner confirmed it was theirs and removed it. It never reached the branch.\n- The checklist tester was quick (8 tool calls) and judged AC3 from the PASS lines without reading the script. The harbormaster spot-checked the script and the test titles and accepted the verdicts.\n\n## Known gaps\n\n- The failure path of the new `server.ts` try/catch (the dev-admin step failing without stopping startup) is untested.\n- `check-dev-admin` uses `process.execPath` instead of `node`. A change to `crate.db-wal` prints a warning rather than failing, because your dev server also writes that file.\n- A verify click landing during an in-flight users refresh could be overwritten by the stale response.\n- Bulk import is not de-duplicated, so pasting the same JSON twice creates duplicates. Run `db:backup` before large imports.\n- Demo rows return after deletion on restart while demo seeding is on. Admin-created rows do not.\n- The `NODE_ENV` guard fails open if `NODE_ENV` is unset on an internet-facing host started outside the Dockerfile or Compose. `shouldSeedDemo` has the same weakness, and `docs/DEPLOY.md` says so.\n\n## Observations for the owner to choose from\n\n1. **Top choice: the Demo tag on Home news (medium).** Home tags every news item Demo, including news an admin just created, because `HomeView.vue` renders `\u003cDemoTag />` unconditionally. The Recommended section also still says \"Curated demo picks\". Admin-published content is presented to the public as demo. Fixing this is the recommended follow-up.\n2. **Dev admin is the only admin on `data/crate.db` (medium).** See the top of this report. Decide whether `ADMIN_EMAIL=trf@frission.com` in `.env` should become a real admin some other way.\n3. `.env` has `ADMIN_EMAIL=trf@frission.com` (double s), which differs from the `frisson.com` domain of the new login (low). Nothing here changed `.env`.\n4. `AboutView` says the news and recommendations are demo data. That becomes untrue once an admin publishes real items (low).\n5. The comment in `apps/api/src/db/schema.ts` still calls news fictional demo news (low).\n6. For about 0.5s after a route change, the view transition in `viewTransitions.ts` swallows clicks and taps (low). This is pre-existing, not from this change.\n7. `/admin` is very long at 390px, about 13,900 CSS px in the test data, with no way to jump between sections. Bulk import sits at the very bottom (low).\n8. Info: a real-admin pass confirmed that Add records opens the editor with the crate preselected, the Suggest toggles move the row and show on signed-out Home, and double-clicking Create crate makes one crate.\n\n## Recommended next steps\n\n1. Fix the Demo tag so admin-created news and crates are not labelled demo.\n2. Confirm the dev-only reading of the login and the two-section crate reading.\n3. Consider a startup check that detects the dev admin row in a production database.\n4. Add an in-page section jump for `/admin` on phones.\n5. Update the About copy and the schema comment.\n## Token use\n\nSize: standard. Reported total: 682,066 tokens across 9 agents.\n\n| Role | Agents | Tokens | Share |\n|---|---|---|---|\n| dev | 3 | 291,625 | 43% |\n| browser-tester | 1 | 140,764 | 21% |\n| manager | 1 | 93,166 | 14% |\n| intake | 1 | 61,420 | 9% |\n| surveyor | 1 | 47,412 | 7% |\n| tester | 1 | 27,601 | 4% |\n| reporter | 1 | 20,078 | 3% |\n\n| Agent | Model | Tokens | Tool uses | Seconds |\n|---|---|---|---|---|\n| surveyor-relevant | sonnet | 47,412 | 33 | 74 |\n| intake | opus | 61,420 | 32 | 153 |\n| manager | opus | 93,166 | 52 | 301 |\n| dev-admin-api | opus | 83,592 | 28 | 279 |\n| dev-dev-admin | opus | 92,282 | 33 | 346 |\n| dev-admin-web | opus | 115,751 | 37 | 669 |\n| tester | sonnet | 27,601 | 8 | 30 |\n| browser-tester | opus | 140,764 | 37 | 945 |\n| reporter | sonnet | 20,078 | 7 | 24 |\n\nThe harbormaster's own tokens are not included: no figure was available.\n\n### Dev models across 4 run(s)\n\n| Model | Tasks | Fix agents | Fixes per task | Tokens |\n|---|---|---|---|---|\n| sonnet | 2 | 1 | 0.50 | 46,027 |\n| opus | 5 | 1 | 0.20 | 396,557 |\n","cycles":[{"n":"1","spec":"# Admin panel and local admin login\n\n## What we are building\n\nFrisson has an admin role but almost nothing for an admin to use. The only admin endpoint is the verified toggle, which no screen calls, and news and recommended crates can only come from seed data. This run adds a panel at `/admin` where an admin can see all news, all crates and all users, grant or revoke the verified tag, and publish news and crates, one at a time or in bulk, that show up on the public site.\n\nIt also adds a working `admin@frisson.com` / `admin` login to the owner's existing database without resetting anything, and makes sure that login can never be created in production.\n\n## The dev admin step\n\nThe existing `bootstrapAdmin` cannot do this job. It does nothing when any admin already exists, and it goes through `hashPassword`, which throws on passwords under 8 characters. Inside the `server.ts` try block, that throw would stop the app from starting.\n\nSo a new `ensureDevAdmin` step runs right after `bootstrapFromEnv`, in its own try/catch, and a failure there is logged without stopping the API. It only runs from `server.ts`, not `buildApp`, so tests and other callers never get an extra user.\n\nThe step only ever inserts one row:\n\n- If the email already belongs to an admin, it does nothing, and the password is never rewritten.\n- If the email belongs to an ordinary account, it warns and leaves that row untouched, matching bootstrap's refusal to promote silently.\n- If username `admin` is taken, it uses the next free `admin-N`.\n\nThe short password gets a deliberately narrow path. `hashDevAdminPassword()` takes no argument and hashes only that one constant, so no caller can use it to get around the password policy. `hashPassword`, signup and the `ADMIN_PASSWORD` bootstrap keep the 8-character minimum, and `passwords.test.ts` and `auth-accounts.test.ts` stay unedited.\n\nThe production guard is checked first: `NODE_ENV=production` always refuses, even with `SEED_DEV_ADMIN=true`. `SEED_DEV_ADMIN=false` turns the step off everywhere else.\n\n## The admin API\n\nEvery new endpoint lives in one encapsulated plugin under `/api/admin/*`. A single plugin-level `onRequest` hook calls the existing `requireAdmin`, so a route added later cannot forget the check, and refused callers are turned away before their body is parsed. The access test collects routes from Fastify itself through an `onRoute` option on `buildApp`, so it covers new routes automatically.\n\nThere is no migration, because the existing schema already holds everything:\n\n- **Suggested** means `crates.recommended_rank` is non-NULL, the same column Home reads. Turning it on puts the crate last. Suggesting an ownerless crate returns 409, because Home's recommended list can only show crates with an owner.\n- **Admin news** uses `news_items` with a generated `admin:\u003cuuid>` seed key. It can't collide with the demo `news:` keys, the demo seed leaves it alone, and it never appears in a response.\n- **Verified** stays on the existing `PATCH /api/users/:username/verified` route.\n- **Bulk import** is validated whole by zod and then written in one transaction, so one bad entry means nothing is written and the 400 names the failing entry by path. A paste over Fastify's default limit of about 1 MB fails cleanly with 413, also writing nothing.\n\nThe users list holds every email address, so it is CONFIDENTIAL PII. Columns are selected by hand and responses pass through zod schemas, so password hashes and seed keys never leave the API.\n\n## The panel\n\n`/admin` is one lazy-loaded Vue view behind a new `requiresAdmin` route meta. Signed-out visitors go to login with `next=/admin`, and non-admins go home. The account menu shows an Admin link to admins only.\n\nEach section loads independently through the existing `useAsyncSection`, so one failed list shows its own error and never looks like an empty list. Crate editing and deletion stay on the existing `/crates` page, which the panel links to.\n\nThe panel has to refresh the library store after crate changes. That store caches crates and albums for the session, so without a forced reload a newly created crate would be missing from `/list` and `/crates/:id` until a page reload.\n\n## How the work is split\n\n1. **dev-admin**: the step, the narrow hash path, tests, the repeatable `npm run check:dev-admin -w apps/api` command for AC3, and the docs and ADR.\n2. **admin-api**: shared schemas, routes, service and API tests. It can run alongside dev-admin because they own different files.\n3. **admin-web**: the panel, guard, menu link, unit tests, the browser check for AC10 and AC11, and the final repo-wide gate. It runs last because the browser check needs both of the others.\n\n## How it is checked\n\nThe AC3 command starts the real server from a from-scratch environment on temporary databases, so neither `.env` values nor the caller's `NODE_ENV` can leak in. It refuses to use `data/crate.db` and fails if that file's size or modification time changes.\n\nIts fixture has no ownerless crates. Bootstrap hands those to the earliest admin on the next start, which is existing behaviour and would change rows for a reason unrelated to this step. The docs describe that behaviour rather than the check hiding it.\n\nAC2(e) needs care because the password `admin` is a substring of the email and of ordinary log text. A search for the string proves nothing, so the test compares every log message against the exact expected strings.\n\n## Known limits and risks the owner should know\n\n- The next `npm run dev` adds this login to `data/crate.db`, as requested. If that database has no admin yet and has ownerless crates, the following start gives those crates to the new admin. If the email already belongs to an ordinary account, a warning is logged and no login is created.\n- The guard fails open if `NODE_ENV` is unset on an internet-facing host started outside Docker, the same weakness `shouldSeedDemo` has.\n- The guard only stops the row being created. A dev database copied or restored to production brings a working admin/admin login with it. `docs/DEPLOY.md` will tell operators to remove it, and a startup check that detects it is a sensible follow-up.\n- A demo news item deleted from the panel returns on restart while demo seeding is on, and the panel says so next to delete. Admin-created items do not come back.\n- Panel changes are real data with no audit trail or undo, and bulk import does not de-duplicate.\n\n## Open points for the owner\n\n- The brief asks for confirmation that crates are one view with two sections, Suggested and User created. This plan builds them that way, as two headed sections on the panel.\n- `.env` has `ADMIN_EMAIL=trf@frission.com`, spelled with a double s, while the new login uses `frisson.com` as the brief specifies. Nothing here changes `.env`.\n- `AboutView` tells visitors the news and recommendations are demo data. That becomes untrue once an admin publishes real items. The brief does not cover this copy, so this plan leaves it unchanged and flags it for a decision.\n\n## Out of scope\n\nRole changes, deleting or suspending users, password reset or change, an audit log, permanently deleting demo rows, creating content on behalf of another user, a CLI seed command, and real news feeds or AI recommendations.","plan":{"summary":"Three tasks. A adds the idempotent, never-in-production dev admin step, the repeatable AC3 command and the docs. B adds the shared admin schemas and the guarded /api/admin/* API, with no migration. A and B own disjoint files and can run in parallel. C runs after both and builds the /admin panel, its router guard, the account menu link, web unit tests and the browser check.","tasks":[{"id":"dev-admin","goal":"Add an insert-only dev admin step (admin@frisson.com / admin) that never runs in production, a repeatable real-server check command, and the docs for both.","description":"CONTEXT. apps/api/src/server.ts runs bootstrapFromEnv(app.db, process.env, app.log), then seedDemoFromEnv in its own inner try/catch, then listen. bootstrapAdmin cannot be reused: it does nothing when any admin exists, and createUser calls hashPassword, which throws 400 under 8 characters.\n\nPASSWORDS (apps/api/src/services/passwords.ts). Split the salt, derive and format code into a private unexported helper. Keep hashPassword's behaviour exactly. Export `hashDevAdminPassword(): Promise\u003cstring>`, which takes NO argument and hashes only a module-private constant 'admin'. This is the narrow path: it cannot weaken the policy for any other password. Do not export the unchecked helper. apps/api/test/passwords.test.ts and apps/api/test/auth-accounts.test.ts must not be edited.\n\nBOOTSTRAP (apps/api/src/services/bootstrap.ts). Only add `export` to freeAdminUsername(db: Db): string. BootstrapLog ({info(msg), warn(msg)}) is already exported.\n\nNEW SERVICE (apps/api/src/services/dev-admin.ts), with a CONFIDENTIAL (credentials) data-classification comment:\n- `export const DEV_ADMIN_EMAIL = 'admin@frisson.com'`\n- `export function shouldSeedDevAdmin(env: NodeJS.ProcessEnv = process.env): boolean`. Production check first: false if env.NODE_ENV, trimmed and lower-cased, is 'production', whatever else is set. Then false if SEED_DEV_ADMIN === 'false'. Otherwise true. SEED_DEV_ADMIN=true never overrides production.\n- `export async function ensureDevAdmin(db: Db, env: NodeJS.ProcessEnv = process.env, log: BootstrapLog = silent): Promise\u003c{ created: boolean }>`. Logic: if the guard is false, return {created:false}. Call findUserByEmail(db, DEV_ADMIN_EMAIL) from services/users.ts. If the row has role admin, return silently with no change. If it has any other role, log.warn a refusal to promote and return with no change. Otherwise hash with hashDevAdminPassword and do exactly one direct db.insert(users) with {email, username: freeAdminUsername(db), displayName: 'Admin', passwordHash, role: 'admin'}. Do NOT go through createUser. Catch a unique-constraint race (code SQLITE_CONSTRAINT_UNIQUE), warn, and do not throw. Do not touch crates or any other table. Log only fixed strings plus the username, never the password.\n\nSERVER (apps/api/src/server.ts). Immediately after bootstrapFromEnv, add an inner try { await ensureDevAdmin(app.db, process.env, app.log) } catch (err) { app.log.error(err, 'Could not add the dev admin; starting without it') }. Do not call it from buildApp, because tests and existing row counts rely on buildApp creating nothing.\n\nTESTS (apps/api/test/dev-admin.test.ts). Use buildTestApp, signUp and addCrate from apps/api/test/helpers.ts, and pass env explicitly (for example {}), since vitest sets NODE_ENV=test.\n- AC1: populate users, crates, albums, tracks, follows and news. Snapshot every row of every table with raw SQL. Run with NODE_ENV unset. Expect one new row, role admin, and POST /api/auth/login with admin@frisson.com / admin returning 200. All earlier rows must be deep-equal. A second run adds no row and leaves password_hash byte-identical.\n- AC2 (a) to (f) as written in the brief.\n- AC2(e) trap: the password 'admin' is a substring of the email and of ordinary messages, so a naive includes('admin') check cannot work. Instead capture every log call and assert each message exactly equals an expected fixed string, that no message contains the word 'password' with a value, and that only string arguments were passed. Also assert the hash never appears in logs.\n- Add a case where ADMIN_EMAIL has already created admin@frisson.com as admin: the step is a no-op.\n\nAC3 COMMAND. Create apps/api/scripts/check-dev-admin.ts, add `\"check:dev-admin\": \"node scripts/check-dev-admin.ts\"` to apps/api/package.json, and add \"scripts\" to include in apps/api/tsconfig.json. Run it as `npm run check:dev-admin -w apps/api`. It prints PASS or FAIL per step and exits non-zero on any failure. Behaviour:\n1. mkdtemp a temp DATA_DIR and build the fixture with createDb(path) from apps/api/src/db/client.ts (it returns an object with db). Add users, crates, albums, tracks and news, then close it. Every fixture crate MUST have an owner. Say why in a comment: bootstrap hands ownerless crates to the earliest admin on the next start, which is existing documented behaviour and would otherwise change rows.\n2. Dump every non-sqlite_ table from a separate connection.\n3. Spawn `node apps/api/src/server.ts` with cwd at the repo root and an env built from scratch: PATH and HOME only, plus DATA_DIR, PORT (free port), HOST=127.0.0.1, SEED_DEMO_DATA=false. No NODE_ENV, no ADMIN_*, no WEB_DIR, no DATABASE_PATH. Poll GET /api/health, SIGTERM, await exit, and start it again.\n4. While it is up and BEFORE login creates a session row, dump and compare. All pre-existing rows are identical, the only difference is one added users row, and the users count is +1.\n5. POST /api/auth/login returns 200 and GET /api/auth/me has role admin, using the returned cookie. Stop.\n6. Third start on a second, separate temp DB with NODE_ENV=production and SEED_DEV_ADMIN=true. Login returns 401 and no such row exists.\n7. Scan captured server stdout and stderr: no password_hash value, no scrypt$ string.\n8. Refuse to run if the resolved DB path is the repo's data/crate.db. Record size and mtime of data/crate.db (if present) before and after, and fail if they changed. Always remove the temp dirs and child processes, including on failure.\n\nDOCS.\n- README.md: env table row for SEED_DEV_ADMIN, how the local admin login works, a short /admin panel paragraph, and the check command.\n- docs/DEPLOY.md: production admins come only from ADMIN_EMAIL/ADMIN_PASSWORD. The guard fails open if NODE_ENV is unset on an internet-facing host started outside the Dockerfile or Compose, so always set it. A dev database restored through db:backup/db:restore or a copied file carries the working admin/admin row, so remove that row or use a clean production database. Run db:backup before bulk imports. With no earlier admin and no ADMIN_EMAIL, the dev admin becomes the earliest admin and receives ownerless crates on the next start. Demo rows deleted from the panel return on restart while seeding is on.\n- .env.example: a commented SEED_DEV_ADMIN entry saying it has no effect in production.\n- docs/adr/0007-dev-admin-login.md: a short ADR on the decision and its accepted risk.\nDo not touch compose.yaml or the Dockerfile.\n\nRun prettier, lint, typecheck and npm test. Never start the API without a temporary DATA_DIR.","ownsFiles":["apps/api/src/services/passwords.ts","apps/api/src/services/bootstrap.ts","apps/api/src/services/dev-admin.ts","apps/api/src/server.ts","apps/api/test/dev-admin.test.ts","apps/api/scripts/check-dev-admin.ts","apps/api/package.json","apps/api/tsconfig.json","README.md","docs/DEPLOY.md","docs/adr/0007-dev-admin-login.md",".env.example"],"dependsOn":[],"criteriaIds":["AC1","AC2","AC3","AC12"],"model":"opus"},{"id":"admin-api","goal":"Add the shared admin schemas and the admin-only /api/admin/* endpoints for overview, users, crates, news and all-or-nothing bulk import.","description":"NO MIGRATION is needed: news_items, crates.recommended_rank and users.verified all exist. Do not add a flag or column. Verification stays on the existing PATCH /api/users/:username/verified and setVerified; do not duplicate it.\n\nSHARED (packages/shared/src/index.ts). Add an Admin section using the existing private helpers requiredText, hexColor and the existing createCrateInput, createAlbumInput and newsItem. Use these exact names, because the web task relies on them:\n- adminOverview = {users, crates, suggestedCrates, albums, news} (all ints)\n- adminUser = {id, email, username, displayName, role, verified, isDemo: boolean, createdAt: iso datetime, crateCount: int}, marked CONFIDENTIAL (PII)\n- adminCrate = {id, name, label: string|null, color, albumCount, ownerUsername: string|null, ownerDisplayName: string|null, recommendedRank: int|null, isDemo: boolean, createdAt: iso datetime}\n- adminNewsItem = newsItem.extend({isDemo: z.boolean()}), with no seed key\n- adminCreateCrateInput = createCrateInput.extend({suggested: z.boolean().default(false)})\n- adminSetSuggestedInput = z.strictObject({suggested: z.boolean()})\n- adminNewsInput = {title: requiredText(200), summary: requiredText(2000), source: requiredText(100), publishedAt: z.iso.datetime().optional()}\n- adminUpdateNewsInput = adminNewsInput.partial() with a refine requiring at least one field\n- adminImportAlbum = createAlbumInput.omit({crateId: true})\n- adminImportCrate = adminCreateCrateInput.extend({albums: z.array(adminImportAlbum).default([])})\n- adminImportInput = z.object({crates: z.array(adminImportCrate).default([]), news: z.array(adminNewsInput).default([])}) with a refine requiring at least one entry\n- adminImportResult = {crates, albums, tracks, news} (ints)\nExport inferred types AdminOverview, AdminUser, AdminCrate, AdminNewsItem, AdminImportResult, plus request types from z.input: AdminCreateCrateRequest, AdminNewsRequest, AdminUpdateNewsRequest, AdminImportRequest.\n\nROUTES (new apps/api/src/routes/admin.ts, exporting adminRoutes: FastifyPluginAsyncZod; register in apps/api/src/app.ts with prefix '/api' next to the others, before webPlugin). Guard the whole plugin with a plugin-level hook: app.addHook('onRequest', async (req) => { requireAdmin(req.user) }), using requireAdmin from services/permissions.ts. onRequest means a new route cannot forget the guard, and a signed-out oversized or malformed body gets 401 rather than 413 or 400. authPlugin sets req.user in a global onRequest hook that runs first. Do not wrap this plugin in fastify-plugin, because the hook must stay encapsulated.\nEndpoints, each with zod response schemas:\n- GET /admin/overview -> adminOverview\n- GET /admin/users -> adminUser[]\n- GET /admin/crates -> adminCrate[]: suggested first by rank then id, then the rest by id\n- POST /admin/crates -> 201 adminCrate\n- PATCH /admin/crates/:id/suggested -> adminCrate\n- GET /admin/news -> adminNewsItem[]: same order as public listNews\n- POST /admin/news -> 201 adminNewsItem\n- PATCH /admin/news/:id -> adminNewsItem\n- DELETE /admin/news/:id -> 204\n- POST /admin/import -> 201 adminImportResult\nUse idParams for :id. Throw HttpError(409, ...) and notFound(...) from errors.ts.\n\nSERVICE (new apps/api/src/services/admin.ts). Thin routes, logic here. Select columns by hand so passwordHash, demoSeedKey and seedKey never enter a result. isDemo for users and crates is demoSeedKey !== null. isDemo for news is !seedKey.startsWith('admin:'), and the key is dropped before returning. Dates go out through toISOString(). users.crateCount and crates.albumCount use LEFT JOINs so zero and ownerless cases appear.\n- Suggesting: rank = (max(crates.recommendedRank) ?? 0) + 1. Toggle order is: 404 for an unknown id; {suggested:true} on an ownerless crate returns 409, because listRecommendedCrates inner-joins the owner and a card must name one; {suggested:true} on an already suggested crate keeps its rank (no-op); {suggested:false} sets NULL.\n- Create crate: owner is the signed-in admin, and sortOrder = max(sortOrder)+1 as in services/crates.ts createCrate. Destructure `suggested` out before inserting.\n- News create: seedKey = `admin:${randomUUID()}`. publishedAt defaults to new Date(). The column has second precision, and listNews breaks ties by id descending, so a new item still sorts first. PATCH updates only fields provided and never touches seedKey. Editing or deleting demo rows is allowed.\n- Import: run everything in one synchronous db.transaction((tx) => ...) with direct tx inserts, as apps/api/src/services/demo-seed.ts does (it has `type Tx = Parameters\u003cParameters\u003cDb['transaction']>[0]>[0]`). createAlbum and createCrate take Db, not tx, so do not call them inside. Increment sortOrder and rank per crate in request order. Album position is its index. Crates are owned by the admin. Zod validation rejects a bad entry before any write, and the error handler already returns issues with paths like 'body/crates/0/albums/1/artist', which is how the failing entry gets named.\n\nALSO. Add an optional `onRoute?: (route: RouteOptions) => void` to AppOptions in app.ts, wired with app.addHook('onRoute', opts.onRoute) straight after Fastify() and before any register, so the AC4 test can collect real routes. buildTestApp already spreads opts into buildApp, so apps/api/test/helpers.ts needs no change. Update the 'Fictional demo news' classification comments in packages/shared/src/index.ts and apps/api/src/services/news.ts to say PUBLIC demo or admin-written news. listNews behaviour is unchanged. Keep the default Fastify bodyLimit.\n\nTESTS (apps/api/test/admin-access.test.ts for AC4, apps/api/test/admin.test.ts for AC5 to AC8). Helpers: buildTestApp, signUp, createAdmin, addCrate.\n- AC4: enumerate with onRoute, filter url startsWith '/api/admin', assert non-empty, add PATCH /api/users/:username/verified, and substitute params (:id -> 1, :username -> an existing user). Auto-generated HEAD routes will appear in the list; handle them as ordinary routes. Each returns 401 signed out and 403 as role=user, with row counts of all tables unchanged. As admin, status is neither 401 nor 403.\n- AC5 to AC8 as written in the brief, including a recursive key check for passwordHash, password_hash, demoSeedKey and seedKey.\n- Also cover: an oversized import returns 413 with zero rows written; un-suggesting a demo crate stays un-suggested after seedDemoContent; a repeat {suggested:true} keeps the rank; signed-out public /api/news has no seedKey.\n\nRun prettier, lint, typecheck and npm test. All tests use in-memory databases.","ownsFiles":["packages/shared/src/index.ts","apps/api/src/app.ts","apps/api/src/routes/admin.ts","apps/api/src/services/admin.ts","apps/api/src/services/news.ts","apps/api/test/admin-access.test.ts","apps/api/test/admin.test.ts"],"dependsOn":[],"criteriaIds":["AC4","AC5","AC6","AC7","AC8","AC12"],"model":"opus"},{"id":"admin-web","goal":"Build the /admin panel, its admin route guard and account menu link, with unit tests and a real-browser check, then run the full repo gate.","description":"API CONTRACT (implemented by admin-api; types come from @frisson/shared, use `import type` only so Zod stays out of the main bundle):\n- GET /admin/overview -> AdminOverview {users, crates, suggestedCrates, albums, news}\n- GET /admin/users -> AdminUser[] {id,email,username,displayName,role,verified,isDemo,createdAt,crateCount}\n- GET /admin/crates -> AdminCrate[] {id,name,label,color,albumCount,ownerUsername|null,ownerDisplayName|null,recommendedRank|null,isDemo,createdAt}, suggested first in rank order\n- POST /admin/crates AdminCreateCrateRequest {name,label?,color?,sortBy?,suggested?} -> 201 AdminCrate\n- PATCH /admin/crates/:id/suggested {suggested} -> AdminCrate (409 for an ownerless crate)\n- GET /admin/news -> AdminNewsItem[] {id,title,summary,source,publishedAt,isDemo}\n- POST /admin/news AdminNewsRequest {title,summary,source,publishedAt?} -> 201\n- PATCH /admin/news/:id AdminUpdateNewsRequest -> AdminNewsItem\n- DELETE /admin/news/:id -> 204\n- POST /admin/import AdminImportRequest {crates:[{name,label?,color?,suggested?,albums?:[{title,artist,year?,genre?,format?,tracks?}]}],news:[...]} -> 201 AdminImportResult {crates,albums,tracks,news}\nVerification uses the existing setVerified(username, verified) in apps/web/src/api/profiles.ts.\nErrors: `request` and `errorMessage` from apps/web/src/api/client.ts. ApiRequestError.body.issues is [{path,message}], with paths like 'body/crates/0/albums/1/artist'. errorMessage alone only says 'Request is invalid', so the bulk form MUST render the issues inline to name the failing entry.\n\nFILES.\n- apps/web/src/api/admin.ts: thin client functions, one per endpoint, following apps/web/src/api/profiles.ts.\n- apps/web/src/router.ts: add `requiresAdmin?: boolean` to RouteMeta and a lazy route { path: '/admin', name: 'admin', meta: { requiresAuth: true, requiresAdmin: true } } before the catch-all. In router.beforeEach keep the login redirect for requiresAuth, and then if to.meta.requiresAdmin && !session.isAdmin return { name: 'home' }. requiresAuth also makes AccountMenu's logOut leave /admin, since it checks currentRoute.meta.requiresAuth.\n- apps/web/src/components/AccountMenu.vue: add a RouterLink role=menuitem, class menu-item, text 'Admin', to { name: 'admin' }, with @click=close and v-if on session.isAdmin, placed before Log out so the Log out last-child style stays correct.\n- apps/web/src/views/AdminView.vue plus components under apps/web/src/components/admin/ as needed. Include a CONFIDENTIAL (PII) data-classification comment wherever the users list is held. Never persist or log it.\n\nPANEL.\n- Use one useAsyncSection(loader) from apps/web/src/composables/useAsyncSection.ts per section ({data,status,error,load,refresh}: load shows loading, refresh is silent, neither rejects). Each section renders its own role=alert error with a Try again, never an empty list on failure. If refresh() fails, status is 'error' with old data retained, so show the error.\n- Sections have headings exactly: an overview with counts; 'News'; 'Suggested crates' (recommendedRank non-null); 'User created crates' (all others, each showing owner, and 'No owner' for ownerless); 'Users'; and a 'Bulk import' form.\n- News: create form; inline edit; delete with window.confirm (the pattern used in CratesView.vue). Next to delete on isDemo items, state that demo news returns on the next restart while demo seeding is on.\n- Crates: create form with Name and a Suggested checkbox. Each crate name links to /crates/:id. A suggested on/off control, disabled with an explanation for ownerless crates. An add-records link to /albums/new?crateId=\u003cid>, and a link to /crates for editing and deleting. Do not add crate editing or deletion here.\n- Users: email, username (link to /u/:username), display name, role, demo marker, crate count, VerifiedBadge (components/profile/VerifiedBadge.vue), and a verify/unverify button that updates the row without reload. If the target is the signed-in admin, also call session.refresh() so the masthead badge stays current. No role change, deletion or other out-of-scope actions.\n- Bulk import: textarea with a short example of the shape. JSON.parse locally; a parse failure shows an inline error and sends nothing. Show server issues inline and keep the pasted text on any error, including 413. On success show the created counts, clear the text, and refresh all sections. Note that bulk import is not de-duplicated and suggest db:backup first.\n- Disable every submit while its request is in flight, since a double post would create duplicates.\n- TRAP: the library Pinia store (apps/web/src/stores/library.ts) caches crates and albums once loaded, and CrateView, LibraryView and the album editor read from it. After any successful crate create, suggested toggle or import, call useLibraryStore().load({ force: true }) when its status is not 'idle'. Otherwise the same SPA session shows a stale /list, /albums/new dropdown, or a missing crate at /crates/:id, which would fail AC11.\n- Layout: no page-level horizontal overflow at 1280px or 390px. Use a stacked layout or an inner scroller on narrow widths, overflow-wrap:anywhere on emails and long names, and make controls comfortably tappable. Use the existing CSS variables and classes (.btn, .status-note, --paper, --ink, --marker-red) and set document.title as other views do.\n\nUNIT TESTS (AC9). Add to apps/web/src/router.test.ts (additions only, do not change existing cases) for signed-out -> login with next=/admin, role=user -> home, admin -> /admin. New apps/web/src/views/AdminView.test.ts covering section labels, fixture items from each list including owner names, a failed load showing an error rather than an empty list, invalid JSON sending nothing, and the verify toggle. New apps/web/src/components/AccountMenu.test.ts for the Admin link shown only to admins.\n\nBROWSER CHECK. Do NOT write it: the browser tester writes .shipyard/checks/admin-panel.check.mjs and judges AC10 and AC11. You may run the app yourself to confirm your own work, only on a temporary DATA_DIR (see startApp in .shipyard/checks/lib.mjs, read-only), never data/crate.db. The login and signup limit is 10 attempts per IP per 15 minutes. Build so that every clause of AC10 and AC11 in the brief works with real typing, clicks and touch taps.\n\nFINAL GATE (AC12), from the repo root: npm run format:check, npm run lint, npm run typecheck, npm test, npm run build, and also npm run check:dev-admin -w apps/api. All 357 baseline tests must still pass; list any changed existing test with the reason. If a failure belongs to a file you do not own, report it rather than editing that file.","ownsFiles":["apps/web/src/api/admin.ts","apps/web/src/router.ts","apps/web/src/router.test.ts","apps/web/src/components/AccountMenu.vue","apps/web/src/components/AccountMenu.test.ts","apps/web/src/views/AdminView.vue","apps/web/src/views/AdminView.test.ts","apps/web/src/components/admin/**"],"dependsOn":["dev-admin","admin-api"],"criteriaIds":["AC9","AC10","AC11","AC12"],"model":"opus"}]},"testReport":{"criteria":{"AC1":{"verdict":"pass","evidence":"dev-admin.test.ts 'ensureDevAdmin on a populated database (AC1)' inserts one admin row, rows unchanged, idempotent, login 200; suite green."},"AC2":{"verdict":"pass","evidence":"dev-admin.test.ts (a)-(f) present. (e) pins every logged message to exact fixed strings, no password/scrypt/hash; not a vacuous search. (f) signup 400 and hashPassword rejects."},"AC3":{"verdict":"pass","evidence":"npm run check:dev-admin: all steps PASS (two starts, only one admin row added, hash identical, login 200 role admin, production start login 401, no row, data/crate.db untouched)."},"AC4":{"verdict":"pass","evidence":"admin-access.test.ts collects routes via buildTestApp onRoute hook, asserts non-empty plus PATCH verified, 401 signed out, 403 role=user, row counts unchanged, admin never 401/403."},"AC5":{"verdict":"pass","evidence":"admin.test.ts overview counts, users list with no credential/seed key, verified toggle reflected in admin list and profile."},"AC6":{"verdict":"pass","evidence":"admin.test.ts GET/POST crates, PATCH suggested incl. rank order, 409 ownerless, 404 unknown."},"AC7":{"verdict":"pass","evidence":"admin.test.ts 'admin news' create/patch/delete, 400 per field, 404, survives demo seed with no duplicates."},"AC8":{"verdict":"pass","evidence":"admin.test.ts POST /api/admin/import creates all, readable publicly; 400 naming failing entry with zero rows written; rollback test."},"AC9":{"verdict":"pass","evidence":"router.test.ts redirects (login next=/admin, home, admin ok); AdminView.test.ts section headings, owners, failure error tests; AccountMenu.test.ts Admin link admin vs user."},"AC12":{"verdict":"pass","evidence":"format:check, lint, typecheck, test, build all exit 0; 428 api + 400 web tests pass. Diff vs 8f53e04: passwords.test.ts and auth-accounts.test.ts unchanged; only router.test.ts pre-existing test file touched (22 added lines)."}},"observations":[{"what":"Baseline 357 figure not reconcilable per workspace; judged by unchanged pre-existing tests.","severity":"low"}]},"browserReport":{"criteria":{"AC10":{"verdict":"pass","evidence":".shipyard/checks/admin-panel.check.mjs on a temp DATA_DIR, port 4332, Chromium 1280px. Typed admin@frisson.com / admin into /login, opened the account menu, clicked Admin and landed on /admin (9 mouse points on the button and on the menu item, no dead spots). The panel forms created a news item and a Suggested crate; both appeared in the panel with no reload (window marker survived). Signed-out context: / showed the news under Music news and the crate under Recommended crates, and /list showed the crate, both by direct load and from Home's link. role=user context, signed in through the form: /admin ended on / with no panel content, .admin-panel was never in the DOM (MutationObserver, also with the API slowed by 600ms), no Admin menu link, API 403."},"AC11":{"verdict":"pass","evidence":"Same script. Verify at 1280px: the row showed Verified and a badge with no reload, the signed-out /u/ruth showed the badge; clicked again, the badge was gone after reload on both pages. Real clipboard paste of a crate with 2 albums and a news item: 'Imported 1 crate, 2 albums, 0 tracks, 1 news item.'; the crate opened at /crates/:id with both records from the panel link (with the library store already loaded) and signed out; the news showed on /. Truncated JSON, non-JSON, empty and [] showed an inline error, sent no request and left the admin lists unchanged; a payload with one bad crate and {} were refused by the API with an inline error, also adding nothing. No overflow at 1280 or 390 (scrollWidth \u003c= width) with maximum-length text, error shown and Example open. Verify, Create news item and Create crate had no dead spots across 9 points with real mouse at 1280 and real touch at 390 (touch context, touchscreen.tap); touch also verified end to end, ticked Suggested and imported."}},"observations":[{"what":"Home shows a red 'Demo' tag on every news item, including news an admin just created in the panel (HomeView.vue renders \u003cDemoTag /> unconditionally), and the Recommended section still says 'Curated demo picks'. Admin-created content is presented to the public as demo.","severity":"medium"},{"what":"For about half a second after any route change, the app's view transition makes every click or tap land on \u003chtml> and do nothing. Seen as a lost first click on the account button after login and a lost first tap on Verify after opening /admin. Comes from viewTransitions.ts, not this change; the check waits for the transition to end before raw clicks.","severity":"low"},{"what":"/admin gets very long on a phone with no way to jump between sections: about 13,900 CSS px at 390px in this test's data, with Bulk import at the very bottom below every user.","severity":"low"},{"what":"Real-admin pass worked: a panel-created crate's Add records link opened /albums/new?crateId= with the crate picked, the record saved, the row showed 1 record, Suggest and Stop suggesting moved the row and were reflected on signed-out Home. Double-clicking Create crate made one crate.","severity":"info"}]},"defects":null,"tasks":[{"id":"admin-api","goal":"Add the shared admin schemas and the admin-only /api/admin/* endpoints for overview, users, crates, news and all-or-nothing bulk import.","description":"NO MIGRATION is needed: news_items, crates.recommended_rank and users.verified all exist. Do not add a flag or column. Verification stays on the existing PATCH /api/users/:username/verified and setVerified; do not duplicate it.\n\nSHARED (packages/shared/src/index.ts). Add an Admin section using the existing private helpers requiredText, hexColor and the existing createCrateInput, createAlbumInput and newsItem. Use these exact names, because the w
