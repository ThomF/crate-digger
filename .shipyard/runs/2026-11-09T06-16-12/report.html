eb task relies on them:\n- adminOverview = {users, crates, suggestedCrates, albums, news} (all ints)\n- adminUser = {id, email, username, displayName, role, verified, isDemo: boolean, createdAt: iso datetime, crateCount: int}, marked CONFIDENTIAL (PII)\n- adminCrate = {id, name, label: string|null, color, albumCount, ownerUsername: string|null, ownerDisplayName: string|null, recommendedRank: int|null, isDemo: boolean, createdAt: iso datetime}\n- adminNewsItem = newsItem.extend({isDemo: z.boolean()}), with no seed key\n- adminCreateCrateInput = createCrateInput.extend({suggested: z.boolean().default(false)})\n- adminSetSuggestedInput = z.strictObject({suggested: z.boolean()})\n- adminNewsInput = {title: requiredText(200), summary: requiredText(2000), source: requiredText(100), publishedAt: z.iso.datetime().optional()}\n- adminUpdateNewsInput = adminNewsInput.partial() with a refine requiring at least one field\n- adminImportAlbum = createAlbumInput.omit({crateId: true})\n- adminImportCrate = adminCreateCrateInput.extend({albums: z.array(adminImportAlbum).default([])})\n- adminImportInput = z.object({crates: z.array(adminImportCrate).default([]), news: z.array(adminNewsInput).default([])}) with a refine requiring at least one entry\n- adminImportResult = {crates, albums, tracks, news} (ints)\nExport inferred types AdminOverview, AdminUser, AdminCrate, AdminNewsItem, AdminImportResult, plus request types from z.input: AdminCreateCrateRequest, AdminNewsRequest, AdminUpdateNewsRequest, AdminImportRequest.\n\nROUTES (new apps/api/src/routes/admin.ts, exporting adminRoutes: FastifyPluginAsyncZod; register in apps/api/src/app.ts with prefix '/api' next to the others, before webPlugin). Guard the whole plugin with a plugin-level hook: app.addHook('onRequest', async (req) => { requireAdmin(req.user) }), using requireAdmin from services/permissions.ts. onRequest means a new route cannot forget the guard, and a signed-out oversized or malformed body gets 401 rather than 413 or 400. authPlugin sets req.user in a global onRequest hook that runs first. Do not wrap this plugin in fastify-plugin, because the hook must stay encapsulated.\nEndpoints, each with zod response schemas:\n- GET /admin/overview -> adminOverview\n- GET /admin/users -> adminUser[]\n- GET /admin/crates -> adminCrate[]: suggested first by rank then id, then the rest by id\n- POST /admin/crates -> 201 adminCrate\n- PATCH /admin/crates/:id/suggested -> adminCrate\n- GET /admin/news -> adminNewsItem[]: same order as public listNews\n- POST /admin/news -> 201 adminNewsItem\n- PATCH /admin/news/:id -> adminNewsItem\n- DELETE /admin/news/:id -> 204\n- POST /admin/import -> 201 adminImportResult\nUse idParams for :id. Throw HttpError(409, ...) and notFound(...) from errors.ts.\n\nSERVICE (new apps/api/src/services/admin.ts). Thin routes, logic here. Select columns by hand so passwordHash, demoSeedKey and seedKey never enter a result. isDemo for users and crates is demoSeedKey !== null. isDemo for news is !seedKey.startsWith('admin:'), and the key is dropped before returning. Dates go out through toISOString(). users.crateCount and crates.albumCount use LEFT JOINs so zero and ownerless cases appear.\n- Suggesting: rank = (max(crates.recommendedRank) ?? 0) + 1. Toggle order is: 404 for an unknown id; {suggested:true} on an ownerless crate returns 409, because listRecommendedCrates inner-joins the owner and a card must name one; {suggested:true} on an already suggested crate keeps its rank (no-op); {suggested:false} sets NULL.\n- Create crate: owner is the signed-in admin, and sortOrder = max(sortOrder)+1 as in services/crates.ts createCrate. Destructure `suggested` out before inserting.\n- News create: seedKey = `admin:${randomUUID()}`. publishedAt defaults to new Date(). The column has second precision, and listNews breaks ties by id descending, so a new item still sorts first. PATCH updates only fields provided and never touches seedKey. Editing or deleting demo rows is allowed.\n- Import: run everything in one synchronous db.transaction((tx) => ...) with direct tx inserts, as apps/api/src/services/demo-seed.ts does (it has `type Tx = Parameters\u003cParameters\u003cDb['transaction']>[0]>[0]`). createAlbum and createCrate take Db, not tx, so do not call them inside. Increment sortOrder and rank per crate in request order. Album position is its index. Crates are owned by the admin. Zod validation rejects a bad entry before any write, and the error handler already returns issues with paths like 'body/crates/0/albums/1/artist', which is how the failing entry gets named.\n\nALSO. Add an optional `onRoute?: (route: RouteOptions) => void` to AppOptions in app.ts, wired with app.addHook('onRoute', opts.onRoute) straight after Fastify() and before any register, so the AC4 test can collect real routes. buildTestApp already spreads opts into buildApp, so apps/api/test/helpers.ts needs no change. Update the 'Fictional demo news' classification comments in packages/shared/src/index.ts and apps/api/src/services/news.ts to say PUBLIC demo or admin-written news. listNews behaviour is unchanged. Keep the default Fastify bodyLimit.\n\nTESTS (apps/api/test/admin-access.test.ts for AC4, apps/api/test/admin.test.ts for AC5 to AC8). Helpers: buildTestApp, signUp, createAdmin, addCrate.\n- AC4: enumerate with onRoute, filter url startsWith '/api/admin', assert non-empty, add PATCH /api/users/:username/verified, and substitute params (:id -> 1, :username -> an existing user). Auto-generated HEAD routes will appear in the list; handle them as ordinary routes. Each returns 401 signed out and 403 as role=user, with row counts of all tables unchanged. As admin, status is neither 401 nor 403.\n- AC5 to AC8 as written in the brief, including a recursive key check for passwordHash, password_hash, demoSeedKey and seedKey.\n- Also cover: an oversized import returns 413 with zero rows written; un-suggesting a demo crate stays un-suggested after seedDemoContent; a repeat {suggested:true} keeps the rank; signed-out public /api/news has no seedKey.\n\nRun prettier, lint, typecheck and npm test. All tests use in-memory databases.","ownsFiles":["packages/shared/src/index.ts","apps/api/src/app.ts","apps/api/src/routes/admin.ts","apps/api/src/services/admin.ts","apps/api/src/services/news.ts","apps/api/test/admin-access.test.ts","apps/api/test/admin.test.ts"],"dependsOn":[],"criteriaIds":["AC4","AC5","AC6","AC7","AC8","AC12"],"model":"opus","criteria":[{"id":"AC4","statement":"A test enumerates every route registered under /api/admin (collected from the Fastify app with an onRoute hook, not a hand-written list), and asserts the list is non-empty, plus PATCH /api/users/:username/verified. Each route returns 401 when signed out and 403 when signed in as a role=user account. Table row counts are unchanged after those refused calls. The same test confirms that an admin session does not receive 401 or 403 on those routes.","check":"api"},{"id":"AC5","statement":"As an admin, GET /api/admin/overview returns correct counts of users, crates, suggested crates, albums and news for a known fixture. GET /api/admin/users returns every user, including role=user and demo users, each with id, email, username, displayName, role, verified, an isDemo boolean, createdAt and crateCount. A recursive check of the serialized response finds no passwordHash, password_hash or demoSeedKey key. After PATCH /api/users/:username/verified with {verified:true}, that user shows verified:true in GET /api/admin/users and on the public profile response. After {verified:false}, both show false.","check":"api"},{"id":"AC6","statement":"As an admin, GET /api/admin/crates returns every crate, including ownerless ones, with id, name, ownerUsername (null if ownerless), albumCount, recommendedRank and createdAt. POST /api/admin/crates with {name, suggested:true} creates a crate owned by the admin, which appears in public GET /api/crates and last in public recommended-crates order. PATCH /api/admin/crates/:id/suggested with {suggested:false} sets recommendedRank to null and removes it from the recommended list; {suggested:true} adds it back at the end. Suggesting an ownerless crate returns 409, and an unknown id returns 404.","check":"api"},{"id":"AC7","statement":"As an admin: POST /api/admin/news with title, summary and source returns 201, and the item appears first in public GET /api/news (signed out) with no seedKey field. PATCH /api/admin/news/:id changes the fields seen in public GET /api/news. DELETE /api/admin/news/:id removes the item from it. A missing or blank title, summary or source returns 400 and writes no row. An unknown id returns 404. After running seedDemoContent, the admin-created item is still present and unchanged, and there are no duplicate rows.","check":"api"},{"id":"AC8","statement":"As an admin, POST /api/admin/import with {crates:[{name, label?, color?, suggested?, albums?:[{title, artist, year?, genre?, format?, tracks?}]}], news:[{title, summary, source, publishedAt?}]} creates everything and returns the created counts. The crates, their albums and tracks, and the news are then readable through the public crate, album and news endpoints. A payload with one invalid entry anywhere (for example, the last album with no artist) returns 400 naming the failing entry, and all table row counts are unchanged, proving all-or-nothing.","check":"api"},{"id":"AC12","statement":"From the repo root, npm run format:check, npm run lint, npm run typecheck, npm test and npm run build all exit 0. Every test in the baseline (357 tests) still passes, or any that had to change is listed with the reason in the run report; passwords.test.ts and auth-accounts.test.ts must not be among those changed.","check":"command"}],"constraints":["Admin account path: add a new idempotent step (for example ensureDevAdmin in apps/api/src/services/) called from apps/api/src/server.ts after bootstrapFromEnv. It only ever inserts one users row. It must not call db:seed, delete or update any existing row, or change an existing account's password or role.","The existing bootstrapAdmin cannot be reused as it stands, for two reasons. It does nothing when any admin already exists. Its createUser call goes through hashPassword, which throws 400 for passwords under 8 characters, and a thrown error in that server.ts try block exits the process. So ADMIN_PASSWORD=admin would stop the app from starting.","The 8-character minimum stays in force for signup, hashPassword's public behaviour and ADMIN_EMAIL/ADMIN_PASSWORD bootstrap. The short password is allowed only inside the dev-admin step, through a narrowly scoped internal hash path. apps/api/test/passwords.test.ts and the signup test in apps/api/test/auth-accounts.test.ts must pass unchanged.","Production guard: the dev-admin step never runs when NODE_ENV=production, whatever other variables are set. The Dockerfile already sets NODE_ENV=production. SEED_DEV_ADMIN=false disables it in other environments, following the shouldSeedDemo pattern, and SEED_DEV_ADMIN=true cannot override production. Production admins continue to come only from ADMIN_EMAIL/ADMIN_PASSWORD. A failure in this step is logged and must not stop the API from starting.","The plaintext password must never be logged. password_hash must never appear in any API response.","All new endpoints live under /api/admin/*, are registered in a new routes file with prefix /api, and call the existing requireAdmin from apps/api/src/services/permissions.ts, which stays the single authority. Verification reuses the existing PATCH /api/users/:username/verified route and setVerified.","Suggested means crates.recommended_rank is non-NULL, the same column that drives Home's Recommended crates section. Do not add a second flag.","Admin-created news uses the existing news_items table. seed_key is NOT NULL UNIQUE, so generate a key such as admin:\u003cuuid>. It must never collide with the demo 'news:' keys and must not appear in any response. Any migration must be additive and must keep existing rows.","Follow the repo's conventions: Vue view plus Pinia session store (session.isAdmin), a router meta guard next to requiresAuth, shared zod schemas in packages/shared, Prettier and ESLint, Conventional Commits, data-classification comments. The users list is CONFIDENTIAL PII.","Document the dev-admin step and SEED_DEV_ADMIN in README.md, docs/DEPLOY.md and .env.example.","Browser and command checks run on a temporary DATA_DIR or a temporary copy of the database, never on the owner's data/crate.db.","Out of scope: changing roles, deleting or suspending users, password reset or change, audit log, deleting demo rows permanently, and any real news feed or AI recommendations."],"testCommand":"npm test","status":"running"},{"id":"admin-web","goal":"Build the /admin panel, its admin route guard and account menu link, with unit tests and a real-browser check, then run the full repo gate.","description":"API CONTRACT (implemented by admin-api; types come from @frisson/shared, use `import type` only so Zod stays out of the main bundle):\n- GET /admin/overview -> AdminOverview {users, crates, suggestedCrates, albums, news}\n- GET /admin/users -> AdminUser[] {id,email,username,displayName,role,verified,isDemo,createdAt,crateCount}\n- GET /admin/crates -> AdminCrate[] {id,name,label,color,albumCount,ownerUsername|null,ownerDisplayName|null,recommendedRank|null,isDemo,createdAt}, suggested first in rank order\n- POST /admin/crates AdminCreateCrateRequest {name,label?,color?,sortBy?,suggested?} -> 201 AdminCrate\n- PATCH /admin/crates/:id/suggested {suggested} -> AdminCrate (409 for an ownerless crate)\n- GET /admin/news -> AdminNewsItem[] {id,title,summary,source,publishedAt,isDemo}\n- POST /admin/news AdminNewsRequest {title,summary,source,publishedAt?} -> 201\n- PATCH /admin/news/:id AdminUpdateNewsRequest -> AdminNewsItem\n- DELETE /admin/news/:id -> 204\n- POST /admin/import AdminImportRequest {crates:[{name,label?,color?,suggested?,albums?:[{title,artist,year?,genre?,format?,tracks?}]}],news:[...]} -> 201 AdminImportResult {crates,albums,tracks,news}\nVerification uses the existing setVerified(username, verified) in apps/web/src/api/profiles.ts.\nErrors: `request` and `errorMessage` from apps/web/src/api/client.ts. ApiRequestError.body.issues is [{path,message}], with paths like 'body/crates/0/albums/1/artist'. errorMessage alone only says 'Request is invalid', so the bulk form MUST render the issues inline to name the failing entry.\n\nFILES.\n- apps/web/src/api/admin.ts: thin client functions, one per endpoint, following apps/web/src/api/profiles.ts.\n- apps/web/src/router.ts: add `requiresAdmin?: boolean` to RouteMeta and a lazy route { path: '/admin', name: 'admin', meta: { requiresAuth: true, requiresAdmin: true } } before the catch-all. In router.beforeEach keep the login redirect for requiresAuth, and then if to.meta.requiresAdmin && !session.isAdmin return { name: 'home' }. requiresAuth also makes AccountMenu's logOut leave /admin, since it checks currentRoute.meta.requiresAuth.\n- apps/web/src/components/AccountMenu.vue: add a RouterLink role=menuitem, class menu-item, text 'Admin', to { name: 'admin' }, with @click=close and v-if on session.isAdmin, placed before Log out so the Log out last-child style stays correct.\n- apps/web/src/views/AdminView.vue plus components under apps/web/src/components/admin/ as needed. Include a CONFIDENTIAL (PII) data-classification comment wherever the users list is held. Never persist or log it.\n\nPANEL.\n- Use one useAsyncSection(loader) from apps/web/src/composables/useAsyncSection.ts per section ({data,status,error,load,refresh}: load shows loading, refresh is silent, neither rejects). Each section renders its own role=alert error with a Try again, never an empty list on failure. If refresh() fails, status is 'error' with old data retained, so show the error.\n- Sections have headings exactly: an overview with counts; 'News'; 'Suggested crates' (recommendedRank non-null); 'User created crates' (all others, each showing owner, and 'No owner' for ownerless); 'Users'; and a 'Bulk import' form.\n- News: create form; inline edit; delete with window.confirm (the pattern used in CratesView.vue). Next to delete on isDemo items, state that demo news returns on the next restart while demo seeding is on.\n- Crates: create form with Name and a Suggested checkbox. Each crate name links to /crates/:id. A suggested on/off control, disabled with an explanation for ownerless crates. An add-records link to /albums/new?crateId=\u003cid>, and a link to /crates for editing and deleting. Do not add crate editing or deletion here.\n- Users: email, username (link to /u/:username), display name, role, demo marker, crate count, VerifiedBadge (components/profile/VerifiedBadge.vue), and a verify/unverify button that updates the row without reload. If the target is the signed-in admin, also call session.refresh() so the masthead badge stays current. No role change, deletion or other out-of-scope actions.\n- Bulk import: textarea with a short example of the shape. JSON.parse locally; a parse failure shows an inline error and sends nothing. Show server issues inline and keep the pasted text on any error, including 413. On success show the created counts, clear the text, and refresh all sections. Note that bulk import is not de-duplicated and suggest db:backup first.\n- Disable every submit while its request is in flight, since a double post would create duplicates.\n- TRAP: the library Pinia store (apps/web/src/stores/library.ts) caches crates and albums once loaded, and CrateView, LibraryView and the album editor read from it. After any successful crate create, suggested toggle or import, call useLibraryStore().load({ force: true }) when its status is not 'idle'. Otherwise the same SPA session shows a stale /list, /albums/new dropdown, or a missing crate at /crates/:id, which would fail AC11.\n- Layout: no page-level horizontal overflow at 1280px or 390px. Use a stacked layout or an inner scroller on narrow widths, overflow-wrap:anywhere on emails and long names, and make controls comfortably tappable. Use the existing CSS variables and classes (.btn, .status-note, --paper, --ink, --marker-red) and set document.title as other views do.\n\nUNIT TESTS (AC9). Add to apps/web/src/router.test.ts (additions only, do not change existing cases) for signed-out -> login with next=/admin, role=user -> home, admin -> /admin. New apps/web/src/views/AdminView.test.ts covering section labels, fixture items from each list including owner names, a failed load showing an error rather than an empty list, invalid JSON sending nothing, and the verify toggle. New apps/web/src/components/AccountMenu.test.ts for the Admin link shown only to admins.\n\nBROWSER CHECK. Do NOT write it: the browser tester writes .shipyard/checks/admin-panel.check.mjs and judges AC10 and AC11. You may run the app yourself to confirm your own work, only on a temporary DATA_DIR (see startApp in .shipyard/checks/lib.mjs, read-only), never data/crate.db. The login and signup limit is 10 attempts per IP per 15 minutes. Build so that every clause of AC10 and AC11 in the brief works with real typing, clicks and touch taps.\n\nFINAL GATE (AC12), from the repo root: npm run format:check, npm run lint, npm run typecheck, npm test, npm run build, and also npm run check:dev-admin -w apps/api. All 357 baseline tests must still pass; list any changed existing test with the reason. If a failure belongs to a file you do not own, report it rather than editing that file.","ownsFiles":["apps/web/src/api/admin.ts","apps/web/src/router.ts","apps/web/src/router.test.ts","apps/web/src/components/AccountMenu.vue","apps/web/src/components/AccountMenu.test.ts","apps/web/src/views/AdminView.vue","apps/web/src/views/AdminView.test.ts","apps/web/src/components/admin/**"],"dependsOn":["dev-admin","admin-api"],"criteriaIds":["AC9","AC10","AC11","AC12"],"model":"opus","criteria":[{"id":"AC9","statement":"Web unit tests: visiting /admin signed out redirects to login with next=/admin, as role=user redirects to home, and as admin renders the panel with sections labelled News, Suggested crates, User created crates and Users. Those sections show fixture items from each API list, including owner names. The account menu shows an Admin link for an admin and no such link for role=user. A failed API load shows an error message, not an empty list.","check":"unit"},{"id":"AC10","statement":"Real browser, temporary database, 1280px wide. Type admin@frisson.com and admin into the /login form and submit, open the account menu, and click Admin, which lands on /admin. Use the panel forms to create a news item and a crate with Suggested on; both appear in the panel without a page reload. In a separate signed-out browser context, / shows the news item under Music news and the crate under Recommended crates, and /list shows the crate. In a third context, signed in as a role=user account, going to /admin directly ends on / with no panel content visible.","check":"browser"},{"id":"AC11","statement":"Same browser pass, as admin. Click the verify control on a user in the Users section; without a reload the row shows verified, and that user's public /u/:username page in a signed-out context shows the verified badge. Click it again and the badge is gone after a reload. Paste a valid JSON payload holding a crate with 2 albums and a news item into the bulk form and submit: a success count shows, the crate opens at /crates/:id showing both records, and the news shows on /. Pasting invalid JSON shows an inline error and adds nothing. At 1280px and 390px wide, /admin has no page-level horizontal overflow (document scrollWidth \u003c= viewport width), and the verify and create controls can be clicked with real mouse and touch input at those widths respectively.","check":"browser"},{"id":"AC12","statement":"From the repo root, npm run format:check, npm run lint, npm run typecheck, npm test and npm run build all exit 0. Every test in the baseline (357 tests) still passes, or any that had to change is listed with the reason in the run report; passwords.test.ts and auth-accounts.test.ts must not be among those changed.","check":"command"}],"constraints":["Admin account path: add a new idempotent step (for example ensureDevAdmin in apps/api/src/services/) called from apps/api/src/server.ts after bootstrapFromEnv. It only ever inserts one users row. It must not call db:seed, delete or update any existing row, or change an existing account's password or role.","The existing bootstrapAdmin cannot be reused as it stands, for two reasons. It does nothing when any admin already exists. Its createUser call goes through hashPassword, which throws 400 for passwords under 8 characters, and a thrown error in that server.ts try block exits the process. So ADMIN_PASSWORD=admin would stop the app from starting.","The 8-character minimum stays in force for signup, hashPassword's public behaviour and ADMIN_EMAIL/ADMIN_PASSWORD bootstrap. The short password is allowed only inside the dev-admin step, through a narrowly scoped internal hash path. apps/api/test/passwords.test.ts and the signup test in apps/api/test/auth-accounts.test.ts must pass unchanged.","Production guard: the dev-admin step never runs when NODE_ENV=production, whatever other variables are set. The Dockerfile already sets NODE_ENV=production. SEED_DEV_ADMIN=false disables it in other environments, following the shouldSeedDemo pattern, and SEED_DEV_ADMIN=true cannot override production. Production admins continue to come only from ADMIN_EMAIL/ADMIN_PASSWORD. A failure in this step is logged and must not stop the API from starting.","The plaintext password must never be logged. password_hash must never appear in any API response.","All new endpoints live under /api/admin/*, are registered in a new routes file with prefix /api, and call the existing requireAdmin from apps/api/src/services/permissions.ts, which stays the single authority. Verification reuses the existing PATCH /api/users/:username/verified route and setVerified.","Suggested means crates.recommended_rank is non-NULL, the same column that drives Home's Recommended crates section. Do not add a second flag.","Admin-created news uses the existing news_items table. seed_key is NOT NULL UNIQUE, so generate a key such as admin:\u003cuuid>. It must never collide with the demo 'news:' keys and must not appear in any response. Any migration must be additive and must keep existing rows.","Follow the repo's conventions: Vue view plus Pinia session store (session.isAdmin), a router meta guard next to requiresAuth, shared zod schemas in packages/shared, Prettier and ESLint, Conventional Commits, data-classification comments. The users list is CONFIDENTIAL PII.","Document the dev-admin step and SEED_DEV_ADMIN in README.md, docs/DEPLOY.md and .env.example.","Browser and command checks run on a temporary DATA_DIR or a temporary copy of the database, never on the owner's data/crate.db.","Out of scope: changing roles, deleting or suspending users, password reset or change, audit log, deleting demo rows permanently, and any real news feed or AI recommendations."],"testCommand":"npm test","status":"running"},{"id":"dev-admin","goal":"Add an insert-only dev admin step (admin@frisson.com / admin) that never runs in production, a repeatable real-server check command, and the docs for both.","description":"CONTEXT. apps/api/src/server.ts runs bootstrapFromEnv(app.db, process.env, app.log), then seedDemoFromEnv in its own inner try/catch, then listen. bootstrapAdmin cannot be reused: it does nothing when any admin exists, and createUser calls hashPassword, which throws 400 under 8 characters.\n\nPASSWORDS (apps/api/src/services/passwords.ts). Split the salt, derive and format code into a private unexported helper. Keep hashPassword's behaviour exactly. Export `hashDevAdminPassword(): Promise\u003cstring>`, which takes NO argument and hashes only a module-private constant 'admin'. This is the narrow path: it cannot weaken the policy for any other password. Do not export the unchecked helper. apps/api/test/passwords.test.ts and apps/api/test/auth-accounts.test.ts must not be edited.\n\nBOOTSTRAP (apps/api/src/services/bootstrap.ts). Only add `export` to freeAdminUsername(db: Db): string. BootstrapLog ({info(msg), warn(msg)}) is already exported.\n\nNEW SERVICE (apps/api/src/services/dev-admin.ts), with a CONFIDENTIAL (credentials) data-classification comment:\n- `export const DEV_ADMIN_EMAIL = 'admin@frisson.com'`\n- `export function shouldSeedDevAdmin(env: NodeJS.ProcessEnv = process.env): boolean`. Production check first: false if env.NODE_ENV, trimmed and lower-cased, is 'production', whatever else is set. Then false if SEED_DEV_ADMIN === 'false'. Otherwise true. SEED_DEV_ADMIN=true never overrides production.\n- `export async function ensureDevAdmin(db: Db, env: NodeJS.ProcessEnv = process.env, log: BootstrapLog = silent): Promise\u003c{ created: boolean }>`. Logic: if the guard is false, return {created:false}. Call findUserByEmail(db, DEV_ADMIN_EMAIL) from services/users.ts. If the row has role admin, return silently with no change. If it has any other role, log.warn a refusal to promote and return with no change. Otherwise hash with hashDevAdminPassword and do exactly one direct db.insert(users) with {email, username: freeAdminUsername(db), displayName: 'Admin', passwordHash, role: 'admin'}. Do NOT go through createUser. Catch a unique-constraint race (code SQLITE_CONSTRAINT_UNIQUE), warn, and do not throw. Do not touch crates or any other table. Log only fixed strings plus the username, never the password.\n\nSERVER (apps/api/src/server.ts). Immediately after bootstrapFromEnv, add an inner try { await ensureDevAdmin(app.db, process.env, app.log) } catch (err) { app.log.error(err, 'Could not add the dev admin; starting without it') }. Do not call it from buildApp, because tests and existing row counts rely on buildApp creating nothing.\n\nTESTS (apps/api/test/dev-admin.test.ts). Use buildTestApp, signUp and addCrate from apps/api/test/helpers.ts, and pass env explicitly (for example {}), since vitest sets NODE_ENV=test.\n- AC1: populate users, crates, albums, tracks, follows and news. Snapshot every row of every table with raw SQL. Run with NODE_ENV unset. Expect one new row, role admin, and POST /api/auth/login with admin@frisson.com / admin returning 200. All earlier rows must be deep-equal. A second run adds no row and leaves password_hash byte-identical.\n- AC2 (a) to (f) as written in the brief.\n- AC2(e) trap: the password 'admin' is a substring of the email and of ordinary messages, so a naive includes('admin') check cannot work. Instead capture every log call and assert each message exactly equals an expected fixed string, that no message contains the word 'password' with a value, and that only string arguments were passed. Also assert the hash never appears in logs.\n- Add a case where ADMIN_EMAIL has already created admin@frisson.com as admin: the step is a no-op.\n\nAC3 COMMAND. Create apps/api/scripts/check-dev-admin.ts, add `\"check:dev-admin\": \"node scripts/check-dev-admin.ts\"` to apps/api/package.json, and add \"scripts\" to include in apps/api/tsconfig.json. Run it as `npm run check:dev-admin -w apps/api`. It prints PASS or FAIL per step and exits non-zero on any failure. Behaviour:\n1. mkdtemp a temp DATA_DIR and build the fixture with createDb(path) from apps/api/src/db/client.ts (it returns an object with db). Add users, crates, albums, tracks and news, then close it. Every fixture crate MUST have an owner. Say why in a comment: bootstrap hands ownerless crates to the earliest admin on the next start, which is existing documented behaviour and would otherwise change rows.\n2. Dump every non-sqlite_ table from a separate connection.\n3. Spawn `node apps/api/src/server.ts` with cwd at the repo root and an env built from scratch: PATH and HOME only, plus DATA_DIR, PORT (free port), HOST=127.0.0.1, SEED_DEMO_DATA=false. No NODE_ENV, no ADMIN_*, no WEB_DIR, no DATABASE_PATH. Poll GET /api/health, SIGTERM, await exit, and start it again.\n4. While it is up and BEFORE login creates a session row, dump and compare. All pre-existing rows are identical, the only difference is one added users row, and the users count is +1.\n5. POST /api/auth/login returns 200 and GET /api/auth/me has role admin, using the returned cookie. Stop.\n6. Third start on a second, separate temp DB with NODE_ENV=production and SEED_DEV_ADMIN=true. Login returns 401 and no such row exists.\n7. Scan captured server stdout and stderr: no password_hash value, no scrypt$ string.\n8. Refuse to run if the resolved DB path is the repo's data/crate.db. Record size and mtime of data/crate.db (if present) before and after, and fail if they changed. Always remove the temp dirs and child processes, including on failure.\n\nDOCS.\n- README.md: env table row for SEED_DEV_ADMIN, how the local admin login works, a short /admin panel paragraph, and the check command.\n- docs/DEPLOY.md: production admins come only from ADMIN_EMAIL/ADMIN_PASSWORD. The guard fails open if NODE_ENV is unset on an internet-facing host started outside the Dockerfile or Compose, so always set it. A dev database restored through db:backup/db:restore or a copied file carries the working admin/admin row, so remove that row or use a clean production database. Run db:backup before bulk imports. With no earlier admin and no ADMIN_EMAIL, the dev admin becomes the earliest admin and receives ownerless crates on the next start. Demo rows deleted from the panel return on restart while seeding is on.\n- .env.example: a commented SEED_DEV_ADMIN entry saying it has no effect in production.\n- docs/adr/0007-dev-admin-login.md: a short ADR on the decision and its accepted risk.\nDo not touch compose.yaml or the Dockerfile.\n\nRun prettier, lint, typecheck and npm test. Never start the API without a temporary DATA_DIR.","ownsFiles":["apps/api/src/services/passwords.ts","apps/api/src/services/bootstrap.ts","apps/api/src/services/dev-admin.ts","apps/api/src/server.ts","apps/api/test/dev-admin.test.ts","apps/api/scripts/check-dev-admin.ts","apps/api/package.json","apps/api/tsconfig.json","README.md","docs/DEPLOY.md","docs/adr/0007-dev-admin-login.md",".env.example"],"dependsOn":[],"criteriaIds":["AC1","AC2","AC3","AC12"],"model":"opus","criteria":[{"id":"AC1","statement":"A test in apps/api/test/ populates a database with users, crates, albums, tracks, follows and news, then runs the dev-admin step with NODE_ENV unset. Exactly one new users row exists, with email admin@frisson.com and role admin, and logging in through the existing login endpoint with admin@frisson.com / admin returns 200. Every row that existed before is deep-equal to its earlier value. A second run adds no row and leaves that account's password_hash byte-identical.","check":"unit"},{"id":"AC2","statement":"Tests prove each of the following. (a) NODE_ENV=production creates no row, including with SEED_DEV_ADMIN=true. (b) SEED_DEV_ADMIN=false creates no row. (c) If admin@frisson.com already belongs to a role=user account, that row is unchanged (role and hash), a warning is logged, and nothing throws. (d) If username 'admin' is taken by another account, the new account gets admin-2 and that other account is unchanged. (e) No log output contains the plaintext password. (f) Signup with a 5-character password still returns 400, and hashPassword('admin') still rejects.","check":"unit"},{"id":"AC3","statement":"Start the real API (node apps/api/src/server.ts, with NODE_ENV unset and SEED_DEMO_DATA=false) against a temporary database already holding users, crates, albums and news, then stop it and start it again. After both starts, every table's pre-existing rows are identical to a dump taken before the first start (the only allowed dif <script>
const D = JSON.parse(document.getElementById('run-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

const st = D.state || {};
const verdict = (st.verdict || 'pending').toLowerCase();
const crit = st.criteria || {};
const critKeys = Object.keys(crit);
const statements = {};
const checks = {};
(D.brief?.acceptanceCriteria || []).forEach(c => { statements[c.id] = c.statement; checks[c.id] = c.check; });
const keys = critKeys.length ? critKeys : Object.keys(statements);
const counts = { pass: 0, fail: 0, untested: 0 };
keys.forEach(k => { counts[(crit[k] || 'untested')] = (counts[(crit[k] || 'untested')] || 0) + 1; });
const total = keys.length || 1;

const parts = [];

const nowIdx = D.stages.indexOf(st.stage);
const T = s => { const t = Date.parse(s); return Number.isFinite(t) ? t : null; };
const dur = ms => {
  if (ms == null || ms < 0) return '';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}h${String(m).padStart(2, '0')}m` : m ? `${m}m${String(r).padStart(2, '0')}s` : `${r}s`;
};
// Elements carrying data-since tick every second, so the page looks alive
// between renders even while one long agent is working.
const since = (iso, end) => {
  const a = T(iso); if (a == null) return '—';
  const b = T(end);
  return b != null ? dur(b - a) : `<span data-since="${a}">${dur(Date.now() - a)}</span>`;
};
const times = st.stageTimes || {};
const pipeline = D.stages.filter(s => s !== 'done').map((s, i) => {
  const cls = D.live && i === nowIdx ? 'now' : (nowIdx > i || !D.live ? 'done' : '');
  const t = times[s];
  const clock = t?.start ? `<small>${since(t.start, (D.live && i === nowIdx) ? null : (t.end || null))}</small>` : '';
  return `<div class="${cls}">${s.toUpperCase()}${clock}</div>`;
}).join('');
const quietMs = D.stateMtime ? Date.now() - D.stateMtime : 0;
const active = Array.isArray(st.active) ? st.active : [];
const usage = Array.isArray(st.usage) ? st.usage : [];
const tokenTotal = usage.reduce((sum, u) => sum + (u.tokens ?? 0), 0);

parts.push(`
<header>
  <h1>SHIPYARD<small>AUTONOMOUS DEV YARD // ${D.live ? 'YARD ACTIVE' : 'RUN RECORD'}</small></h1>
  <div class="meta">
    ${D.live
      ? '<span class="chip verdict live"><span class="dot"></span>WORKING</span>'
      : `<span class="chip verdict v-${esc(verdict)}">${esc(verdict)}</span>`}
    <span class="chip">RUN <b>${esc(st.runId || '—')}</b></span>
    ${st.size ? `<span class="chip">SIZE <b>${esc(st.size)}</b></span>` : ''}
    ${usage.length ? `<span class="chip">TOKENS <b>${tokenTotal.toLocaleString('en-US')}</b></span>` : ''}
    ${st.startedAt ? `<span class="chip">ELAPSED <b>${since(st.startedAt, D.live ? null : st.endedAt)}</b></span>` : ''}
    ${D.live && active.length ? `<span class="chip live">CREW <b>${active.length}</b></span>` : ''}
    ${D.live ? `<span class="chip nosignal" id="nosignal" data-mtime="${D.stateMtime}" style="display:none">NO SIGNAL <b></b></span>` : ''}
    <span class="chip">CYCLE <b>${esc(st.cycle || '?')}/${esc(st.maxCycles || 3)}</b></span>
    ${st.fixRound ? `<span class="chip">FIX ROUND <b>${esc(st.fixRound)}/${esc(st.maxFixRounds || 3)}</b></span>` : ''}
    <span class="chip">BRANCH <b>${esc(st.branch || '—')}</b></span>
    <span class="chip">TARGET <b>${esc(st.target || '—')}</b></span>
    ${(st.fastPaths || []).map(f => `<span class="chip fast">FAST PATH <b>${esc(f)}</b></span>`).join('')}
  </div>
  <div class="pipe">${pipeline}</div>
  <div class="tele">
    <span>${D.live ? '◉ TELEMETRY LIVE — REFRESHING EVERY 4s' : '· TRANSMISSION ENDED'}</span>
    <span>STAGE: ${esc((st.stage || 'unknown').toUpperCase())}</span>
  </div>
</header>
${D.live ? '<div class="scan"><i></i></div>' : ''}
<div class="hazard"></div>`);

if (D.live && active.length) {
  parts.push(`<section><h2>Crew on deck — ${active.length} working</h2><div class="body"><div class="crew">
    ${active.map(a => {
      const t = T(a.since);
      const slow = t != null && Date.now() - t > 15 * 60 * 1000;
      return `<div class="hand${slow ? ' slow' : ''}"><div class="role"><span class="dot"></span>${esc(a.role || 'agent')}<span class="clock">${since(a.since)}</span></div>
        <div class="who">${esc(a.id || '?')}</div>
        ${a.task ? `<div class="sub" style="color:var(--grey);font-size:11px">${esc(a.task)}</div>` : ''}</div>`;
    }).join('')}
  </div></div></section>`);
}

if (D.tree && D.tree.total) {
  const wip = D.tree.files.filter(f => f.wip).length;
  const rows = D.tree.files.map(f => `<tr>
      <td class="mono">${f.wip ? '<span class="wip">●</span> ' : ''}${esc(f.path)}</td>
      <td class="num">${f.add == null ? (f.isNew ? '<span class="add">new</span>' : '') : f.add ? '<span class="add">+' + f.add + '</span>' : ''}</td>
      <td class="num">${f.del ? '<span class="del">−' + f.del + '</span>' : ''}</td></tr>`).join('');
  parts.push(`<section><h2>Working tree — ${D.tree.total} file${D.tree.total === 1 ? '' : 's'} changed${wip ? ', ' + wip + ' uncommitted' : ''}</h2><div class="body">
    <table><thead><tr><th>File ${wip ? '(● = being written)' : ''}</th><th style="text-align:right">Added</th><th style="text-align:right">Removed</th></tr></thead><tbody>${rows}</tbody></table>
    ${D.tree.total > D.tree.files.length ? '<p class="empty">Showing the first ' + D.tree.files.length + '.</p>' : ''}
  </div></section>`);
}

if (st.request || D.brief?.goal) {
  parts.push(`<section><h2>Work order</h2><div class="body">
    <pre>${esc(D.brief?.goal || st.request)}</pre>
    ${(D.brief?.assumptions || []).length ? '<p style="margin:11px 0 4px;color:var(--amber-dim);font-size:11px;letter-spacing:.2em">ASSUMPTIONS MADE</p><ul>' + D.brief.assumptions.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : ''}
  </div></section>`);
}

// Acceptance criteria
const bar = `<div class="bar">
  <i class="p" style="width:${counts.pass / total * 100}%"></i>
  <i class="f" style="width:${counts.fail / total * 100}%"></i>
  <i class="u" style="width:${counts.untested / total * 100}%"></i>
</div>`;
const cards = keys.length ? keys.map(k => {
  const s = crit[k] || 'untested';
  return `<div class="crit"><span class="id">${esc(k)}</span><span class="st ${esc(s)}">${s === 'pass' ? '◉ PASS' : s === 'fail' ? '✗ FAIL' : '· UNTESTED'}</span>
    <p>${esc(statements[k] || '')}</p>${checks[k] ? `<span class="tag">${esc(checks[k])}</span>` : ''}</div>`;
}).join('') : '<p class="empty">No acceptance criteria recorded — intake did not complete.</p>';
parts.push(`<section><h2>Acceptance criteria — ${counts.pass}/${keys.length || 0} pass</h2><div class="body">${keys.length ? bar : ''}<div class="grid">${cards}</div></div></section>`);

// Token use. The figures come straight from state.json's usage list.
if (usage.length) {
  const byRole = {};
  usage.forEach(u => {
    const r = byRole[u.role] || (byRole[u.role] = { agents: 0, tokens: 0 });
    r.agents++;
    r.tokens += u.tokens ?? 0;
  });
  const fmt = n => Number(n).toLocaleString('en-US');
  const roleRows = Object.entries(byRole).sort((a, b) => b[1].tokens - a[1].tokens).map(([role, r]) =>
    `<tr><td><b>${esc(role)}</b></td><td class="num">${r.agents}</td><td class="num">${fmt(r.tokens)}</td><td class="num">${tokenTotal ? Math.round(r.tokens / tokenTotal * 100) : 0}%</td></tr>`).join('');
  const agentRows = usage.map(u =>
    `<tr><td class="mono">${esc(u.agent)}${u.fixOf ? ' (fix of ' + esc(u.fixOf) + ')' : ''}</td><td>${esc(u.role)}</td><td>${esc(u.model || '—')}</td><td class="num">${u.tokens == null ? 'unavailable' : fmt(u.tokens)}</td><td class="num">${u.toolUses ?? '—'}</td></tr>`).join('');
  const unknown = usage.filter(u => u.tokens == null).length;
  const hasHarbormaster = usage.some(u => u.role === 'harbormaster');
  parts.push(`<section><h2>Token use — ${fmt(tokenTotal)} reported</h2><div class="body">
    <table><thead><tr><th>Role</th><th style="text-align:right">Agents</th><th style="text-align:right">Tokens</th><th style="text-align:right">Share</th></tr></thead><tbody>${roleRows}</tbody></table>
    ${hasHarbormaster ? '' : "<p class=\"empty\">The harbormaster's own tokens are not included: no figure was available.</p>"}
    ${unknown ? '<p class="empty">' + unknown + ' agent(s) reported no figure and count as 0, so the real total is higher.</p>' : ''}
    <details><summary>Per agent</summary><div class="inner"><table><thead><tr><th>Agent</th><th>Role</th><th>Model</th><th style="text-align:right">Tokens</th><th style="text-align:right">Tool uses</th></tr></thead><tbody>${agentRows}</tbody></table></div></details>
  </div></section>`);
}

// Cycles
(D.cycles || []).forEach(c => {
  const tasks = (c.plan?.tasks || []);
  const taskState = st.tasks || {};
  const rows = tasks.length ? tasks.map(t => {
    const s = taskState[t.id] || 'todo';
    return `<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.goal)}${t.model ? ` <span class="tag">${esc(t.model)}</span>` : ''}</td>
      <td class="mono">${esc((t.ownsFiles || []).join(', '))}</td>
      <td class="mono">${esc((t.dependsOn || []).join(', ') || '—')}</td>
      <td><span class="tag t-${esc(s)}">${esc(s)}</span></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No plan produced for this cycle.</td></tr>';

  parts.push(`<section><h2>Cycle ${esc(c.n)}</h2><div class="body">
    <div class="cycle-head"><h3>DELEGATION</h3></div>
    <table><thead><tr><th>Task</th><th>Goal</th><th>Owns files</th><th>After</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>
    ${c.spec ? '<details><summary>Manager spec — what it intended to build</summary><div class="inner"><pre>' + esc(c.spec) + '</pre></div></details>' : ''}
    ${c.testReport ? '<details><summary>Tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.testReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.browserReport ? '<details><summary>Browser tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.browserReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.defects ? '<details><summary>Triaged defects</summary><div class="inner"><pre>' + esc(JSON.stringify(c.defects, null, 2)) + '</pre></div></details>' : ''}
  </div></section>`);
});

// Deaths
if ((st.deaths || []).length) {
  parts.push(`<section><h2>Agent losses — ${st.deaths.length}</h2><div class="body"><table>
    <thead><tr><th>Agent</th><th>Reason</th><th>Detail</th></tr></thead><tbody>
    ${st.deaths.map(d => `<tr><td><b>${esc(d.agentId || d.agent || '?')}</b></td><td class="fail">${esc(d.reason)}</td><td class="mono">${esc(d.detail)}</td></tr>`).join('')}
    </tbody></table></div></section>`);
}

if (D.reportMd) {
  parts.push(`<section><h2>Report</h2><div class="body"><pre>${esc(D.reportMd)}</pre></div></section>`);
}

if ((D.agents || []).length) {
  parts.push(`<section><h2>Crew logs — ${D.agents.length} agents</h2><div class="body">
    ${D.agents.map(a => '<details><summary>' + esc(a.id) + '</summary><div class="inner"><pre>' + esc(a.body) + '</pre></div></details>').join('')}
  </div></section>`);
}

if (D.ledger) {
  parts.push(`<section><h2>Harbormaster log</h2><div class="body"><pre>${esc(D.ledger)}</pre></div></section>`);
}

parts.push(`<div class="hazard"></div><footer>
  SHIPYARD // ${esc(D.runDir)}<br>
  ${D.live
    ? 'YARD ACTIVE — this page reloads itself. Leave the tab open.'
    : 'TRANSMISSION ENDED — this page is final and will not reload.'}
</footer>`);
document.getElementById('app').innerHTML = parts.join('');

// Tick the clocks between reloads, and raise NO SIGNAL if the harbormaster
// has not written state.json for a long time while the run claims to be live.
(function tick(){
  const fmt = ms => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + 'h' + String(m).padStart(2, '0') + 'm' : m ? m + 'm' + String(r).padStart(2, '0') + 's' : r + 's';
  };
  const QUIET = 20 * 60 * 1000;
  function step(){
    document.querySelectorAll('[data-since]').forEach(n => { n.textContent = fmt(Date.now() - +n.dataset.since); });
    const ns = document.getElementById('nosignal');
    if (ns && +ns.dataset.mtime) {
      const q = Date.now() - +ns.dataset.mtime;
      ns.style.display = q > QUIET ? '' : 'none';
      ns.querySelector('b').textContent = fmt(q);
    }
  }
  step(); setInterval(step, 1000);
})();

// A meta-refresh is a full reload, which would slam every <details> shut and
// jump you back to the top mid-read. Persist what the reader opened and where
// they were, keyed by run so two tabs do not fight. sessionStorage, not local:
// this is view state, and it should die with the tab.
(function preserveReadingState(){
  const KEY = 'shipyard:' + (D.state?.runId || 'run');
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}') } catch {}

  const summaries = () => [...document.querySelectorAll('details')];

  summaries().forEach(d => {
    const label = d.querySelector('summary')?.textContent?.trim();
    if (label && saved.open && saved.open.includes(label)) d.open = true;
    d.addEventListener('toggle', save);
  });

  if (typeof saved.scroll === 'number') window.scrollTo(0, saved.scroll);

  function save(){
    const open = summaries().filter(d => d.open)
      .map(d => d.querySelector('summary')?.textContent?.trim())
      .filter(Boolean);
    try { sessionStorage.setItem(KEY, JSON.stringify({ open, scroll: window.scrollY })) } catch {}
  }

  let t;
  window.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(save, 150) }, { passive: true });
  window.addEventListener('beforeunload', save);
})();
</script>
</body>
</html>
