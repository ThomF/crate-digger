*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);}
body{

  color:var(--amber); font-size:13px; line-height:1.55;

  text-shadow:0 0 1px var(--amber-glow);
}
/* CRT scanlines */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:98;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);

a{color:var(--amber)}
.hazard{height:8px;background:repeating-linear-gradient(45deg,var(--amber-dim) 0 10px,#0b0a08 10px 20px);margin:14px 0;opacity:.6}
header{border:2px solid var(--amber-dim);background:var(--panel);padding:14px 16px;position:relative}
header h1{margin:0;font-size:22px;letter-spacing:.42em;font-weight:700}
header h1 small{letter-spacing:.1em;font-size:11px;color:var(--amber-dim);display:block;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

.v-shipped{border-color:var(--green);color:var(--green)}
.v-failed{border-color:var(--red);color:var(--red)}
.v-partial,.v-pending{border-color:var(--amber);color:var(--amber)}
section{border:1px solid var(--rule);background:var(--panel);margin:18px 0}
section>h2{
  margin:0;padding:8px 14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  background:var(--panel2);border-bottom:1px solid var(--rule);color:var(--amber-dim);
}
section>.body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.crit{border:1px solid var(--rule);padding:9px 11px;background:var(--panel2)}
.crit .id{font-weight:700;letter-spacing:.14em}
.crit .st{float:right;font-size:11px;letter-spacing:.14em}
.pass{color:var(--green)} .fail{color:var(--red)} .untested{color:var(--grey)}

.bar i.p{background:var(--green)} .bar i.f{background:var(--red)} .bar i.u{background:#2a2419}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--amber-dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
td.mono{color:#d9c9a6}
.tag{border:1px solid var(--rule);padding:1px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-dim)}
.t-done{border-color:var(--green);color:var(--green)}
.t-blocked{border-color:var(--red);color:var(--red)}
pre{background:#0c0a07;border:1px solid var(--rule);padding:11px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#d9c9a6;font-size:12px;margin:0}
details{border:1px solid var(--rule);background:var(--panel2);margin:7px 0}
details>summary{padding:7px 11px;cursor:pointer;letter-spacing:.14em;font-size:11px;text-transform:uppercase;color:var(--amber-dim)}
details[open]>summary{border-bottom:1px solid var(--rule);color:var(--amber)}
details .inner{padding:11px}
.cycle-head{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.cycle-head h3{margin:0;font-size:13px;letter-spacing:.26em}
.empty{color:var(--grey);font-style:italic}
footer{color:var(--grey);font-size:11px;letter-spacing:.14em;text-align:center;padding:18px 0}
@media print{body::before,body::after{display:none}}

/* ── live telemetry ─────────────────────────────────────── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(420%)}}
@keyframes flicker{0%,100%{opacity:1}97%{opacity:1}98%{opacity:.82}99%{opacity:1}}
header{animation:flicker 7s infinite}
.live{border-color:var(--green)!important;color:var(--green)!important}
.live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;animation:pulse 1.1s infinite;box-shadow:0 0 6px var(--green)}
.scan{position:relative;overflow:hidden;height:3px;background:#0c0a07;border:1px solid var(--rule);border-left:0;border-right:0;margin:0}
.scan i{position:absolute;top:0;left:0;height:100%;width:24%;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 2.4s linear infinite}
/* stage pipeline */
.pipe{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--rule);background:#0c0a07}
.pipe div{flex:1;text-align:center;padding:7px 2px;font-size:10px;letter-spacing:.18em;color:#3b3225;border-right:1px solid var(--rule);position:relative}
.pipe div:last-child{border-right:0}
.pipe div.done{color:var(--amber-dim);background:#140f09}
.pipe div.now{color:#0b0a08;background:var(--amber);font-weight:700;animation:pulse 1.6s infinite}
.tele{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--grey);margin-top:6px}
.pipe div small{display:block;font-size:9px;letter-spacing:.08em;margin-top:2px;opacity:.85}
.nosignal{border-color:var(--red)!important;color:var(--red)!important;animation:pulse 1.6s infinite}
.fast{border-color:var(--green);color:var(--green)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hand{border:1px solid var(--green);background:var(--panel2);padding:9px 11px}
.hand .role{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.hand .role .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.1s infinite}
.hand .who{font-weight:700;margin:4px 0 2px}
.hand .clock{float:right;color:#e8d5ad}
.hand.slow{border-color:var(--amber)}
td.num{text-align:right;white-space:nowrap}
.add{color:var(--green)} .del{color:var(--red)}
.wip{color:var(--green);animation:pulse 1.1s infinite}

ck && npm run lint && npm test && npm run build"},"ledger":"# Ledger\n\n- 2026-11-07T08:36:17Z preflight: branched from 1278ddfd8222ad32ef9c604eb62d1b303292d95c. Owner override: merge and push to main when shipped.\n- 2026-11-07T08:36:17Z survey cache rejected (apps/web/vite.config.ts changed since cached commit, a vite config per the rule): full survey, 3 surveyors (268 tracked files), dispatched with intake.\n- 2026-11-07T08:37:45Z brief AC1..AC14 accepted. Survey merged and cached. manager-1 dispatched.\n- 2026-11-07T08:38:51Z baseline gates green.\n- 2026-11-07T08:39:02Z plan validated: 2 tasks, uncovered=[], conflicts=0.\n- 2026-11-07T08:39:02Z dispatched dev-T1.\n- 2026-11-07T08:42:49Z done: T1.\n- 2026-11-07T08:42:49Z dispatched dev-T2.\n- 2026-11-07T08:45:03Z done: T2.\n- 2026-11-07T08:45:03Z build complete (2 tasks). tester-1 dispatched on AC1..AC14 plus real-browser screenshots (desktop + narrow).\n- 2026-11-07T08:49:17Z tester-1: 14/14 pass; real Chrome at 1280/390/320 wide: avatar top right, no overlap when closed, Escape and all items work. Harbormaster reviewed the screenshots. reporter-1 dispatched.\n- 2026-11-07T08:49:52Z verdict shipped. Fast-forward merge to main and push per owner override.\n","reportMd":"# Report: header account menu\n\n**Verdict: shipped.** All 14 acceptance criteria pass in cycle 1 of 3, with no fix rounds.\n\n## What was asked\nMove the account UI in the header to the right as an avatar. Clicking it opens a menu with View profile, Edit profile and Log out. The owner asked for a direct merge and push to main, which is done right after this report.\n\n## Acceptance criteria\n| ID | Criterion | Status |\n|---|---|---|\n| AC1 | Avatar button with menu semantics and accessible name | pass |\n| AC2 | Initials fallback and avatar image | pass |\n| AC3 | Menu header and exactly three items | pass |\n| AC4 | Menu toggles from the trigger | pass |\n| AC5 | Escape closes and refocuses the trigger | pass |\n| AC6 | Outside click closes | pass |\n| AC7 | Closes after choosing a link and on route change | pass |\n| AC8 | Log out, redirect from auth routes, failure alert | pass |\n| AC9 | Signed-out Log in / Sign up on the right, hidden on own page | pass |\n| AC10 | Right-pinned layout CSS, old centered styles removed | pass |\n| AC11 | Frisson sign and tagline unchanged | pass |\n| AC12 | No v-html, no dependency changes | pass |\n| AC13 | Only apps/web changed | pass |\n| AC14 | Typecheck, tests and build green | pass |\n\n## What was built\n- 179fb1c feat(web): move account controls to a right-hand avatar menu in the masthead\n- b5b6438 refactor(web): use shared initials helper in ProfileView\n\n## Test results\n- Full workspace: typecheck, tests (web 222, other workspace 180) and build all exit 0.\n- Each named vitest test exists, runs and asserts real behaviour.\n- Real Chrome at 1280, 390 and 320 widths: the avatar sits top right and the closed menu never overlaps the sign or tagline. On mobile the open dropdown covers part of the sign, which is expected for a popover.\n- Real Chrome flows: Escape closes and refocuses the trigger. View profile and Edit profile navigate and close the menu. Log out returns to the home page, removes the avatar, and /api/auth/me returns 401.\n- Screenshots were taken outside the repo, in /home/claude/shots.\n\n## What went wrong\nNothing blocking. One small test gap: the \"log out signs out and closes the menu\" test starts on the home page, so its library redirect assertion is trivially true. The redirect is covered by the separate auth-required page test. Production static serving needs WEB_DIR=apps/web/dist; this is a setup note, not a defect.\n\n## Next steps\n1. New homepage with automated music-news posts.\n2. Auto-generated crates and favorites on profiles.\n3. Following.\n","cycles":[{"n":"1","spec":"# Cycle 1 spec: header account menu\n\n## What and why\nToday the Frisson masthead is centered and the account controls (name link, Edit profile, Log out, or Log in / Sign up) sit as a centered text row under the tagline (App.vue `nav.user-menu`). The request moves account UI to the right of the masthead as a round avatar button that opens an accessible dropdown, matching common web conventions while keeping the 90s paper and marker look from docs/SPEC.md section 5. The sign and tagline stay exactly as they are (AC11). Everything stays in apps/web (AC13) with no new dependencies and no v-html (AC12).\n\n## Design\n- **utils/initials.ts**: one exported function with the ProfileView rule (displayName trimmed, else username; two words give first letters of the first two, otherwise first two chars; uppercase). The survey found the logic only lives inline in ProfileView, so extracting it guarantees \"identical\" initials. Unit tested.\n- **components/profile/UserAvatar.vue**: round avatar; img when avatarUrl is set, initials span otherwise. Decorative inside the trigger (the button carries the name).\n- **components/AccountMenu.vue**: wrapper `nav.user-menu` (aria-label Account) with `button.avatar-btn` (aria-haspopup=menu, aria-expanded, accessible name containing the display name). When open, a `role=menu` panel, right aligned, with a header (name, @username, VerifiedBadge for verified users) and three `role=menuitem` entries: View profile (/u/alice), Edit profile (/profile/edit), Log out (button). Closed by default via v-if. Closes on trigger toggle, Escape (focus returns to trigger), outside document click (contains check against the wrapper so the trigger click and header clicks do not close it), item choice, and route change (watch route.fullPath). Document listeners removed on unmount. No arrow key roving; Tab order is enough.\n- **Log out** keeps the existing behaviour: session.logOut() (POST /api/auth/logout), close menu, redirect to library when the current route has meta.requiresAuth, role=alert message with errorMessage on failure.\n- **App.vue**: `.masthead` gets position: relative; account area absolutely positioned with top and right; signed-out Log in / Sign up live in that area and stay hidden on their own pages. Horizontal padding is reserved around the sign so the control cannot overlap on narrow screens. Old centered `.user-menu` row styles are deleted (AC10). Styling uses base.css tokens only.\n- **ProfileView** (T2) switches to the shared helper without changing its DOM.\n\n## Tests (App.test.ts, exact titles, old tests removed)\n- renders an avatar trigger with menu semantics (AC1)\n- shows initials when there is no avatar; shows the avatar image when avatarUrl is set (AC2)\n- opens a menu with header and three items (AC3)\n- toggles the menu from the trigger (AC4)\n- closes on Escape and refocuses the trigger (AC5)\n- closes on outside click (AC6)\n- closes after choosing a link; closes on route change (AC7)\n- log out signs out and closes the menu; log out on an auth-required page redirects to the library; log out failure shows an alert (AC8; add a requiresAuth stub route in the test router)\n- shows log in and sign up when signed out; hides the link for the current auth page (AC9)\n\nUse attachTo: document.body where focus or document clicks matter (happy-dom risk).\n\n## Tasks\nT1 owns the helper, UserAvatar, AccountMenu, App.vue and App.test.ts and serves every criterion. T2 depends on T1 and only touches ProfileView.vue. No shared files.\n\n## Gate notes\nAC10's grep for `right:` looks at src/App.vue and top-level src/components/*.vue, which is why the menu lives at src/components/AccountMenu.vue (not a subfolder) and the absolute/right positioning sits in App.vue. AC12/AC13 rely on git; the target may lack a git repo, so the orchestrator may need to verify against the base commit snapshot.\n","plan":{"cycle":1,"tasks":[{"id":"T1","title":"Header account menu on the right with shared avatar and initials helper","description":"Add apps/web/src/utils/initials.ts exporting initials(displayName, username): use displayName.trim() or username; if two or more words take the first letter of the first two words, else the first two characters; uppercase. Cover it in utils/initials.test.ts ('Alice Cooper' -> 'AC', empty displayName with username 'alice' -> 'AL', single word, extra whitespace). Add components/profile/UserAvatar.vue (props avatarUrl: string|null, displayName, username, optional size class): renders img with src=avatarUrl when set, otherwise a span with the initials (aria-hidden, since the trigger carries the accessible name). Add components/AccountMenu.vue: a nav.user-menu aria-label=Account wrapper containing button.avatar-btn (type=button, aria-haspopup=menu, aria-expanded bound, aria-controls to the menu id, aria-label 'Account menu for \u003cdisplayName or username>') with UserAvatar inside; when open (v-if) a right-aligned [role=menu] panel with a header (display name, @username, VerifiedBadge only if verified) and exactly three role=menuitem items: RouterLink View profile to /u/{encodeURIComponent(username)}, RouterLink Edit profile to /profile/edit, button Log out. Close on: second trigger click, Escape (then focus the trigger via template ref), document click outside the wrapper (use a contains check on the wrapper ref so trigger and menu header clicks do not close; register on mount, remove on unmount), choosing any item, and a watch on route.fullPath. Log out reuses the App.vue logic moved into this component or emitted to App: await session.logOut(), close the menu, push {name:'library'} if currentRoute.meta.requiresAuth, on throw show span role=alert with errorMessage(e). In App.vue keep RouterLink.sign 'Frisson' and the tagline text exactly; make .masthead position: relative; render an account area (v-if session.loaded) positioned absolute with top and right set; signed-in shows AccountMenu, signed-out shows Log in / Sign up links in that same area hidden on their own route names as today; reserve horizontal padding on .sign/.masthead (e.g. padding-inline on the sign block at narrow widths) so the right control cannot overlap the sign; delete the old centered .user-menu styles (justify-content center, margin-top). Dropdown styling with base.css tokens only (paper bg, 2px ink border, 4px 4px 0 var(--cardboard-dark) shadow, z-index above page, max-width with overflow-wrap for long names, text-align left). Rewrite App.test.ts with the brief's exact test titles (see spec) and drop the obsolete tests; mount with attachTo: document.body for focus/outside-click tests and unmount after each. No v-html, no new deps, no hard-coded hex colours.","criteria":["AC1","AC2","AC3","AC4","AC5","AC6","AC7","AC8","AC9","AC10","AC11","AC12","AC13","AC14"],"files":["apps/web/src/utils/initials.ts","apps/web/src/utils/initials.test.ts","apps/web/src/components/profile/UserAvatar.vue","apps/web/src/components/AccountMenu.vue","apps/web/src/App.vue","apps/web/src/App.test.ts"],"dependsOn":[]},{"id":"T2","title":"ProfileView uses the shared initials helper","description":"Replace the local initials computation in apps/web/src/views/ProfileView.vue with the initials() helper from utils/initials.ts so header and profile share one implementation. Keep ProfileView's existing markup, classes (.avatar, .placeholder), alt text and styles unchanged so ProfileView.test.ts passes untouched. Using UserAvatar here is optional and only if the rendered DOM and classes stay identical. Run the full web gate afterwards.","criteria":["AC2","AC12","AC13","AC14"],"files":["apps/web/src/views/ProfileView.vue"],"dependsOn":["T1"]}]},"testReport":{"criteria":{"AC1":{"verdict":"pass","evidence":"vitest -t 'renders an avatar trigger with menu semantics': Tests 1 passed | 13 skipped (14), exit 0. Asserts BUTTON tag, type=button, aria-haspopup=menu, aria-expanded=false, aria-label contains 'Alice Cooper', no menu. Browser: aria-label 'Account menu for Ada Lovelace', haspopup=menu, expanded=false."},"AC2":{"verdict":"pass","evidence":"Both named tests: 1 passed | 13 skipped each, exit 0. Asserts text 'AC', 'AL' for em on '/', so its library assertion is trivially true; the redirect is covered by the second test."},"AC9":{"verdict":"pass","evidence":"'shows log in and sign up when signed out' and 'hides the link for the current auth page': 1 passed each, exit 0. Real Chrome: '/' shows [Log in, Sign up] at top right; '/login' shows [Sign up] only."},"AC10":{"verdict":"pass","evidence":"check exit 0. App.vue: .masthead position: relative; padding 2rem 4.75rem (10rem inline at >=40rem); .account position: absolute; top 0.75rem; right 0.75rem. AccountMenu .menu position: absolute; right: 0. No justify-content: center on user-menu. Browser: avatar box x=1216..1256 at 1280 wide; x=338..378 at 390 wide, sign x=122..268, no overlap; at 320 wide avatar x=268, sign ends 233, no overlap."},"AC11":{"verdict":"pass","evidence":"check exit 0: class=\"sign\">Frisson and 'Used &amp; new vinyl · est. 1994' present in App.vue."},"AC12":{"verdict":"pass","evidence":"check exit 0; grep -rn v-html src finds nothing; git diff --stat 1278ddf HEAD on package.json files empty."},"AC13":{"verdict":"pass","evidence":"check exit 0 (worktree only has untracked .shipyard run dir). git diff --name-only 1278ddf HEAD lists only apps/web files: App.test.ts, App.vue, components/AccountMenu.vue, components/profile/UserAvatar.vue, utils/initials.ts, utils/initials.test.ts, views/ProfileView.vue."},"AC14":{"verdict":"pass","evidence":"Full command 'npm run format:check && npm run typecheck && npm run lint && npm test && npm run build' exit 0: Test Files 16 passed (16) Tests 222 passed (222); Test Files 24 passed (24) Tests 180 passed (180); vite build '242 modules transformed', 'built in 2.51s'."}},"visual":{"screenshots":["/home/claude/shots/header-signed-out-desktop.png","/home/claude/shots/header-signed-in-desktop.png","/home/claude/shots/header-menu-open-desktop.png","/home/claude/shots/header-menu-open-mobile.png"],"avatarOnRight":"yes: top right corner at 1280, 390 and 320 widths; signed out links also top right s"},"tests":{"App.test.ts":"14 passed, brief titles exact","initials.test.ts":"4 passed"},"blockers":[],"notes":["Log out logic moved from App.vue into AccountMenu.vue; menu closes before awaiting logout, alert shown inside AccountMenu on failure.","Escape and outside click use document listeners added on mount, removed on unmount; outside click uses root.contains.","Signed-out links use nav.auth-links aria-label Account inside .account; nav.user-menu exists only when signed in.","Masthead padding-inline 4.75rem narrow, 10rem at >=40rem; narrow-width overlap verified by CSS reasoning only, not visually.","ProfileView still has its own inline initials (T2 scope)."]},{"id":"T2","status":"implemented","commit":"b5b6438","files":["apps/web/src/views/ProfileView.vue"],"criteria":["AC2","AC12","AC13","AC14"],"gates":{"format:check":"pass","typecheck":"pass","lint":"pass","test":"pass (web 180, api 222)","build":"pass"},"tests":{"ProfileView.test.ts":"14 passed, unchanged","App.test.ts -t 'shows initials when there is no avatar'":"passed"},"blockers":[],"notes":["Local initials computation replaced by initials(displayName, username) from utils/initials.ts, imported as initialsFor; computed returns '' when profile is null, same as before.","Template, classes (.avatar, .placeholder), alt text and styles untouched; UserAvatar not used so the DOM stays identical.","No new tests: helper is covered by T1's initials.test.ts and ProfileView behaviour by the existing ProfileView.test.ts."]}]}],"agents":[{"id":"dev-T1","body":"# dev T1\n\nImplemented the header account menu. Commit 179fb1c on shipyard/header-user-menu-2026-11-07T08-36-17.\n\n- utils/initials.ts (+ 4 unit tests): ProfileView rule extracted verbatim.\n- components/profile/UserAvatar.vue: round img (alt \"\") or aria-hidden initials span on cardboard.\n- components/AccountMenu.vue: nav.user-menu, button.avatar-btn with aria-haspopup/expanded/controls and label \"Account menu for \u003cname>\"; v-if role=menu paper panel (2px ink border, cardboard-dark offset shadow, right aligned, overflow-wrap) with name/@username/VerifiedBadge header and three menuitems. Closes on toggle, Escape (refocus trigger), outside click (contains check), item click, route.fullPath watch. Log out logic moved here from App.vue.\n- App.vue: sign and tagline unchanged; masthead relative; .account absolute top/right; signed-out Log in / Sign up there, hidden on own pages; old centered .user-menu styles removed.\n- App.test.ts: 14 tests with the brief's exact titles, attachTo body, unmount after each.\n\nAll five gates passed. Not checked visually in a browser.\n"},{"id":"dev-T2","body":"# dev T2\n\nCommit b5b6438 on shipyard/header-user-menu-2026-11-07T08-36-17.\n\n- ProfileView.vue: the inline initials logic now calls initials() from utils/initials.ts (imported as initialsFor). Markup, classes, alt text and styles unchanged; UserAvatar not used, to keep the DOM identical.\n- No new tests. T1's initials.test.ts covers the helper and the existing ProfileView.test.ts (14) passes untouched.\n\nAll five gates passed (web 180 tests, api 222). No v-html, no dependency changes.\n"},{"id":"intake-1","body":"# Intake 1\n\nRead apps/web/src/App.vue and App.test.ts. Current header: centered masthead, nav.user-menu with a.who, Edit profile link, Log out button, role=alert menu-error. Initials logic exists only in ProfileView.vue (computed `initials`); the brief requires the same logic in the header, so extract to apps/web/src/utils (e.g. initials.ts with a unit test) or duplicate; either passes. Route names: library, login, signup, profile, profile-edit. requiresAuth meta drives the logout redirect.\n\nNeeds from the owner: none blocking. AC10 and AC12/13 checks assume git is available in the repo; /home/claude/crate-digger reported \"not a git repository\" in the environment, so those checks may need adaptation (use a file hash or diff against a snapshot). Test names in AC1 to AC9 are binding: builder must create tests with those exact titles in App.test.ts and delete the obsolete ones.\n"},{"id":"manager-1","body":"# Manager 1\n\nPlan: two tasks. T1 (header menu, shared avatar + initials helper, App.vue, AccountMenu.vue, App.test.ts rewrite) serves AC1..AC14. T2 (ProfileView adopts initials helper, DOM unchanged) depends on T1.\n\nDecisions:\n- Component named src/components/AccountMenu.vue (top level) because AC10's checks grep src/components/*.vue and name AccountMenu.vue explicitly; the request's suggested UserMenu name was not used for that reason.\n- position: relative and the absolute/right rule for the account area live in App.vue so AC10 passes on App.vue alone.\n- Signed-out links stay in App.vue inside the same right-hand area.\n- ProfileView.test.ts is not owned and should pass untouched.\nRisk: intake flagged that AC12/AC13 checks need git; environment reported no git repo.\n"},{"id":"reporter-1","body":"# reporter-1 notes\nWrote report.md from state.json, brief.json, ledger.md, tester-1.md, test-report.json and git log. Verdict shipped, 14/14 AC pass. Noted tester's small gap on the logout-from-home test and the owner's merge-and-push request.\n"},{"id":"surveyor-1","body":"# Surveyor 1: structure and tests (Frisson)\n- Root workspaces: packages/*, apps/*; dirs apps/api, apps/web, packages/shared.\n- Web: Vue 3 + Pinia + vue-router; src has App.vue, router.ts, main.ts, components/{album,forms,profile,crate}, views, stores (session, library), api, composables, utils, forms, styles/base.css (single file).\n- Tests: vitest run with happy-dom set in apps/web/vite.config.ts; no setup file or separate config; tests colocated.\n- App.test.ts: createPinia + memory-history router with Blank routes, mount with plugins [pinia, router], fetch stubbed globally.\n- router.test.ts: real router, fresh pinia per test, api/auth.ts mocked.\n- Root commands: npm test, npm run typecheck, npm run lint, npm run format:check, npm run build; web only: npm run test -w apps/web.\n"},{"id":"surveyor-2","body":"# Surveyor 2: conventions and docs (Frisson web)\n- SFC order: script setup ts, template, style scoped. Only EmptyShelf and NotFoundView lack styles.\n- Tokens only in base.css :root (9 colours, 2 fonts); Courier New display, system-ui body; no webfonts. 25 raw hex literals in .vue.\n- Global :focus-visible is 3px marker-red outline, offset 2px; a few component overrides.\n- .btn is global; header links are ink-soft, Log out is a button styled as a link.\n- Header: App.vue masthead + nav.user-menu (tests select by class). Crates/List nav lives in LibraryToolbar, inside views.\n- Prettier: no semi, single quotes, width 100. ESLint flat, vue essential, formatting delegated to Prettier.\n- Docs: nothing on header or nav. SPEC section 5 has the 90s style description; SPEC mentions tokens.css and textures that do not exist.\n"},{"id":"surveyor-3","body":"# Surveyor 3 (relevant)\nMap for header profile-button request. Details in survey-relevant.json.\n- App.vue (124 lines): masthead is centered text; nav.user-menu L31-49 has name link + Edit profile link + Log out button; logOut L14-23; scoped styles L57-124.\n- App.test.ts asserts on nav.user-menu, a.who, Edit profile link, first button 'Log out', badge inside a.who; these will need updating.\n- Session store exposes user (avatarUrl, verified, displayName, username), loaded, logOut.\n- No reusable avatar component or initials helper; ProfileView has local initials computed (L36-43) and avatar/placeholder markup + CSS. AvatarUpload has a separate single-letter initial.\n- Routes: profile (/u/:username, public), profile-edit (/profile/edit, requiresAuth).\n- No existing dropdown/click-outside/Escape pattern anywhere.\n- Tokens in base.css L2-15; global focus-visible style.\n"},{"id":"tester-1","body":"# tester-1 notes (cycle 1)\n\nVerdict: all AC1..AC14 pass, no defects.\n\n- Full test command exit 0 (web 222 tests, other workspace 180 tests, vite build ok).\n- Each named vitest test exists, runs (1 passed, 13 skipped) and asserts real behaviour. Small gap: 'log out signs out and closes the menu' starts on '/', so its library redirect assertion is trivially true; the redirect is covered by 'log out on an auth-required page redirects to the library'.\n- initials.ts matches the baseline ProfileView initials logic exactly.\n- Server note: production static serving needs WEB_DIR=apps/web/dist; without it '/' is a 404. Not a defect, just setup.\n- Real Chrome (playwright, /usr/bin/google-chrome) against the production server on localhost:3917:\n  - Avatar sits top right at 1280, 390, 320 widths. Signed out Log in / Sign up top right; on /login only Sign up shows.\n  - Closed menu never overlaps sign or tagline (box checks at 390 and 320). The open dropdown overlays part of the sign on mobile, which is expected for a popover.\n  - Escape closes and refocuses the trigger; tagline click closes.\n  - View profile -> /u/admin, Edit profile -> /profile/edit, menu closes each time. Log out from /profile/edit -> '/', avatar gone, /api/auth/me 401.\n- Screenshots: /home/claude/shots/header-signed-out-desktop.png, header-signed-in-desktop.png, header-menu-open-desktop.png, header-menu-open-mobile.png.\n- Server killed; temp data in /tmp/cd-tester. No tracked files touched.\n"}],"runDir":"/home/claude/crate-digger/.shipyard/runs/2026-11-07T08-36-17","live":false,"stages":["intake","survey","plan","build","test","fix","report","done"],"tree":{"files":[{"path":"apps/web/src/App.test.ts","add":239,"del":60,"wip":false},{"path":"apps/web/src/App.vue","add":40,"del":63,"wip":false},{"path":"apps/web/src/components/AccountMenu.vue","add":210,"del":0,"wip":false},{"path":"apps/web/src/components/profile/UserAvatar.vue","add":44,"del":0,"wip":false},{"path":"apps/web/src/utils/initials.test.ts","add":23,"del":0,"wip":false},{"path":"apps/web/src/utils/initials.ts","add":10,"del":0,"wip":false},{"path":"apps/web/src/views/ProfileView.vue","add":5,"del":7,"wip":false}],"total":7},"stateMtime":1794041392827.02,"renderedAt":1794041392890}</script>
<script>
const D = JSON.parse(document.getElementById('run-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

const st = D.state || {};
const verdict = (st.verdict || 'pending').toLowerCase();
const crit = st.criteria || {};
const critKeys = Object.keys(crit);
const statements = {};
(D.brief?.acceptanceCriteria || []).forEach(c => { statements[c.id] = c.statement; });
const keys = critKeys.length ? critKeys : Object.keys(statements);
const counts = { pass: 0, fail: 0, untested: 0 };
keys.forEach(k => { counts[(crit[k] || 'untested')] = (counts[(crit[k] || 'untested')] || 0) + 1; });
const total = keys.length || 1;

const parts = [];

const nowIdx = D.stages.indexOf(st.stage);
const T = s => { const t = Date.parse(s); return Number.isFinite(t) ? t : null; };
const dur = ms => {
  if (ms == null || ms < 0) return '';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}h${String(m).padStart(2, '0')}m` : m ? `${m}m${String(r).padStart(2, '0')}s` : `${r}s`;
};
// Elements carrying data-since tick every second, so the page looks alive
// between renders even while one long agent is working.
const since = (iso, end) => {
  const a = T(iso); if (a == null) return '—';
  const b = T(end);
  return b != null ? dur(b - a) : `<span data-since="${a}">${dur(Date.now() - a)}</span>`;
};
const times = st.stageTimes || {};
const pipeline = D.stages.filter(s => s !== 'done').map((s, i) => {
  const cls = D.live && i === nowIdx ? 'now' : (nowIdx > i || !D.live ? 'done' : '');
  const t = times[s];
  const clock = t?.start ? `<small>${since(t.start, (D.live && i === nowIdx) ? null : (t.end || null))}</small>` : '';
  return `<div class="${cls}">${s.toUpperCase()}${clock}</div>`;
}).join('');
const quietMs = D.stateMtime ? Date.now() - D.stateMtime : 0;
const active = Array.isArray(st.active) ? st.active : [];

parts.push(`
<header>
  <h1>SHIPYARD<small>AUTONOMOUS DEV YARD // ${D.live ? 'YARD ACTIVE' : 'RUN RECORD'}</small></h1>
  <div class="meta">
    ${D.live
      ? '<span class="chip verdict live"><span class="dot"></span>WORKING</span>'
      : `<span class="chip verdict v-${esc(verdict)}">${esc(verdict)}</span>`}
    <span class="chip">RUN <b>${esc(st.runId || '—')}</b></span>
    ${st.startedAt ? `<span class="chip">ELAPSED <b>${since(st.startedAt, D.live ? null : st.endedAt)}</b></span>` : ''}
    ${D.live && active.length ? `<span class="chip live">CREW <b>${active.length}</b></span>` : ''}
    ${D.live ? `<span class="chip nosignal" id="nosignal" data-mtime="${D.stateMtime}" style="display:none">NO SIGNAL <b></b></span>` : ''}
    <span class="chip">CYCLE <b>${esc(st.cycle || '?')}/${esc(st.maxCycles || 3)}</b></span>
    ${st.fixRound ? `<span class="chip">FIX ROUND <b>${esc(st.fixRound)}/${esc(st.maxFixRounds || 3)}</b></span>` : ''}
    <span class="chip">BRANCH <b>${esc(st.branch || '—')}</b></span>
    <span class="chip">TARGET <b>${esc(st.target || '—')}</b></span>
    ${(st.fastPaths || []).map(f => `<span class="chip fast">FAST PATH <b>${esc(f)}</b></span>`).join('')}
  </div>
  <div class="pipe">${pipeline}</div>
  <div class="tele">
    <span>${D.live ? '◉ TELEMETRY LIVE — REFRESHING EVERY 4s' : '· TRANSMISSION ENDED'}</span>
    <span>STAGE: ${esc((st.stage || 'unknown').toUpperCase())}</span>
  </div>
</header>
${D.live ? '<div class="scan"><i></i></div>' : ''}
<div class="hazard"></div>`);

if (D.live && active.length) {
  parts.push(`<section><h2>Crew on deck — ${active.length} working</h2><div class="body"><div class="crew">
    ${active.map(a => {
      const t = T(a.since);
      const slow = t != null && Date.now() - t > 15 * 60 * 1000;
      return `<div class="hand${slow ? ' slow' : ''}"><div class="role"><span class="dot"></span>${esc(a.role || 'agent')}<span class="clock">${since(a.since)}</span></div>
        <div class="who">${esc(a.id || '?')}</div>
        ${a.task ? `<div class="sub" style="color:var(--grey);font-size:11px">${esc(a.task)}</div>` : ''}</div>`;
    }).join('')}
  </div></div></section>`);
}

if (D.tree && D.tree.total) {
  const wip = D.tree.files.filter(f => f.wip).length;
  const rows = D.tree.files.map(f => `<tr>
      <td class="mono">${f.wip ? '<span class="wip">●</span> ' : ''}${esc(f.path)}</td>
      <td class="num">${f.add == null ? (f.isNew ? '<span class="add">new</span>' : '') : f.add ? '<span class="add">+' + f.add + '</span>' : ''}</td>
      <td class="num">${f.del ? '<span class="del">−' + f.del + '</span>' : ''}</td></tr>`).join('');
  parts.push(`<section><h2>Working tree — ${D.tree.total} file${D.tree.total === 1 ? '' : 's'} changed${wip ? ', ' + wip + ' uncommitted' : ''}</h2><div class="body">
    <table><thead><tr><th>File ${wip ? '(● = being written)' : ''}</th><th style="text-align:right">Added</th><th style="text-align:right">Removed</th></tr></thead><tbody>${rows}</tbody></table>
    ${D.tree.total > D.tree.files.length ? '<p class="empty">Showing the first ' + D.tree.files.length + '.</p>' : ''}
  </div></section>`);
}

if (st.request || D.brief?.goal) {
  parts.push(`<section><h2>Work order</h2><div class="body">
    <pre>${esc(D.brief?.goal || st.request)}</pre>
    ${(D.brief?.assumptions || []).length ? '<p style="margin:11px 0 4px;color:var(--amber-dim);font-size:11px;letter-spacing:.2em">ASSUMPTIONS MADE</p><ul>' + D.brief.assumptions.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : ''}
  </div></section>`);
}

// Acceptance criteria
const bar = `<div class="bar">
  <i class="p" style="width:${counts.pass / total * 100}%"></i>
  <i class="f" style="width:${counts.fail / total * 100}%"></i>
  <i class="u" style="width:${counts.untested / total * 100}%"></i>
</div>`;
const cards = keys.length ? keys.map(k => {
  const s = crit[k] || 'untested';
  return `<div class="crit"><span class="id">${esc(k)}</span><span class="st ${esc(s)}">${s === 'pass' ? '◉ PASS' : s === 'fail' ? '✗ FAIL' : '· UNTESTED'}</span>
    <p>${esc(statements[k] || '')}</p></div>`;
}).join('') : '<p class="empty">No acceptance criteria recorded — intake did not complete.</p>';
parts.push(`<section><h2>Acceptance criteria — ${counts.pass}/${keys.length || 0} pass</h2><div class="body">${keys.length ? bar : ''}<div class="grid">${cards}</div></div></section>`);

// Cycles
(D.cycles || []).forEach(c => {
  const tasks = (c.plan?.tasks || []);
  const taskState = st.tasks || {};
  const rows = tasks.length ? tasks.map(t => {
    const s = taskState[t.id] || 'todo';
    return `<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.goal)}</td>
      <td class="mono">${esc((t.ownsFiles || []).join(', '))}</td>
      <td class="mono">${esc((t.dependsOn || []).join(', ') || '—')}</td>
      <td><span class="tag t-${esc(s)}">${esc(s)}</span></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No plan produced for this cycle.</td></tr>';

  parts.push(`<section><h2>Cycle ${esc(c.n)}</h2><div class="body">
    <div class="cycle-head"><h3>DELEGATION</h3></div>
    <table><thead><tr><th>Task</th><th>Goal</th><th>Owns files</th><th>After</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>
    ${c.spec ? '<details><summary>Manager spec — what it intended to build</summary><div class="inner"><pre>' + esc(c.spec) + '</pre></div></details>' : ''}
    ${c.testReport ? '<details><summary>Tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.testReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.defects ? '<details><summary>Triaged defects</summary><div class="inner"><pre>' + esc(JSON.stringify(c.defects, null, 2)) + '</pre></div></details>' : ''}
  </div></section>`);
});

// Deaths
if ((st.deaths || []).length) {
  parts.push(`<section><h2>Agent losses — ${st.deaths.length}</h2><div class="body"><table>
    <thead><tr><th>Agent</th><th>Reason</th><th>Detail</th></tr></thead><tbody>
    ${st.deaths.map(d => `<tr><td><b>${esc(d.agentId || d.agent || '?')}</b></td><td class="fail">${esc(d.reason)}</td><td class="mono">${esc(d.detail)}</td></tr>`).join('')}
    </tbody></table></div></section>`);
}

if (D.reportMd) {
  parts.push(`<section><h2>Report</h2><div class="body"><pre>${esc(D.reportMd)}</pre></div></section>`);
}

if ((D.agents || []).length) {
  parts.push(`<section><h2>Crew logs — ${D.agents.length} agents</h2><div class="body">
    ${D.agents.map(a => '<details><summary>' + esc(a.id) + '</summary><div class="inner"><pre>' + esc(a.body) + '</pre></div></details>').join('')}
  </div></section>`);
}

if (D.ledger) {
  parts.push(`<section><h2>Harbormaster log</h2><div class="body"><pre>${esc(D.ledger)}</pre></div></section>`);
}

parts.push(`<div class="hazard"></div><footer>
  SHIPYARD // ${esc(D.runDir)}<br>
  ${D.live
    ? 'YARD ACTIVE — this page reloads itself. Leave the tab open.'
    : 'TRANSMISSION ENDED — this page is final and will not reload.'}
</footer>`);
document.getElementById('app').innerHTML = parts.join('');

// Tick the clocks between reloads, and raise NO SIGNAL if the harbormaster
// has not written state.json for a long time while the run claims to be live.
(function tick(){
  const fmt = ms => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + 'h' + String(m).padStart(2, '0') + 'm' : m ? m + 'm' + String(r).padStart(2, '0') + 's' : r + 's';
  };
  const QUIET = 20 * 60 * 1000;
  function step(){
    document.querySelectorAll('[data-since]').forEach(n => { n.textContent = fmt(Date.now() - +n.dataset.since); });
    const ns = document.getElementById('nosignal');
    if (ns && +ns.dataset.mtime) {
      const q = Date.now() - +ns.dataset.mtime;
      ns.style.display = q > QUIET ? '' : 'none';
      ns.querySelector('b').textContent = fmt(q);
    }
  }
  step(); setInterval(step, 1000);
})();

// A meta-refresh is a full reload, which would slam every <details> shut and
// jump you back to the top mid-read. Persist what the reader opened and where
// they were, keyed by run so two tabs do not fight. sessionStorage, not local:
// this is view state, and it should die with the tab.
(function preserveReadingState(){
  const KEY = 'shipyard:' + (D.state?.runId || 'run');
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}') } catch {}

  const summaries = () => [...document.querySelectorAll('details')];

  summaries().forEach(d => {
    const label = d.querySelector('summary')?.textContent?.trim();
    if (label && saved.open && saved.open.includes(label)) d.open = true;
    d.addEventListener('toggle', save);
  });

  if (typeof saved.scroll === 'number') window.scrollTo(0, saved.scroll);

  function save(){
    const open = summaries().filter(d => d.open)
      .map(d => d.querySelector('summary')?.textContent?.trim())
      .filter(Boolean);
    try { sessionStorage.setItem(KEY, JSON.stringify({ open, scroll: window.scrollY })) } catch {}
  }

  let t;
  window.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(save, 150) }, { passive: true });
  window.addEventListener('beforeunload', save);
})();
</script>
