<style>
:root{
  --bg:#0b0a08; --panel:#15120d; --panel2:#1d1812;
  --amber:#ffb53d; --amber-dim:#8a6224; --amber-glow:rgba(255,181,61,.25);

  --rule:#3a3024;

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  color:var(--amber); font-size:13px; line-height:1.55;
  padding:24px; max-width:1180px; margin:0 auto;
  text-shadow:0 0 1px var(--amber-glow);
}
/* CRT scanlines */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:98;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);

a{color:var(--amber)}
.hazard{height:8px;background:repeating-linear-gradient(45deg,var(--amber-dim) 0 10px,#0b0a08 10px 20px);margin:14px 0;opacity:.6}
header{border:2px solid var(--amber-dim);background:var(--panel);padding:14px 16px;position:relative}
header h1{margin:0;font-size:22px;letter-spacing:.42em;font-weight:700}
header h1 small{letter-spacing:.1em;font-size:11px;color:var(--amber-dim);display:block;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

.v-shipped{border-color:var(--green);color:var(--green)}
.v-failed{border-color:var(--red);color:var(--red)}
.v-partial,.v-pending{border-color:var(--amber);color:var(--amber)}
section{border:1px solid var(--rule);background:var(--panel);margin:18px 0}
section>h2{
  margin:0;padding:8px 14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  background:var(--panel2);border-bottom:1px solid var(--rule);color:var(--amber-dim);
}
section>.body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.crit{border:1px solid var(--rule);padding:9px 11px;background:var(--panel2)}
.crit .id{font-weight:700;letter-spacing:.14em}
.crit .st{float:right;font-size:11px;letter-spacing:.14em}
.pass{color:var(--green)} .fail{color:var(--red)} .untested{color:var(--grey)}
.crit p{margin:6px 0 0;color:#d9c9a6;font-size:12px}
.bar{height:16px;border:1px solid var(--rule);background:#0c0a07;display:flex;margin-bottom:14px}
.bar i{display:block;height:100%}
.bar i.p{background:var(--green)} .bar i.f{background:var(--red)} .bar i.u{background:#2a2419}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--amber-dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
td.mono{color:#d9c9a6}
.tag{border:1px solid var(--rule);padding:1px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-dim)}
.t-done{border-color:var(--green);color:var(--green)}
.t-blocked{border-color:var(--red);color:var(--red)}

details{border:1px solid var(--rule);background:var(--panel2);margin:7px 0}

details[open]>summary{border-bottom:1px solid var(--rule);color:var(--amber)}
details .inner{padding:11px}
.cycle-head{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.cycle-head h3{margin:0;font-size:13px;letter-spacing:.26em}
.empty{color:var(--grey);font-style:italic}
footer{color:var(--grey);font-size:11px;letter-spacing:.14em;text-align:center;padding:18px 0}
@media print{body::before,body::after{display:none}}

/* ── live telemetry ─────────────────────────────────────── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(420%)}}
@keyframes flicker{0%,100%{opacity:1}97%{opacity:1}98%{opacity:.82}99%{opacity:1}}
header{animation:flicker 7s infinite}
.live{border-color:var(--green)!important;color:var(--green)!important}
.live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;animation:pulse 1.1s infinite;box-shadow:0 0 6px var(--green)}
.scan{position:relative;overflow:hidden;height:3px;background:#0c0a07;border:1px solid var(--rule);border-left:0;border-right:0;margin:0}
.scan i{position:absolute;top:0;left:0;height:100%;width:24%;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 2.4s linear infinite}
/* stage pipeline */
.pipe{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--rule);background:#0c0a07}
.pipe div{flex:1;text-align:center;padding:7px 2px;font-size:10px;letter-spacing:.18em;color:#3b3225;border-right:1px solid var(--rule);position:relative}
.pipe div:last-child{border-right:0}
.pipe div.done{color:var(--amber-dim);background:#140f09}
.pipe div.now{color:#0b0a08;background:var(--amber);font-weight:700;animation:pulse 1.6s infinite}
.tele{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--grey);margin-top:6px}
.pipe div small{display:block;font-size:9px;letter-spacing:.08em;margin-top:2px;opacity:.85}
.nosignal{border-color:var(--red)!important;color:var(--red)!important;animation:pulse 1.6s infinite}
.fast{border-color:var(--green);color:var(--green)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hand{border:1px solid var(--green);background:var(--panel2);padding:9px 11px}
.hand .role{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.hand .role .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.1s infinite}
.hand .who{font-weight:700;margin:4px 0 2px}
.hand .clock{float:right;color:#e8d5ad}
.hand.slow{border-color:var(--amber)}
td.num{text-align:right;white-space:nowrap}
.add{color:var(--green)} .del{color:var(--red)}
.wip{color:var(--green);animation:pulse 1.1s infinite}
</style>

puted (crateId -> crateById, else selectedCrate)":"30-32","watch syncs crateId into selectCrate":"35-41","stale-id reload-once":"43-60","chooseCrate (selectCrate + router.replace to 'crate')":"62-65","albums computed":"66-68","position in/set":"70-77","open() spins if canEditCrate then pushes album route":"82-89","LibraryToolbar add-to-crate-id":"93","loading/error":"95-102","not-found with 'Browse all crates' link to library":"104-107","EmptyShelf":"109","PICKER div.tabs v-for library.crates":"112-125","OwnerLink":"128","CrateBox":"130","now-playing, Add a record":"133-156","back/pull/flip controls":"158-166","hint":"168-170","tabs CSS":"175-199"}},"router":"apps/web/src/router.ts: 14-18 shared CrateView comment and inCrateBrowser helper, 24 /shelf 'library', 27-29 /crates 'crates' guarded manage page, 33-38 /crates/:id(\\d+) 'crate', 112-113 scrollBehavior comment about crate tabs changing the URL","store":"apps/web/src/stores/library.ts: crates/albums 22-23, crateShelves 28-36, selectedCrateId/positions 41-42, selectedCrate falls back to crates[0] 44-46, selectCrate 48, positionIn/setPosition 52-58, crateById 60, load 65+, delete resets selection 132","dependents":{"LibraryToolbar":"apps/web/src/components/LibraryToolbar.vue:11-28 (Crates/List tabs, Edit crates, Add record with crateId; Crates active on library and crate routes)","CratesView":"apps/web/src/views/CratesView.vue (manage page; back link to library at 63)","AlbumEditorView":"apps/web/src/views/AlbumEditorView.vue (?crateId=; back/after-save to library at 179,187,192)","AlbumView":"apps/web/src/views/AlbumView.vue:76 back link to library, not the specific crate","LibraryView":"apps/web/src/views/LibraryView.vue (list view, crate filters)","NotFoundView":"apps/web/src/views/NotFoundView.vue:8 link to library","components":"components/crate/CrateBox.vue, OwnerLink.vue, EmptyShelf.vue; utils/permissions.ts canEditCrate"},"links_in":{"crate route":["HomeView.vue:88-95","FollowingView.vue:80-87","ProfileVi acceptance criteria are passing at the end. AC12(b) first passed on a weak check, was reversed to fail, and passed only after a fix round. Nothing is merged or pushed. The branch is `shipyard/single-crate-view-2026-11-09T01-05-12`.\n\n## What was asked\n\n\"I want update the crate view. currently it uses the old system which shows all crates in the db as a choice. this should only show the crate you are on and not all the choices to view other crates as this is viewing the one crate.\"\n\nInterpretation (brief.json): \"the crate view\" means `/crates/:id`. That page now shows only its own crate and has the crate's name as its heading. `/shelf` shares the component and keeps its tabs, because it is the only public way to browse crates. The owner confirmed this before planning. The owner also approved adding Playwright as a dev dependency, because AC12 needs a real browser.\n\n## Acceptance criteria\n\n| AC | What it checks | Final | Evidence |\n|---|---|---|---|\n| AC1 | `/crates/2`: no `button.tab`, no Crates group, no \"Guitars\" or \"Dub\" text | pass | CrateView.test.ts |\n| AC2 | Exactly one h1, equal to the label or, if the label is null, the name | pass | CrateView.test.ts, both cases |\n| AC3 | Navigating from `/crates/2` to `/crates/3` updates the h1, `.now h2` and `selectedCrate`, with no tabs | pass | CrateView.test.ts |\n| AC4 | Not-found, one forced reload, and the error state with Try again are kept | pass | 4 tests in CrateView.test.ts |\n| AC5 | `/shelf` shows all tabs in order and remembers Dub | pass | CrateView.test.ts |\n| AC6 | A tab click on `/shelf` stays on `/shelf`, with no push or replace | pass | CrateView.test.ts |\n| AC7 | Flip, Back, Pull it out, ArrowDown, owner link and empty crate on `/crates/:id` | pass | CrateView.test.ts |\n| AC8 | API, packages, store, CratesView, AlbumView and AlbumEditorView untouched since 24dcabd | pass | `git diff --name-only` printed nothing |\n| AC9 | Spin POST and `crateId` preselect, for own crate vs another user's | pass | editControls.test.ts, 2 new tests |\n| AC10 | `npm test`, typecheck and lint exit 0 | pass | api 360 tests, web 326 tests, typecheck and lint clean |\n| AC11 | README row says one crate; SPEC says the picker appears only at `/shelf` | pass | checked by the tester |\n| AC12 | Real-browser pass across (a) Home card, widths and the 80-char name, (b) wheel, keys, sleeve click and Back, (c) toolbar to `/shelf` | pass, after reversal | See below |\n\n## What was built\n\n- **T1** changed `apps/web/src/views/CrateView.vue`. The picker renders only when the `crateId` prop is undefined. `/crates/:id` gets an h1 showing `label ?? name`. A tab click on `/shelf` now switches the crate in place and no longer navigates.\n- **T1** also rewrote the affected `CrateView.test.ts` cases and added two `editControls.test.ts` cases.\n- **T2** changed README.md and docs/SPEC.md, and added Playwright as a dev dependency.\n- **Fix round 1** was commit `57302be`, \"let clicks pass through the crate box to the front sleeve\". It touched `apps/web/src/components/crate/CrateBox.vue`.\n- The browser script is `.shipyard/checks/browser.mjs`. Lint was run with it present.\n\n## Test results\n\n- Baseline before the change: `npm test` exit 0, 316 web tests.\n- tester-1: 12 of 12 passed, tree clean.\n- After the fix, the harbormaster ran `npm test`, typecheck, lint and format:check, and all exited 0. tester-2 reported AC12 passing with a tightened script. The final `npm test` ran 360 api tests (21 files) and 326 web tests (31 files).\n- The final browser run is `cycles/1/browser-output-2.txt`. It ends `PASS AC12`, and every checked line is `ok`.\n  - 11 or more crates were seeded (12), including one with an 80-character name.\n  - At 1280, 390 and 320 px, a Home card lands on `/crates/:id` with no visible `.tab` and one h1 equal to the name.\n  - `scrollWidth \u003c= clientWidth` at all three widths, for the long-named crate and a normal one.\n  - At 1280, the wheel, ArrowDown and ArrowRight advance `.count` from 1/4 to 4/4. A drag flips and does not open the album.\n  - The sleeve click was tried at 25%, 50% and 75% of the visible art and 2px above the panel top, at 1280 and 390. Each opened `/albums/13`, and Back returned to `/crates/4`. A touch tap at 390 also opened it.\n  - Clicking 10px below the panel top does nothing (`div.panel.front`, stays on `/crates/4`, count 1 / 4).\n  - The toolbar Crates link opens `/shelf` with 12 tabs. A tab click switched the crate from \"Album 2-1\" to \"Album 11-1\" and the URL stayed `/shelf`.\n\nThere was no failing test output in the final run. The failure on the way is described next.\n\n## What went wrong and why\n\n1. **AC12(b) passed for the wrong reason.** `browser.mjs` clicked the front sleeve and passed. It had only hit a strip about 5px tall at the top of the sleeve, which is 4% of the visible art at 1280 and 2% at 390. The first tester measured 16px, but that was taken during the 0.45s transition after a key press. At rest the strip is 4 to 6px.\n2. **The exploratory pass exposed it.** Real clicks at 25%, 50% and 75% of the art stayed on `/crates/1`. A touch tap on mid-art also did nothing. A click in the middle of the 5px strip did open `/albums/5`.\n3. **The harbormaster reversed AC12(b) to fail.** The ledger says \"AC12(b) pass was trivial (5px strip). Marked fail, direct fix round 1.\"\n4. **The cause was not the requested change.** It was a pre-existing bug. The same 5 to 6px strip was measured at 24dcabd, and the CrateBox diff in T1 only added `max-width` and `overflow-wrap` to `.crate-label`. The likely cause is that the front sleeve is rotated and `.crate`, a transparent flat plane, takes the hit. Injecting `.crate{pointer-events:none}.crate>*{pointer-events:auto}` made the whole art clickable. `transform-style: preserve-3d` goes back to at least 4ab0f2f, and when the bug began was not found.\n5. **One fix round, within the 3 allowed.** Commit `57302be` applied that fix, and the tester tightened the script to the multi-point clicks above. The tester did not re-probe clicks below the panel after a flip.\n\n## What the cycle learned\n\n- A click check that targets one pixel strip proves nothing about whether a user can click. Sample the whole visible area and use real mouse and touch input.\n- The page's own hint (\"Enter or click to pull out\") promised a click that had not worked for a user at least since 24dcabd.\n- The 80-character name was written straight into the temp DB, because the API caps names at 60. It is unreachable through the API, but the layout handles it.\n\n## Observations for the owner to choose from\n\nFrom `report-notes.json`. None are fixed in this run.\n\n- **Medium:** after a flip, the invisible previous sleeve (opacity 0) sits over the lower crate panel. Clicking the crate tape label moves back one record. Pre-existing. After the fix, the tester did not re-test this.\n- **Medium:** on a phone, `.scene` is full width with `touch-action: none`, so a swipe on it never scrolls. Pull it out is below the fold at 390x740. A 150px swipe jumps from 1/4 to 4/4. Pre-existing CSS.\n- **Low:** an empty crate shows near-unreadable \"Empty crate\" text. The panels float apart, and the flip hint still shows.\n- **Low:** when a crate has a label, the page shows the label twice (h1 and tape) and never the name. This follows the spec (`label ?? name`).\n- **Low:** \"Back to the crates\" on the album page goes to `/shelf`, so the picker reappears after viewing a `/crates/:id` record. This is the most likely follow-up request.\n- **Low:** `/crates/9999` has no h1 and keeps the title \"Crates · Frisson\". `/shelf` and `/list` have no h1.\n- **Low:** `/shelf` at phone width with 10 crates fills the viewport with tabs, and the crate starts off screen. Known limit.\n- **Low:** after Back from an album, focus is on body, not the crate.\n- **Low:** the top describe in CrateView.test.ts is still named \"crate browser\".\n- **Low:** a crate chosen on `/shelf` is not in the URL, so a reload returns to the first crate. This is the documented trade-off.\n- **Low:** a fast 144px drag jumps 1/4 to 4/4.\n\n## Not covered\n\n- Firefox and Safari were not tested, because only Chromium was available.\n- Not tested: the edit-crate flow, a Following card, the Try again state in a browser, and login through the UI.\n- The T2 dev note is short, and `npm ci` was not run.\n- T1's dev did not run a real browser.\n\n## Recommended next steps\n\n1. Review and merge the branch. Note that it sits on the four-page branch, which is not merged to main, so do not diff against main.\n2. Decide whether the album page's \"Back to the crates\" should return to the album's own crate.\n3. Pick from the medium observations. The flipped-sleeve click catch and the phone scroll trap are the two with user impact. Re-probe the flipped-sleeve case in a browser first, since it was not re-tested after the fix.\n4. Rename the \"crate browser\" describe in CrateView.test.ts.\n## Token use\n\nSize: standard. Reported total: 529,927 tokens across 12 agents.\n\n| Role | Agents | Tokens | Share |\n|---|---|---|---|\n| tester | 3 | 263,173 | 50% |\n| surveyor | 3 | 73,356 | 14% |\n| dev | 3 | 67,447 | 13% |\n| manager | 1 | 62,494 | 12% |\n| intake | 1 | 37,745 | 7% |\n| reporter | 1 | 25,712 | 5% |\n\n| Agent | Model | Tokens | Tool uses | Seconds |\n|---|---|---|---|---|\n| surveyor-structure-tests | sonnet | 16,805 | 13 | 17 |\n| surveyor-conventions-docs | sonnet | 33,032 | 18 | 30 |\n| surveyor-relevant | sonnet | 23,519 | 9 | 32 |\n| intake | opus | 37,745 | 24 | 96 |\n| manager | opus | 62,494 | 29 | 150 |\n| dev-T2 | sonnet | 11,889 | 6 | 63 |\n| dev-T1 | opus | 46,305 | 13 | 139 |\n| tester-1 | sonnet | 94,499 | 18 | 303 |\n| tester-explore | opus | 109,835 | 20 | 372 |\n| dev-T1-fix1 (fix of T1) | sonnet | 9,253 | 5 | 31 |\n| tester-2 | sonnet | 58,839 | 4 | 55 |\n| reporter | sonnet | 25,712 | 9 | 29 |\n\nThe harbormaster's own tokens are not included: no figure was available.\n\n### Dev models across 1 run(s)\n\n| Model | Tasks | Fix agents | Fixes per task | Tokens |\n|---|---|---|---|---|\n| sonnet | 1 | 0 | 0.00 | 11,889 |\n| opus | 1 | 1 | 1.00 | 55,558 |\n","cycles":[{"n":"1","spec":"# One crate at /crates/:id\n\n## The job\n\nCrate cards on Home, Following and Profile open `/crates/:id`. That page should be about that one crate, but it currently shows a tab for every crate in the database. We are removing that picker from the page and showing the crate's name as the page heading, because the tabs were its only readable label. `/shelf` stays the one place to choose between crates, and the owner has confirmed it keeps its tabs.\n\nThis is a display change only. Crate deep links stay public. The API, the shared package, the schema and the library store do not change.\n\n## How it works today\n\n`apps/web/src/views/CrateView.vue` serves both routes. `/shelf` has no `crateId` prop and shows the store's selected crate. `/crates/:id` passes a numeric `crateId` and shows exactly that crate or nothing. The picker is the `.tabs` button group, and a tab click calls `router.replace` to `/crates/:id`.\n\nThat last detail makes the change more than hiding some markup. If tabs kept navigating, the first click on `/shelf` would land on a page with no picker, and the picker would vanish.\n\n## What changes\n\n**On `/crates/:id`**, the picker is replaced by one `h1` showing `label ?? name`, the same text the tab showed. The picker renders only when `crateId` is undefined. These stay as they are:\n\n- flipping by wheel, drag and keyboard\n- pulling a record out, and spin counting\n- the owner link and the empty message\n- `LibraryToolbar`, including its Crates link to `/shelf`\n- selecting the crate in the store, so `/shelf` remembers it\n- the single forced reload for an unknown id\n- `Crate not found`\n- the error state with Try again\n- the page title `Crates · Frisson`\n\n**On `/shelf`**, a tab click now only updates the store selection and the URL stays `/shelf`. The trade-off, accepted in the brief, is that a crate chosen on `/shelf` no longer gives a shareable URL, and a reload returns to the first crate. `/shelf` gets no new heading.\n\n**Long names.** The tabs had their own wrap rule, so the new heading needs one too. Tracing the 80-character case in AC12 turned up a second problem the brief did not name: `.crate-label` in `CrateBox.vue` has no wrap rule and no ancestor clips it, so an unbroken long name would widen the page at 320 px. T1 therefore adds a two-line CSS rule there. It should not change how normal names render.\n\n**The router comment.** `router.ts` says \"Crate tabs change the URL\". This change makes that false, so the one comment line is reworded. The `scrollBehavior` code is unchanged, because moving between `/crates/:id` and `/shelf` through the toolbar should still not jump the page. `router.test.ts` still holds and is not touched.\n\n**The toolbar comment.** `LibraryToolbar.vue` calls `/crates/:id` \"still the crate browser\". That is loose wording rather than a false statement, and the brief says to keep the toolbar as it is, so it stays.\n\n## Tests\n\nMost of the risk is in the test rewrite. `CrateView.test.ts` uses `pressedTab` on `/crates/:id` throughout, including in the reload cases, so a careless rewrite could quietly lose coverage of the reload and not-found logic. Only tests that assert tabs on `/crates/:id`, or a URL change from a tab click, may change, and each is replaced with an equivalent assertion, usually on the `h1`.\n\nNew tests cover:\n\n- the absence of the picker on `/crates/:id`\n- the heading, both with a label and with only a name\n- URL-driven crate changes\n- flipping, pulling out, the owner link and the empty crate on `/crates/:id`\n- spin and add-record behaviour by ownership, in `editControls.test.ts`\n\n## Docs and tooling\n\nThe README Pages row for `/crates/:id` and the SPEC line \"Where the crate view lives\" are updated to match. ADR 0006 is a historical record and stays as written.\n\nPlaywright (Apache-2.0, approved by the owner) is added as a root dev dependency so the tester can write `.shipyard/checks/browser.mjs` for AC12. The README documents the browser install and the need to run against a temp copy of the database, because starting the API otherwise adds demo content to the owner's data. No dev task writes the browser script.\n\n## Task split\n\n- **T1** owns the view, its tests, the `CrateBox` CSS and the router comment.\n- **T2** owns the docs and the dependency.\n\nThey share no files and can run at the same time. AC8 and AC10 are repo-wide, so both tasks must leave them passing. For AC12, T1 supplies the feature and T2 supplies the dependency.\n\n## Out of scope and known follow-ups\n\n- `← Back to the crates` on the album page and the album editor's links still go to `/shelf`. A user who pulls a record from `/crates/:id` and follows that link sees the picker again, which is the most likely follow-up request.\n- The picker still stacks at narrow widths on `/shelf` with 11 or more crates.\n- Per-crate page titles were not requested.\n- `CratesView` has no view test file, so reorder and crate-edit regressions are guarded by leaving that file unchanged (AC8) and by API tests.\n\n## Note for the tester\n\n`npm run lint` runs `eslint .`, and `eslint.config.js` does not ignore `.shipyard`, so `.shipyard/checks/browser.mjs` will be linted once it exists. It must pass lint, or AC10 will fail.\n","plan":{"summary":"Hide the crate picker on /crates/:id and show the crate's name as an h1. Tab clicks on /shelf switch crate in place with no URL change. Replace the tests pinned to the old behaviour, update README and SPEC, and add Playwright as a root dev dependency so the tester can write the AC12 browser check. Two tasks with no shared files, so they can run in parallel.","tasks":[{"id":"T1","goal":"CrateView shows the picker only on /shelf and an h1 with the crate's name on /crates/:id, /shelf tab clicks stay on /shelf, and the tests pin all of this.","description":"All paths are under apps/web/src. Base commit is 24dcabd; do not diff against main. Do not merge or push. Do not touch apps/api, packages, stores/library.ts, CratesView.vue, AlbumView.vue, AlbumEditorView.vue or LibraryToolbar.vue (AC8 and the brief). Do not change router.test.ts: its scrollBehavior test still holds.\n\nCODE: views/CrateView.vue\n1. In the final `\u003ctemplate v-else>` (crate exists), render the existing `\u003cdiv class=\"tabs\" role=\"group\" aria-label=\"Crates\">` only when `crateId === undefined`. Otherwise render `\u003ch1 class=\"crate-name\">{{ crate.label ?? crate.name }}\u003c/h1>` in the same place, above OwnerLink. /shelf gets no new h1.\n2. Remove chooseCrate. The tab click calls `library.selectCrate(c.id)` only, with no router call. Keep `router`, because open() uses it. Add a short comment explaining why tabs do not navigate: going to /crates/:id would hide the picker on the first click.\n3. Add scoped CSS for `.crate-name`: `margin: 0; text-align: center; font-family: var(--font-display); font-size: 1.75rem; overflow-wrap: anywhere; max-width: 100%`. This matches the ProfileView h1, and without the wrap rule an 80-character name would widen the page. There is no global h1 rule. Keep the .tabs CSS.\n4. Keep unchanged: the crateId watch that calls selectCrate, the reload-once watch, the loading, error and not-found branches, LibraryToolbar, CrateBox, the controls, and the title 'Crates · Frisson'.\n\nCODE: components/crate/CrateBox.vue (CSS only)\nAdd `max-width: 100%; overflow-wrap: anywhere;` to `.crate-label`. That span has no wrap rule and sits on a 3D panel no ancestor clips, so a long unbroken name (the Crate schema has no length cap to rely on) would break AC12's scrollWidth check at 320px. Normal names must render as before.\n\nCODE: router.ts line 112 (comment only)\nThe comment 'Crate tabs change the URL...' becomes false with this change. Reword it to say moving between /shelf and /crates/:id should not jump the page to the top. Do not change scrollBehavior or any other line.\n\nTESTS: views/CrateView.test.ts\nExisting tests may be changed ONLY where they assert tabs on /crates/:id or a URL change from a tab click. Each must be replaced by an equivalent assertion, never just deleted. Leave everything else as it is, including the pressedTab and tab helpers, which /shelf tests still use. Add `const heading = (w: Wrapper) => w.get('h1').text()`. `visit(path, { crateList })` currently fixes albums to `albums`. Add an optional `albumList?: AlbumSummary[]` to its options, defaulting to `albums`. Fixtures: crates Guitars(1), Beats & Bass(2), Dub(3); albums Riffs(10, crate 1), Breaks(20, crate 2), Echoes(30, crate 3). Test owners and labels by spreading `{ ...crate(2, 'Beats & Bass'), label: 'BEATS', ownerUsername: 'alice' }`.\nEdits to existing tests:\n- Line 93 'a deep link selects...': replace pressedTab with heading(wrapper) === 'Beats & Bass'. Keep the .now h2 and selectedCrate assertions.\n- Line 117 'reloads once...': replace pressedTab with heading(wrapper) === 'Brand New'.\n- Line 202 tab click on /shelf: rewrite for AC6. Spy on router.push and router.replace, click Dub, await flushPromises. Assert fullPath is '/shelf', neither spy called, Dub aria-pressed=\"true\", `.now h2` is 'Echoes', all three tabs still rendered.\n- Line 217 tab click on /crates/:id: replace with the AC1 test. On /crates/2, findAll('button.tab') has length 0, `[role=\"group\"][aria-label=\"Crates\"]` does not exist, and wrapper.text() contains neither 'Guitars' nor 'Dub'. Note CrateBox's .scene is also role=group, so keep the aria-label in the selector.\n- Line 226 'follows the URL': rewrite for AC3. Zero tabs and h1 'Beats & Bass' on /crates/2, then push /crates/3 and flush. Assert h1 'Dub', `.now h2` 'Echoes', library.selectedCrate.id === 3, zero tabs.\nExisting tests to keep unchanged, which already serve AC4 and AC5: lines 100, 143, 179, 191, 234, 241.\nNew tests:\n- AC2: exactly one h1 (findAll('h1') length 1), equal to the label when set and the name when label is null.\n- AC7, on /crates/:id with a crate of at least 2 albums via albumList (use position values in order): 'Flip ▶' changes `.count` from '1 / N' to '2 / N'; '◀ Back' returns to '1 / N'; 'Pull it out' (button.pull) navigates, after flushPromises, to /albums/\u003ccurrent id>; `wrapper.get('.scene').trigger('keydown', { key: 'ArrowDown' })` advances `.count`; the owner link (`p.owner a`) href is /u/\u003cownerUsername>; a crate with no albums shows 'Nothing in here yet.'\n\nTESTS: views/editControls.test.ts\nLeave the /shelf tests at lines 191 and 204 unchanged: they do not assert a URL change and should still pass. Add AC9 tests with visit(path, alice). Alice owns crates 1 and 3, Bob owns 2. On /crates/1: clicking button.pull sends one POST to '/api/albums/10/spins', and the toolbar `a.btn` containing '+ Add a record' has href '/albums/new?crateId=1'. Check the href before clicking, because pulling navigates away. On /crates/2: button.pull sends no POST, and the '+ Add a record' href is '/albums/new' with no crateId.\n\nFINISH: npm test, npm run typecheck, npm run lint and npm run format:check (CI runs it) must all pass. Commit with Conventional Commits, scope web.","ownsFiles":["apps/web/src/views/CrateView.vue","apps/web/src/views/CrateView.test.ts","apps/web/src/views/editControls.test.ts","apps/web/src/components/crate/CrateBox.vue","apps/web/src/router.ts"],"dependsOn":[],"criteriaIds":["AC1","AC2","AC3","AC4","AC5","AC6","AC7","AC8","AC9","AC10","AC12"],"model":"opus"},{"id":"T2","goal":"README and SPEC describe the one-crate page and the /shelf-only picker, and Playwright is installed as a root dev dependency with its browser install documented.","description":"Do not merge or push. Do not write .shipyard/checks/browser.mjs or any browser test: the tester owns that. Do not touch anything under apps/ or : anywhere;`.\n- `apps/web/src/router.ts`: the comment on line 112 is reworded. No code changed.\n- `apps/web/src/views/CrateView.test.ts`: edited the tests the plan named, added `heading` and `albumList`, and added tests for AC2 and AC7.\n- `apps/web/src/views/editControls.test.ts`: added two AC9 tests. The /shelf tests are unchanged.\n\n## Results\n\nExit codes from the repo root, run just before committing:\n\n| Command | Exit |\n| --- | --- |\n| `npm test` | 0 (api 360 tests in 21 files, web 326 tests in 31 files) |\n| `npm run typecheck` | 0 |\n| `npm run lint` | 0 |\n| `npm run format:check` | 0 |\n\nThe AC8 diff command against 24dcabd prints nothing. I also included LibraryToolbar.vue and router.test.ts in that check, and they are unchanged too.\n\nThe other dev's files (README.md, docs/SPEC.md, package.json, package-lock.json) showed no changes in `git status` when I committed, so these checks did not exercise their work.\n\n## Do the tests detect the change?\n\nI temporarily restored the 24dcabd CrateView.vue and ran the two test files, then put the new version back. 7 tests failed against the old view: no picker on /crates/:id, deep link, reload, /shelf tab click, follows the URL, and both heading cases.\n\nThe AC7 and AC9 tests and the \"no h1 on /shelf\" test pass against the old view too. They pin behaviour that already existed, so they guard against regressions but do not show this change works.\n\n## Not verified\n\n- **No real browser run.** The CSS is not exercised by any test (jsdom does no layout). That covers the `.crate-name` and `.crate-label` wrap rules, and so AC12's scrollWidth check at 320 px for the 80-character name. From reading the CSS, `.crate-label` is a grid item in `.front`, so `max-width` applies to it. An 80-character label will wrap to several lines and may overflow the panel vertically. That would not affect scrollWidth, but it is worth a look in the AC12 pass.\n- AC12 as a whole is left to the tester.\n\n## Small additions beyond the plan\n\n- A `control` helper in CrateView.test.ts finds the Flip and Back buttons by text.\n- A test that /shelf has no h1 (the plan states this but listed no test for it).\n- The \"Pull it out\" AC7 test flips first and expects /albums/22, so it proves the current record opens rather than the first.\n- The AC9 tests also assert the route reached /albums/\u003cid>, so \"no POST\" cannot pass just because the click did nothing.\n- A comment on each new CSS rule explaining why it wraps.\n\nNo new dependencies. No shortcuts taken.\n\n## Noted, not changed\n\n- `apps/web/src/stores/library.ts` keeps its selection logic, untouched as required. A tab click on /shelf still updates the shared selection, so opening /shelf later keeps the last crate, as AC5 expects.\n"},{"id":"dev-T2","body":"T2 done: README/SPEC updated, playwright 1.65.0 (Apache-2.0) in root devDependencies, chromium installed to user cache. npm test/typecheck/lint/format:check pass. No apps/api or packages diff.\n"}],"runDir":".shipyard/runs/2026-11-09T01-05-12","live":false,"stages":["intake","survey","plan","build","test","fix","report","done"],"tree":{"files":[{"path":"apps/web/src/components/crate/CrateBox.vue","add":11,"del":0,"wip":false},{"path":"apps/web/src/router.ts","add":1,"del":1,"wip":false},{"path":"apps/web/src/views/CrateView.test.ts","add":92,"del":19,"wip":false},{"path":"apps/web/src/views/CrateView.vue","add":16,"del":7,"wip":false},{"path":"apps/web/src/views/editControls.test.ts","add":27,"del":0,"wip":false},{"path":"docs/SPEC.md","add":3,"del":1,"wip":false},{"path":"package-lock.json","add":30,"del":0,"wip":false},{"path":"package.json","add":1,"del":0,"wip":false},{"path":"README.md","add":11,"del":2,"wip":false}],"total":9},"stateMtime":1794187806221.4663,"renderedAt":1794187813704}</script>
<script>
const D = JSON.parse(document.getElementById('run-data').textContent);

const dur = ms => {
  if (ms == null || ms < 0) return '';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}h${String(m).padStart(2, '0')}m` : m ? `${m}m${String(r).padStart(2, '0')}s` : `${r}s`;
};
// Elements carrying data-since tick every second, so the page looks alive
// between renders even while one long agent is working.
const since = (iso, end) => {
  const a = T(iso); if (a == null) return '—';
  const b = T(end);
  return b != null ? dur(b - a) : `<span data-since="${a}">${dur(Date.now() - a)}</span>`;
};
const times = st.stageTimes || {};
const pipeline = D.stages.filter(s => s !== 'done').map((s, i) => {
  const cls = D.live && i === nowIdx ? 'now' : (nowIdx > i || !D.live ? 'done' : '');
  const t = times[s];
  const clock = t?.start ? `<small>${since(t.start, (D.live && i === nowIdx) ? null : (t.end || null))}</small>` : '';
  return `<div class="${cls}">${s.toUpperCase()}${clock}</div>`;
}).join('');
const quietMs = D.stateMtime ? Date.now() - D.stateMtime : 0;
const active = Array.isArray(st.active) ? st.active : [];
const usage = Array.isArray(st.usage) ? st.usage : [];
const tokenTotal = usage.reduce((sum, u) => sum + (u.tokens ?? 0), 0);

parts.push(`
<header>
  <h1>SHIPYARD<small>AUTONOMOUS DEV YARD // ${D.live ? 'YARD ACTIVE' : 'RUN RECORD'}</small></h1>

    ${D.live
      ? '<span class="chip verdict live"><span class="dot"></span>WORKING</span>'
      : `<span class="chip verdict v-${esc(verdict)}">${esc(verdict)}</span>`}
    <span class="chip">RUN <b>${esc(st.runId || '—')}</b></span>
    ${st.size ? `<span class="chip">SIZE <b>${esc(st.size)}</b></span>` : ''}

    ${st.startedAt ? `<span class="chip">ELAPSED <b>${since(st.startedAt, D.live ? null : st.endedAt)}</b></span>` : ''}
    ${D.live && active.length ? `<span class="chip live">CREW <b>${active.length}</b></span>` : ''}
    ${D.live ? `<span class="chip nosignal" id="nosignal" data-mtime="${D.stateMtime}" style="display:none">NO SIGNAL <b></b></span>` : ''}
    <span class="chip">CYCLE <b>${esc(st.cycle || '?')}/${esc(st.maxCycles || 3)}</b></span>
    ${st.fixRound ? `<span class="chip">FIX ROUND <b>${esc(st.fixRound)}/${esc(st.maxFixRounds || 3)}</b></span>` : ''}
    <span class="chip">BRANCH <b>${esc(st.branch || '—')}</b></span>
    <span class="chip">TARGET <b>${esc(st.target || '—')}</b></span>
    ${(st.fastPaths || []).map(f => `<span class="chip fast">FAST PATH <b>${esc(f)}</b></span>`).join('')}
  </div>
  <div class="pipe">${pipeline}</div>
  <div class="tele">
    <span>${D.live ? '◉ TELEMETRY LIVE — REFRESHING EVERY 4s' : '· TRANSMISSION ENDED'}</span>
    <span>STAGE: ${esc((st.stage || 'unknown').toUpperCase())}</span>
  </div>
</header>
${D.live ? '<div class="scan"><i></i></div>' : ''}
<div class="hazard"></div>`);

  parts.push(`<section><h2>Crew on deck — ${active.length} working</h2><div class="body"><div class="crew">

      const t = T(a.since);
      const slow = t != null && Date.now() - t > 15 * 60 * 1000;
      return `<div class="hand${slow ? ' slow' : ''}"><div class="role"><span class="dot"></span>${esc(a.role || 'agent')}<span class="clock">${since(a.since)}</span></div>
        <div class="who">${esc(a.id || '?')}</div>
        ${a.task ? `<div class="sub" style="color:var(--grey);font-size:11px">${esc(a.task)}</div>` : ''}</div>`;
    }).join('')}
  </div></div></section>`);
}

if (D.tree && D.tree.total) {
  const wip = D.tree.files.filter(f => f.wip).length;
  const rows = D.tree.files.map(f => `<tr>
      <td class="mono">${f.wip ? '<span class="wip">●</span> ' : ''}${esc(f.path)}</td>

  parts.push(`<section><h2>Working tree — ${D.tree.total} file${D.tree.total === 1 ? '' : 's'} changed${wip ? ', ' + wip + ' uncommitted' : ''}</h2><div class="body">

  parts.push(`<section><h2>Work order</h2><div class="body">
    <pre>${esc(D.brief?.goal || st.request)}</pre>

const cards = keys.length ? keys.map(k => {
  const s = crit[k] || 'untested';

  });
  const fmt = n => Number(n).toLocaleString('en-US');
  const roleRows = Object.entries(byRole).sort((a, b) => b[1].tokens - a[1].tokens).map(([role, r]) =>
    `<tr><td><b>${esc(role)}</b></td><td class="num">${r.agents}</td><td class="num">${fmt(r.tokens)}</td><td class="num">${tokenTotal ? Math.round(r.tokens / tokenTotal * 100) : 0}%</td></tr>`).join('');
  const agentRows = usage.map(u =>
    `<tr><td class="mono">${esc(u.agent)}${u.fixOf ? ' (fix of ' + esc(u.fixOf) + ')' : ''}</td><td>${esc(u.role)}</td><td>${esc(u.model || '—')}</td><td class="num">${u.tokens == null ? 'unavailable' : fmt(u.tokens)}</td><td class="num">${u.toolUses ?? '—'}</td></tr>`).join('');
  const unknown = usage.filter(u => u.tokens == null).length;
  const hasHarbormaster = usage.some(u => u.role === 'harbormaster');
  parts.push(`<section><h2>Token use — ${fmt(tokenTotal)} reported</h2><div class="body">
    <table><thead><tr><th>Role</th><th style="text-align:right">Agents</th><th style="text-align:right">Tokens</th><th style="text-align:right">Share</th></tr></thead><tbody>${roleRows}</tbody></table>
    ${hasHarbormaster ? '' : "<p class=\"empty\">The harbormaster's own tokens are not included: no figure was available.</p>"}
    ${unknown ? '<p class="empty">' + unknown + ' agent(s) reported no figure and count as 0, so the real total is higher.</p>' : ''}
    <details><summary>Per agent</summary><div class="inner"><table><thead><tr><th>Agent</th><th>Role</th><th>Model</th><th style="text-align:right">Tokens</th><th style="text-align:right">Tool uses</th></tr></thead><tbody>${agentRows}</tbody></table></div></details>
  </div></section>`);
}

// Cycles
(D.cycles || []).forEach(c => {
  const tasks = (c.plan?.tasks || []);
  const taskState = st.tasks || {};
  const rows = tasks.length ? tasks.map(t => {
    const s = taskState[t.id] || 'todo';
    return `<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.goal)}${t.model ? ` <span class="tag">${esc(t.model)}</span>` : ''}</td>
      <td class="mono">${esc((t.ownsFiles || []).join(', '))}</td>
      <td class="mono">${esc((t.dependsOn || []).join(', ') || '—')}</td>
      <td><span class="tag t-${esc(s)}">${esc(s)}</span></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No plan produced for this cycle.</td></tr>';

  parts.push(`<section><h2>Cycle ${esc(c.n)}</h2><div class="body">
    <div class="cycle-head"><h3>DELEGATION</h3></div>
    <table><thead><tr><th>Task</th><th>Goal</th><th>Owns files</th><th>After</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>
    ${c.spec ? '<details><summary>Manager spec — what it intended to build</summary><div class="inner"><pre>' + esc(c.spec) + '</pre></div></details>' : ''}
    ${c.testReport ? '<details><summary>Tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.testReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.defects ? '<details><summary>Triaged defects</summary><div class="inner"><pre>' + esc(JSON.stringify(c.defects, null, 2)) + '</pre></div></details>' : ''}
  </div></section>`);
});

// Deaths
if ((st.deaths || []).length) {
  parts.push(`<section><h2>Agent losses — ${st.deaths.length}</h2><div class="body"><table>
    <thead><tr><th>Agent</th><th>Reason</th><th>Detail</th></tr></thead><tbody>
    ${st.deaths.map(d => `<tr><td><b>${esc(d.agentId || d.agent || '?')}</b></td><td class="fail">${esc(d.reason)}</td><td class="mono">${esc(d.detail)}</td></tr>`).join('')}
    </tbody></table></div></section>`);
}

if (D.reportMd) {
  parts.push(`<section><h2>Report</h2><div class="body"><pre>${esc(D.reportMd)}</pre></div></section>`);
}

if ((D.agents || []).length) {
  parts.push(`<section><h2>Crew logs — ${D.agents.length} agents</h2><div class="body">
    ${D.agents.map(a => '<details><summary>' + esc(a.id) + '</summary><div class="inner"><pre>' + esc(a.body) + '</pre></div></details>').join('')}
  </div></section>`);
}

if (D.ledger) {
  parts.push(`<section><h2>Harbormaster log</h2><div class="body"><pre>${esc(D.ledger)}</pre></div></section>`);
}

parts.push(`<div class="hazard"></div><footer>
  SHIPYARD // ${esc(D.runDir)}<br>
  ${D.live
    ? 'YARD ACTIVE — this page reloads itself. Leave the tab open.'
    : 'TRANSMISSION ENDED — this page is final and will not reload.'}
</footer>`);
document.getElementById('app').innerHTML = parts.join('');

// Tick the clocks between reloads, and raise NO SIGNAL if the harbormaster
// has not written state.json for a long time while the run claims to be live.
(function tick(){
  const fmt = ms => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + 'h' + String(m).padStart(2, '0') + 'm' : m ? m + 'm' + String(r).padStart(2, '0') + 's' : r + 's';
  };
  const QUIET = 20 * 60 * 1000;
  function step(){
    document.querySelectorAll('[data-since]').forEach(n => { n.textContent = fmt(Date.now() - +n.dataset.since); });
    const ns = document.getElementById('nosignal');
    if (ns && +ns.dataset.mtime) {
      const q = Date.now() - +ns.dataset.mtime;
      ns.style.display = q > QUIET ? '' : 'none';
      ns.querySelector('b').textContent = fmt(q);
    }
  }
  step(); setInterval(step, 1000);
})();

// A meta-refresh is a full reload, which would slam every <details> shut and
// jump you back to the top mid-read. Persist what the reader opened and where
// they were, keyed by run so two tabs do not fight. sessionStorage, not local:
// this is view state, and it should die with the tab.
(function preserveReadingState(){
  const KEY = 'shipyard:' + (D.state?.runId || 'run');
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}') } catch {}

  const summaries = () => [...document.querySelectorAll('details')];

  summaries().forEach(d => {
    const label = d.querySelector('summary')?.textContent?.trim();
    if (label && saved.open && saved.open.includes(label)) d.open = true;
    d.addEventListener('toggle', save);
  });

  if (typeof saved.scroll === 'number') window.scrollTo(0, saved.scroll);

  function save(){
    const open = summaries().filter(d => d.open)
      .map(d => d.querySelector('summary')?.textContent?.trim())
      .filter(Boolean);
    try { sessionStorage.setItem(KEY, JSON.stringify({ open, scroll: window.scrollY })) } catch {}
  }

  let t;
  window.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(save, 150) }, { passive: true });
  window.addEventListener('beforeunload', save);
})();
</script>
</body>
</html>
