in counts, possibly affected by cascade."],"auth":["apps/api/src/plugins/auth.ts sets req.user (PublicUser|null).","apps/api/src/services/permissions.ts: requireUser, canEditOwner, assertCanEditCrate, requireAdmin. Own-crate rule compares crates.ownerId to req.user.id; legacy crates have ownerId NULL.","apps/api/src/errors.ts: notFound, badRequest helpers."],"shared":"packages/shared/src/index.ts: idParams, usernameParams, crate (ownerId, ownerUsername, ownerDisplayName), crateCard (public, no ownerId), recommendedCrateCard (isDemo), profileCrate (id, name, color, label, albumCount), publicProfile (crates, followerCount, followingCount, viewerFollows, isDemo), publicUser. Rule: public responses never expose numeric user ids, email, role or demo keys.","web":["apps/web/src/api/client.ts request\u003cT>(); api/follows.ts is the template for api/favorites.ts; api/crates.ts, api/profiles.ts.","apps/web/src/views/ProfileView.vue (/u/:username): 'Crates' section (h2 Crates, links to route 'crate'), FollowButton with optimistic count. Favorites section goes here, separate from Crates.","apps/web/src/views/MyProfileView.vue (/profile) own profile.","apps/web/src/views/CrateView.vue (/shelf and /crates/:id): place for a favorite toggle shown only when the crate is not yours (owner check in apps/web/src/utils/permissions.ts, OwnerLink.vue).","apps/web/src/components/profile/FollowButton.vue: toggle pattern (emits 'changed') for FavoriteButton.","apps/web/src/router.ts; stores/session.ts (current user); stores/library.ts."],"tests_near":["API: follows.test.ts (model), profiles.test.ts, shared-profile.test.ts, crates.test.ts, ownership.test.ts, schema.test.ts, migration.test.ts, helpers.ts.","Web: views/ProfileView.test.ts, MyProfileView.test.ts, CrateView.test.ts, crateActions.test.ts, components/profile/FollowButton.test.ts, utils/permissions.test.ts."],"notes":["apps/api/dist/ is stale compiled JS; ignore.","No existing favorites/likes concept."]}},"ledger":"# Ledger 2026-11 crate-favorites-2026-11-13T21-41-52`, base 2b94aaf. Run directory: `/Users/thomasfuhriman/code/crate-digger/.shipyard/runs/2026-11-13T21-41-52/`.\n\n## What was asked for\nA signed-in user can favorite any crate they don't own from `/crates/:id`. Their favorites show in a separate Favorites section on their profile, apart from the Crates they created.\n\nConstraints:\n- A new table in migration 0006, with a unique index on (user_id, crate_id) and cascading foreign keys.\n- Favorites only ever act for `request.user`.\n- Favorites expose only public crate-card fields.\n- PUT and DELETE copy the follow routes: 204, idempotent, and a signed-out caller gets 401 before 400.\n- Browser checks run on a temp DB copy.\n\n## Acceptance criteria\n| ID | Check | Status | Evidence |\n|---|---|---|---|\n| AC1 | unit | pass | `migration.test.ts`: fresh DB and DB at 0005 with rows, plus structure (7 tests). |\n| AC2 | api | pass | `favorites.test.ts`: PUT and DELETE return 204 and are idempotent. |\n| AC3 | api | pass | `favorites.test.ts`: 400 on own crate, 401 signed out (including a non-numeric id), 404 on an unknown crate. |\n| AC4 | api | pass | `favorites.test.ts`: `viewerFavorited` is true, false, and false when signed out. |\n| AC5 | api | pass | `favorites.test.ts`: newest first, only owned crates in `crates`, no private fields. |\n| AC6 | api | pass | `favorites.test.ts`: deleting the crate or the user removes the favorite rows. |\n| AC7 | unit | pass | `ProfileView.test.ts` (35 tests): heading after Crates, link to `/crates/9`, owner name, \"No favorites yet.\" |\n| AC8 | unit | pass | `CrateView.test.ts` (40 tests) and `FavoriteButton.test.ts` (7 tests). |\n| AC9 | browser | pass | `favorites.check.mjs` on a temp DB (port 4917): \"PASS AC9\". Favorite, profile listing, card click, unfavorite and reload all worked, at 9 click points. |\n| AC10 | browser | pass | `favorites.check.mjs`: \"PASS AC10\". No Favorite button on the own crate. No horizontal overflow at 390px and 1280px. Centre clicks on the favorite cards opened the crates. |\n| AC11 | command | pass | `test-output.txt`: API 25 files and 456 tests pass. Web suite passes, including 427 tests per the tester. Typecheck and lint ran clean. |\n\n## What was built\n`git diff --stat 2b94aaf HEAD`: 35 files, +2278 -18.\n- **T1, backend (5603cf2):**\n  - `apps/api/src/services/favorites.ts` (+80) and `routes/favorites.ts` (+32).\n  - `schema.ts` (+29).\n  - `drizzle/0006_crate_favorites.sql` (+11), plus a generated snapshot (+859).\n  - Tests: `favorites.test.ts` (+366) and `migration.test.ts` (+122).\n  - `packages/shared/src/index.ts` (+22).\n- **T3, profile and docs (ee667c9, 686d282):**\n  - The Favorites section in `ProfileView.vue` (+27), with tests (+69).\n  - README, SPEC, DEPLOY and ADR 0008 (+59).\n- **T2, crate page (aa6c09c):**\n  - `FavoriteButton.vue` (+102) and its test (+131).\n  - `CrateView.vue` (+55) and its test (+209).\n  - `api/favorites.ts` (+18) and `api/crates.ts` (+6).\n\n## Test results\nThere were no failures. `npm test`, typecheck and lint all exited 0. The baseline `npm test` also passed on the untouched branch. The harbormaster re-ran all checks by command after the testers returned, and all passed.\n\n## What went wrong or needs your attention\n1. **Public favorites is an assumption to confirm.**\n   - Favorites are visible to anyone viewing `/u/:username` or `/profile`, like the Crates section. Follow lists stay private, so this differs from them.\n   - The choice is recorded in ADR 0008. Intake flagged it as the most likely wrong assumption, and it is cheap to flip.\n2. **Your `/harbor` call paused the build.** You invoked `/harbor` mid-run, and build paused after T1 until you said resume. T2 and T3 were then dispatched. No work was lost.\n3. **T3 returned no handoff.**\n   - It returned only \"Placeholder\", with no STATUS block, no test names and no statement that it ran the suite.\n   - Its commits were real (ee667c9 and 686d282), with 68 test lines in `ProfileView.test.ts`. The harbormaster spot-checked the AC7 tests and found 5 real assertions.\n   - The suite run, not T3's report, is what supports the AC7 pass.\n4. **`browser.mjs` rewrote tracked PNGs again.** It rewrote the `ac12-long` PNGs, as the brief's risks predicted. The harbormaster restored them, so they are not in the diff.\n5. **Browser criteria were untested in the first pass.** The unit tester marked AC9 and AC10 untested because no check or browser run existed then. The browser tester ran them afterwards and both passed.\n\n## Observations for you to choose from\n- T3's handoff was a placeholder with no tests or build notes. This is low severity, and the work itself checked out. Consider tightening the handoff requirement for sonnet tasks.\n- At 390px the favorite cards lay out unevenly. On \"Bea Jazz Box\" the \"by bea Display\" owner text pushes \"0 records\" onto a second line, but \"Bea Soul Box\" doesn't wrap, so the card heights differ. This is cosmetic and low severity.\n- T2 reported that CrateView logs `console.warn` when the favorite-state fetch fails, and the button then stays hidden. This is by design but worth knowing.\n- The brief assumes a stale favorite row can stay if the viewer later becomes the crate's owner. Nothing cleans it up.\n\n## Recommended next steps\n1. Confirm or flip public favorites, per ADR 0008. Flipping means showing the section only to the profile owner.\n2. Optionally fix the uneven card heights at 390px.\n3. Review and merge the branch. The run directory and `.shipyard/checks/favorites.check.mjs` are committed with it.\n## Token use\n\nSize: standard. Reported total: 447,318 tokens across 11 agents.\n\n| Role | Agents | Tokens | Share |\n|---|---|---|---|\n| dev | 3 | 146,529 | 33% |\n| surveyor | 3 | 108,802 | 24% |\n| browser-tester | 1 | 71,770 | 16% |\n| manager | 1 | 57,442 | 13% |\n| intake | 1 | 27,507 | 6% |\n| tester | 1 | 18,702 | 4% |\n| reporter | 1 | 16,566 | 4% |\n\n| Agent | Model | Tokens | Tool uses | Seconds |\n|---|---|---|---|---|\n| survey-cd | sonnet | 29,217 | 19 | 34 |\n| survey-st | sonnet | 41,324 | 16 | 30 |\n| survey-rel | sonnet | 38,261 | 21 | 50 |\n| intake | opus | 27,507 | 15 | 58 |\n| manager-plan | opus | 57,442 | 26 | 168 |\n| dev-T1 | opus | 65,429 | 33 | 258 |\n| dev-T3 | sonnet | 34,062 | 8 | 49 |\n| dev-T2 | opus | 47,038 | 14 | 142 |\n| tester | sonnet | 18,702 | 9 | 23 |\n| browser-tester | opus | 71,770 | 10 | 84 |\n| reporter | sonnet | 16,566 | 7 | 20 |\n\nThe harbormaster's own tokens are not included: no figure was available.\n\n### Dev models across 5 run(s)\n\n| Model | Tasks | Fix agents | Fixes per task | Tokens |\n|---|---|---|---|---|\n| sonnet | 3 | 1 | 0.33 | 80,089 |\n| opus | 7 | 1 | 0.14 | 509,024 |\n","cycles":[{"n":"1","spec":"# Crate favorites\n\n## What we are building\n\nA signed-in collector can favorite any crate they do not own. They do it from that crate's own page, `/crates/:id`. Their favorites then appear on their profile in a **Favorites** section. The section is separate from the **Crates** section, which keeps listing only crates they created. This is the first \"bookmark someone else's work\" feature in Frisson. Until now the only social link was following another collector.\n\n## Why it is shaped this way\n\nThe codebase already has a close model in Follows, which is a user-to-user relation. It has its own table, idempotent PUT/DELETE routes that return 204, a `signedInOnly` preValidation hook so signed-out callers get 401 before any 400, a thin route over a plain-function service, and a non-optimistic toggle button in the web app. Favorites are the same pattern as a user-to-crate relation. Copying it keeps the API predictable and lets reviewers compare the two features directly.\n\n### Data\n\nA new `crate_favorites` table holds `id, user_id, crate_id, created_at`. It has a unique index on `(user_id, crate_id)`, so favoriting twice leaves one row, and a secondary index on `crate_id`. Both foreign keys use `ON DELETE CASCADE`, so deleting the user or the crate removes the rows. A crate can only be deleted once it is empty, so the cascade must not block a delete that would otherwise succeed. Migration `0006_crate_favorites.sql` is generated by drizzle-kit and only creates the table and its indexes. Earlier migrations are untouched, and a migration test confirms that a DB at 0005 keeps every user and crate row after upgrading.\n\n### API\n\n- `PUT /api/crates/:id/favorite` and `DELETE /api/crates/:id/favorite` act only for `request.user`, and no route sets favorites for anyone else. Both return 204 and are idempotent. The signed-in check runs in preValidation, so a signed-out caller gets 401 even with a non-numeric id. An unknown crate gives 404. Favoriting your own crate gives 400 and writes nothing. \"Not yours\" means `crate.ownerId !== viewer.id`, so ownerless legacy crates and demo crates can be favorited. An admin can favorite other people's crates but not their own.\n- `GET /api/crates/:id` gains `viewerFavorited: boolean`. It is false when signed out. It lives in a new `crateDetail` schema used only by this route, so the shelf list and the create, update and delete responses stay the same shape.\n- `GET /api/users/:username` (`publicProfile`) gains `favorites`, newest favorited first. Each entry is a `profileFavorite` with exactly `id, name, label, color, albumCount, ownerUsername, ownerDisplayName`. The owner fields are nullable for ownerless crates. Under the public-data rule these cards never carry an email, role, numeric user id or demo key. The service selects only those columns, and the Zod response schema strips anything else. `crates` remains owner-only.\n\n### Web\n\n- **Crate page.** On `/crates/:id` only (not `/shelf`, Home or the Following feed), a signed-in viewer who does not own the crate sees a toggle button named \"Favorite\". Its `aria-pressed` reflects `viewerFavorited`. CrateView fetches `GET /api/crates/:id` for that state, because the library store's crate list does not carry it. Like FollowButton, the button changes state only after the server agrees, and a failure shows an inline alert. Signed-out viewers and owners see no control, and there is no \"log in to favorite\" prompt. Existing crate-page behaviour stays as it is: toolbar actions remain hidden on other users' crates, and edit gating and spin counting are unchanged.\n- **Profile.** ProfileView, which serves both `/u/:username` and `/profile`, adds a Favorites section after Crates. The cards look like the Crates cards, plus a plain-text \"by \u003cowner display name>\" line. The section shows \"No favorites yet.\" when empty. The cards use the same stretched-link technique, and each card contains its own overlay. That way neither section swallows clicks meant for the other, which was a past source of bugs. The owner name is text rather than a nested link for the same reason. All user text is rendered with `{{ }}`.\n\n### Public vs private\n\nThe brief assumes favorites are public, like the Crates section and unlike follow lists. This is the assumption most likely to be wrong. It is recorded in ADR 0008 so it is easy to find and reverse. Making favorites private would be a small change: drop `favorites` from `publicProfile` for non-owners, and show the section only to the profile owner.\n\n## Out of scope\n\nThere are no favorite counts, no notifications to crate owners, no `/me/favorites` endpoint, and no favorite control on cards outside the crate page. If an admin later reassigns a crate to someone who had favorited it, their old favorite row stays.\n\n## Work split\n\n1. **T1, backend (opus).** Shared schemas, the table and generated migration, the service, routes, profile and crate-detail changes, API and migration tests for AC1-AC6, and the `favorites: []` additions to existing web test fixtures so typecheck stays green.\n2. **T2, crate page (opus, after T1).** Web API client, FavoriteButton, CrateView wiring and component tests for AC8. It also updates any CrateView-related fetch mocks that the new GET call disturbs.\n3. **T3, profile and docs (sonnet, after T1, parallel with T2).** The ProfileView Favorites section and tests for AC7, plus updates to README, SPEC, DEPLOY and ADR 0008.\n\nAC9 and AC10 are browser criteria. T2 and T3 build what they exercise, and the browser tester writes and runs those checks on a temp DB copy under `.shipyard/checks/`. No dev task touches `.shipyard/`, starts a dev server, or touches `data/crate.db`. AC11 (typecheck, lint, test) applies to every task.\n","plan":{"summary":"Add crate favorites, a user-to-crate relation modelled on Follows. T1 builds the backend in one pass: shared Zod contract, the crate_favorites table and generated migration 0006, a favorites service, PUT/DELETE /api/crates/:id/favorite, viewerFavorited on GET /api/crates/:id, a favorites array on the public profile, and API and migration tests. Once T1 lands, two web tasks with separate files run in parallel. T2 adds the Favorite toggle to the single-crate page. T3 adds the Favorites section to the profile and updates the docs.","tasks":[{"id":"T1","goal":"Backend for crate favorites: shared contract, crate_favorites table and migration 0006, service, routes, viewerFavorited on GET /crates/:id, favorites on the public profile, and API and migration tests.","description":"Template: the Follows feature (apps/api/src/routes/follows.ts, apps/api/src/services/follows.ts, the follows table in apps/api/src/db/schema.ts, apps/api/test/follows.test.ts). Favorites mirror it as user->crate.\n\n1. SHARED CONTRACT (packages/shared/src/index.ts)\n- Add, near profileCrate:\n```ts\n// Data classification: PUBLIC. A crate someone favorited, as their profile lists it. Owner username and display name only (null for ownerless legacy crates). No owner id.\nexport const profileFavorite = z.object({\n  id: z.number().int(),\n  name: z.string(),\n  color: z.string(),\n  label: z.string().nullable(),\n  albumCount: z.number().int(),\n  ownerUsername: z.string().nullable(),\n  ownerDisplayName: z.string().nullable(),\n})\n```\n- Add `favorites: z.array(profileFavorite)` to publicProfile, right after `crates`. Doc comment: newest favorited first.\n- Add `export const crateDetail = crate.extend({ viewerFavorited: z.boolean() })` with the comment 'Does the signed-in viewer favorite this crate? Always false when signed out.'\n- Export the types `ProfileFavorite` and `CrateDetail` (z.infer) beside ProfileCrate and Crate.\n\n2. DB (apps/api/src/db/schema.ts)\n- Add after follows:\n```ts\n// Data classification: INTERNAL (personal data: which crates a user favorited). Profiles show a user's favorites as public crate cards; numeric ids never leave the API.\n// 'cascade' = deleting the user or the crate deletes the favorite rows.\nexport const crateFavorites = sqliteTable('crate_favorites', {\n  id: integer('id').primaryKey({ autoIncrement: true }),\n  userId: integer('user_id').notNull().references(() => users.id, { onDelete: 'cascade' }),\n  crateId: integer('crate_id').notNull().references(() => crates.id, { onDelete: 'cascade' }),\n  createdAt: timestamps.createdAt,\n}, (t) => [\n  uniqueIndex('crate_favorites_user_crate_unique').on(t.userId, t.crateId),\n  index('crate_favorites_crate_idx').on(t.crateId),\n])\n```\n  Add relations entries if the file has relations blocks for follows.\n- Generate the migration with `npm run db:generate -w apps/api -- --name crate_favorites`. This writes apps/api/drizzle/0006_crate_favorites.sql, meta/0006_snapshot.json and the _journal.json entry. Never hand-write or hand-edit them. Do not touch 0000-0005. The SQL must only CREATE TABLE and CREATE INDEX, with no table rebuilds.\n- Check apps/api/test/dev-admin.test.ts, apps/api/scripts/check-dev-admin.ts, apps/api/test/demo-seed.test.ts, apps/api/test/schema.test.ts, src/db/backup.ts, src/db/restore.ts and src/services/admin.ts for hard-coded table lists. Add crate_favorites wherever the follows table is enumerated.\n\n3. SERVICE: new file apps/api/src/services/favorites.ts\n- `favoriteCrate(db: Db, viewer: PublicUser | null, crateId: number): void`: requireUser(viewer) (401). Select crate {id, ownerId}; if it is missing, throw notFound(`Crate ${crateId}`) (404). If crate.ownerId === signedIn.id, throw badRequest('You cannot favorite your own crate') (400). Then insert with .onConflictDoNothing(). Ownerless (null owner) crates and other users' crates are allowed, including for admins. 404 is checked before 400.\n- `unfavoriteCrate(db, viewer, crateId): void`: requireUser, 404 if the crate is missing, otherwise delete the row for (viewer, crate). A missing row is a no-op.\n- `isFavoritedBy(db, crateId: number, viewerId: number | null): boolean`: false when viewerId is null.\n- `listFavorites(db, userId: number): ProfileFavorite[]`: from crateFavorites innerJoin crates, leftJoin users on users.id = crates.ownerId, leftJoin albums on albums.crateId = crates.id. Select exactly id, name, color, label, albumCount: count(albums.id), ownerUsername: users.username, ownerDisplayName: users.displayName. where crateFavorites.userId = userId, groupBy crates.id, orderBy desc(crateFavorites.createdAt), desc(crateFavorites.id). Never select email, role, user ids or demoSeedKey.\n- Write a data-classification header comment like the one in services/follows.ts.\n\n4. ROUTES: new file apps/api/src/routes/favorites.ts, registered in apps/api/src/app.ts the way followRoutes is (same prefix).\n- PUT /crates/:id/favorite and DELETE /crates/:id/favorite, each `{ schema: { params: idParams }, preValidation: signedInOnly }`, returning reply.code(204).send(). Define signedInOnly locally as in follows.ts (`async (req) => { requireUser(req.user) }`). Because it runs in preValidation, a signed-out caller gets 401 even with a non-numeric id. Check that /crates/:id/favorite does not collide with /crates/order or /crates/recommended in crates.ts.\n- GET /crates/:id in apps/api/src/routes/crates.ts: response schema becomes crateDetail, and the handler calls a new `getCrateDetail(db: Db, id: number, viewer: PublicUser | null): CrateDetail` in apps/api/src/services/crates.ts. It returns `{ ...getCrate(db, id), viewerFavorited: isFavoritedBy(db, id, viewer?.id ?? null) }`. Keep getCrate unchanged, because create, update and delete use it. GET /crates (the list) stays as it is.\n\n5. PROFILE (apps/api/src/services/profiles.ts)\n- toPublicProfile adds `favorites: listFavorites(db, user.id)` after `crates`. profileCrates stays owner-only. Favorites are PUBLIC: any viewer, signed in or not, sees them. updateOwnProfile and setVerified return toPublicProfile, so they gain the field too. Fix any existing toEqual assertions on those responses.\n\n6. WEB FIXTURES. Adding a required `favorites` breaks typecheck in the web test fixtures that build a PublicProfile. Add `favorites: []` to the fixtures in apps/web/src/views/ProfileView.test.ts, apps/web/src/views/MyProfileView.test.ts, apps/web/src/views/EditProfileView.test.ts and apps/web/src/stores/session.test.ts. Make no other web changes. In apps/web/src/views/ProfileView.vue, do not add UI yet. T3 does that.\n\n7. TESTS\n- apps/api/test/migration.test.ts (AC1): add a 'migration 0006' describe that follows the existing 0005 test pattern. (a) A fresh DB through createDb has crate_favorites. (b) Build a DB at 0005 holding users and crates, then open it so 0006 applies; every pre-existing user and crate row is still there. In both cases check: PRAGMA index_list shows a unique index on (user_id, crate_id), and PRAGMA foreign_key_list(crate_favorites) shows on_delete 'CASCADE' for both the users and crates FKs. Add an 'only adds to the schema' test for 0006 that mirrors the 0005 one.\n- New apps/api/test/favorites.test.ts, using buildTestApp and helpers.ts as follows.test.ts does:\n  - AC2: PUT gives 204, and repeating it gives 204 with exactly one row. DELETE gives 204 and removes the row, and repeating it s entries if the file has relations blocks for follows.\n- Generate the migration with `npm run db:generate -w apps/api -- --name crate_favorites`. This writes apps/api/drizzle/0006_crate_favorites.sql, meta/0006_snapshot.json and the _journal.json entry. Never hand-write or hand-edit them. Do not touch 0000-0005. The SQL must only CREATE TABLE and CREATE INDEX, with no table rebuilds.\n- Check apps/api/test/dev-admin.test.ts, apps/api/scripts/check-dev-admin.ts, apps/api/test/demo-seed.test.ts, apps/api/test/schema.test.ts, src/db/backup.ts, src/db/restore.ts and src/services/admin.ts for hard-coded table lists. Add crate_favorites wherever the follows table is enumerated.\n\n3. SERVICE: new file apps/api/src/services/favorites.ts\n- `favoriteCrate(db: Db, viewer: PublicUser | null, crateId: number): void`: requireUser(viewer) (401). Select crate {id, ownerId}; if it is missing, throw notFound(`Crate ${crateId}`) (404). If crate.ownerId === signedIn.id, throw badRequest('You cannot favorite your own crate') (400). Then insert with .onConflictDoNothing(). Ownerless (null owner) crates and other users' crates are allowed, including for admins. 404 is checked before 400.\n- `unfavoriteCrate(db, viewer, crateId): void`: requireUser, 404 if the crate is missing, otherwise delete the row for (viewer, crate). A missing row is a no-op.\n- `isFavoritedBy(db, crateId: number, viewerId: number | null): boolean`: false when viewerId is null.\n- `listFavorites(db, userId: number): ProfileFavorite[]`: from crateFavorites innerJoin crates, leftJoin users on users.id = crates.ownerId, leftJoin albums on albums.crateId = crates.id. Select exactly id, name, color, label, albumCount: count(albums.id), ownerUsername: users.username, ownerDisplayName: users.displayName. where crateFavorites.userId = userId, groupBy crates.id, orderBy desc(crateFavorites.createdAt), desc(crateFavorites.id). Never select email, role, user ids or demoSeedKey.\n- Write a data-classification header comment llows.ts: `favoriteCrate(id: number) => request\u003cvoid>(`/crates/${id}/favorite`, { method: 'PUT' })` and `unfavoriteCrate(id: number)` with DELETE. Add a data-classification comment.\n2. apps/web/src/api/crates.ts: add `getCrate(id: number) => request\u003cCrateDetail>(`/crates/${id}`)`.\n3. apps/web/src/components/crate/FavoriteButton.vue, modelled on apps/web/src/components/profile/FollowButton.vue (not optimistic: busy and error state; emits only after the server agrees).\n   - Props `{ crateId: number; favorited: boolean }`. Emits `changed: [favorited: boolean]`.\n   - A `\u003cbutton type=\"button\">` whose accessible name is exactly 'Favorite' in both states, with `:aria-pressed=\"favorited\"`. A decorative star glyph may sit in an aria-hidden span. Style the pressed state visibly, using the existing tokens (--ink, --paper, --marker-red).\n   - Clicking calls favoriteCrate when not pressed and unfavoriteCrate when pressed. On success it emits changed(!favorited), guarding against the crateId changing mid-request as FollowButton does. On failure it shows a role=alert message via errorMessage and aria-pressed stays as it was.\n4. apps/web/src/views/CrateView.vue:\n   - `showFavorite = props.crateId !== undefined && library.status === 'ready' && !!session.user && !!crate.value && crate.value.ownerId !== session.user.id`. Ownerless crates (ownerId null) show it, and admins see it on others' crates. It never shows on /shelf (no crateId), on your own crate, or when signed out. There is no 'log in to favorite' link.\n   - Hold `viewerFavorited = ref\u003cboolean | null>(null)`. Watch [props.crateId, session.user?.id, showFavorite]. When showFavorite is true, call getCrate(crateId) and set viewerFavorited from the response. Otherwise reset it to null. Ignore stale responses whose crateId or user no longer matches. On a fetch error, leave it null so the button stays hidden.\n   - Render `\u003cFavoriteButton v-if=\"showFavorite && viewerFavorited !== null\" :crate- <script>
const D = JSON.parse(document.getElementById('run-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

const st = D.state || {};
const verdict = (st.verdict || 'pending').toLowerCase();
const crit = st.criteria || {};
const critKeys = Object.keys(crit);
const statements = {};
const checks = {};
(D.brief?.acceptanceCriteria || []).forEach(c => { statements[c.id] = c.statement; checks[c.id] = c.check; });
const keys = critKeys.length ? critKeys : Object.keys(statements);
const counts = { pass: 0, fail: 0, untested: 0 };
keys.forEach(k => { counts[(crit[k] || 'untested')] = (counts[(crit[k] || 'untested')] || 0) + 1; });
const total = keys.length || 1;

const parts = [];

const nowIdx = D.stages.indexOf(st.stage);
const T = s => { const t = Date.parse(s); return Number.isFinite(t) ? t : null; };
const dur = ms => {
  if (ms == null || ms < 0) return '';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}h${String(m).padStart(2, '0')}m` : m ? `${m}m${String(r).padStart(2, '0')}s` : `${r}s`;
};
// Elements carrying data-since tick every second, so the page looks alive
// between renders even while one long agent is working.
const since = (iso, end) => {
  const a = T(iso); if (a == null) return '—';
  const b = T(end);
  return b != null ? dur(b - a) : `<span data-since="${a}">${dur(Date.now() - a)}</span>`;
};
const times = st.stageTimes || {};
const pipeline = D.stages.filter(s => s !== 'done').map((s, i) => {
  const cls = D.live && i === nowIdx ? 'now' : (nowIdx > i || !D.live ? 'done' : '');
  const t = times[s];
  const clock = t?.start ? `<small>${since(t.start, (D.live && i === nowIdx) ? null : (t.end || null))}</small>` : '';
  return `<div class="${cls}">${s.toUpperCase()}${clock}</div>`;
}).join('');
const quietMs = D.stateMtime ? Date.now() - D.stateMtime : 0;
const active = Array.isArray(st.active) ? st.active : [];
const usage = Array.isArray(st.usage) ? st.usage : [];
const tokenTotal = usage.reduce((sum, u) => sum + (u.tokens ?? 0), 0);

parts.push(`
<header>
  <h1>SHIPYARD<small>AUTONOMOUS DEV YARD // ${D.live ? 'YARD ACTIVE' : 'RUN RECORD'}</small></h1>
  <div class="meta">
    ${D.live
      ? '<span class="chip verdict live"><span class="dot"></span>WORKING</span>'
      : `<span class="chip verdict v-${esc(verdict)}">${esc(verdict)}</span>`}
    <span class="chip">RUN <b>${esc(st.runId || '—')}</b></span>
    ${st.size ? `<span class="chip">SIZE <b>${esc(st.size)}</b></span>` : ''}
    ${usage.length ? `<span class="chip">TOKENS <b>${tokenTotal.toLocaleString('en-US')}</b></span>` : ''}
    ${st.startedAt ? `<span class="chip">ELAPSED <b>${since(st.startedAt, D.live ? null : st.endedAt)}</b></span>` : ''}
    ${D.live && active.length ? `<span class="chip live">CREW <b>${active.length}</b></span>` : ''}
    ${D.live ? `<span class="chip nosignal" id="nosignal" data-mtime="${D.stateMtime}" style="display:none">NO SIGNAL <b></b></span>` : ''}
    <span class="chip">CYCLE <b>${esc(st.cycle || '?')}/${esc(st.maxCycles || 3)}</b></span>
    ${st.fixRound ? `<span class="chip">FIX ROUND <b>${esc(st.fixRound)}/${esc(st.maxFixRounds || 3)}</b></span>` : ''}
    <span class="chip">BRANCH <b>${esc(st.branch || '—')}</b></span>
    <span class="chip">TARGET <b>${esc(st.target || '—')}</b></span>
    ${(st.fastPaths || []).map(f => `<span class="chip fast">FAST PATH <b>${esc(f)}</b></span>`).join('')}
  </div>
  <div class="pipe">${pipeline}</div>
  <div class="tele">
    <span>${D.live ? '◉ TELEMETRY LIVE — REFRESHING EVERY 4s' : '· TRANSMISSION ENDED'}</span>
    <span>STAGE: ${esc((st.stage || 'unknown').toUpperCase())}</span>
  </div>
</header>
${D.live ? '<div class="scan"><i></i></div>' : ''}
<div class="hazard"></div>`);

if (D.live && active.length) {
  parts.push(`<section><h2>Crew on deck — ${active.length} working</h2><div class="body"><div class="crew">
    ${active.map(a => {
      const t = T(a.since);
      const slow = t != null && Date.now() - t > 15 * 60 * 1000;
      return `<div class="hand${slow ? ' slow' : ''}"><div class="role"><span class="dot"></span>${esc(a.role || 'agent')}<span class="clock">${since(a.since)}</span></div>
        <div class="who">${esc(a.id || '?')}</div>
        ${a.task ? `<div class="sub" style="color:var(--grey);font-size:11px">${esc(a.task)}</div>` : ''}</div>`;
    }).join('')}
  </div></div></section>`);
}

if (D.tree && D.tree.total) {
  const wip = D.tree.files.filter(f => f.wip).length;
  const rows = D.tree.files.map(f => `<tr>
      <td class="mono">${f.wip ? '<span class="wip">●</span> ' : ''}${esc(f.path)}</td>
      <td class="num">${f.add == null ? (f.isNew ? '<span class="add">new</span>' : '') : f.add ? '<span class="add">+' + f.add + '</span>' : ''}</td>
      <td class="num">${f.del ? '<span class="del">−' + f.del + '</span>' : ''}</td></tr>`).join('');
  parts.push(`<section><h2>Working tree — ${D.tree.total} file${D.tree.total === 1 ? '' : 's'} changed${wip ? ', ' + wip + ' uncommitted' : ''}</h2><div class="body">
    <table><thead><tr><th>File ${wip ? '(● = being written)' : ''}</th><th style="text-align:right">Added</th><th style="text-align:right">Removed</th></tr></thead><tbody>${rows}</tbody></table>
    ${D.tree.total > D.tree.files.length ? '<p class="empty">Showing the first ' + D.tree.files.length + '.</p>' : ''}
  </div></section>`);
}

if (st.request || D.brief?.goal) {
  parts.push(`<section><h2>Work order</h2><div class="body">
    <pre>${esc(D.brief?.goal || st.request)}</pre>
    ${(D.brief?.assumptions || []).length ? '<p style="margin:11px 0 4px;color:var(--amber-dim);font-size:11px;letter-spacing:.2em">ASSUMPTIONS MADE</p><ul>' + D.brief.assumptions.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : ''}
  </div></section>`);
}

// Acceptance criteria
const bar = `<div class="bar">
  <i class="p" style="width:${counts.pass / total * 100}%"></i>
  <i class="f" style="width:${counts.fail / total * 100}%"></i>
  <i class="u" style="width:${counts.untested / total * 100}%"></i>
</div>`;
const cards = keys.length ? keys.map(k => {
  const s = crit[k] || 'untested';
  return `<div class="crit"><span class="id">${esc(k)}</span><span class="st ${esc(s)}">${s === 'pass' ? '◉ PASS' : s === 'fail' ? '✗ FAIL' : '· UNTESTED'}</span>
    <p>${esc(statements[k] || '')}</p>${checks[k] ? `<span class="tag">${esc(checks[k])}</span>` : ''}</div>`;
}).join('') : '<p class="empty">No acceptance criteria recorded — intake did not complete.</p>';
parts.push(`<section><h2>Acceptance criteria — ${counts.pass}/${keys.length || 0} pass</h2><div class="body">${keys.length ? bar : ''}<div class="grid">${cards}</div></div></section>`);

// Token use. The figures come straight from state.json's usage list.
if (usage.length) {
  const byRole = {};
  usage.forEach(u => {
    const r = byRole[u.role] || (byRole[u.role] = { agents: 0, tokens: 0 });
    r.agents++;
    r.tokens += u.tokens ?? 0;
  });
  const fmt = n => Number(n).toLocaleString('en-US');
  const roleRows = Object.entries(byRole).sort((a, b) => b[1].tokens - a[1].tokens).map(([role, r]) =>
    `<tr><td><b>${esc(role)}</b></td><td class="num">${r.agents}</td><td class="num">${fmt(r.tokens)}</td><td class="num">${tokenTotal ? Math.round(r.tokens / tokenTotal * 100) : 0}%</td></tr>`).join('');
  const agentRows = usage.map(u =>
    `<tr><td class="mono">${esc(u.agent)}${u.fixOf ? ' (fix of ' + esc(u.fixOf) + ')' : ''}</td><td>${esc(u.role)}</td><td>${esc(u.model || '—')}</td><td class="num">${u.tokens == null ? 'unavailable' : fmt(u.tokens)}</td><td class="num">${u.toolUses ?? '—'}</td></tr>`).join('');
  const unknown = usage.filter(u => u.tokens == null).length;
  const hasHarbormaster = usage.some(u => u.role === 'harbormaster');
  parts.push(`<section><h2>Token use — ${fmt(tokenTotal)} reported</h2><div class="body">
    <table><thead><tr><th>Role</th><th style="text-align:right">Agents</th><th style="text-align:right">Tokens</th><th style="text-align:right">Share</th></tr></thead><tbody>${roleRows}</tbody></table>
    ${hasHarbormaster ? '' : "<p class=\"empty\">The harbormaster's own tokens are not included: no figure was available.</p>"}
    ${unknown ? '<p class="empty">' + unknown + ' agent(s) reported no figure and count as 0, so the real total is higher.</p>' : ''}
    <details><summary>Per agent</summary><div class="inner"><table><thead><tr><th>Agent</th><th>Role</th><th>Model</th><th style="text-align:right">Tokens</th><th style="text-align:right">Tool uses</th></tr></thead><tbody>${agentRows}</tbody></table></div></details>
  </div></section>`);
}

// Cycles
(D.cycles || []).forEach(c => {
  const tasks = (c.plan?.tasks || []);
  const taskState = st.tasks || {};
  const rows = tasks.length ? tasks.map(t => {
    const s = taskState[t.id] || 'todo';
    return `<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.goal)}${t.model ? ` <span class="tag">${esc(t.model)}</span>` : ''}</td>
      <td class="mono">${esc((t.ownsFiles || []).join(', '))}</td>
      <td class="mono">${esc((t.dependsOn || []).join(', ') || '—')}</td>
      <td><span class="tag t-${esc(s)}">${esc(s)}</span></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty">No plan produced for this cycle.</td></tr>';

  parts.push(`<section><h2>Cycle ${esc(c.n)}</h2><div class="body">
    <div class="cycle-head"><h3>DELEGATION</h3></div>
    <table><thead><tr><th>Task</th><th>Goal</th><th>Owns files</th><th>After</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>
    ${c.spec ? '<details><summary>Manager spec — what it intended to build</summary><div class="inner"><pre>' + esc(c.spec) + '</pre></div></details>' : ''}
    ${c.testReport ? '<details><summary>Tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.testReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.browserReport ? '<details><summary>Browser tester verdict + evidence</summary><div class="inner"><pre>' + esc(JSON.stringify(c.browserReport, null, 2)) + '</pre></div></details>' : ''}
    ${c.defects ? '<details><summary>Triaged defects</summary><div class="inner"><pre>' + esc(JSON.stringify(c.defects, null, 2)) + '</pre></div></details>' : ''}
  </div></section>`);
});

// Deaths
if ((st.deaths || []).length) {
  parts.push(`<section><h2>Agent losses — ${st.deaths.length}</h2><div class="body"><table>
    <thead><tr><th>Agent</th><th>Reason</th><th>Detail</th></tr></thead><tbody>
    ${st.deaths.map(d => `<tr><td><b>${esc(d.agentId || d.agent || '?')}</b></td><td class="fail">${esc(d.reason)}</td><td class="mono">${esc(d.detail)}</td></tr>`).join('')}
    </tbody></table></div></section>`);
}

if (D.reportMd) {
  parts.push(`<section><h2>Report</h2><div class="body"><pre>${esc(D.reportMd)}</pre></div></section>`);
}

if ((D.agents || []).length) {
  parts.push(`<section><h2>Crew logs — ${D.agents.length} agents</h2><div class="body">
    ${D.agents.map(a => '<details><summary>' + esc(a.id) + '</summary><div class="inner"><pre>' + esc(a.body) + '</pre></div></details>').join('')}
  </div></section>`);
}

if (D.ledger) {
  parts.push(`<section><h2>Harbormaster log</h2><div class="body"><pre>${esc(D.ledger)}</pre></div></section>`);
}

parts.push(`<div class="hazard"></div><footer>
  SHIPYARD // ${esc(D.runDir)}<br>
  ${D.live
    ? 'YARD ACTIVE — this page reloads itself. Leave the tab open.'
    : 'TRANSMISSION ENDED — this page is final and will not reload.'}
</footer>`);
document.getElementById('app').innerHTML = parts.join('');

// Tick the clocks between reloads, and raise NO SIGNAL if the harbormaster
// has not written state.json for a long time while the run claims to be live.
(function tick(){
  const fmt = ms => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + 'h' + String(m).padStart(2, '0') + 'm' : m ? m + 'm' + String(r).padStart(2, '0') + 's' : r + 's';
  };
  const QUIET = 20 * 60 * 1000;
  function step(){
    document.querySelectorAll('[data-since]').forEach(n => { n.textContent = fmt(Date.now() - +n.dataset.since); });
    const ns = document.getElementById('nosignal');
    if (ns && +ns.dataset.mtime) {
      const q = Date.now() - +ns.dataset.mtime;
      ns.style.display = q > QUIET ? '' : 'none';
      ns.querySelector('b').textContent = fmt(q);
    }
  }
  step(); setInterval(step, 1000);
})();

// A meta-refresh is a full reload, which would slam every <details> shut and
// jump you back to the top mid-read. Persist what the reader opened and where
// they were, keyed by run so two tabs do not fight. sessionStorage, not local:
// this is view state, and it should die with the tab.
(function preserveReadingState(){
  const KEY = 'shipyard:' + (D.state?.runId || 'run');
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}') } catch {}

  const summaries = () => [...document.querySelectorAll('details')];

  summaries().forEach(d => {
    const label = d.querySelector('summary')?.textContent?.trim();
    if (label && saved.open && saved.open.includes(label)) d.open = true;
    d.addEventListener('toggle', save);
  });

  if (typeof saved.scroll === 'number') window.scrollTo(0, saved.scroll);

  function save(){
    const open = summaries().filter(d => d.open)
      .map(d => d.querySelector('summary')?.textContent?.trim())
      .filter(Boolean);
    try { sessionStorage.setItem(KEY, JSON.stringify({ open, scroll: window.scrollY })) } catch {}
  }

  let t;
  window.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(save, 150) }, { passive: true });
  window.addEventListener('beforeunload', save);
})();
</script>
</body>
</html>
